[stage]
name = "stance"
description = "Intermediate platform start, settle and hold"

[env]
task = "stance"
surface = "hard"
frame_skip = 10
max_episode_steps = 180
reset_noise_scale = 0.006

[ppo]
learning_rate = 0.0003
n_steps = 256
batch_size = 64
n_epochs = 5
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.0
max_grad_norm = 0.5

[ppo.policy_kwargs]
net_arch = [64, 64]
log_std_init = -1.2

[sac]
learning_rate = 0.0003
buffer_size = 100000
learning_starts = 1000
batch_size = 128
tau = 0.005
gamma = 0.99

[curriculum]
gate_schema_version = 1
gate_kind = "reward_and_length/v1"
timesteps = 32768
min_avg_reward = 80.0
min_avg_episode_length = 178
min_avg_forward_vel = 0.0
min_eval_episodes = 8
required_consecutive = 2
