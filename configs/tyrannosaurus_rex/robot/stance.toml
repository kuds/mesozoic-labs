# M1 skeleton / hw_r01. Experimental budgets and qualification targets.
# No trained policy or physical validation is claimed. Preserve the plant identity.
[stage]
name = "stance"
description = "Hold the M1 skeleton upright on both feet"

[env]
frame_skip = 10
max_episode_steps = 1000
reset_noise_scale = 0.005
reset_height_noise_scale = 0.0
forward_vel_max = 0.10
fall_penalty = -25.0
energy_penalty_weight = 0.02
smoothness_weight = 0.02
spin_penalty_weight = 0.02
lateral_penalty_weight = 0.1
max_tilt_angle = 0.7
healthy_z_range = [0.065, 0.16]
gait_symmetry_weight = 0.0
forward_vel_weight = 0.0
alive_bonus = 1.0
posture_weight = 1.0
height_weight = 1.0
home_pose_weight = 0.15
drift_penalty_weight = 0.5
heading_weight = 0.0
target_approach_weight = 0.0
target_reach_bonus = 0.0
prey_distance_range = [0.5, 0.8]
prey_lateral_range = [0.0, 0.0]

[ppo]
learning_rate = 0.00003
learning_rate_end = 0.00001
lr_schedule = "linear"
n_steps = 1024
batch_size = 64
n_epochs = 5
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.0
ent_coef_decay_timesteps = 2000000
target_kl = 0.03
max_grad_norm = 0.5

[ppo.policy_kwargs]
net_arch = [128, 128]
log_std_init = -2.0

[sac]
learning_rate = 0.0003
buffer_size = 100000
learning_starts = 1000
batch_size = 128
tau = 0.005
gamma = 0.99
train_freq = 4
gradient_steps = 1
ent_coef = "auto"

[sac.policy_kwargs]
net_arch = [128, 128]


[curriculum]
gate_schema_version = 1
gate_kind = "stance_quality/v1"
timesteps = 3000000
min_avg_reward = 1800.0
min_full_horizon_fraction = 0.95
max_unsupported_duty = 0.02
max_unsupported_duty_ucb = 0.02
settle_steps = 200
min_eval_episodes = 40
required_consecutive = 3
