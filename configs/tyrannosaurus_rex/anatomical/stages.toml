# T-Rex stage manifest (mesozoic.stage-manifest/v2; BEHAVIOR_RECIPES_PLAN §4.1,
# adopted 2026-09-05; v1 of STAGE1_SPLIT_PLAN §4, 2026-08-15). A stage's
# identity is its semantic id, not its number: legacy_number is the integer
# the stage was known as before the manifest existed — old artifacts and
# integer references resolve through it, which is why locomotion stays
# "stage 2" to history at position 3 here. recovery has no legacy_number and
# is addressed by id everywhere.
#
# v2 adds the recipe DAG on top of the same ids, numbers and config files:
#   warm_start_from  the EARLIER entry this node initialises from
#                    (initialize_next_stage, lineage recorded); absent = root
#   deliverable      this node's certified checkpoint is a published policy
#   recipe           the behavior label the node belongs to; a label resolves
#                    to its deepest deliverable in manifest order. stance is
#                    "stance" and recovery "recover" (decision D-D35, before
#                    which both were "stand", so "stand" meant recovery here;
#                    stance was "stand" until decision D-D38, which refuses
#                    "stand" naming "stance"). A label may equal a stage id
#                    only when it resolves to that stage.
# Recipes are derived from the edges (a deliverable plus its ancestor chain),
# never declared in a second table.
#
# Config files are named by their stage, with no number (here since
# 2026-08-20, for every model since decision D-D33): the manifest is the only
# place order and numbering live.

schema = "mesozoic.stage-manifest/v2"

[[stages]]                       # quiet stance
id = "stance"
config = "stance.toml"
legacy_number = 1
recipe = "stance"
deliverable = true               # the six-heading certificate since D-D32 (v2 since physics r8, D-D24); no r10 seed yet (bar 2)

[[stages]]                       # balance under pushes
id = "recovery"
config = "recovery.toml"
warm_start_from = "stance"
recipe = "recover"
deliverable = true               # recovery_quality/v1, judged against a per-run frozen resolution

[[stages]]
id = "locomotion"
config = "locomotion.toml"
legacy_number = 2
warm_start_from = "stance"       # the 2026-08-23 lineage rule, now declared;
recipe = "walk"                  # flips to "recovery" once a recovery run passes (plan A2)
deliverable = true

[[stages]]                       # id stays "behavior"; the label is the recipe
id = "behavior"
config = "behavior.toml"
legacy_number = 3
warm_start_from = "locomotion"
recipe = "hunt"
deliverable = true
