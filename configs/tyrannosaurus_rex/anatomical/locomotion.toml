[stage]
name = "locomotion"
description = "Learn forward walking/running"

[env]
forward_vel_weight = 2.0               # Match raptor: was 0.8, far too low. Primary driver of locomotion speed.
                                       # At 2.0, forward velocity dominates the reward landscape and
                                       # pushes the agent past the slow-walking local optimum.
alive_bonus = 0.5                      # Keep: already reduced from Stage 1
fall_penalty = -150.0                  # Raised from -50: hedge against late-episode falls, which stay cheap
                                       # in the discounted objective at gamma=0.995 (corrected break-even math
                                       # in docs/investigations/STAGE2_RECOMMENDATIONS.md section 2.1).
forward_vel_max = 1.5                  # WALKING PILOT 3 (pilot-only, never merged; production 2.5, which
                                       # saturates just past the old 2.0 m/s gate): R6 part (c), the maintainer's
                                       # decision (9) of 2026-11-04. Pays forward speed up to 1.5 m/s, on a 5/3
                                       # steeper slope below it. The gate's min_avg_forward_vel 1.0 is unchanged
                                       # (decision 10); the config-only screen inferred (not measured) that a cap
                                       # at or below 1.4 m/s stops paying at or below the cruise that gate needs.
energy_penalty_weight = 0.002          # Increase from 0.001: CoT was near 0, provide some efficiency signal
tail_stability_weight = 0.05           # Reduce from 0.08 to match raptor: tail oscillation is less
                                       # critical than forward progress at this stage
posture_weight = 0.2                   # Reduce from 0.5 to match raptor: allow dynamic forward lean for running
nosedive_weight = 0.5                  # Reduce from 1.0 (raptor uses 0.3): allow head-forward running posture
                                       # Keep slightly above raptor since head_contact is major termination cause
height_weight = 0.3                    # Reduce from 1.0: pelvis already at 0.932m (above 0.90 target),
                                       # this was wasting reward budget; raptor doesn't use height at all
gait_symmetry_weight = 0.0            # Kept at 0.0: the alternation formula is fixed (base_env.py) but untested and
                                      # unswept for the T-Rex; brachiosaurus/dibothrosuchus train stage 2 on it
smoothness_weight = 0.05              # Reduce from 0.1 to match raptor: less penalty for dynamic motion
heading_weight = 0.3                   # Reduce from 0.5 to match raptor: heading is already ~0.99
lateral_penalty_weight = 0.1           # Reduce from 0.3 to match raptor: allow lateral dynamics for gait
bite_bonus = 0.0
bite_approach_weight = 0.0
prey_distance_range = [8.0, 12.0]
max_episode_steps = 1000
reset_noise_scale = 0.05               # Was omitted, so SB3 silently fell back to the class default 0.01
                                       # while the retired [jax] table used 0.05. Stage 1 raised it deliberately; stages 2-3
                                       # inherited a 5x narrower reset distribution by accident.
# WALKING PILOT 3 (pilot-only, never merged): the rest of R6, the walking reward of the maintainer's decision (9) of
# 2026-11-04 (with forward_vel_max above). The SCREEN stage's offline recomputation on hand-built r10 behaviours
# ranked every stable alternating walk above standing and above its speed-matched two-footed hop on every seed under
# R6. The T. rex behavior recipes inherit this [env] (train_behaviors.read_recipe), so they carry R6 too.
airborne_substep_weight = 1.0          # R6 part (b); production leaves it unset (env default 0.0), the stance stage's
                                       # own value: -1.0 x the share of a step's substeps on which every foot's touch
                                       # is at most 0.1 N.
walk_support_gate_bw = 0.04            # R6 part (a), a new key off by default: alive, posture and height are paid only
                                       # while the two feet's substep-MIN touch sums to more than 4% of body weight
                                       # (33.6 N; the compsognathus rule).
walk_touchdown_weight = 0.1            # R6 part (d), a new key off by default: SCREEN's alternating-touchdown event
                                       # R5p, min(T_i, 1.2 s) / (2 dt) x clip(lead / (0.1 L), 0, 1) per alternating,
                                       # non-simultaneous touchdown, paid 4 control steps after it.
# WALKING PILOT 4 (pilot-only, never merged): the maintainer's decisions (23)-(28) of 2026-11-05. R6 above is
# unchanged; pilot 4 adds a live "walk straight" command on the reserved command inputs (obs[60:63]), the prey held
# on the spawn line, and a heading price. The T. rex behavior recipes do NOT inherit these five keys
# (train_behaviors.LOCOMOTION_ONLY_ENV_KEYS); they keep R6 and their own [commands].
command_mode = "heading"               # Decision (23): the command fixes the desired heading at the spawn heading
                                       # (a straight command never turns; the table below) and adapts a yaw-rate
                                       # request to the actual heading (BaseDinoEnv; direction_commands.py).
prey_lateral_range = [0.0, 0.0]        # Carried default of 2026-11-05: the prey 8-12 m straight ahead of the spawn
                                       # heading (env default [-2, 2] m), so R6's forward and heading reference (the
                                       # prey line), the command's desired heading and the price share one heading.
walk_heading_price_weight = 0.2        # Decision (27), a new key off by default: -0.2 x min(|theta| / 0.5 rad, 1) per
walk_heading_price_scale_rad = 0.5     # step, theta = wrap(pelvis yaw - the command's desired heading) in [-pi, pi),
                                       # from the current pelvis quaternion (tyrannosaurus_rex/base_env.py, 9d).

[env.command_config]
# WALKING PILOT 4: the straight command, one fixed table (decisions (21)-(28)). WRITTEN ONCE: the task digest hashes
# the table as written, so the same command written differently is another task (and a resume would refuse it).
# Fields left out take the DirectionCommandConfig defaults: speed_range none (TOML has no null), switch_interval_s
# 4.0 and switch_jitter_s 0.0 (a switch only re-draws a straight request; it never turns).
cruise_speed = 1.5                     # Decision (28): the speed input shows top of scale (obs[60] = 1.0 when on heading).
stop_probability = 0.0                 # Never a stop.
turn_increment_max = 0.0               # Never a turn: the desired heading stays the spawn heading all episode.
straight_probability = 1.0             # Every switch keeps the heading.
speed_scale = 1.5                      # From here down the follow_direction recipe's values (yaw_gain, turn_slowdown
                                       # and minimum_turn_speed_fraction the dataclass defaults it keeps).
lateral_speed_scale = 1.0
yaw_rate_scale = 0.6
yaw_gain = 1.5
yaw_rate_max = 0.3
turn_slowdown = true
minimum_turn_speed_fraction = 0.25

[ppo]
learning_rate = 5e-5                    # Reduce from 1e-4: prevent catastrophic forgetting of Stage 1 balance
learning_rate_end = 1e-5
n_steps = 4096                          # Increase from 2048: larger rollout buffer for more stable gradients
batch_size = 256                       # Increase from 128 to match raptor: more stable gradient estimates
n_epochs = 10
gamma = 0.995                           # Increase from 0.99: longer horizon values sustained locomotion
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.001                    # Decay entropy over the stage (EntCoefDecayCallback). This decay
                                        # (with fall_penalty -150 and forward_vel_max 2.5) is what carried
                                        # velociraptor stage 2 to 2706 +/- 8 @ 2.75 m/s on the 1.5x-kp plant.
                                        # See docs/investigations/STAGE2_RECOMMENDATIONS.md §5.
ent_coef_decay_timesteps = 4000000      # Anchor the decay to half the 8M budget. (Record fixed 2026-08-23:
                                        # originally "matching stage 1's 3M-of-6M" — that anchor is retired,
                                        # stance now decays over 7M of 11M; the half-budget choice here
                                        # stands on the measurement below, not on the mirror.)
                                        # Without it decay_timesteps defaults to the full stage budget
                                        # (train_base._maybe_ent_coef_decay_callback:502) and ent_coef coasts high.
                                        # Measured on run 20260725_194916, this was the only T-Rex stage without the
                                        # anchor and the only one whose policy std ROSE: algo_std climbed
                                        # monotonically 1.024 -> 1.211 across all five quintiles, the same signature
                                        # as un-anchored velociraptor stage 2 (1.01 -> 1.22). It also compounds --
                                        # stage 3 inherited the inflated std (started 1.213 against stage 1's 0.947
                                        # finish) and climbed to 1.438 despite carrying its own anchor.

target_kl = 0.05                        # Loosened from 0.03 for the locomotion stage (fast early learning).

[ppo.policy_kwargs]
net_arch = [512, 256]                  # Match raptor width; T-Rex obs is 63 (heading-free since policy interface r14; arms/distal tail welded, plus the Phase C command segment)

[sac]
learning_rate = 1e-4              # 3x reduction from Stage 1 — replay buffer provides natural gradient smoothing
batch_size = 256
gamma = 0.99                     # Keep at 0.99 — replay staleness at high gamma makes
                                 # high gamma risky; the buffer naturally handles temporal credit assignment
tau = 0.005
ent_coef = "auto"                # Auto-entropy handles Stage 1→2 transition exploration naturally
buffer_size = 1_000_000          # Large buffer retains Stage 1 balance transitions — key advantage over PPO
                                 # for mitigating catastrophic forgetting (PPO's biggest pain point for T-Rex)
learning_starts = 10_000
train_freq = 16                  # Collect 16 env steps before training — matches proven raptor SAC config
gradient_steps = 8               # 2:1 data-to-update ratio — matches raptor; reduces overfitting risk on replay buffer

[sac.policy_kwargs]
net_arch = [512, 256]            # Match raptor width; T-Rex obs is 63 (heading-free since policy interface r14; arms/distal tail welded, plus the Phase C command segment)

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "reward_and_length/v1"      # environments/shared/curriculum/gate_schema.py
timesteps = 2000000                     # WALKING PILOT 4 (pilot-only, never merged; pilot 3 and production 8,000,000):
                                        # a 2,000,000-step fine-tune of each pilot-3 seed's 8M checkpoint, the
                                        # maintainer's decision (25) of 2026-11-05.
eval_freq = 65536                       # WALKING PILOT 4 (pilot-only, never merged; PROPOSED, not yet decided; pilot 3
                                        # 131,072, production 50,000): one evaluation every 65,536 steps, 30 over the
                                        # 2,000,000 budget (pilot 3's cadence would give 15). Read by
                                        # train_base._stage_cadence; evaluation never changes training.
eval_episodes = 10                      # WALKING PILOT 3 and 4 (pilot-only, never merged; production 30): 10 episodes
                                        # per evaluation, walking pilot 1's panel (decision of 2026-11-03), kept.
checkpoint_freq = 250000                # WALKING PILOT 4 (pilot-only, never merged; PROPOSED, not yet decided; pilot 3
                                        # 500,000, production 100,000): a periodic checkpoint every 250,000 steps, 8 pairs
                                        # at 250,000 ... 2,000,000: the deciding pair at the budget, trajectory pairs
                                        # before it and pairs to resume from (the pre-registration names the judged
                                        # ones).
max_checkpoints = 0                     # WALKING PILOT 3 and 4 (pilot-only, never merged; production keeps the newest
                                        # 5): keep every periodic pair (8 at 2,000,000), pilot 3's decision of 2026-11-03.
initialize_from_own_checkpoint = true   # WALKING PILOT 4 (pilot-only, never merged; no other stage of any model
                                        # declares it): the maintainer's decision (25) of 2026-11-05. Under
                                        # initialize_next_stage this node also accepts an earlier COMMAND-FREE
                                        # checkpoint of ITSELF beside its declared parent (stance): pilot 3's 8M
                                        # locomotion pairs into this live-command task; a command-trained checkpoint
                                        # of this node is refused, and resumed instead
                                        # (task_fingerprint.validate_declared_parent).
                                        # Such a load is an edge crossing to train_base: the command columns are zeroed
                                        # and their inputs reseeded, ret_rms starts afresh, and the stage-entry shaping
                                        # applies, which the warm-up and ramp lines below make inert. Permits a load and
                                        # shapes nothing: it enters no gate, recipe or task digest.
min_avg_reward = 100.0
# Collapse backstop: the relative floor pair stance and recovery use
# (PLANT_VALIDATION §14 item 3), replacing the absolute
# collapse_peak_floor = 100.0 — which sat 11x BELOW the measured do-nothing
# reward, so it armed on the first qualifying eval of any run, healthy or
# not, and encoded nothing about this stage. The absolute key is REMOVED,
# not shadowed: collapse_settings_from_config (curriculum/early_stopping.py)
# lets an explicit collapse_peak_floor win over the pair, so leaving it in
# place would silently keep the old floor.
collapse_peak_floor_reference = 1064.0  # The zero-action locomotion statue's reward at noise 0.05:
                                        # 1091.51 ± 5.46 over 40 episodes, 40/40 full horizon, measured
                                        # 2026-08-23 with environments/shared/scripts/
                                        # zero_action_baseline.py --model-id tyrannosaurus_rex anatomical
                                        # --stage 2 (2026-08 review §5.3). Re-measure
                                        # with the same script whenever a reward weight OR the plant
                                        # changes: a weight change rescales the statue's terms exactly and
                                        # cheaply; a plant change moves its trajectory, so only a re-run is
                                        # evidence. Forgetting either is silent. Re-measured on physics r8
                                        # (plant_versions note 13) with the same command: 1091.52 ± 5.46,
                                        # 40/40 full horizon, so the reference carries. This stage's [env]
                                        # sets none of the stance shaping keys, and the hip-roll servos only
                                        # trim the statue's spawn-noise foot roll. Carries through the stance
                                        # follow-up (D-D27) too: this [env] sets none of its TyrannosaurusRexAnatomicalEnv kwargs,
                                        # whose defaults keep the r8 reward bit for bit (test_anatomical_rewards.py;
                                        # the digest snapshot's trex locomotion reward summary did not move).
                                        # Re-measured on physics r9 (plant_versions note 16) with the same
                                        # command: 1069.94 ± 138.75 with 39/40 full horizon (seed 3081
                                        # nosedives, as in stance), its 39 standing episodes 1092.14 ± 5.74,
                                        # so the reference carried: +0.6 against a 0.9 standard error.
                                        # Re-measured on physics r10 (plant_versions note 20, D-D44: the tail
                                        # pitch springs preloaded, and the natural_pitch default this [env]
                                        # inherits re-measured 0.027 -> 0.017 with it) with the same command,
                                        # 2026-10-25: 1092.60 ± 5.35 with 40/40 full horizon, +1.1 against
                                        # 1091.5 at a 0.85 standard error (1.3 standard errors), so the
                                        # reference moves to 1092.6.
                                        # WALKING PILOT 4 (pilot-only, never merged): re-measured with the same
                                        # command on 2026-11-06, on the pilot-4 branch. Pilot 3's [env] (R6, no
                                        # command): 1091.07 ± 5.83, 40/40 full horizon, so 1092.6 carried for pilot
                                        # 3 (-1.5 at a 0.92 standard error). This [env] (R6 with the straight
                                        # command, the prey on the spawn line and the heading price 0.2): 1064.02
                                        # ± 24.62, 40/40 full horizon: the statue yaws up to 14 deg in 10 s and pays
                                        # the price, -29.3 per episode on average (median -23.1, worst -86.9; the
                                        # same [env] with the price off: 1093.37 ± 4.01). -28.6 against 1092.6 at a
                                        # 3.9 standard error (7.3 standard errors), so the reference moves to 1064.0.
collapse_peak_floor_fraction = 0.45     # Same fraction as stance and recovery; floor = 0.45 x 1064.0 =
                                        # 478.8 under walking pilot 4; pilot 3 had 0.45 x 1092.6 =
                                        # 491.7 (491.2 at r9's 1091.5). The interrupted run
                                        # 20260821_142144's best eval (1494.47 at 5.3M) clears it, and even its ~1100 ramp-window plateau does,
                                        # so the backstop arms as soon as collapse_min_evals is met and
                                        # watches the rest of the run. The ratio, not the product, is what
                                        # carries across a reward change.
statue_constants_physics_revision = 10  # The trex PHYSICS revision the reference (1064.0; 1092.6 before pilot 4) was measured on
                                        # (1091.5 measured 2026-08-23 on r7 and carried on r8 and r9;
                                        # re-measured on r10 above).
                                        # test_statue_constant_freshness.py holds this pin
                                        # against the plant manifest, so a plant bump that forgets the
                                        # re-measure fails CI instead of silently training against a
                                        # backstop calibrated on a plant that no longer exists.
min_avg_episode_length = 750            # Reduce from 800: T-Rex best run reached 682, 800 is too strict
min_avg_forward_vel = 1.0               # A firm walk, re-derived from this plant (2026-08 review §5.3
                                        # decision (b)). The previous 2.0 was a velociraptor copy: on this
                                        # plant 2.0 m/s is Froude 0.46-0.57 (CoM height 0.72-0.88 m) — the
                                        # walk-run boundary — while the raptor runs its own 2.0 gate at
                                        # Froude ~1.07; the dynamically-similar raptor-gate equivalent here
                                        # is 2.7-3.0 m/s. Measured against run 20260821_142144: its
                                        # velocity curve first-touches 2.0 m/s at 7.1M/10.5M/13.5M steps
                                        # (exponential/quadratic/linear post-ramp fits) on an 8M budget,
                                        # with 0/109 in-training evals passing; 1.0 m/s (Froude 0.14-0.16)
                                        # first-touches at 6.4-8.0M on the same fits — inside the budget.
                                        # The 2.0 m/s capability target moved to the behavior stage's gate
                                        # and was retired there on 2026-09-13 (2026-08 review CF2, plan D1):
                                        # a bite episode cannot average it, so closing speed is measured,
                                        # not gated. Re-derive this floor by refitting the post-ramp
                                        # velocity curve of the next full run.
required_consecutive = 3
collapse_min_evals = 20                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps before it can fire.
collapse_patience = 10                  # Require 10 consecutive raw per-eval mean drops so a transient dip won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count, so the normal early-locomotion dip survives.
warmup_timesteps = 0                    # WALKING PILOT 4 (pilot-only, never merged; pilot 3 and production 300,000):
                                        # no warm-up, the maintainer's decision (26) of 2026-11-05 (the entry shaping
                                        # switched off): [ppo]'s clip, entropy and learning rate apply from the first
                                        # update. A 0-step warm-up still sets the two warmup_ values below at training
                                        # start and restores [ppo]'s at the first env step, before the first update,
                                        # so no update uses them (measured by the setup check of 2026-11-06).
warmup_clip_range = 0.02                # Small clip range during warm-up to limit policy change
warmup_ent_coef = 0.02                  # Higher entropy during warm-up to maintain exploration
ramp_timesteps = 2000000                # Increased from 500k: much slower ramp prevents reward-chasing collapse. 500k was only 6% of 8M budget; 2M is 25%, matching raptor stage 2 proportion.
ramp_start_value = 2.0                  # WALKING PILOT 4 (pilot-only, never merged; pilot 3 and production 0.2): the
                                        # ramp starts at [env] forward_vel_weight 2.0, so the forward weight is a
                                        # constant 2.0 (decision (26)). Pilot 3's warm_start_log_std = -2.0 is removed
                                        # by the same decision: each walker keeps its own log_std (about -1.94).
