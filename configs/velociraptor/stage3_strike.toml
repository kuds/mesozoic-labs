[stage]
name = "strike"
description = "Sprint and strike prey with sickle claw"

[env]
forward_vel_weight = 1.0
backward_vel_penalty_weight = 0.0
alive_bonus = 0.1
energy_penalty_weight = 0.001
tail_stability_weight = 0.02
posture_weight = 0.1
gait_symmetry_weight = 0.05
smoothness_weight = 0.02
strike_bonus = 10.0
strike_approach_weight = 1.0
prey_distance_range = [3.0, 8.0]
prey_lateral_range = [-1.5, 1.5]
max_episode_steps = 1000

[ppo]
learning_rate = 5e-5
n_steps = 4096
batch_size = 256
n_epochs = 10
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.1
ent_coef = 0.001

[sac]
learning_rate = 5e-5
batch_size = 256
gamma = 0.995
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 4000000
