[stage]
name = "strike"
description = "Sprint and strike prey with sickle claw"

[env]
forward_vel_weight = 1.0
backward_vel_penalty_weight = 0.0
alive_bonus = 0.5                       # Increase from 0.1: maintain self-preservation during strike training
energy_penalty_weight = 0.001
tail_stability_weight = 0.02
posture_weight = 0.1
nosedive_weight = 0.3                  # Reduced from stage2 (0.7): more aggressive lean acceptable during sprinting
gait_symmetry_weight = 0.0             # Disabled: formula rewards asymmetry, not alternation (same as stage 1/2)
smoothness_weight = 0.02
heading_weight = 0.3                   # Match stage 2: face toward prey for strike
lateral_penalty_weight = 0.1           # Match stage 2: penalize crab-walking toward prey
strike_bonus = 5.0                     # Reduced from 10.0: still 10x alive_bonus but limits gradient shock (not ramped by callback)
strike_approach_weight = 1.0
prey_distance_range = [3.0, 8.0]
prey_lateral_range = [-1.5, 1.5]
max_episode_steps = 1000

[ppo]
learning_rate = 5e-5
learning_rate_end = 1e-5
n_steps = 4096
batch_size = 256
n_epochs = 10
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.1
ent_coef = 0.001

[ppo.policy_kwargs]
net_arch = [256, 256]

[sac]
learning_rate = 5e-5
batch_size = 256
gamma = 0.995
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 4000000
min_avg_reward = 50.0
min_success_rate = 0.1                 # At least 10% strike success — confirms hunting behavior emerged
required_consecutive = 3
warmup_timesteps = 200000               # Increased from 100k: Stage 3 introduces new reward components, critic needs more adaptation time
warmup_clip_range = 0.02                # Small clip range during warm-up to limit policy change
warmup_ent_coef = 0.02                  # Higher entropy during warm-up to maintain exploration
ramp_timesteps = 500000                 # Timesteps over which to linearly ramp forward_vel_weight
ramp_start_value = 0.1                  # Starting fraction of forward_vel_weight during ramp
