[stage]
name = "locomotion"
description = "Learn forward walking/running"

[env]
forward_vel_weight = 1.0
forward_vel_max = 3.0
backward_vel_penalty_weight = 0.5               # Restore from Stage 1 to heavily penalize backward drifting
alive_bonus = 2.0                       # Keep alive bonus high to prevent suicide, but ensure it balances
energy_penalty_weight = 0.003
tail_stability_weight = 0.05
posture_weight = 1.5                    # Match Stage 1: preserve balance signal to prevent catastrophic forgetting
nosedive_weight = 1.5                   # Match Stage 1: keep nosedive penalty strong during locomotion learning
gait_symmetry_weight = 0.0             # Disable: formula rewards asymmetry, not alternation
smoothness_weight = 0.05               # Revert to Stage 1's 0.05. 0.15 makes it too sluggish to catch a fall
strike_bonus = 0.0
strike_approach_weight = 0.0
heading_weight = 0.3
lateral_penalty_weight = 0.1
prey_distance_range = [8.0, 12.0]
max_episode_steps = 1000

[ppo]
learning_rate = 5e-5                    # Reduce from 1e-4: prevent catastrophic forgetting of Stage 1 balance
learning_rate_end = 1e-5
n_steps = 4096                          # Reduce from 8192: faster updates, more stable for locomotion
batch_size = 256                        # Increase: your passing stage1 uses 256, keep consistency
n_epochs = 10
gamma = 0.995                           # Increase from 0.99: longer horizon helps value sustained walking
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005                        # Reduce from 0.01: exploit Stage 1 balance more, explore less violently

[ppo.policy_kwargs]
net_arch = [256, 256]

[sac]
learning_rate = 1e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 8000000
min_avg_reward = 100.0
min_avg_episode_length = 600            # Reduce from 800: most good runs cluster 500-680, this is still demanding
min_avg_forward_vel = 0.4               # Reduce slightly from 0.5: less pressure to sprint recklessly
required_consecutive = 3
