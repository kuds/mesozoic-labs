[stage]
name = "locomotion"
description = "Learn forward walking/running"

[env]
forward_vel_weight = 2.0
forward_vel_max = 3.0
backward_vel_penalty_weight = 0.0
alive_bonus = 1.0
energy_penalty_weight = 0.001
tail_stability_weight = 0.05
posture_weight = 0.4
nosedive_weight = 0.35
gait_symmetry_weight = 0.1
smoothness_weight = 0.1
strike_bonus = 0.0
strike_approach_weight = 0.0
heading_weight = 0.3
lateral_penalty_weight = 0.1
prey_distance_range = [8.0, 12.0]
max_episode_steps = 1000

[ppo]
learning_rate = 1e-4
learning_rate_end = 1e-5
n_steps = 4096
batch_size = 128
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01

[ppo.policy_kwargs]
net_arch = [256, 256]

[sac]
learning_rate = 1e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 8000000
min_avg_reward = 100.0
min_avg_episode_length = 800
min_avg_forward_vel = 0.5
required_consecutive = 3
