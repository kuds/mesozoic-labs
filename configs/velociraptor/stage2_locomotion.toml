[stage]
name = "locomotion"
description = "Learn forward walking/running"

[env]
forward_vel_weight = 0.8
alive_bonus = 1.5
energy_penalty_weight = 0.001
tail_stability_weight = 0.05
posture_weight = 0.5
nosedive_weight = 0.5
gait_symmetry_weight = 0.1
smoothness_weight = 0.1
strike_bonus = 0.0
strike_approach_weight = 0.5
heading_weight = 0.5
lateral_penalty_weight = 0.3
prey_distance_range = [8.0, 12.0]
max_episode_steps = 1000

[ppo]
learning_rate = 1e-4
n_steps = 2048
batch_size = 128
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005

[sac]
learning_rate = 1e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 4000000
min_avg_reward = 100.0
min_avg_episode_length = 800
min_avg_forward_vel = 0.5
required_consecutive = 3
