[stage]
name = "balance"
description = "Learn to stand and balance without falling"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.5
alive_bonus = 3.5
energy_penalty_weight = 0.05
tail_stability_weight = 0.02
posture_weight = 1.5
nosedive_weight = 1.75
gait_symmetry_weight = 0.0
smoothness_weight = 0.05
strike_bonus = 0.0
strike_approach_weight = 0.0
prey_distance_range = [10.0, 15.0]
max_episode_steps = 1000                  # Match stage 2/3 for consistent episode horizon across curriculum
reset_noise_scale = 0.05                  # Increased from 0.01 default to improve robustness and reduce eval variance

[ppo]
learning_rate = 5e-5                             # Narrowed from 3e-4; top sweep trials clustered around 3e-5 to 7e-5
# learning_rate_end = 1e-5
# lr_schedule = "cosine"                       # "linear" or "cosine" — cosine decays faster mid-training, protecting converged policies
n_steps = 4096                                   # Best trial (#11, reward 310.6) used 4096
batch_size = 128                                 # Best trial used 128; smaller batches improve gradient signal
n_epochs = 10                                    # Best trial used 10; more updates per rollout buffer
gamma = 0.985                                    # Top trials clustered around 0.98-0.99
gae_lambda = 0.95
clip_range = 0.2
# clip_range_end = 0.1                         # Anneal clip_range to constrain late-training policy updates
ent_coef = 0.002                                 # Top trials used 0.001-0.005; reduced from 0.005

[ppo.policy_kwargs]
net_arch = [256, 256]

[sac]
learning_rate = 3e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 6000000
min_avg_reward = 100.0
min_avg_episode_length = 300
required_consecutive = 3
