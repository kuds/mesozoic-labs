schema_version = 1
fingerprint_tool_version = 2
canonical_mujoco_version = "3.10.0"

# Tool v2 canonicalizes finite numeric fingerprint values to 12 significant
# decimal digits so identical MuJoCo plants remain stable across CPU/OS math.
# Exact MJCF and referenced-asset bytes are still hashed without normalization.

# Human-reviewed compatibility counters. The generator refuses to update a
# changed policy/physics/visual fingerprint unless its corresponding revision
# increases. Source-only changes (for example comments) do not require a bump.

# Two shared-interface changes drive the policy revisions below.
#
# 1. Admitting a second quadruped (dibothrosuchus) required
#    mjx_env.build_mjx_observation to dispatch on the registered root body
#    instead of a hard-coded "brachiosaurus" species check.  No observation
#    dimension, layout, or value changed for any species.
# 2. BaseDinoEnv.reset gained reset_height_noise_scale, so root-height jitter
#    is no longer forced to reuse the radian-scale joint noise as a length.
#    This is fingerprinted through the home_reset entry, which only the
#    home-keyframe-residual species carry -- hence brachiosaurus does not
#    increment for it.  The default is None, which reproduces the previous
#    arithmetic exactly, so velociraptor and trex reset distributions are
#    unchanged and their existing checkpoints remain valid.  Dibothrosuchus is
#    the one species whose reset distribution really does change.
#
# 3. The T-Rex foot-contact repair.  A MuJoCo touch sensor sums only contacts on
#    geoms belonging to its site's OWN body, so the metatarsus-mounted r_foot /
#    l_foot sensors could never see the three digits -- which the preceding
#    plant revision had just made load-bearing.  At the home keyframe each foot
#    transmitted 500.4 N while its sensor reported 388.4 N, and under load
#    transfer the reading could drop to zero on a foot carrying full weight.
#    Each digit now has its own touch site and sensor, appended after the tail
#    block so every existing sensor index keeps its position, and both paths sum
#    pad + digits into one value per foot.  Observation width is unchanged (61
#    for trex) and the summed reading matches measured floor force exactly.
#    The T-Rex physics and visual fingerprints move because the MJCF gained
#    sites and sensors; the DYNAMICS do not -- old and new models are
#    bit-identical in qpos over 2000 perturbed steps and total mass is
#    unchanged.  build_mjx_observation is fingerprinted directly and had to
#    learn to sum, so every species' policy interface revision increments;
#    only the T-Rex's observation values actually change.
#
# 5. Reset can no longer generate an already-terminal state.  The root-height
#    jitter was the only UNBOUNDED term in the reset -- every other one is a
#    bounded uniform -- so BaseDinoEnv.reset now truncates it to the distance to
#    the nearer end of healthy_z_range, less a 0.02 m margin.  This is
#    fingerprinted through home_reset, so the three home-keyframe-residual
#    species increment and brachiosaurus does not.
#
#    Only T-Rex was actually broken.  Its 0.926 m home pelvis sits 0.226 m above
#    the 0.70 m floor, which at sigma 0.10 m is a 2.26 sigma margin, so 1.19% of
#    spawns landed below the floor and terminated on step 1 whatever the policy
#    did (measured: 18/2000 sub-floor spawns over seeds 3042-5041, 16 of them
#    terminal; 43/4000 over the wider range).  Those episodes are not policy
#    failures, and counting them as such caps any reliability gate near 99% for
#    reasons unrelated to the policy -- they are the direct cause of the 39/40
#    evaluation panels.  The bound binds at 2.07 sigma for T-Rex (3.9% of draws)
#    against 3.6-3.8 sigma for velociraptor and dibothrosuchus (~0.02%), so the
#    latter two change only in the far tail.
#
#    The bound is symmetric, so the mean spawn height is unchanged (0.9262 ->
#    0.9261 m over 2000 seeds) while the standard deviation tightens 0.1007 ->
#    0.0980.  Sub-floor spawns go 18/2000 -> 0/2000 and 43/4000 -> 0/4000.
#    All three species' reset DISTRIBUTIONS move, so their existing checkpoints
#    are trained against a different task and the zero-action baseline must be
#    re-measured before any stage-1 gate is calibrated against it.

#
# 6. Reset now settles the animal ON the ground, and two permanent
#    self-collisions were excluded.
#
#    BaseDinoEnv.reset placed the root by height alone.  But joint jitter
#    changes how far the lowest geom sits below the root, so no fixed root
#    height is right for most sampled poses, and entry 5's bound did not help:
#    healthy_z_range is a termination predicate on the ROOT and says nothing
#    about foot-to-floor geometry -- a T-Rex pelvis at 0.739 m is "healthy"
#    with the toes 0.198 m underground.  Measured over 40 seeds, spawns ranged
#    from 0.198 m inside the floor to 0.18 m above it; the solver answered
#    penetration with up to 19x body weight and launched the model 0.52 m
#    upward to tumble ballistically for ~60 steps before landing nose-down past
#    the nosedive threshold.  Reset now shifts the root so the lowest body geom
#    sits at the clearance the HOME KEYFRAME was authored with -- T-Rex's
#    plantar pad and digits at 0.491 mm of contact, and so on per species.
#    Settling to the authored depth rather than to a constant keeps the
#    noise-free reset bit-identical and keeps real foot-floor contact at spawn,
#    which the species static-balance suites already require.  Because the floor
#    is a horizontal plane a single shift settles the pose exactly, so no extra
#    RNG draws are consumed and the reset stays deterministic in its seed.
#
#    Separately, two MJCF geom pairs overlapped in the home pose and injected a
#    constant, pose-independent force into every step of every episode ever
#    run: trex tail_1_geom against both thigh capsules (18.8 mm, 8143 N per
#    side = 16.3 kN = 11x body weight) and brachiosaurus torso_main against
#    tail_2_geom (66.9 mm, 25.9 kN = 12.7x body weight).  Both are now
#    <exclude>d, matching the existing sibling-toe precedent.  T-Rex sibling
#    toe pair d2<->d4 was excluded for consistency with d2<->d3 and d3<->d4.
#
#    Effect on T-Rex, zero action, 40 seeds: t=0 contact force 16990 N (11.5x
#    body weight) -> 190 N (0.13x, i.e. resting rather than colliding); stance
#    duty bilateral 0.983 -> 0.992, single 0.003 -> 0.008, UNSUPPORTED
#    0.014 -> 0.000; survival 25/40 -> 28/40; mean episode length 683 -> 757.
#
#    PHYSICS moves for trex and brachiosaurus (MJCF contact exclusions).  The
#    POLICY INTERFACE moves for every species, since reset placement is
#    fingerprinted through home_reset and the settling applies to all four.
#    Every existing checkpoint is trained against a different task: the
#    zero-action baseline, the stage-1 operating point and any gate calibrated
#    against them must all be re-measured.
#
#    ADDENDUM: the MJX reset lagged this entry and kept spawning with joint and
#    yaw jitter at a fixed root height -- measured on T-Rex at stage-1 noise,
#    -41.2 mm to +5.2 mm around the authored contact -- and the midpoint action
#    mapping's qpos0 base pose hovered 610 mm over the floor on brachiosaurus,
#    opening every MJX episode with a half-metre free fall.  MJX now settles to
#    the same authored keyframe clearance analytically (exact for the species'
#    sphere/capsule/cylinder/box/ellipsoid geoms over the plane floor, verified
#    against mj_geomDistance to ~1e-9).  No further revision bump: this entry's
#    bump already declared the reset-placement interface moved for every
#    species, and no MJX checkpoint or baseline was produced between the two
#    landings.  A noise-free home-residual MJX reset is bit-identical to the
#    pre-settle behaviour; only jittered and midpoint spawns move.

[plants.velociraptor]
physics_revision = 2
policy_interface_revision = 8
visual_revision = 3
observation_schema = "bipedal-target/v1"

# 4. The T-Rex theropod stance correction.  The home keyframe stood the animal
#    on a near-straight knee (172.1 deg interior, 7.9 deg from full extension),
#    which is the singular region for leg-length control: hip-to-ankle distance
#    changes at only 0.024 m/rad there, so servicing the stage-1 height term
#    cost 23.7 deg of knee travel per centimetre of pelvis height.  The keyframe
#    now flexes the limb to a 135.0 deg interior knee -- 45 deg of flexion from
#    the columnar reference pose, the figure Hutchinson et al. (2005,
#    Paleobiology 31:676-701, Fig. 8) use for T. rex, converted by their own
#    Table 1 rule ("for the knee subtract the angle here from 180 deg").  Femur
#    and tibia sit symmetrically at 22.5 deg either side of vertical, which is
#    the unique inclination holding the hip over the ankle for this plant's
#    1.000 tibia:femur, so the CoM / support-polygon relationship is unchanged
#    (33.8% heel-to-toe against 34.3% before).  Leg-length authority rises
#    0.024 -> 0.134 m/rad, i.e. 23.7 -> 4.3 deg of knee per centimetre.
#    Segment vectors, masses, inertias and the whole foot are untouched: the
#    metatarsus keeps its authored 21.8 deg digitigrade slope because the three
#    rotations sum to zero, so the plantar pad and digits keep their 0.5 mm
#    contact.  PHYSICS moves (keyframe qpos, joint ranges, spring references);
#    the POLICY INTERFACE moves because the leg ctrlranges were re-centred on
#    the new pose and the home control vector -- which is what action zero
#    commands under home-keyframe-residual/v1 -- moved with them.  Every
#    existing T-Rex checkpoint is invalidated.
[plants.trex]
physics_revision = 6
policy_interface_revision = 9
visual_revision = 4
observation_schema = "bipedal-target/v1"

# 7. Brachiosaurus can stand: residual action mapping and load-bearing servos.
#
#    Stage 1 was not a balance task for this species: the zero-action statue
#    fell on 40 of 40 episodes at mean length 130.7 (PLANT_VALIDATION §6), so
#    there was no "do not fall" floor and no stage-1 result was interpretable.
#    Two compounding defects, both measured:
#
#    a) BrachioEnv was the only species still on the inherited MIDPOINT action
#       mapping, and its home stance is not the ctrlrange midpoint: "do
#       nothing" dragged the knees up to 0.349 rad and the ankles 0.175 rad
#       away from the standing pose on every step.  Commanding the actual home
#       controls tripled statue survival (mean length 141 -> 455) on its own.
#       Both backends now use home-keyframe-residual/v1 like the other three
#       species; on MJX this also moves the reset base pose from qpos0 (which
#       hovered 610 mm above the floor) to the home keyframe.
#
#    b) The leg position servos could not statically carry the animal: it
#       sagged 71.6 mm under its own weight, putting the planted stance's roll
#       stiffness (~1.9e3 N*m/rad) at parity with the destabilising gravity
#       stiffness m*g*h (~1.77e3), so the statue tipped over in slow roll on
#       9 of 10 resets even when commanding the exact home pose.  Leg kp is
#       doubled (sag 11.1 mm), with forceranges scaled to keep each actuator's
#       documented force-to-stiffness sizing.
#
#    Zero action, 40 episodes, stage-1 noise 0.05, before -> after: reward
#    163.35 +/- 81.40 -> 1739.08 +/- 1.17; full-horizon 0/40 -> 40/40;
#    terminations (fallen 34, tail_contact 6) -> (truncated 40).  The +/- 1.17
#    spread is the tightest of any species and makes brachiosaurus a good
#    gate-prototyping plant (PLANT_VALIDATION §6 asked for exactly this
#    property).  PHYSICS moves (actuator gains); the POLICY INTERFACE moves
#    (action mapping).
#
# 8. Brachiosaurus can feel its feet: pad sites enlarged, meta sensors added.
#
#    FOOT_SENSOR_VERIFICATION section 4: all four foot touch sensors read
#    exactly 0.0 N while mj_contactForce reported 98.8% of body weight over
#    four real floor contacts, so the policy trained with four permanently
#    dead input dimensions and the support-duty diagnostics scored the
#    standing statue as 88.5% airborne.  Two causes: the pad sites were
#    r=0.03 spheres that did not contain the pad's floor contact points, and
#    the metacarpus/metatarsus carries part of the load on the pad's PARENT
#    body, which no site on the pad body can see however large.  The pad
#    sites are now boxes enclosing the pad's contact zone, and four meta
#    touch sensors are APPENDED (sensordata 26-29) so existing indices keep
#    their positions; both backends sum pad + meta per leg (the same repair
#    shape as the T-Rex digit sensors, aa87445).  Verified: summed sensors
#    now report 100.0% of the mj_contactForce floor total in settled stance
#    (fr/fl 313 N, rr/rl 535 N).  Statue stance quality at noise 0.05 moved
#    from all-feet 0.000 / unsupported 0.885 to all-feet 0.998 / unsupported
#    0.000.  The POLICY INTERFACE moves (sensor layout and observation
#    values).  PHYSICS also moves, by the layer's own definition rather than
#    by dynamics: the physics fingerprint covers structural dimensions
#    including nsite and nsensor, so adding sites and sensors bumps it even
#    though they carry no mass and no contacts and every trajectory is
#    unchanged.  VISUAL moves for the same structural reason: that layer
#    fingerprints body-local site definitions (all new sites are group 4,
#    hidden in default renders).  Velociraptor's 45% under-read (same doc,
#    section 3) remains open and is NOT part of this entry.
[plants.brachiosaurus]
physics_revision = 4
policy_interface_revision = 6
visual_revision = 2
observation_schema = "quadrupedal-target/v1"

[plants.dibothrosuchus]
physics_revision = 1
policy_interface_revision = 5
visual_revision = 1
observation_schema = "quadrupedal-target/v1"
