schema_version = 1
fingerprint_tool_version = 2
canonical_mujoco_version = "3.10.0"

# Tool v2 canonicalizes finite numeric fingerprint values to 12 significant
# decimal digits so identical MuJoCo plants remain stable across CPU/OS math.
# Exact MJCF and referenced-asset bytes are still hashed without normalization.

# Human-reviewed compatibility counters. The generator refuses to update a
# changed policy/physics/visual fingerprint unless its corresponding revision
# increases. Source-only changes (for example comments) do not require a bump.

# Two shared-interface changes drive the policy revisions below.
#
# 1. Admitting a second quadruped (dibothrosuchus) required
#    mjx_env.build_mjx_observation to dispatch on the registered root body
#    instead of a hard-coded "brachiosaurus" species check.  No observation
#    dimension, layout, or value changed for any species.
# 2. BaseDinoEnv.reset gained reset_height_noise_scale, so root-height jitter
#    is no longer forced to reuse the radian-scale joint noise as a length.
#    This is fingerprinted through the home_reset entry, which only the
#    home-keyframe-residual species carry -- hence brachiosaurus does not
#    increment for it.  The default is None, which reproduces the previous
#    arithmetic exactly, so velociraptor and trex reset distributions are
#    unchanged and their existing checkpoints remain valid.  Dibothrosuchus is
#    the one species whose reset distribution really does change.
#
# 3. The T-Rex foot-contact repair.  A MuJoCo touch sensor sums only contacts on
#    geoms belonging to its site's OWN body, so the metatarsus-mounted r_foot /
#    l_foot sensors could never see the three digits -- which the preceding
#    plant revision had just made load-bearing.  At the home keyframe each foot
#    transmitted 500.4 N while its sensor reported 388.4 N, and under load
#    transfer the reading could drop to zero on a foot carrying full weight.
#    Each digit now has its own touch site and sensor, appended after the tail
#    block so every existing sensor index keeps its position, and both paths sum
#    pad + digits into one value per foot.  Observation width is unchanged (61
#    for trex) and the summed reading matches measured floor force exactly.
#    The T-Rex physics and visual fingerprints move because the MJCF gained
#    sites and sensors; the DYNAMICS do not -- old and new models are
#    bit-identical in qpos over 2000 perturbed steps and total mass is
#    unchanged.  build_mjx_observation is fingerprinted directly and had to
#    learn to sum, so every species' policy interface revision increments;
#    only the T-Rex's observation values actually change.
#
# 5. Reset can no longer generate an already-terminal state.  The root-height
#    jitter was the only UNBOUNDED term in the reset -- every other one is a
#    bounded uniform -- so BaseDinoEnv.reset now truncates it to the distance to
#    the nearer end of healthy_z_range, less a 0.02 m margin.  This is
#    fingerprinted through home_reset, so the three home-keyframe-residual
#    species increment and brachiosaurus does not.
#
#    Only T-Rex was actually broken.  Its 0.926 m home pelvis sits 0.226 m above
#    the 0.70 m floor, which at sigma 0.10 m is a 2.26 sigma margin, so 1.19% of
#    spawns landed below the floor and terminated on step 1 whatever the policy
#    did (measured: 18/2000 sub-floor spawns over seeds 3042-5041, 16 of them
#    terminal; 43/4000 over the wider range).  Those episodes are not policy
#    failures, and counting them as such caps any reliability gate near 99% for
#    reasons unrelated to the policy -- they are the direct cause of the 39/40
#    evaluation panels.  The bound binds at 2.07 sigma for T-Rex (3.9% of draws)
#    against 3.6-3.8 sigma for velociraptor and dibothrosuchus (~0.02%), so the
#    latter two change only in the far tail.
#
#    The bound is symmetric, so the mean spawn height is unchanged (0.9262 ->
#    0.9261 m over 2000 seeds) while the standard deviation tightens 0.1007 ->
#    0.0980.  Sub-floor spawns go 18/2000 -> 0/2000 and 43/4000 -> 0/4000.
#    All three species' reset DISTRIBUTIONS move, so their existing checkpoints
#    are trained against a different task and the zero-action baseline must be
#    re-measured before any stage-1 gate is calibrated against it.

#
# 6. Reset now settles the animal ON the ground, and two permanent
#    self-collisions were excluded.
#
#    BaseDinoEnv.reset placed the root by height alone.  But joint jitter
#    changes how far the lowest geom sits below the root, so no fixed root
#    height is right for most sampled poses, and entry 5's bound did not help:
#    healthy_z_range is a termination predicate on the ROOT and says nothing
#    about foot-to-floor geometry -- a T-Rex pelvis at 0.739 m is "healthy"
#    with the toes 0.198 m underground.  Measured over 40 seeds, spawns ranged
#    from 0.198 m inside the floor to 0.18 m above it; the solver answered
#    penetration with up to 19x body weight and launched the model 0.52 m
#    upward to tumble ballistically for ~60 steps before landing nose-down past
#    the nosedive threshold.  Reset now shifts the root so the lowest body geom
#    sits at the clearance the HOME KEYFRAME was authored with -- T-Rex's
#    plantar pad and digits at 0.491 mm of contact, and so on per species.
#    Settling to the authored depth rather than to a constant keeps the
#    noise-free reset bit-identical and keeps real foot-floor contact at spawn,
#    which the species static-balance suites already require.  Because the floor
#    is a horizontal plane a single shift settles the pose exactly, so no extra
#    RNG draws are consumed and the reset stays deterministic in its seed.
#
#    Separately, two MJCF geom pairs overlapped in the home pose and injected a
#    constant, pose-independent force into every step of every episode ever
#    run: trex tail_1_geom against both thigh capsules (18.8 mm, 8143 N per
#    side = 16.3 kN = 11x body weight) and brachiosaurus torso_main against
#    tail_2_geom (66.9 mm, 25.9 kN = 12.7x body weight).  Both are now
#    <exclude>d, matching the existing sibling-toe precedent.  T-Rex sibling
#    toe pair d2<->d4 was excluded for consistency with d2<->d3 and d3<->d4.
#
#    Effect on T-Rex, zero action, 40 seeds: t=0 contact force 16990 N (11.5x
#    body weight) -> 190 N (0.13x, i.e. resting rather than colliding); stance
#    duty bilateral 0.983 -> 0.992, single 0.003 -> 0.008, UNSUPPORTED
#    0.014 -> 0.000; survival 25/40 -> 28/40; mean episode length 683 -> 757.
#
#    PHYSICS moves for trex and brachiosaurus (MJCF contact exclusions).  The
#    POLICY INTERFACE moves for every species, since reset placement is
#    fingerprinted through home_reset and the settling applies to all four.
#    Every existing checkpoint is trained against a different task: the
#    zero-action baseline, the stage-1 operating point and any gate calibrated
#    against them must all be re-measured.
#
#    ADDENDUM: the MJX reset lagged this entry and kept spawning with joint and
#    yaw jitter at a fixed root height -- measured on T-Rex at stage-1 noise,
#    -41.2 mm to +5.2 mm around the authored contact -- and the midpoint action
#    mapping's qpos0 base pose hovered 610 mm over the floor on brachiosaurus,
#    opening every MJX episode with a half-metre free fall.  MJX now settles to
#    the same authored keyframe clearance analytically (exact for the species'
#    sphere/capsule/cylinder/box/ellipsoid geoms over the plane floor, verified
#    against mj_geomDistance to ~1e-9).  No further revision bump: this entry's
#    bump already declared the reset-placement interface moved for every
#    species, and no MJX checkpoint or baseline was produced between the two
#    landings.  A noise-free home-residual MJX reset is bit-identical to the
#    pre-settle behaviour; only jittered and midpoint spawns move.

# 11. The perturbation engine: scheduled external pushes for the recovery
#     stage (STAGE1_SPLIT_PLAN, stage 1b).  BaseDinoEnv.reset can now derive
#     a per-episode push schedule and BaseDinoEnv.step can apply the
#     scheduled push to the root body through xfrc_applied for its window
#     (environments/shared/perturbation.py; the MJX path mirrors both).
#     Push force is derived from the plant itself -- capture-point velocity
#     over the support hull and the root subtree mass -- so any species gets
#     a correctly scaled shove with no per-species constants (T-Rex r7:
#     165.5 N for 0.20 s at capture multiple 1.5).
#
#     Perturbation is OFF by default and only the recovery stage enables it.
#     While off, the new code is inert end to end: reset consumes no extra
#     RNG draw and step writes no force, so a perturbation-free episode is
#     bit-identical to the previous plant, RNG stream included, and every
#     existing checkpoint remains valid on its own stage.  While ON, the
#     schedule seed is drawn AFTER every pre-existing reset draw, so spawn
#     distributions are unchanged even under pushes, and reset(seed=S)
#     yields the same schedule for the policy and for every null controller
#     on either backend -- the pairing the recovery gate's null comparison
#     rests on.  The POLICY INTERFACE moves for every species because reset
#     placement is fingerprinted through home_reset and all four species
#     carry it; PHYSICS and VISUAL are untouched (no MJCF edit).
#
# 12. BEHAVIOR_RECIPES_PLAN §4.6 Phase C: a 3-dim body-relative command
#     segment (v_x_cmd, v_y_cmd, yaw_rate_cmd, pre-scaled to [-1, 1]) is
#     appended at the END of every species observation, zero under
#     command_mode = "none"; BaseDinoEnv.reset gained the per-episode
#     command hook (no RNG draw under "none"; the seeded draw stream is
#     pinned by tests/fixtures/phase_c_reset_golden.json); the SB3/MJX
#     plant-contract probes now inject a non-zero command; the
#     height-channel removal queued in note 11 is deliberately NOT batched
#     here (D3).  All six plants move, the two compsognathus recovery
#     calibrations are restamped (not re-measured).  Existing checkpoints
#     are widened, never re-labelled: environments/shared/scripts/widen_checkpoint.py.
#     The compsognathus recovery calibrations were restamped (plant identity
#     + task hash + restamp_history) by
#     environments/shared/scripts/restamp_recovery_calibration.py; their
#     profile_sha256 therefore moves and every compsognathus recovery freeze
#     made before this revision must be re-frozen.

# 14. The velociraptor stands on its servos, on flat toes, and feels its whole
#     foot.  Four measured defects of the r2 plant, fixed together so the
#     species' digests move once (D-D25):
#
#     a) Every leg spring pulled toward qpos 0.  No leg joint set springref,
#        and MuJoCo's default is 0, not ref, so the stiffness-20 springs
#        pulled the settled hip, knee and ankle (34.0 / -45.2 / 80.2 deg)
#        toward zero with 11.9 / 15.8 / 28.0 N.m, and the statue stood by
#        spending 10.4 / 15.1 / 34.5 N.m of servo torque mostly cancelling
#        them.  Every leg joint's springref is now the standing pose.
#     b) The keyframe kept every leg joint at ref, which tips the toes 20 deg
#        toe-down: digit 3 sat 44.6 mm inside the floor, and since note 6
#        every reset settles to the keyframe's own clearance, so every episode
#        began that deep (reset peak floor force 2.08 BW mean, 2.42 max).  The
#        ankle and toes now flatten the foot (ankle 100 -> 90.5536 deg, toes
#        10 -> -0.5536 / 0.6464) while hip 38 and knee -50 keep the CoM over
#        it -- the hip-18 keyframe alone moves the support 7.6 cm ahead of the
#        CoM and the statue falls backward in 0.66 s -- and the root sits at
#        0.505543 m, 0.5 mm of contact as on the T-Rex.
#     c) Springs anchored at the stance alone make the statue fall: with the
#        home ctrl at the pose it lands on its body within 1.1-1.34 s on 10 of
#        10 seeds, because a servo with no error holds no torque, so the
#        joints sag 3-4 deg and the CoM rolls past the toe tips.  The home
#        ctrl now carries the gravity preload (ctrl - qpos = hip -0.606, knee
#        +0.166, ankle +3.206, toe_d3 +2.651, toe_d4 +1.127 deg: tau_g / kp,
#        with tau_g measured by a near-rigid hold), and the nominal servos --
#        kp, forcerange and ctrlrange unchanged -- hold it with 1.60 / 0.48 /
#        5.56 / 2.33 N.m (0.2-5.8% of forcerange), 40/40 even with every leg
#        spring deleted.  Re-sizing the leg actuators, which
#        VELOCIRAPTOR_PLANT_REVIEW and KNOWN_ISSUES said this fix required, is
#        not needed.
#     d) The foot touch sensor saw digit 3 only, 54% of the foot's floor load;
#        the rest sits on the metatarsal head and digit 4, other bodies.  Their
#        touch sites and sensors are APPENDED (sensordata 27-30, right foot
#        first) so existing indices keep their positions, and the env sums
#        d3 + metatarsus + d4 per foot: the summed reading equals the floor
#        force to rel 1e-6.  Observation width is unchanged (70).
#
#     Zero action, 40 episodes, noise 0.05, seeds 3042-3081, r2 -> r3: full
#     horizon 40/40 -> 40/40; settled pitch 24.02 -> 20.10 deg, so the 0.35
#     rad natural_pitch is right again (it settles at 0.3508); pelvis 0.4932
#     -> 0.5052 m; reset peak floor force 2.08 / 2.42 -> 1.34 / 1.76 BW (mean
#     / max); nosedive charge -95.3 -> -3.0 per episode.
#
#     PHYSICS moves (springref, key qpos and ctrl, and nsite / nsensor by the
#     layer's own definition).  The POLICY INTERFACE moves (the home ctrl that
#     action zero commands, the sensor layout, the observation values), and
#     with it the backend declaration: the summed foot cannot be mirrored by
#     the frozen MJX registration (D-D17), so velociraptor is now SB3-only and
#     environments/velociraptor/mjx_config.py is deleted, as KNOWN_ISSUES and
#     CLEANUP_PLAN_2026_09 section 4.1 prescribed for this revision.  VISUAL
#     moves (four group-4 touch sites).  Every velociraptor checkpoint is
#     invalidated, the certified stance and walker of 20260922_125248
#     included, and the statue-derived constants in
#     configs/velociraptor/stage1_balance.toml were re-measured on this plant.
[plants.velociraptor]
physics_revision = 3
policy_interface_revision = 11
visual_revision = 4
observation_schema = "bipedal-target/v1"

# 4. The T-Rex theropod stance correction.  The home keyframe stood the animal
#    on a near-straight knee (172.1 deg interior, 7.9 deg from full extension),
#    which is the singular region for leg-length control: hip-to-ankle distance
#    changes at only 0.024 m/rad there, so servicing the stage-1 height term
#    cost 23.7 deg of knee travel per centimetre of pelvis height.  The keyframe
#    now flexes the limb to a 135.0 deg interior knee -- 45 deg of flexion from
#    the columnar reference pose, the figure Hutchinson et al. (2005,
#    Paleobiology 31:676-701, Fig. 8) use for T. rex, converted by their own
#    Table 1 rule ("for the knee subtract the angle here from 180 deg").  Femur
#    and tibia sit symmetrically at 22.5 deg either side of vertical, which is
#    the unique inclination holding the hip over the ankle for this plant's
#    1.000 tibia:femur, so the CoM / support-polygon relationship is unchanged
#    (33.8% heel-to-toe against 34.3% before).  Leg-length authority rises
#    0.024 -> 0.134 m/rad, i.e. 23.7 -> 4.3 deg of knee per centimetre.
#    Segment vectors, masses, inertias and the whole foot are untouched: the
#    metatarsus keeps its authored 21.8 deg digitigrade slope because the three
#    rotations sum to zero, so the plantar pad and digits keep their 0.5 mm
#    contact.  PHYSICS moves (keyframe qpos, joint ranges, spring references);
#    the POLICY INTERFACE moves because the leg ctrlranges were re-centred on
#    the new pose and the home control vector -- which is what action zero
#    commands under home-keyframe-residual/v1 -- moved with them.  Every
#    existing T-Rex checkpoint is invalidated.
#
# 9. T-Rex toes made passive.  The six per-digit position actuators (kp 60,
#    forcerange +/-50, ctrlrange -0.4363..0.8727) are deleted; the digits keep
#    their hinges, and the leg_joint class already gives them the passive
#    stance: stiffness 40 with springref 12.5 deg holds the old commanded home
#    pose, damping 15 dissipates strike energy.  Motivation is the stage-1
#    bounce postmortem (docs/investigations/TREX_STAGE1_BOUNCE_2026_08.md):
#    release-ablation showed holding only the six toes at home reproduces the
#    whole constant-hold failure, i.e. the policy's learned 0.8727 rad claw
#    curl -- not the leg servos -- seeded the bounce, and a splayed digit is a
#    pose the passive spring simply cannot hold.  PHYSICS moves (nu 21 -> 15,
#    actuator arrays, key ctrl shrinks to 15 entries; qpos/qvel widths and all
#    16 sensors unchanged).  The POLICY INTERFACE moves (action_dim 21 -> 15
#    and the home-keyframe-residual origin ctrl vector shrinks with it); the
#    observation is unchanged at 61 -- toe joints stay in qpos/qvel.  VISUAL is
#    untouched (no geom, site, material, camera or light moved).  Every
#    existing T-Rex checkpoint is invalidated, and the statue-derived
#    constants (min_avg_reward, collapse_peak_floor_reference) must be
#    re-measured with zero_action_baseline.py / stance_quality_baseline.py on
#    this plant -- the statue's toes now settle on springs instead of servos,
#    so the old 3271.8 standing reward may not carry.
# 10. T-Rex commands are low-passed at 10 Hz.  Both 2026-08 stage-1 runs
#     converged on statically unstable poses held up by 16.8-18.7 Hz command
#     chatter (the narrow-tolerance run locked both knees against their
#     stops and pumped the ankles +-28-33 deg; its constant-hold probe fell
#     backward onto the tail in 9/10 episodes within ~3 s), while the
#     balance task itself needs ~1.1-1.4 Hz.  The plant now applies a
#     first-order low-pass (environments/shared/action_filter.py) to the
#     commanded action in BOTH backends, seeded with the first post-reset
#     action.  PHYSICS unchanged (no MJCF edit; the statue's zero action
#     filters to zero, so the statue-derived constants carry).  The POLICY
#     INTERFACE moves without any tensor changing shape: an action now means
#     "pre-filter command", so checkpoints trained unfiltered are
#     incompatible (the "action meaning" rule in docs/PLANT_CONTRACT.md).
#     The cutoff is plant-level by construction -- an SB3 class attribute
#     and a register_species_mjx field guarded by
#     _PLANT_INTERFACE_CONFIG_FIELDS -- so stage TOMLs cannot tune it, and
#     the contract records cutoff + filter fingerprint and asserts backend
#     agreement.  See
#     docs/investigations/TREX_STAGE1_NARROW_TOLERANCE_RUN_2026_08.md.
# 13. T-Rex hip-roll servos sized for the plant's mass.  r/l_hip_roll_act go kp
#     150 -> 600 and forcerange +/-120 -> +/-480, keeping the 0.8x kp spike cap;
#     ctrlrange, joints, keyframe, sites and sensors are untouched.  The July
#     home-equilibrium repair mass-scaled hip pitch, knee and ankle only, so hip
#     roll kept its raptor-era gain.  With both feet planted the two hip-roll
#     servos and their 40 N.m/rad joint springs resist lateral sway in parallel,
#     which is stable only while 2 x (kp + 40) exceeds the settled statue's
#     m.g.h = 85.72 kg x 9.81 x 0.8377 m = 704.4 N.m/rad; kp 150 gave 380, kp
#     600 gives 1280 (1.8x).  Measured on the 40-episode statue panel (seeds
#     3042-3081, reset noise 0.05): the soft servos left the reset's hip-roll
#     noise in the stance, rolling the worse pad up to 3.42 deg over the
#     post-settle window, unloading the outer digit on 4/40 episodes and
#     spreading the settled foot-site width over 0.218-0.337 m -- the
#     propped-foot signature the trained stances showed, on the statue itself.
#     On this plant the worst pad is 1.15 deg (1.53 over 80 more seeds) and the
#     width 0.244-0.316 m.  Quasi-static lateral push capacity rises from 3.3%
#     to 5.1% of body weight (fore-aft stays 3.2%, set by leg-chain compliance,
#     not the hips; KNOWN_ISSUES records the fore-aft fragility), and the
#     pushed recovery statue loses all 20 of its lateral "fallen" ends.  The
#     capacity protocol: the zero-action statue at reset noise 0, a 200-step
#     settle, then a horizontal force on the pelvis through xfrc_applied (as
#     the perturbation engine applies it) ramped over 0.5 s, held 2.5 s and
#     released for 2 s, bisected on the largest force it survives.  The
#     stance-hack audit's "about 6% BW in every direction" used a different
#     protocol, so compare these figures with each other, not with it.  The symmetric settle does not move: the noise-free
#     statue's 1000-step reward (3517.26), pelvis height 0.9260 m and forward_z
#     -0.0279 equal r7's, so target_z, natural_pitch and
#     nosedive_termination_threshold carry.  Measured and left out: stiffer
#     passive digits (300 / 600 N.m/rad: forward push capacity +11% / +17%,
#     backward and lateral +0, statue pad roll and outer-digit lift unchanged or
#     worse), and tail_1 authority (at kp 100 the servo cannot lift tail_1 off
#     its -12 deg stop -- 42.0 + 16.9 N.m against 68.3 N.m of gravity -- but kp
#     300 moves _TAIL_SETTLED_QPOS and forward_z, slows the tail's settle past
#     200 steps and opens a new actuated balance channel: a new task, not a
#     plant fix).  PHYSICS moves; the POLICY INTERFACE (0b43de..) and VISUAL
#     (7042dc..) digests are unchanged, so policy stays 13 and visual 4.  Every
#     existing T-Rex checkpoint is invalidated (the plant check compares
#     physics_sha256), including the certified seed-42/44 stances, the seed-44
#     recovery and both walkers; no widen applies.  The statue-derived constants
#     of all four configs/trex stage files were re-measured on this plant:
#     stance 3766.1 (with the r8 stance task), recovery 1337.5, locomotion
#     1091.5 and behavior 602.0 (both unchanged).
[plants.trex]
physics_revision = 8
policy_interface_revision = 13
visual_revision = 4
observation_schema = "bipedal-target/v1"

# 7. Brachiosaurus can stand: residual action mapping and load-bearing servos.
#
#    Stage 1 was not a balance task for this species: the zero-action statue
#    fell on 40 of 40 episodes at mean length 130.7 (PLANT_VALIDATION §6), so
#    there was no "do not fall" floor and no stage-1 result was interpretable.
#    Two compounding defects, both measured:
#
#    a) BrachioEnv was the only species still on the inherited MIDPOINT action
#       mapping, and its home stance is not the ctrlrange midpoint: "do
#       nothing" dragged the knees up to 0.349 rad and the ankles 0.175 rad
#       away from the standing pose on every step.  Commanding the actual home
#       controls tripled statue survival (mean length 141 -> 455) on its own.
#       Both backends now use home-keyframe-residual/v1 like the other three
#       species; on MJX this also moves the reset base pose from qpos0 (which
#       hovered 610 mm above the floor) to the home keyframe.
#
#    b) The leg position servos could not statically carry the animal: it
#       sagged 71.6 mm under its own weight, putting the planted stance's roll
#       stiffness (~1.9e3 N*m/rad) at parity with the destabilising gravity
#       stiffness m*g*h (~1.77e3), so the statue tipped over in slow roll on
#       9 of 10 resets even when commanding the exact home pose.  Leg kp is
#       doubled (sag 11.1 mm), with forceranges scaled to keep each actuator's
#       documented force-to-stiffness sizing.
#
#    Zero action, 40 episodes, stage-1 noise 0.05, before -> after: reward
#    163.35 +/- 81.40 -> 1739.08 +/- 1.17; full-horizon 0/40 -> 40/40;
#    terminations (fallen 34, tail_contact 6) -> (truncated 40).  The +/- 1.17
#    spread is the tightest of any species and makes brachiosaurus a good
#    gate-prototyping plant (PLANT_VALIDATION §6 asked for exactly this
#    property).  PHYSICS moves (actuator gains); the POLICY INTERFACE moves
#    (action mapping).
#
# 8. Brachiosaurus can feel its feet: pad sites enlarged, meta sensors added.
#
#    FOOT_SENSOR_VERIFICATION section 4: all four foot touch sensors read
#    exactly 0.0 N while mj_contactForce reported 98.8% of body weight over
#    four real floor contacts, so the policy trained with four permanently
#    dead input dimensions and the support-duty diagnostics scored the
#    standing statue as 88.5% airborne.  Two causes: the pad sites were
#    r=0.03 spheres that did not contain the pad's floor contact points, and
#    the metacarpus/metatarsus carries part of the load on the pad's PARENT
#    body, which no site on the pad body can see however large.  The pad
#    sites are now boxes enclosing the pad's contact zone, and four meta
#    touch sensors are APPENDED (sensordata 26-29) so existing indices keep
#    their positions; both backends sum pad + meta per leg (the same repair
#    shape as the T-Rex digit sensors, aa87445).  Verified: summed sensors
#    now report 100.0% of the mj_contactForce floor total in settled stance
#    (fr/fl 313 N, rr/rl 535 N).
#
#    Attribution, measured on the repaired plant: the PAD-SITE enlargement
#    alone accounts for that 100.0% -- with note 7's stance fix the meta
#    capsules no longer reach the floor and the meta sensors read 0.0 N at
#    home.  They earned their place on the pre-repair SAGGING plant, where
#    the meta carried a real share (fr/fl contact at 34.4 mm depth), and they
#    remain the correct defensive cover for any pose that puts the meta back
#    on the ground.  Do not read the note as "the meta was carrying load
#    here"; it is not, today.
#
#    Known remaining gap, NOT fixed here: only the pads and metas are
#    instrumented.  A brachiosaurus kneeling on its SHINS (measured: a deep
#    knee/ankle command settles onto fr/fl/rr/rl_shin_geom carrying the full
#    1695 N, feet clear of the floor) reads 0.0 N on every foot sensor, so
#    the support-duty metrics score it identically to airborne.  For the
#    section 12 unsupported-duty gate that errs in the safe direction -- a
#    kneeling policy fails a stance gate, which is the desired outcome -- but
#    any future diagnostic that needs to tell "kneeling" from "airborne"
#    needs shin instrumentation.  Statue stance quality at noise 0.05 moved
#    from all-feet 0.000 / unsupported 0.885 to all-feet 0.998 / unsupported
#    0.000.  The POLICY INTERFACE moves (sensor layout and observation
#    values).  PHYSICS also moves, by the layer's own definition rather than
#    by dynamics: the physics fingerprint covers structural dimensions
#    including nsite and nsensor, so adding sites and sensors bumps it even
#    though they carry no mass and no contacts and every trajectory is
#    unchanged.  VISUAL moves for the same structural reason: that layer
#    fingerprints body-local site definitions (all new sites are group 4,
#    hidden in default renders).  Velociraptor's 45% under-read (same doc,
#    section 3) remains open and is NOT part of this entry.
[plants.brachiosaurus]
physics_revision = 4
policy_interface_revision = 8
visual_revision = 2
observation_schema = "quadrupedal-target/v1"

[plants.dibothrosuchus]
physics_revision = 1
policy_interface_revision = 7
visual_revision = 1
observation_schema = "quadrupedal-target/v1"

