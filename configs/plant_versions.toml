schema_version = 1
fingerprint_tool_version = 2
canonical_mujoco_version = "3.10.0"

# Tool v2 canonicalizes finite numeric fingerprint values to 12 significant
# decimal digits so identical MuJoCo plants remain stable across CPU/OS math.
# Exact MJCF and referenced-asset bytes are still hashed without normalization.

# Human-reviewed compatibility counters. The generator refuses to update a
# changed policy/physics/visual fingerprint unless its corresponding revision
# increases. Source-only changes (for example comments) do not require a bump.

# Admitting a second quadruped (dibothrosuchus) required
# mjx_env.build_mjx_observation to dispatch on the registered root body instead
# of a hard-coded "brachiosaurus" species check.  That function is part of the
# fingerprinted policy interface, so every species' policy_interface_revision
# increments below even though no observation dimension, layout, or value
# changed for any of them: existing checkpoints remain numerically valid.

[plants.velociraptor]
physics_revision = 2
policy_interface_revision = 4
visual_revision = 3
observation_schema = "bipedal-target/v1"

[plants.trex]
physics_revision = 3
policy_interface_revision = 4
visual_revision = 3
observation_schema = "bipedal-target/v1"

[plants.brachiosaurus]
physics_revision = 1
policy_interface_revision = 2
visual_revision = 1
observation_schema = "quadrupedal-target/v1"

[plants.dibothrosuchus]
physics_revision = 1
policy_interface_revision = 1
visual_revision = 1
observation_schema = "quadrupedal-target/v1"
