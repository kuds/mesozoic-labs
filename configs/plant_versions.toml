schema_version = 2
fingerprint_tool_version = 2
canonical_mujoco_version = "3.10.0"

# Tool v2 canonicalizes finite numeric fingerprint values to 12 significant
# decimal digits so identical MuJoCo plants remain stable across CPU/OS math.
# Exact MJCF and referenced-asset bytes are still hashed without normalization.

# Human-reviewed compatibility counters. The generator refuses to update a
# changed policy/physics/visual fingerprint unless its corresponding revision
# increases. Source-only changes (for example comments) do not require a bump.
# Schema 2 (decision D-D33, note 19) holds one [plants.<species>.<embodiment>]
# table per model.

# Two shared-interface changes drive the policy revisions below.
#
# 1. Admitting a second quadruped (dibothrosuchus) required
#    mjx_env.build_mjx_observation to dispatch on the registered root body
#    instead of a hard-coded "brachiosaurus" species check.  No observation
#    dimension, layout, or value changed for any species.
# 2. BaseDinoEnv.reset gained reset_height_noise_scale, so root-height jitter
#    is no longer forced to reuse the radian-scale joint noise as a length.
#    This is fingerprinted through the home_reset entry, which only the
#    home-keyframe-residual species carry -- hence brachiosaurus does not
#    increment for it.  The default is None, which reproduces the previous
#    arithmetic exactly, so velociraptor and trex reset distributions are
#    unchanged and their existing checkpoints remain valid.  Dibothrosuchus is
#    the one species whose reset distribution really does change.
#
# 3. The T-Rex foot-contact repair.  A MuJoCo touch sensor sums only contacts on
#    geoms belonging to its site's OWN body, so the metatarsus-mounted r_foot /
#    l_foot sensors could never see the three digits -- which the preceding
#    plant revision had just made load-bearing.  At the home keyframe each foot
#    transmitted 500.4 N while its sensor reported 388.4 N, and under load
#    transfer the reading could drop to zero on a foot carrying full weight.
#    Each digit now has its own touch site and sensor, appended after the tail
#    block so every existing sensor index keeps its position, and both paths sum
#    pad + digits into one value per foot.  Observation width is unchanged (61
#    for trex) and the summed reading matches measured floor force exactly.
#    The T-Rex physics and visual fingerprints move because the MJCF gained
#    sites and sensors; the DYNAMICS do not -- old and new models are
#    bit-identical in qpos over 2000 perturbed steps and total mass is
#    unchanged.  build_mjx_observation is fingerprinted directly and had to
#    learn to sum, so every species' policy interface revision increments;
#    only the T-Rex's observation values actually change.
#
# 5. Reset can no longer generate an already-terminal state.  The root-height
#    jitter was the only UNBOUNDED term in the reset -- every other one is a
#    bounded uniform -- so BaseDinoEnv.reset now truncates it to the distance to
#    the nearer end of healthy_z_range, less a 0.02 m margin.  This is
#    fingerprinted through home_reset, so the three home-keyframe-residual
#    species increment and brachiosaurus does not.
#
#    Only T-Rex was actually broken.  Its 0.926 m home pelvis sits 0.226 m above
#    the 0.70 m floor, which at sigma 0.10 m is a 2.26 sigma margin, so 1.19% of
#    spawns landed below the floor and terminated on step 1 whatever the policy
#    did (measured: 18/2000 sub-floor spawns over seeds 3042-5041, 16 of them
#    terminal; 43/4000 over the wider range).  Those episodes are not policy
#    failures, and counting them as such caps any reliability gate near 99% for
#    reasons unrelated to the policy -- they are the direct cause of the 39/40
#    evaluation panels.  The bound binds at 2.07 sigma for T-Rex (3.9% of draws)
#    against 3.6-3.8 sigma for velociraptor and dibothrosuchus (~0.02%), so the
#    latter two change only in the far tail.
#
#    The bound is symmetric, so the mean spawn height is unchanged (0.9262 ->
#    0.9261 m over 2000 seeds) while the standard deviation tightens 0.1007 ->
#    0.0980.  Sub-floor spawns go 18/2000 -> 0/2000 and 43/4000 -> 0/4000.
#    All three species' reset DISTRIBUTIONS move, so their existing checkpoints
#    are trained against a different task and the zero-action baseline must be
#    re-measured before any stage-1 gate is calibrated against it.

#
# 6. Reset now settles the animal ON the ground, and two permanent
#    self-collisions were excluded.
#
#    BaseDinoEnv.reset placed the root by height alone.  But joint jitter
#    changes how far the lowest geom sits below the root, so no fixed root
#    height is right for most sampled poses, and entry 5's bound did not help:
#    healthy_z_range is a termination predicate on the ROOT and says nothing
#    about foot-to-floor geometry -- a T-Rex pelvis at 0.739 m is "healthy"
#    with the toes 0.198 m underground.  Measured over 40 seeds, spawns ranged
#    from 0.198 m inside the floor to 0.18 m above it; the solver answered
#    penetration with up to 19x body weight and launched the model 0.52 m
#    upward to tumble ballistically for ~60 steps before landing nose-down past
#    the nosedive threshold.  Reset now shifts the root so the lowest body geom
#    sits at the clearance the HOME KEYFRAME was authored with -- T-Rex's
#    plantar pad and digits at 0.491 mm of contact, and so on per species.
#    Settling to the authored depth rather than to a constant keeps the
#    noise-free reset bit-identical and keeps real foot-floor contact at spawn,
#    which the species static-balance suites already require.  Because the floor
#    is a horizontal plane a single shift settles the pose exactly, so no extra
#    RNG draws are consumed and the reset stays deterministic in its seed.
#
#    Separately, two MJCF geom pairs overlapped in the home pose and injected a
#    constant, pose-independent force into every step of every episode ever
#    run: trex tail_1_geom against both thigh capsules (18.8 mm, 8143 N per
#    side = 16.3 kN = 11x body weight) and brachiosaurus torso_main against
#    tail_2_geom (66.9 mm, 25.9 kN = 12.7x body weight).  Both are now
#    <exclude>d, matching the existing sibling-toe precedent.  T-Rex sibling
#    toe pair d2<->d4 was excluded for consistency with d2<->d3 and d3<->d4.
#
#    Effect on T-Rex, zero action, 40 seeds: t=0 contact force 16990 N (11.5x
#    body weight) -> 190 N (0.13x, i.e. resting rather than colliding); stance
#    duty bilateral 0.983 -> 0.992, single 0.003 -> 0.008, UNSUPPORTED
#    0.014 -> 0.000; survival 25/40 -> 28/40; mean episode length 683 -> 757.
#
#    PHYSICS moves for trex and brachiosaurus (MJCF contact exclusions).  The
#    POLICY INTERFACE moves for every species, since reset placement is
#    fingerprinted through home_reset and the settling applies to all four.
#    Every existing checkpoint is trained against a different task: the
#    zero-action baseline, the stage-1 operating point and any gate calibrated
#    against them must all be re-measured.
#
#    ADDENDUM: the MJX reset lagged this entry and kept spawning with joint and
#    yaw jitter at a fixed root height -- measured on T-Rex at stage-1 noise,
#    -41.2 mm to +5.2 mm around the authored contact -- and the midpoint action
#    mapping's qpos0 base pose hovered 610 mm over the floor on brachiosaurus,
#    opening every MJX episode with a half-metre free fall.  MJX now settles to
#    the same authored keyframe clearance analytically (exact for the species'
#    sphere/capsule/cylinder/box/ellipsoid geoms over the plane floor, verified
#    against mj_geomDistance to ~1e-9).  No further revision bump: this entry's
#    bump already declared the reset-placement interface moved for every
#    species, and no MJX checkpoint or baseline was produced between the two
#    landings.  A noise-free home-residual MJX reset is bit-identical to the
#    pre-settle behaviour; only jittered and midpoint spawns move.

# 11. The perturbation engine: scheduled external pushes for the recovery
#     stage (STAGE1_SPLIT_PLAN, stage 1b).  BaseDinoEnv.reset can now derive
#     a per-episode push schedule and BaseDinoEnv.step can apply the
#     scheduled push to the root body through xfrc_applied for its window
#     (environments/shared/perturbation.py; the MJX path mirrors both).
#     Push force is derived from the plant itself -- capture-point velocity
#     over the support hull and the root subtree mass -- so any species gets
#     a correctly scaled shove with no per-species constants (T-Rex r7:
#     165.5 N for 0.20 s at capture multiple 1.5).
#
#     Perturbation is OFF by default and only the recovery stage enables it.
#     While off, the new code is inert end to end: reset consumes no extra
#     RNG draw and step writes no force, so a perturbation-free episode is
#     bit-identical to the previous plant, RNG stream included, and every
#     existing checkpoint remains valid on its own stage.  While ON, the
#     schedule seed is drawn AFTER every pre-existing reset draw, so spawn
#     distributions are unchanged even under pushes, and reset(seed=S)
#     yields the same schedule for the policy and for every null controller
#     on either backend -- the pairing the recovery gate's null comparison
#     rests on.  The POLICY INTERFACE moves for every species because reset
#     placement is fingerprinted through home_reset and all four species
#     carry it; PHYSICS and VISUAL are untouched (no MJCF edit).
#
# 12. BEHAVIOR_RECIPES_PLAN §4.6 Phase C: a 3-dim body-relative command
#     segment (v_x_cmd, v_y_cmd, yaw_rate_cmd, pre-scaled to [-1, 1]) is
#     appended at the END of every species observation, zero under
#     command_mode = "none"; BaseDinoEnv.reset gained the per-episode
#     command hook (no RNG draw under "none"; the seeded draw stream is
#     pinned by tests/fixtures/phase_c_reset_golden.json); the SB3/MJX
#     plant-contract probes now inject a non-zero command; the
#     height-channel removal queued in note 11 is deliberately NOT batched
#     here (D3).  All six plants move, the two compsognathus recovery
#     calibrations are restamped (not re-measured).  Existing checkpoints
#     are widened, never re-labelled: environments/shared/scripts/widen_checkpoint.py.
#     The compsognathus recovery calibrations were restamped (plant identity
#     + task hash + restamp_history) by
#     environments/shared/scripts/restamp_recovery_calibration.py; their
#     profile_sha256 therefore moves and every compsognathus recovery freeze
#     made before this revision must be re-frozen.
#
# 19. Species named by their binomial, and every plant keyed by (species,
#     embodiment) (decision D-D33; schema_version 2).  The tables were
#     [plants.velociraptor], [plants.trex], [plants.brachiosaurus],
#     [plants.dibothrosuchus], [plants.compsognathus] and
#     [plants.compsognathus_robot]; they are now the anatomical models of
#     velociraptor_mongoliensis, tyrannosaurus_rex, brachiosaurus_altithorax,
#     dibothrosuchus_elaphros and compsognathus_longipes, and
#     compsognathus_longipes.robot.  Notes 1-18 name the plants by the IDs of
#     their date.  No observation, action, reset or dynamics change.  The
#     POLICY INTERFACE digests move only because the payload records the
#     qualnames of the hashed methods, which now sit on one base class per
#     species that a later robot of the species shares (TRexEnv._get_obs ->
#     TyrannosaurusRexEnv._get_obs, RaptorEnv -> VelociraptorMongoliensisEnv,
#     CompsognathusEnv -> CompsognathusLongipesEnv,
#     CompsognathusBiologicalEnv -> CompsognathusLongipesAnatomicalEnv, ...),
#     because the frozen MJX registrations of brachiosaurus and
#     dibothrosuchus moved to environments.<species>.anatomical.mjx_config
#     (jax_interface.registration_module), and because the compsognathus
#     helper robot_body_ids, read in CompsognathusLongipesEnv._cache_ids, is
#     renamed pelvis_subtree_body_ids; every hashed method's tokens are
#     otherwise unchanged.  policy_interface_revision +1 on all six
#     (11 -> 12, 14 -> 15, 8 -> 9, 7 -> 8, 4 -> 5, 2 -> 3).  The PHYSICS and
#     VISUAL digests are byte-identical: the plant contract paired each plant
#     of the v1 manifest with its new key by physics digest and found every
#     physics and visual digest equal, so those counters carry over.  Source
#     closures move with the paths (source-only).  Every existing checkpoint
#     is invalidated, which D-D33 accepts.

# 14. The velociraptor stands on its servos, on flat toes, and feels its whole
#     foot.  Four measured defects of the r2 plant, fixed together so the
#     species' digests move once (D-D25):
#
#     a) Every leg spring pulled toward qpos 0.  No leg joint set springref,
#        and MuJoCo's default is 0, not ref, so the stiffness-20 springs
#        pulled the settled hip, knee and ankle (34.0 / -45.2 / 80.2 deg)
#        toward zero with 11.9 / 15.8 / 28.0 N.m, and the statue stood by
#        spending 10.4 / 15.1 / 34.5 N.m of servo torque mostly cancelling
#        them.  Every leg joint's springref is now the standing pose.
#     b) The keyframe kept every leg joint at ref, which tips the toes 20 deg
#        toe-down: digit 3 sat 44.6 mm inside the floor, and since note 6
#        every reset settles to the keyframe's own clearance, so every episode
#        began that deep (reset peak floor force 2.08 BW mean, 2.42 max).  The
#        ankle and toes now flatten the foot (ankle 100 -> 90.5536 deg, toes
#        10 -> -0.5536 / 0.6464) while hip 38 and knee -50 keep the CoM over
#        it -- the hip-18 keyframe alone moves the support 7.6 cm ahead of the
#        CoM and the statue falls backward in 0.66 s -- and the root sits at
#        0.505543 m, 0.5 mm of contact as on the T-Rex.
#     c) Springs anchored at the stance alone make the statue fall: with the
#        home ctrl at the pose it lands on its body within 1.1-1.34 s on 10 of
#        10 seeds, because a servo with no error holds no torque, so the
#        joints sag 3-4 deg and the CoM rolls past the toe tips.  The home
#        ctrl now carries the gravity preload (ctrl - qpos = hip -0.606, knee
#        +0.166, ankle +3.206, toe_d3 +2.651, toe_d4 +1.127 deg: tau_g / kp,
#        with tau_g measured by a near-rigid hold), and the nominal servos --
#        kp, forcerange and ctrlrange unchanged -- hold it with 1.60 / 0.48 /
#        5.56 / 2.33 N.m (0.2-5.8% of forcerange), 40/40 even with every leg
#        spring deleted.  Re-sizing the leg actuators, which
#        VELOCIRAPTOR_PLANT_REVIEW and KNOWN_ISSUES said this fix required, is
#        not needed.
#     d) The foot touch sensor saw digit 3 only, 54% of the foot's floor load;
#        the rest sits on the metatarsal head and digit 4, other bodies.  Their
#        touch sites and sensors are APPENDED (sensordata 27-30, right foot
#        first) so existing indices keep their positions, and the env sums
#        d3 + metatarsus + d4 per foot: the summed reading equals the floor
#        force to rel 1e-6.  Observation width is unchanged (70).
#
#     Zero action, 40 episodes, noise 0.05, seeds 3042-3081, r2 -> r3: full
#     horizon 40/40 -> 40/40; settled pitch 24.02 -> 20.10 deg, so the 0.35
#     rad natural_pitch is right again (it settles at 0.3508); pelvis 0.4932
#     -> 0.5052 m; reset peak floor force 2.08 / 2.42 -> 1.34 / 1.76 BW (mean
#     / max); nosedive charge -95.3 -> -3.0 per episode.
#
#     PHYSICS moves (springref, key qpos and ctrl, and nsite / nsensor by the
#     layer's own definition).  The POLICY INTERFACE moves (the home ctrl that
#     action zero commands, the sensor layout, the observation values), and
#     with it the backend declaration: the summed foot cannot be mirrored by
#     the frozen MJX registration (D-D17), so velociraptor is now SB3-only and
#     environments/velociraptor/mjx_config.py is deleted, as KNOWN_ISSUES and
#     CLEANUP_PLAN_2026_09 section 4.1 prescribed for this revision.  VISUAL
#     moves (four group-4 touch sites).  Every velociraptor checkpoint is
#     invalidated, the certified stance and walker of 20260922_125248
#     included, and the statue-derived constants in
#     configs/velociraptor/stage1_balance.toml were re-measured on this plant.
#
# 17. Velociraptor, brachiosaurus and dibothrosuchus friction cones made
#     elliptic (<option cone="elliptic">; decision D-D30): one friction model
#     for every species.  The maintainer chose on 2026-10-11 to follow the
#     T-Rex (note 16) and both compsognathus plants, which declare it
#     already, even where the benefit is small.  A box or ellipsoid on the
#     floor plane keeps its contact tangent frame on the world axes whichever
#     way the animal faces, and MuJoCo's default pyramidal cone is weaker
#     between those axes; a capsule's frame turns with the foot.  Measured
#     through the heading probe's own path (run_panel with a whole-scene
#     SpawnYaw, zero action, seeds 3042-3049): the statue's +-45 deg rewards
#     differed from 0 deg by up to 0.84 on brachiosaurus r4 (ellipsoid feet,
#     the strongest effect of any species), 3.7e-2 on dibothrosuchus r1 (box
#     pads) and 1.8e-12 on velociraptor r3 (capsule metatarsus and digits,
#     already invariant); on the new plants they agree to 1.4e-12 at every
#     heading.  Raw MuJoCo from the home keyframe under fixed random commands
#     (uniform +-0.15 of each half range, each held 10 steps, 2000 steps), a
#     45 deg turn of the whole scene separated the joints by 7.9e-3 rad
#     (brachiosaurus), 8.7e-2 (dibothrosuchus) and 5.4e-3 (velociraptor, once
#     it fell onto its ellipsoid head), and by at most 4e-14 on the new
#     plants.  Only the cone moves: on MuJoCo 3.10.0 the other solver options
#     already equal the compsognathus's (Newton, 100 iterations, 50
#     line-search iterations, tolerance 1e-8, impratio 1; every geom condim
#     3).  Newton converges in 1.0-1.1 iterations per substep on each statue
#     (at most 6; old 1.0 and 5) and 2.4-3.3 under N(0, 0.22) commands (at
#     most 10 on seeds 3042-3044; old 1.5-2.0 and 6), never at the cap and
#     with no MuJoCo warning.  Statues, zero action at reset noise 0.05,
#     old -> new:
#     a) velociraptor r3 -> r4, on stance_quality/v2: clean on 40/40 of the
#        certification seeds 3042-3081 on both (bound 0.928), and on 238/240
#        out of sample (3082-3201, 5042-5081, 7042-7081, 9042-9081) against
#        r3's 239/240.  Seed 9065 lands on its body at step 162 (r3 at 168:
#        not the cone); seed 5060's lighter foot carries 0.342 of one 1 s
#        block, under the 0.35 min_foot_load_share_windowed bar (r3 0.432),
#        the one bar a full-horizon r4 statue episode fails.  The feet carry
#        the same mean load (66.2 N each) but share it less evenly and rest
#        digit IV less steadily (certification / out of sample, over the
#        full-horizon episodes, so without seed 9065): lighter-foot share
#        0.481 / 0.464 (r3 0.494 / 0.490), windowed 0.412 / 0.342 (0.457 /
#        0.425), support-geom duty 0.964 / 0.869 (1.000 / 0.970), coverage
#        0.988 / 0.956 (1.000 / 0.990), statue ratio 0.962 / 0.932 (0.987 /
#        0.981); the settle bars barely move.  The statue settles at 20.02
#        deg (0.3494 rad over 40 seeds) and pelvis 0.5055 m (r3 20.10 deg,
#        0.3508, 0.5052 m), so natural_pitch 0.35 carries.
#        configs/velociraptor/stage1_balance.toml keeps every bar with the r4
#        extremes in its comments; its reference carries (2843.00 +/- 2.70
#        against 2842.76 +/- 2.62, inside one standard error) and its pin
#        moves to 4.
#     b) brachiosaurus r4 -> r5, on reward_and_length/v1: stance 1738.38 +/-
#        1.46 (1739.08 +/- 1.17), 40/40, and 80/80 on 3082-3161; -0.7 is
#        about three standard errors, so the figure moves, but 0.60x and 0.75x
#        still round to the 1040 / 1300 rails.  The locomotion statue reads
#        2201.3 +/- 200.6 (2242.7 +/- 7.8; median 2244.9 against 2243.2): two
#        of its 40 episodes lose 724 and 1088 of gait_symmetry's 2200 to a
#        briefly unloaded foot.  The trunk settles about 2 mm higher.
#     c) dibothrosuchus r1 -> r2, on reward_and_length/v1: stance 2598.53 +/-
#        0.87 (2598.29 +/- 0.86), 40/40, and 80/80 on 3082-3161; the rails
#        stay 1560 / 1950; locomotion 2197.0 +/- 217.8 (2196.9 +/- 217.7).
#        The trunk settles at 0.3132 m (0.3129, which dibothrosuchus_env.py
#        keeps as target_z: the clipped height term pays the statue in full
#        either way), and the pads stand nearer their heel edge: the worst
#        pad's fore-aft CoP reads 0.752 at the median and 0.795 at most on
#        3042-3081 (r1 0.694 / 0.706), against the 0.80 bar D-D28 sets on the
#        T-Rex, should this species adopt stance_quality/v2.
#     PHYSICS moves for all three; the POLICY INTERFACE (velociraptor
#     f12251.., brachiosaurus 506613.., dibothrosuchus d0194c..) and VISUAL
#     (1bf243.., 445b4d.., 0a5f29..) digests are unchanged, so the policy
#     interfaces stay 11 / 8 / 7 and the visual layers 4 / 2 / 1.  Every
#     velociraptor physics-r3, brachiosaurus physics-r4 and dibothrosuchus
#     physics-r1 checkpoint is invalidated (the plant check compares
#     physics_sha256); no widen applies.
[plants.velociraptor_mongoliensis.anatomical]
physics_revision = 4
policy_interface_revision = 12
visual_revision = 4
observation_schema = "bipedal-target/v1"

# 4. The T-Rex theropod stance correction.  The home keyframe stood the animal
#    on a near-straight knee (172.1 deg interior, 7.9 deg from full extension),
#    which is the singular region for leg-length control: hip-to-ankle distance
#    changes at only 0.024 m/rad there, so servicing the stage-1 height term
#    cost 23.7 deg of knee travel per centimetre of pelvis height.  The keyframe
#    now flexes the limb to a 135.0 deg interior knee -- 45 deg of flexion from
#    the columnar reference pose, the figure Hutchinson et al. (2005,
#    Paleobiology 31:676-701, Fig. 8) use for T. rex, converted by their own
#    Table 1 rule ("for the knee subtract the angle here from 180 deg").  Femur
#    and tibia sit symmetrically at 22.5 deg either side of vertical, which is
#    the unique inclination holding the hip over the ankle for this plant's
#    1.000 tibia:femur, so the CoM / support-polygon relationship is unchanged
#    (33.8% heel-to-toe against 34.3% before).  Leg-length authority rises
#    0.024 -> 0.134 m/rad, i.e. 23.7 -> 4.3 deg of knee per centimetre.
#    Segment vectors, masses, inertias and the whole foot are untouched: the
#    metatarsus keeps its authored 21.8 deg digitigrade slope because the three
#    rotations sum to zero, so the plantar pad and digits keep their 0.5 mm
#    contact.  PHYSICS moves (keyframe qpos, joint ranges, spring references);
#    the POLICY INTERFACE moves because the leg ctrlranges were re-centred on
#    the new pose and the home control vector -- which is what action zero
#    commands under home-keyframe-residual/v1 -- moved with them.  Every
#    existing T-Rex checkpoint is invalidated.
#
# 9. T-Rex toes made passive.  The six per-digit position actuators (kp 60,
#    forcerange +/-50, ctrlrange -0.4363..0.8727) are deleted; the digits keep
#    their hinges, and the leg_joint class already gives them the passive
#    stance: stiffness 40 with springref 12.5 deg holds the old commanded home
#    pose, damping 15 dissipates strike energy.  Motivation is the stage-1
#    bounce postmortem (docs/investigations/TREX_STAGE1_BOUNCE_2026_08.md):
#    release-ablation showed holding only the six toes at home reproduces the
#    whole constant-hold failure, i.e. the policy's learned 0.8727 rad claw
#    curl -- not the leg servos -- seeded the bounce, and a splayed digit is a
#    pose the passive spring simply cannot hold.  PHYSICS moves (nu 21 -> 15,
#    actuator arrays, key ctrl shrinks to 15 entries; qpos/qvel widths and all
#    16 sensors unchanged).  The POLICY INTERFACE moves (action_dim 21 -> 15
#    and the home-keyframe-residual origin ctrl vector shrinks with it); the
#    observation is unchanged at 61 -- toe joints stay in qpos/qvel.  VISUAL is
#    untouched (no geom, site, material, camera or light moved).  Every
#    existing T-Rex checkpoint is invalidated, and the statue-derived
#    constants (min_avg_reward, collapse_peak_floor_reference) must be
#    re-measured with zero_action_baseline.py / stance_quality_baseline.py on
#    this plant -- the statue's toes now settle on springs instead of servos,
#    so the old 3271.8 standing reward may not carry.
# 10. T-Rex commands are low-passed at 10 Hz.  Both 2026-08 stage-1 runs
#     converged on statically unstable poses held up by 16.8-18.7 Hz command
#     chatter (the narrow-tolerance run locked both knees against their
#     stops and pumped the ankles +-28-33 deg; its constant-hold probe fell
#     backward onto the tail in 9/10 episodes within ~3 s), while the
#     balance task itself needs ~1.1-1.4 Hz.  The plant now applies a
#     first-order low-pass (environments/shared/action_filter.py) to the
#     commanded action in BOTH backends, seeded with the first post-reset
#     action.  PHYSICS unchanged (no MJCF edit; the statue's zero action
#     filters to zero, so the statue-derived constants carry).  The POLICY
#     INTERFACE moves without any tensor changing shape: an action now means
#     "pre-filter command", so checkpoints trained unfiltered are
#     incompatible (the "action meaning" rule in docs/PLANT_CONTRACT.md).
#     The cutoff is plant-level by construction -- an SB3 class attribute
#     and a register_species_mjx field guarded by
#     _PLANT_INTERFACE_CONFIG_FIELDS -- so stage TOMLs cannot tune it, and
#     the contract records cutoff + filter fingerprint and asserts backend
#     agreement.  See
#     docs/investigations/TREX_STAGE1_NARROW_TOLERANCE_RUN_2026_08.md.
# 13. T-Rex hip-roll servos sized for the plant's mass.  r/l_hip_roll_act go kp
#     150 -> 600 and forcerange +/-120 -> +/-480, keeping the 0.8x kp spike cap;
#     ctrlrange, joints, keyframe, sites and sensors are untouched.  The July
#     home-equilibrium repair mass-scaled hip pitch, knee and ankle only, so hip
#     roll kept its raptor-era gain.  With both feet planted the two hip-roll
#     servos and their 40 N.m/rad joint springs resist lateral sway in parallel,
#     which is stable only while 2 x (kp + 40) exceeds the settled statue's
#     m.g.h = 85.72 kg x 9.81 x 0.8377 m = 704.4 N.m/rad; kp 150 gave 380, kp
#     600 gives 1280 (1.8x).  Measured on the 40-episode statue panel (seeds
#     3042-3081, reset noise 0.05): the soft servos left the reset's hip-roll
#     noise in the stance, rolling the worse pad up to 3.42 deg over the
#     post-settle window, unloading the outer digit on 4/40 episodes and
#     spreading the settled foot-site width over 0.218-0.337 m -- the
#     propped-foot signature the trained stances showed, on the statue itself.
#     On this plant the worst pad is 1.15 deg (1.53 over 80 more seeds) and the
#     width 0.244-0.316 m.  Quasi-static lateral push capacity rises from 3.3%
#     to 5.1% of body weight (fore-aft stays 3.2%, set by leg-chain compliance,
#     not the hips; KNOWN_ISSUES records the fore-aft fragility), and the
#     pushed recovery statue loses all 20 of its lateral "fallen" ends.  The
#     capacity protocol: the zero-action statue at reset noise 0, a 200-step
#     settle, then a horizontal force on the pelvis through xfrc_applied (as
#     the perturbation engine applies it) ramped over 0.5 s, held 2.5 s and
#     released for 2 s, bisected on the largest force it survives.  The
#     stance-hack audit's "about 6% BW in every direction" used a different
#     protocol, so compare these figures with each other, not with it.  The symmetric settle does not move: the noise-free
#     statue's 1000-step reward (3517.26), pelvis height 0.9260 m and forward_z
#     -0.0279 equal r7's, so target_z, natural_pitch and
#     nosedive_termination_threshold carry.  Measured and left out: stiffer
#     passive digits (300 / 600 N.m/rad: forward push capacity +11% / +17%,
#     backward and lateral +0, statue pad roll and outer-digit lift unchanged or
#     worse), and tail_1 authority (at kp 100 the servo cannot lift tail_1 off
#     its -12 deg stop -- 42.0 + 16.9 N.m against 68.3 N.m of gravity -- but kp
#     300 moves _TAIL_SETTLED_QPOS and forward_z, slows the tail's settle past
#     200 steps and opens a new actuated balance channel: a new task, not a
#     plant fix).  PHYSICS moves; the POLICY INTERFACE (0b43de..) and VISUAL
#     (7042dc..) digests are unchanged, so policy stays 13 and visual 4.  Every
#     existing T-Rex checkpoint is invalidated (the plant check compares
#     physics_sha256), including the certified seed-42/44 stances, the seed-44
#     recovery and both walkers; no widen applies.  The statue-derived constants
#     of all four configs/trex stage files were re-measured on this plant:
#     stance 3766.1 (with the r8 stance task), recovery 1337.5, locomotion
#     1091.5 and behavior 602.0 (both unchanged).
# 16. T-Rex friction cone made elliptic (<option cone="elliptic">), so every
#     world heading is physically identical.  The plantar pads are boxes, and
#     a box-on-plane contact keeps its tangent frame on the world axes
#     whichever way the animal faces; MuJoCo's default pyramidal cone is
#     weaker between those axes, so the pads' friction depended on world
#     heading.  Measured through the heading probe's own path (run_panel with
#     a whole-scene SpawnYaw, zero action, seeds 3042-3049): on r8 the
#     statue's rewards at +-45 deg differed from 0 deg by up to 2.6e-2, and
#     by 4e-11 at +-90 and 180; on r9 they agree to 3e-11 at every heading.
#     Raw MuJoCo from the home keyframe under fixed random commands (uniform
#     +-0.15 of each half range, each held 10 steps, 2000 steps), a 45 deg
#     turn of the whole scene separated the joints by 7.7e-2 rad on r8 and by
#     4.8e-14 on r9.  Only the cone moves: on MuJoCo 3.10.0 the other solver options
#     already equal the anatomical Compsognathus's (Newton, 100 iterations,
#     50 line-search iterations, tolerance 1e-8, impratio 1).  Newton
#     converges in 1.7 iterations per substep on the statue (at most 6; r8
#     1.1 and 4) and 3.4 under N(0, 0.22) commands (at most 10), never at
#     the cap and with no MuJoCo warning.  impratio 10 was measured and left
#     out: the statue is clean on 25/40 with 4 nosedives.  The symmetric
#     settle barely moves (the noise-free statue, 1000 steps, means over
#     steps 200-999): pelvis 0.92616 m against 0.92601, forward_z -0.02714
#     against -0.02778, neck and tail within 1.6e-4 rad of
#     _NECK_SETTLED_QPOS / _TAIL_SETTLED_QPOS, stance width 0.27999 m, reward
#     3788.93 against 3788.45, so target_z, natural_pitch,
#     nosedive_termination_threshold and the settled-pose targets carry.  On
#     the stance statue panels (reset noise 0.05) the statue is not neutral
#     to the change: clean on 39/40 on the certification seeds 3042-3081
#     (seed 3081 nosedives at step 292; r8 40/40) and on 236/240 out of
#     sample (3082-3201, 5042-5081, 7042-7081, 9042-9081; r8 238/240), with 4
#     falls in 280 against r8's 2 (3081, 3174, 5048, 9062 against 3174 and
#     9062; Fisher exact p = 0.69).  Its worst pad tilts 1.54 deg on 3042-3081
#     and 2.061 deg on 1 of the 240 (seed 3121, over the 2.0 bar; r8 1.15 /
#     1.53), its pads load fewer contact points (median 2.67 against 3.79,
#     least 1.956 against the 1.5 bar) and its worst fore-aft CoP reads 0.476
#     (r8 0.480).  configs/trex/stance.toml keeps every bar and records the r9
#     extremes in each comment.  The statue-derived constants of all four
#     configs/trex stage files were re-measured and carry, every move inside
#     one standard error: stance 3755.7 standing (3756.8), recovery 1369.4
#     (1329.1), locomotion 1092.1 standing (1091.5) and behavior 593.4
#     (602.0).  The fore-aft fragility KNOWN_ISSUES records stays: ankles
#     +0.03 reach the horizon on 14/40 (r8 14/40), -0.03 on 24/40 (r8 18/40).
#     PHYSICS moves; the POLICY INTERFACE (0b43de..) and VISUAL (7042dc..)
#     digests are unchanged, so policy stays 13 and visual 4.  Every T-Rex
#     physics-r8 checkpoint is invalidated (the plant check compares
#     physics_sha256); no widen applies.
# 18. T-Rex and anatomical compsognathus observations made heading-free
#     (decision D-D31; docs/HEADING_INVARIANCE_DESIGN_2026_10.md).  Both fed
#     their policies the root's world quaternion, world linear velocity and
#     world prey direction, so a stance could learn to depend on its world
#     heading where no stance criterion sees it: stance_quality/v2 certified
#     the seed-52 T-Rex stance 20261009_155723, which stands 0/8 with the
#     whole scene turned -90 or -45 deg.  Schema
#     bipedal-target-heading-free/v1 (environments/shared/heading_observation.py)
#     replaces those three blocks and keeps every other channel:
#
#       segment                          trex  compso  content
#       joint_position, joint_velocity   21+21 17+17   unchanged
#       pelvis_projected_gravity         3     3       R^T (0, 0, -1): unit down in pelvis
#                                                      coordinates (was the 4-wide quaternion)
#       pelvis_angular_velocity          3     3       gyro, its own site frame (unchanged)
#       pelvis_heading_linear_velocity   3     3       qvel[0:3] in the gravity-aligned heading
#                                                      frame: forward, left, up
#       pelvis_linear_acceleration       3     3       accelerometer, site frame (unchanged)
#       foot_contact                     2     2       per-foot touch sums (unchanged)
#       prey_direction_body              3     3       R^T d, the normalized pelvis-to-prey
#                                                      direction in pelvis coordinates
#       prey_distance                    1     1       unchanged (from xpos[pelvis])
#       command                          3     3       unchanged, last
#
#     R is built from the free root's own quaternion qpos[3:7], validated and
#     normalized in float64 (the constructor calls _get_obs before any
#     forward pass, where xmat and the orientation sensor still read zero),
#     and the observation is cast to float32.  The heading frame's forward
#     axis is the horizontal projection of pelvis X; below 1e-8 (pelvis X
#     vertical, a terminal pose) the horizontal projection of pelvis Y turned
#     clockwise 90 deg stands in, which turns with the scene.  A quaternion
#     that is not four finite numbers or has norm below 1e-12 is an
#     ObservationStateError, never a world-axis default.  Measured: a global
#     yaw leaves the float32 observation unchanged on 100 lifted, tilted,
#     moving states x 7 turns per species (0 against the design's 2e-6),
#     q and -q read the same, and one seed turned with its whole scene to
#     each of -90, -45, 0, 45, 90 and 180 deg repeats its episode: the same
#     float32 actions, joint state to 2.9e-13, rewards to 3.0e-12 per step
#     (250 steps, zero action and a fixed linear policy), and over the full
#     1000 steps of seeds 3042-3043 behind an untrained PPO policy and a
#     frozen VecNormalize joint state to 4.5e-13 and every floor-truth stance
#     metric to 2e-10 (single-threaded torch: a one-ulp action difference,
#     carried to 7.3e-8 in joint state).
#
#     T-Rex policy interface r13 -> r14 (64 -> 63 wide); anatomical
#     compsognathus r3 -> r4 (56 -> 55, through
#     CompsognathusBiologicalEnv._get_obs, so the robot keeps
#     CompsognathusEnv's observation and every digest).  The plant contract's
#     segments for this schema name each block's frame, source and threshold
#     and describe the feet per foot, their widths are checked to sum to the
#     observation width with the command last, and the helpers' tokens are
#     hashed beside _get_obs (interface_implementations.heading_free_observation).
#     The frozen MJX builders (D-D17) emit only the legacy layout, so the
#     T-Rex leaves the core as the velociraptor did at note 14: SB3-only,
#     with environments/trex/mjx_config.py deleted; its low-pass filter stays
#     hashed (interface_implementations.action_low_pass_filter).  As for every
#     SB3-only species its _cache_ids tokens now enter its policy digest
#     (sb3_sensor_cache), so a token edit there, reward-target setup
#     included, is a policy-interface revision.  (trex.xml's sensor comment
#     still names the deleted registration: an MJCF edit would move the
#     source closure, so it waits for the next T-Rex physics revision.)
#
#     Only the POLICY INTERFACE moves: PHYSICS (trex 3d68ae.., compsognathus
#     592064..), VISUAL (7042dc.., 340185..) and the source closures are
#     unchanged, and rewards, terminations and dynamics are bit-identical at
#     corresponding states.  Every T-Rex policy-interface-r13 and anatomical
#     compsognathus r3 checkpoint is invalidated (the plant check compares
#     the interface digest and the observation width) and none can be
#     widened: the width moves by -1, not by a command segment.  The
#     compsognathus recovery calibration was restamped, not re-measured
#     (restamp_recovery_calibration.py; physics and the recovery [env] block
#     unchanged, and its fixed-command nulls do not read the observation);
#     its profile_sha256 moves, so a recovery freeze made before must be
#     re-frozen.
# 20. T. rex physics r10: a load-bearing tridactyl foot (decision D-D34;
#     docs/investigations/TREX_FOOT_R10_2026_10.md).  On r9 each foot stood
#     on a 14 x 9 cm plantar pad 0.070-0.210 m ahead of the ankle, with three
#     near-parallel digits (splay +8.7 / -7.6 deg) on 40 N.m/rad MTP springs
#     that carried 17% of the statue's load near their bases.  Both feet change:
#
#     a) The sole box, a stance approximation of the metatarsal (heel) pad and
#        the soft tissue under the proximal phalanges (McCrea et al. 2014;
#        "metatarsodigital pad", Xing et al. 2019 via Falkingham et al. 2026):
#        10.5 x 11 cm, 0.060-0.165 m ahead of the ankle, centred 6 mm lateral,
#        rigid across the MTP joints (0.080 m) and the first interphalangeal
#        joints (0.121-0.144 m), which flex in life; the width and shape of
#        its heel are not measured.  Same 0.02 kg and geom names.
#     b) Digits II / III / IV 0.171 / 0.212 / 0.178 m from MTP joint to claw
#        tip: Sue's digit / MT III ratios (FMNH PR 2081; Brochu 2003 via
#        Mortimer, Theropod Database; digit IV completed from Gorgosaurus) at
#        this model's MT III, the TOP of the plausible range (leg scale 0.157 /
#        0.194 / 0.163).  Kept for mechanics: at the leg scale the forward push
#        limit falls to 49.8 N, under r9's 55.4, and no stiffer spring
#        recovers it (51.8 / 54.0 / 55.2 N at 4x / 6x / 8x the base of the
#        stiffness ladder under c; this plant's springs are its 3x).  Chord
#        divarication 25 (II) and 33 (IV) deg off digit III, a compromise
#        below the Bellatoripes means (30, 36 deg): the phalangeal axes of II
#        and IV deviate progressively (Brochu 2003), so the digits curve,
#        and their chord, which the straight capsule follows, sits below
#        the track angles measured on the free digits; the Hell Creek
#        track attributed to T. rex (35, 40 deg) is not matched.  Not
#        modelled: the hallux, MT V, the MTP stagger and a measured MTP
#        condyle spacing.  Masses unchanged (animal 85.72 kg, foot 1.76 kg).
#     c) MTP springs 3000 / 4500 / 3000 N.m/rad (damping 35 / 43 / 35), a
#        mechanical choice, not a measurement: the lowest rung of a stiffness
#        ladder (1x 43.8 N, 2x 54.0 N, 3x 58.4 N of forward push limit) that
#        beats r9's push limit by 5%; omega_n dt 0.42 at the 0.1 armature.
#        Springs this stiff resist toe-off (docs/KNOWN_ISSUES.md).
#
#     Unchanged: every body, joint, geom, site and sensor and its order, the
#     r/l_foot sites (stance width 0.280 m), the r15 toe touch sites, the
#     keyframe (root z 0.9266, every foot geom 0.491 mm into the floor) and
#     the sibling exclusions.  So the POLICY INTERFACE digest (ffbf66..) is
#     unchanged and policy stays 15; PHYSICS (3d68ae.. -> 1a05bc..) and VISUAL
#     (7042dc.. -> 053773..: the visual layer hashes geom pose and size)
#     move, physics 9 -> 10 and visual 4 -> 5.  The digests are the ones the
#     foot proposal evaluated (its MJCF differs in comments only).
#
#     Measured on this plant (mujoco 3.10.0, the stance [env], reset noise
#     0.05; scratch harnesses on the repository's recorder):
#     - The statue stands on all 280 stance-panel seeds (3042-3201,
#       5042-5081, 7042-7081, 9042-9081; r9 fell on 4 of the same seeds,
#       Fisher exact p = 0.12, not significant) and is clean under the
#       stance gate on all of them.  Over the 280 its sole box carries 0.67
#       of each foot's load at the median (both feet), digits II / III / IV
#       0.14 / 0.09 / 0.13; on 3042-3081, where r9 was measured, 0.66 and
#       0.12 / 0.10 / 0.14 (r9's pad 0.83, digits 0.06 / 0.05 / 0.07).  The
#       split moves with the stance's roll.  At the home keyframe a foot
#       transmits 378.6 N on the box and 96.7 N on the digits (r9 388.4 +
#       112.0).
#     - The toe line of environments/shared/scripts/foot_toe_line.py is
#       0.213 m (first falls at -5.0 / -5.5 deg on the right / left ankle, the
#       other foot's CoP 214.8 / 213.4 mm ahead of its ankle); the foot
#       proposal measured r9's at 0.196 by the same rule.
#     - The whole-foot CoP on [0.060, 0.213] m reads at most 0.351 on the
#       statue (280 episodes) and 0.723 under N(0, 0.05) command jitter, and
#       the stance gate's rail moves to it (D-D34; stance.toml).
#     - The ankle probe of KNOWN_ISSUES (+-0.03 on both ankles, 3042-3081):
#       +0.03 reaches the horizon on 25/40 (r9 14/40), -0.03 on 40/40 (r9
#       24/40).  The foot proposal's scratch evaluation adds a forward push
#       limit of 58.4 N against 55.4, a first nosedive under a held
#       single-ankle offset 1.0-1.5 deg later, a statue toe margin to each
#       plant's own held-offset line (0.213 / 0.196 m) of 29.1 against
#       22.5 N m (1.77 against 1.37 deg of ankle servo error; the worse
#       foot 28.4 against 21.4), statue falls under its H4 joint-noise
#       vectors 6/60 against 30/60, and four r9-trained policies falling
#       0/80 under that noise against 9/80.
#     - Touch equals floor truth to within 1e-6 N (solver precision) on
#       every floor contact of 465 recorded episodes.  The one other foot
#       contact is seed 7068's spawn: digit II on the other foot's digit II
#       for the first 4 substeps of step 0 (118-174 N on both toe-II
#       sensors), which the 7.7 cm between the digit-II tips at home (14.0
#       on r9) allows.
#     - Noise-free statue settle (steps 200-999): pelvis 0.92624 m (r9
#       0.92616), forward_z -0.0282 (-0.0271), neck and tail within 3.4e-5
#       and 6.4e-5 rad of _NECK_SETTLED_QPOS / _TAIL_SETTLED_QPOS, stance width
#       0.2805 m, so target_z, natural_pitch, healthy_z_range, the
#       nosedive threshold and the settled-pose targets carry.
#     - The statue-derived constants: stance 3757.3 +/- 16.4 (3756.8 and the
#       2250 rail carry), locomotion 1092.3 +/- 4.6 (1091.5 -> 1092.3),
#       behavior 602.0 (and the 361 rail carry), recovery 1504.4 +/- 654.7
#       (1329.1 -> 1504.4).  The recovery push derives to 186.8 N (165.5 N on
#       r7-r9): the derivation's support margin, the heel-ward side of the
#       home contact hull around the CoM, grows from 77.3 to 87.2 mm.
#     - Two settle readings change.  On 3042-3081 the statue's spawn now
#       leaves the floor on 17 of 40 episodes (up to 16 substeps, all inside
#       the 0.1 s spawn grace; r9 none), and it reaches the
#       max_settle_touchdowns bar of 2 on 10 of the 40 (r9 at most 1); over
#       the 280 it reaches it on 89.
#
#     Every T. rex physics-r9 checkpoint is invalidated (the plant check
#     compares physics_sha256) and no widen applies; every recorded T. rex
#     video shows the r9 feet (visual r4).  The T. rex has no
#     committed recovery calibration; its frozen recovery gate, stale since
#     r8, is re-frozen at the first r10 stance it certifies.
[plants.tyrannosaurus_rex.anatomical]
physics_revision = 10
policy_interface_revision = 15
visual_revision = 5
observation_schema = "bipedal-target-heading-free/v1"

# 7. Brachiosaurus can stand: residual action mapping and load-bearing servos.
#
#    Stage 1 was not a balance task for this species: the zero-action statue
#    fell on 40 of 40 episodes at mean length 130.7 (PLANT_VALIDATION §6), so
#    there was no "do not fall" floor and no stage-1 result was interpretable.
#    Two compounding defects, both measured:
#
#    a) BrachioEnv was the only species still on the inherited MIDPOINT action
#       mapping, and its home stance is not the ctrlrange midpoint: "do
#       nothing" dragged the knees up to 0.349 rad and the ankles 0.175 rad
#       away from the standing pose on every step.  Commanding the actual home
#       controls tripled statue survival (mean length 141 -> 455) on its own.
#       Both backends now use home-keyframe-residual/v1 like the other three
#       species; on MJX this also moves the reset base pose from qpos0 (which
#       hovered 610 mm above the floor) to the home keyframe.
#
#    b) The leg position servos could not statically carry the animal: it
#       sagged 71.6 mm under its own weight, putting the planted stance's roll
#       stiffness (~1.9e3 N*m/rad) at parity with the destabilising gravity
#       stiffness m*g*h (~1.77e3), so the statue tipped over in slow roll on
#       9 of 10 resets even when commanding the exact home pose.  Leg kp is
#       doubled (sag 11.1 mm), with forceranges scaled to keep each actuator's
#       documented force-to-stiffness sizing.
#
#    Zero action, 40 episodes, stage-1 noise 0.05, before -> after: reward
#    163.35 +/- 81.40 -> 1739.08 +/- 1.17; full-horizon 0/40 -> 40/40;
#    terminations (fallen 34, tail_contact 6) -> (truncated 40).  The +/- 1.17
#    spread is the tightest of any species and makes brachiosaurus a good
#    gate-prototyping plant (PLANT_VALIDATION §6 asked for exactly this
#    property).  PHYSICS moves (actuator gains); the POLICY INTERFACE moves
#    (action mapping).
#
# 8. Brachiosaurus can feel its feet: pad sites enlarged, meta sensors added.
#
#    FOOT_SENSOR_VERIFICATION section 4: all four foot touch sensors read
#    exactly 0.0 N while mj_contactForce reported 98.8% of body weight over
#    four real floor contacts, so the policy trained with four permanently
#    dead input dimensions and the support-duty diagnostics scored the
#    standing statue as 88.5% airborne.  Two causes: the pad sites were
#    r=0.03 spheres that did not contain the pad's floor contact points, and
#    the metacarpus/metatarsus carries part of the load on the pad's PARENT
#    body, which no site on the pad body can see however large.  The pad
#    sites are now boxes enclosing the pad's contact zone, and four meta
#    touch sensors are APPENDED (sensordata 26-29) so existing indices keep
#    their positions; both backends sum pad + meta per leg (the same repair
#    shape as the T-Rex digit sensors, aa87445).  Verified: summed sensors
#    now report 100.0% of the mj_contactForce floor total in settled stance
#    (fr/fl 313 N, rr/rl 535 N).
#
#    Attribution, measured on the repaired plant: the PAD-SITE enlargement
#    alone accounts for that 100.0% -- with note 7's stance fix the meta
#    capsules no longer reach the floor and the meta sensors read 0.0 N at
#    home.  They earned their place on the pre-repair SAGGING plant, where
#    the meta carried a real share (fr/fl contact at 34.4 mm depth), and they
#    remain the correct defensive cover for any pose that puts the meta back
#    on the ground.  Do not read the note as "the meta was carrying load
#    here"; it is not, today.
#
#    Known remaining gap, NOT fixed here: only the pads and metas are
#    instrumented.  A brachiosaurus kneeling on its SHINS (measured: a deep
#    knee/ankle command settles onto fr/fl/rr/rl_shin_geom carrying the full
#    1695 N, feet clear of the floor) reads 0.0 N on every foot sensor, so
#    the support-duty metrics score it identically to airborne.  For the
#    section 12 unsupported-duty gate that errs in the safe direction -- a
#    kneeling policy fails a stance gate, which is the desired outcome -- but
#    any future diagnostic that needs to tell "kneeling" from "airborne"
#    needs shin instrumentation.  Statue stance quality at noise 0.05 moved
#    from all-feet 0.000 / unsupported 0.885 to all-feet 0.998 / unsupported
#    0.000.  The POLICY INTERFACE moves (sensor layout and observation
#    values).  PHYSICS also moves, by the layer's own definition rather than
#    by dynamics: the physics fingerprint covers structural dimensions
#    including nsite and nsensor, so adding sites and sensors bumps it even
#    though they carry no mass and no contacts and every trajectory is
#    unchanged.  VISUAL moves for the same structural reason: that layer
#    fingerprints body-local site definitions (all new sites are group 4,
#    hidden in default renders).  Velociraptor's 45% under-read (same doc,
#    section 3) remains open and is NOT part of this entry.
#
# Brachiosaurus physics r5 and dibothrosuchus physics r2: note 17, above
# [plants.velociraptor_mongoliensis.anatomical] (the elliptic friction cone,
# D-D30).
[plants.brachiosaurus_altithorax.anatomical]
physics_revision = 5
policy_interface_revision = 9
visual_revision = 2
observation_schema = "quadrupedal-target/v1"

[plants.dibothrosuchus_elaphros.anatomical]
physics_revision = 2
policy_interface_revision = 8
visual_revision = 1
observation_schema = "quadrupedal-target/v1"

# Initial training interfaces for the anatomical and Rev B robot variants.
# Existing kinematics, masses and actuators are retained. Diagnostic frame
# sensors use xbody (the pelvis frame), not the inertial principal axes.
#
# 15. The anatomical compsognathus stands on its whole foot, and PPO can
#     explore around the statue.  Both certified r1 stances were one-foot
#     tiptoe marches on the digit-III tip.  The stance review traced them to
#     an action map that put the statue's whole holding torque inside 1% of
#     the action and to two plant defects that made the flat stance fragile,
#     and found the right foot built as a left foot; the implementation
#     found the MTP servo ringing numerically.  Five changes, landed
#     together so the species' digests move once (D-D26); a), b), c) and e)
#     are generator edits confined to build_biological:
#
#     a) The tail's 178 g is spread at one density over its tapered meshes:
#        tail_1..tail_4 0.080 / 0.055 / 0.028 / 0.015 -> 0.1173 / 0.0461 /
#        0.0125 / 0.0021 kg (583 / 1019 / 1918 / 6223 -> 854-871 kg/m3; the
#        r1 tip was denser than bone).  Body mass stays 1.000 kg.  The home
#        CoM moves 9.8 mm forward (3.6 -> 13.4 mm ahead of the hip), the
#        settled statue's CoM sits 19.6 -> 29.3 mm ahead of the plantar
#        pad's rear edge (0.25 -> 0.38 of the 78 mm foot), and the tail's
#        pitch inertia about tail_1 halves, 0.00825 -> 0.00434 kg m2.
#     b) The metatarsus collision capsule, also the drawn shank, ends 4 mm
#        short of the MTP joint along its own axis
#        (metatarsus_collision_inset_m).  The metatarsal head rests on the
#        pad and is never support, yet the settled r1 statue held it 1.07 mm
#        off the floor, so a 1 mm soft-contact sink of the sole touched it
#        with 0 N on it (48 of 48 first touches) and the terminating contact
#        ended upright, flat-footed episodes as falls.  Settled clearance is
#        now 4.81 mm; contact still terminates, so a real crouch is a fall.
#     c) Digit II is medial on both feet.  r1 built the right foot as a left
#        foot (its digit-II tip lateral, at world y -64 mm).  Mechanically
#        neutral; the home preload becomes left-right symmetric.
#     d) Policy interface: the species' env is CompsognathusBiologicalEnv
#        (species_manifest env_entrypoint, the species registry and
#        MesozoicLabs/Compsognathus-v0), whose action mapping
#        home-keyframe-residual-softcubic/v1 shapes the ten leg residuals to
#        b = 0.1 a + 0.9 a^3 before the unchanged home-keyframe span: action
#        zero is still the home ctrl and +-1 still the ctrlrange ends, but
#        the slope at home is a tenth.  Every leg servo saturates at
#        forcerange / kp = 0.05 rad of error, and the linear residual spent
#        0.007-0.015 of action on the whole knee or ankle holding torque.
#     e) The MTP joint's armature rises from 5e-5, the default of the
#        generator's joint class, to 2e-4 kg m2 (toe_armature_kg_m2; the
#        maintainer took it on 2026-10-07).  The 20 g foot plate alone gives
#        the toe DOF 1.6e-5 kg m2, so at 5e-5 its kp-12 servo rang at 68 Hz,
#        omega*dt 0.85 at the 2 ms step, the stiffest servo DOF in the
#        model, and on a)-d) sustained a
#        numerical 19-21 Hz heel chatter after the settle on 15 of 40
#        zero-action statues (r1: 6 of 40, at 18.5 Hz) that failed 2 of
#        validate_models' 10 seeded holds (supports_weight, a 5.4% ground-
#        force error).  At 2e-4 it rings at 37 Hz, omega*dt 0.47: no statue
#        of 40 chatters (post-settle ground-force error at most 0.009% of
#        weight), every hold passes, and the sigma 0.135 noisy statue keeps
#        39 of 40 episodes, not 30.  Statics, keyframe and preload are
#        unchanged.
#
#     The MTP servo keeps its 0.6 N.m cap (now the generator parameter
#     toe_forcerange_nm): it holds one body weight on the digit-III tip
#     (0.594 N.m needed), so a single-support tiptoe stays physically
#     possible on this plant -- the 20260921_203149 march, replayed on it
#     through its own linear interface, still survives 20 of 20 episodes on
#     its digit-III tip (seeds 3042-3061; 20261001_225856 survives 9 of 20)
#     -- and the stance reward and gate are what refuse it.  Cutting the cap
#     to 0.4 N.m waits on a measured walker toe-torque budget.
#
#     Zero-action statue (stance [env], frame_skip 10), r1 -> r2: settled
#     metatarsus clearance 1.07 -> 4.81 mm; pad / distal-digit share of each
#     foot's load (seeds 5100-5109, step 200) 0.44 / 0.14 -> 0.41 / 0.25 on
#     average; the largest pelvis push held for 0.1 s on 5 of 5 seeds,
#     forward 0.225 -> 0.275, backward 0.125 -> 0.20 and lateral 0.45 ->
#     0.45 body weights; the largest initial tilt held on 3 of 3 seeds,
#     nose-down 2 -> 5, nose-up 4 -> 7 and roll 15 -> 15 deg.  Every
#     fore-aft push or pitch failure ends on tail_4.  Zero-mean white action
#     noise through each revision's own interface (paired streams, seeds
#     3042+i): sigma 0.02, 5/20 -> 20/20 full episodes; sigma 0.135, PPO's
#     initial exploration, 0/20 (median 12 steps, 16 of 20 on the
#     metatarsus) -> 39/40 (151/160 over four seed blocks, every fall on
#     tail_4); on r2, sigma 0.10 40/40 and 0.20 0/40 (median 130-180
#     steps over two noise streams).
#
#     PHYSICS moves (geom masses and fromto, the toe armature, and the key
#     ctrl that write_gravity_targets regenerates).  The POLICY INTERFACE
#     moves for every item but e), not only d): the tail masses, the shorter
#     capsule (it moves the metatarsus CoM) and the mirror (it makes the
#     preload symmetric) each change the home ctrl that action zero
#     commands.  VISUAL moves (the drawn shank and the digit capsules, b)
