[stage]
name = "food_reach"
description = "Move the head tip within the configured distance threshold of food"

[env]
forward_vel_weight = 0.3               # Reduced from 0.5: agent doesn't need to walk fast, it needs to walk *to food and reach*. Less speed pressure preserves stability.
alive_bonus = 0.0                      # Zeroed: survival is learned in stages 1-2; any per-step alive reward adds opportunity cost that discourages food-reaching attempts
fall_penalty = -10.0                   # Reduced from default -100: prevents agent from being overly conservative about approaching food
energy_penalty_weight = 0.001
tail_stability_weight = 0.02           # Light tail stability penalty
gait_stability_weight = 0.02
smoothness_weight = 0.02               # Light action smoothness penalty
posture_weight = 0.1                   # Light posture maintenance during reach
nosedive_weight = 0.1                  # Reduced from 0.2: agent needs to pitch neck forward/downward to reach food — high nosedive penalty fights this
heading_weight = 0.5                   # Face toward food for effective reach (matches T-Rex stage 3)
lateral_penalty_weight = 0.3           # Penalize crab-walking toward food (matches T-Rex stage 3)
food_reach_bonus = 1000.0              # Must greatly exceed discounted future per-step value; makes reaching food immediately net-positive (matches T-Rex bite_bonus)
food_reach_threshold = 0.8             # Widened from 0.5: easier success criterion for initial discovery — agent gets close but can't position head precisely enough
food_approach_weight = 3.0             # 3x increase from 1.0: stronger delta-based gradient toward food (matches T-Rex bite_approach_weight)
food_head_proximity_weight = 2.0       # Doubled from 1.0: stronger gradient pulling head toward food — this was the missing signal for the last-mile positioning
food_distance_range = [1.5, 4.0]       # Tightened from [2.0, 6.0]: closer food spawns = more frequent reach attempts = denser reward signal
food_lateral_range = [-1.5, 1.5]
food_height_range = [2.0, 3.5]         # Lowered from [2.5, 4.0]: slightly lower food reduces coordination demand on neck extension
max_episode_steps = 1000
reset_noise_scale = 0.05               # Was omitted, so SB3 silently fell back to the class default 0.01
                                       # while [jax] used 0.05. Stage 1 raised it deliberately; stages 2-3
                                       # inherited a 5x narrower reset distribution by accident.
healthy_z_range = [0.85, 3.5]          # Lowered fall floor from the env default 1.0 so the reach motion isn't cut short by spurious "fallen" terminations when the torso bobs during approach (settled stance ~1.13 m).

[ppo]
learning_rate = 5e-5
learning_rate_end = 5e-6                # Lowered from 1e-5 for a gentler late-stage cosine floor.
lr_schedule = "cosine"                 # Cosine LR protects against the post-peak decline (best @1.65M then long drift).
n_steps = 4096
batch_size = 256
n_epochs = 10
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.2                       # Widened from 0.15: tighter clip likely caused reward collapse after 4M. Match Stage 2 value for stability.
ent_coef = 0.01                        # Doubled from 0.005: more exploration needed to discover neck-extension behavior for food reach
ent_coef_end = 0.002                   # Enabled: decay entropy to its floor after the reach behaviour is discovered (~1.65M),
ent_coef_decay_timesteps = 4000000     # so the policy consolidates instead of drifting. Anchored well below the 12M budget.
target_kl = 0.03                       # Cap destabilising late PPO updates (early-stop epochs on high approx-KL).

[ppo.policy_kwargs]
net_arch = [512, 256]                  # Match Stage 1 setting 4 architecture to avoid weight truncation on checkpoint load

[sac]
learning_rate = 1e-4              # Higher than PPO's 5e-5 — replay buffer stabilizes updates for faster sparse reward convergence
batch_size = 256
gamma = 0.99                     # At gamma=0.99, discounted future ≈ 250 vs food_reach_bonus=1000 — reaching is clearly net-positive;
                                 # PPO's gamma=0.995 risks the hovering-near-food exploit seen in raptor Stage 3
tau = 0.005
ent_coef = "auto"                # Auto-entropy is especially valuable for the neck-reaching task —
                                 # Brachiosaurus needs to discover a novel motion (neck extension) not learned in Stages 1-2
buffer_size = 1_000_000          # Large buffer retains locomotion transitions from Stage 2
learning_starts = 10_000
train_freq = 4                   # Batch env steps before training — 4× less Python loop overhead
gradient_steps = 4               # Match train_freq to maintain update-to-data ratio

[sac.policy_kwargs]
net_arch = [512, 256]            # Match Stage 2 architecture to avoid weight truncation on checkpoint load

[jax]
num_envs = 2048
rollout_len = 64
num_updates = 1000                      # Neck-reaching is a novel motion — needs extended training
ppo_epochs = 4
minibatch_size = 512
learning_rate = 1e-4
max_grad_norm = 0.5
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01                         # Higher entropy to discover neck-extension behavior
fall_penalty = -10.0
reset_noise_scale = 0.05
init_qpos_noise = 0.01
init_yaw_noise = 0.1
obs_rms_decay_on_resume = 0.01          # Decay obs normalization count on resume
warmup_updates = 50                     # ~5% of 1000 updates
warmup_clip_range = 0.02
warmup_ent_coef = 0.02
ramp_updates = 150                      # ~15% of 1000 updates: gradual transition to food-approach reward
ramp_attr = "forward_vel_weight"
ramp_start_fraction = 0.2

[jax.policy_kwargs]
net_arch = [512, 256]

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "reward_and_length/v1"      # environments/shared/curriculum/gate_schema.py
timesteps = 12000000                   # Extended from 8M: best model was at 3.9M and policy degraded after — more time with stable config gives room to recover and converge
min_avg_reward = 100.0                  # Minimum average reward to confirm food-reaching behavior
collapse_peak_floor = 100.0    # Explicit: this used to fall back to min_avg_reward, coupling an
                                        # early-stop backstop to an unrelated advancement threshold. Set to
                                        # the value that fallback produced, so behaviour is unchanged.
min_success_rate = 0.5                 # At least 50% food reach success — confirms behavior emerged
required_consecutive = 3
warmup_timesteps = 300000               # Tripled from 100k: agent needs more time to adapt from locomotion to food-reach reward landscape without losing walking ability
warmup_clip_range = 0.02                # Small clip range during warm-up to limit policy change
warmup_ent_coef = 0.02                  # Higher entropy during warm-up to maintain exploration
ramp_timesteps = 1500000                # Tripled from 500k: gradual transition from "walk forward" to "walk toward food and reach" prevents catastrophic forgetting of locomotion
ramp_start_value = 0.2                  # Increased from 0.1: start with slightly more approach signal so agent begins orienting toward food earlier
