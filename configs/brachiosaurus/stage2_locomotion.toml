[stage]
name = "locomotion"
description = "Learn coordinated quadrupedal walking"

[env]
forward_vel_weight = 4.4               # Sweep winner (5223 reward): 4.44 — slightly higher than 4.0, keeps speed as dominant signal.
forward_vel_max = 0.89                 # Sweep winner: 0.89 — tighter speed cap encourages quality over raw speed. Still above 0.75 graduation target.
alive_bonus = 0.26                     # Sweep winner: 0.264 — modest increase from 0.2 stabilizes early training without the 0.3 collapse seen 03-22.
fall_penalty = -50.0                   # Reduced from -100: overly harsh penalty caused conservative policies that avoid movement. Align with T-Rex/Velociraptor.
energy_penalty_weight = 0.004          # Sweep winner: 0.00384 — lighter than 0.005, top-3 trials all clustered 0.0035–0.004.
tail_stability_weight = 0.11           # Sweep winner: 0.113 — slightly lower than 0.15, less pressure on tail lets locomotion dominate.
gait_stability_weight = 0.065          # Sweep winner: 0.0645 — slight increase from 0.05.
gait_symmetry_weight = 2.2             # Sweep winner: 2.224 — confirmed: >2.0 is safe and beneficial. Top-3 all in 2.2–2.4 range.
smoothness_weight = 0.05               # Penalize jerky actions for smoother movement
posture_weight = 0.29                  # Sweep winner: 0.286 — close to current 0.3, marginal reduction.
nosedive_weight = 1.0                  # Sweep winner: 0.991 — strong increase confirmed by top-3 (0.75–1.0). Nosedive was a real problem.
natural_pitch = -0.15                  # Slight upward neck angle target (radians).
height_weight = 0.14                   # Sweep winner: 0.140 — reduced from 0.2. Less height pressure lets agent find natural gait posture.
heading_weight = 0.07                  # Sweep winner: 0.069 — heading was already good at 0.98, less signal needed.
lateral_penalty_weight = 0.11          # Sweep winner: 0.113 — essentially unchanged from 0.1.
idle_penalty_weight = 0.26             # Sweep winner: 0.256 — slight reduction from 0.3, consistent direction.
idle_velocity_threshold = 0.1          # Speed (m/s) at which idle penalty reaches zero. Below this, agent is penalised for inaction.
food_reach_bonus = 0.0
food_approach_weight = 0.0
food_head_proximity_weight = 0.0
food_distance_range = [8.0, 12.0]
food_height_range = [2.0, 3.0]
max_episode_steps = 1000
reset_noise_scale = 0.05               # Was omitted, so SB3 silently fell back to the class default 0.01
                                       # while [jax] used 0.05. Stage 1 raised it deliberately; stages 2-3
                                       # inherited a 5x narrower reset distribution by accident.
healthy_z_range = [0.85, 3.5]          # Lowered fall floor from the env default 1.0: settled stance is ~1.13 m and normal gait bob dips to ~1.10 m, so a 1.0 floor fired spurious "fallen" terminations mid-gait (short 642/1000-step episodes, high variance). 0.85 keeps real falls detectable while letting the gait breathe.

[ppo]
learning_rate = 6e-5                    # Sweep winner: 6.03e-5 — slightly higher than 5e-5, better gradient signal without catastrophic forgetting.
learning_rate_end = 5e-6                # Lowered from 1e-5 for a gentler late-stage cosine floor.
lr_schedule = "cosine"                  # Cosine LR protects the converged gait from the post-peak collapse (best 6625 @3.8M -> final 3495).
n_steps = 2048                          # Sweep winner: 2048 — smaller rollout buffer performed better; faster policy updates.
batch_size = 512                        # Sweep winner: 512 — larger minibatches gave more stable gradients. Key differentiator of the top trial.
n_epochs = 10
gamma = 0.993                           # Sweep winner: 0.9929 — all top-3 trials at 0.991–0.993. Slightly shorter horizon than 0.995 reduces stale value estimates.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01                         # Sweep winner: 0.0104 — reduced from 0.015. Less entropy lets policy commit to discovered gaits sooner.
ent_coef_end = 0.002                    # Enabled: 5x entropy decay (EntCoefDecayCallback) — the documented fix for this exact
ent_coef_decay_timesteps = 6000000      # post-peak collapse, previously disabled only on Brachiosaurus. Anchored to 6M (~the
                                        # gait-consolidation point, just after the 4M ramp) rather than the padded 16M budget,
                                        # so entropy reaches its floor before the late drift. See STAGE2_RECOMMENDATIONS.md §5.
target_kl = 0.05                        # Loosened from 0.03: locomotion learns fast early, so a tight KL cap early-stops epochs and throttles gait development. 0.05 matches the JAX path.

[ppo.policy_kwargs]
net_arch = [512, 256]                  # Larger first layer to match Stage 1 setting 4 architecture

[sac]
learning_rate = 1e-4              # 3x reduction from Stage 1 — gentler than PPO's 6x drop; replay buffer smooths gradients
batch_size = 256
gamma = 0.99                     # Keep at 0.99 — quadruped locomotion is mechanically simpler than biped,
                                 # doesn't need longer horizon; replay staleness risk at higher gamma
tau = 0.005
ent_coef = "auto"                # Auto-entropy handles the standing-still exploit naturally —
                                 # maintains exploration when alive_bonus=0.1 could trap the policy
buffer_size = 1_000_000          # Large buffer retains Stage 1 balance transitions;
                                 # Brachiosaurus (75 obs dims) × 1M ≈ 570MB — fits in Colab RAM
learning_starts = 10_000
train_freq = 4                   # Batch env steps before training — 4× less Python loop overhead
gradient_steps = 4               # Match train_freq to maintain update-to-data ratio

[sac.policy_kwargs]
net_arch = [512, 256]            # Larger first layer to match PPO's tapered architecture for Brachiosaurus's 75 obs dims

[jax]
num_envs = 2048
rollout_len = 64
num_updates = 1200                      # Extra updates for quadruped — Brachio needs more time to develop coordinated 4-leg gait
ppo_epochs = 4
minibatch_size = 512
learning_rate = 1e-4
max_grad_norm = 0.5
gamma = 0.993                           # Match SB3 PPO sweep winner
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01                         # Match SB3 PPO sweep winner — higher entropy for quadruped exploration
fall_penalty = -10.0
reset_noise_scale = 0.05
init_qpos_noise = 0.01
init_yaw_noise = 0.1
obs_rms_decay_on_resume = 0.01          # Decay obs normalization count on resume
warmup_updates = 100                    # ~8% of 1200 updates: Brachio needs longer warmup (matches SB3's 1M/16M ratio)
warmup_clip_range = 0.035               # Slightly more room than bipeds (match SB3 sweep winner)
warmup_ent_coef = 0.018                 # Match SB3 sweep winner — slightly less random than bipeds
ramp_updates = 300                      # ~25% of 1200 updates: gradual ramp for quadruped gait development
ramp_attr = "forward_vel_weight"
ramp_start_fraction = 0.16             # Match SB3 sweep winner — gentler start

[jax.policy_kwargs]
net_arch = [512, 256]

[curriculum]
timesteps = 16000000                   # Reverted to 16M: 20M run (03-22) showed late-training collapse (2396→809). 16M was sufficient for the only S2 pass.
min_avg_reward = 100.0
min_avg_episode_length = 750
min_avg_forward_vel = 0.75             # Gate on actual locomotion; without this, a standing-still policy passes on alive_bonus alone. Realistic walking speed for a heavy sauropod.
required_consecutive = 3
collapse_min_evals = 20                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps (20 evals x 50k) before it can fire.
collapse_patience = 10                  # Require 10 consecutive raw per-eval mean drops (~500k steps) so a transient dip won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count, so the normal early-locomotion dip survives until entropy decay (floor ~6M) stabilises the gait.
warmup_timesteps = 1000000              # Sweep winner: 1M — 3x longer warmup was the biggest signal. Gives critic much more time to adapt to new reward landscape before policy changes accelerate.
warmup_clip_range = 0.035               # Sweep winner: 0.0335 — more clip room during warmup lets policy adjust faster once critic is ready.
warmup_ent_coef = 0.018                 # Sweep winner: 0.0175 — slightly lower than 0.02, less random during warmup since critic has longer to stabilize.
ramp_timesteps = 3000000                # Sweep confirmed: 3M ramp across all top trials. Keep as-is.
ramp_start_value = 0.16                 # Sweep winner: 0.158 — gentler ramp start reduces early speed pressure, letting gait quality develop first.
