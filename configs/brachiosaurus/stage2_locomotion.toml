[stage]
name = "locomotion"
description = "Learn coordinated quadrupedal walking"

[env]
forward_vel_weight = 2.0               # Match T-Rex/raptor: was 1.0, too low. Primary driver of locomotion speed.
forward_vel_max = 1.0                  # Reduced from 3.0: Brachiosaurus max realistic speed ~1 m/s. Lower ceiling makes achievable speeds return meaningful reward.
alive_bonus = 0.1                      # Reduced from 0.5: high alive_bonus created standing-still optimum (0.5/step >> forward reward at low speeds)
fall_penalty = -50.0                   # Match T-Rex stage 2
energy_penalty_weight = 0.002          # Increase from 0.001: provide some efficiency signal (matches T-Rex stage 2)
tail_stability_weight = 0.05           # Penalize tail thrashing during locomotion
gait_stability_weight = 0.05
gait_symmetry_weight = 0.0             # Disabled: formula rewards alternation, needs tuning for quadruped
smoothness_weight = 0.05               # Penalize jerky actions for smoother movement
posture_weight = 0.2                   # Moderate tilt penalty to maintain upright stance
nosedive_weight = 0.5                  # Penalize excessive forward pitch
height_weight = 1.5                    # Increased from 0.3: prevent crouching exploit where agent drops low for stability
heading_weight = 0.3                   # Reward facing toward food
lateral_penalty_weight = 0.1           # Mild anti-crab-walk penalty
food_reach_bonus = 0.0
food_approach_weight = 0.0
food_head_proximity_weight = 0.0
food_distance_range = [8.0, 12.0]
food_height_range = [2.0, 3.0]
max_episode_steps = 1000

[ppo]
learning_rate = 5e-5                    # Reduce from 1e-4: prevent catastrophic forgetting of Stage 1 balance (matches T-Rex)
learning_rate_end = 1e-5
n_steps = 4096                          # Increase from 2048: larger rollout buffer for more stable gradients (matches T-Rex)
batch_size = 256                       # Increase from 128: more stable gradient estimates (matches T-Rex)
n_epochs = 10
gamma = 0.995                           # Increase from 0.99: longer horizon values sustained locomotion (matches T-Rex)
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005

[ppo.policy_kwargs]
net_arch = [512, 256]                  # Larger first layer to match Stage 1 setting 4 architecture

[sac]
learning_rate = 1e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 8000000
min_avg_reward = 100.0
min_avg_episode_length = 750
min_avg_forward_vel = 0.75             # Gate on actual locomotion; without this, a standing-still policy passes on alive_bonus alone. Realistic walking speed for a heavy sauropod.
required_consecutive = 3
warmup_timesteps = 300000               # Increased from 100k: give critic more time to adapt to new reward landscape (matches T-Rex stage 2)
warmup_clip_range = 0.02                # Small clip range during warm-up to limit policy change
warmup_ent_coef = 0.02                  # Higher entropy during warm-up to maintain exploration
ramp_timesteps = 2000000                # Increased from 500k: much slower ramp prevents reward-chasing collapse (matches T-Rex stage 2)
ramp_start_value = 0.2                  # Increased from 0.1: start with detectable forward signal (matches T-Rex stage 2)
