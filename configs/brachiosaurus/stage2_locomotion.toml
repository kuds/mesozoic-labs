[stage]
name = "locomotion"
description = "Learn coordinated quadrupedal walking"

[env]
forward_vel_weight = 1.0
alive_bonus = 0.5
energy_penalty_weight = 0.001
gait_stability_weight = 0.05
food_reach_bonus = 0.0
food_approach_weight = 0.15
food_distance_range = [8.0, 12.0]
food_height_range = [2.0, 3.0]
max_episode_steps = 1000

[ppo]
learning_rate = 1e-4
n_steps = 2048
batch_size = 128
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005

[sac]
learning_rate = 1e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 1000000
min_avg_reward = 100.0
min_avg_episode_length = 800
required_consecutive = 3
