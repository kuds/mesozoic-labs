[stage]
name = "locomotion"
description = "Learn coordinated quadrupedal walking"

[env]
forward_vel_weight = 1.0
alive_bonus = 0.5
energy_penalty_weight = 0.001
gait_stability_weight = 0.05
food_reach_bonus = 0.0
food_approach_weight = 0.0
food_distance_range = [8.0, 12.0]
food_height_range = [2.0, 3.0]
max_episode_steps = 1000

[ppo]
learning_rate = 1e-4
n_steps = 2048
batch_size = 128
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005

[ppo.policy_kwargs]
net_arch = [256, 256]

[sac]
learning_rate = 1e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 8000000
min_avg_reward = 100.0
min_avg_episode_length = 750
min_avg_forward_vel = 2.0              # Gate on actual locomotion; without this, a standing-still policy passes on alive_bonus alone. Lower than raptor (0.4) and T-Rex (0.3) — Brachiosaurus is slower.
required_consecutive = 3
warmup_timesteps = 100000               # Timesteps to constrain policy updates while critic adapts (PPO only)
warmup_clip_range = 0.02                # Small clip range during warm-up to limit policy change
warmup_ent_coef = 0.02                  # Higher entropy during warm-up to maintain exploration
ramp_timesteps = 500000                 # Timesteps over which to linearly ramp forward_vel_weight
ramp_start_value = 0.1                  # Starting fraction of forward_vel_weight during ramp
