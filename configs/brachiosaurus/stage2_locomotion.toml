[stage]
name = "locomotion"
description = "Learn coordinated quadrupedal walking"

[env]
forward_vel_weight = 8.0               # Increased from 2.0: must dominate reward to prevent standing-still exploit. Agent was earning ~2000 reward without walking.
forward_vel_max = 0.4                  # Reduced from 1.0: saturate reward at achievable speed for better gradient signal at low velocities.
alive_bonus = 0.0                      # Removed: was 0.1. Even small alive_bonus creates standing-still optimum when forward reward is weak.
fall_penalty = -50.0                   # Match T-Rex stage 2
energy_penalty_weight = 0.002          # Increase from 0.001: provide some efficiency signal (matches T-Rex stage 2)
tail_stability_weight = 0.05           # Penalize tail thrashing during locomotion
gait_stability_weight = 0.05
gait_symmetry_weight = 0.15            # Enabled: encourage alternating leg movement for quadruped gait. Was 0.0, agent showed no gait cycle.
smoothness_weight = 0.05               # Penalize jerky actions for smoother movement
posture_weight = 0.2                   # Moderate tilt penalty to maintain upright stance
nosedive_weight = 1.5                  # Increased from 0.5: agent's neck collapsed to horizontal within 5 frames. Stronger penalty to maintain neck posture.
natural_pitch = -0.15                  # Slight upward neck angle target (radians). Was 0.0 which allowed flat neck as optimal.
height_weight = 0.3                    # Reduced from 1.5: high value rewarded crouching for stability over walking. Minimal signal sufficient.
heading_weight = 0.3                   # Reward facing toward food
lateral_penalty_weight = 0.1           # Mild anti-crab-walk penalty
speed_penalty_weight = 1.0             # NEW: actively punish standing still. Agent must move to avoid penalty.
speed_penalty_threshold = 0.05         # Velocities below 0.05 m/s incur penalty — no more reward for frozen stance.
food_reach_bonus = 0.0
food_approach_weight = 0.0
food_head_proximity_weight = 0.0
food_distance_range = [8.0, 12.0]
food_height_range = [2.0, 3.0]
max_episode_steps = 1000

[ppo]
learning_rate = 5e-5                    # Reduce from 1e-4: prevent catastrophic forgetting of Stage 1 balance (matches T-Rex)
learning_rate_end = 1e-5
n_steps = 4096                          # Increase from 2048: larger rollout buffer for more stable gradients (matches T-Rex)
batch_size = 256                       # Increase from 128: more stable gradient estimates (matches T-Rex)
n_epochs = 10
gamma = 0.995                           # Increase from 0.99: longer horizon values sustained locomotion (matches T-Rex)
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005

[ppo.policy_kwargs]
net_arch = [512, 256]                  # Larger first layer to match Stage 1 setting 4 architecture

[sac]
learning_rate = 1e-4              # 3x reduction from Stage 1 — gentler than PPO's 6x drop; replay buffer smooths gradients
batch_size = 256
gamma = 0.99                     # Keep at 0.99 — quadruped locomotion is mechanically simpler than biped,
                                 # doesn't need longer horizon; replay staleness risk at higher gamma
tau = 0.005
ent_coef = "auto"                # Auto-entropy handles the standing-still exploit naturally —
                                 # maintains exploration when alive_bonus=0.1 could trap the policy
buffer_size = 1_000_000          # Large buffer retains Stage 1 balance transitions;
                                 # Brachiosaurus (75 obs dims) × 1M ≈ 570MB — fits in Colab RAM
learning_starts = 10_000
train_freq = 1
gradient_steps = 1

[sac.policy_kwargs]
net_arch = [512, 256]            # Larger first layer to match PPO's tapered architecture for Brachiosaurus's 75 obs dims

[curriculum]
timesteps = 8000000
min_avg_reward = 100.0
min_avg_episode_length = 750
min_avg_forward_vel = 0.75             # Gate on actual locomotion; without this, a standing-still policy passes on alive_bonus alone. Realistic walking speed for a heavy sauropod.
required_consecutive = 3
warmup_timesteps = 300000               # Increased from 100k: give critic more time to adapt to new reward landscape (matches T-Rex stage 2)
warmup_clip_range = 0.02                # Small clip range during warm-up to limit policy change
warmup_ent_coef = 0.02                  # Higher entropy during warm-up to maintain exploration
ramp_timesteps = 2000000                # Increased from 500k: much slower ramp prevents reward-chasing collapse (matches T-Rex stage 2)
ramp_start_value = 0.2                  # Increased from 0.1: start with detectable forward signal (matches T-Rex stage 2)
