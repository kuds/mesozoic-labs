[stage]
name = "balance"
description = "Learn to stand on four legs without falling"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0
drift_penalty_weight = 0.0
spin_penalty_weight = 0.0
speed_penalty_weight = 0.3                     # Penalize absolute 2D speed above threshold — complements gait stability with instantaneous signal
speed_penalty_threshold = 0.10                 # m/s — any speed above this incurs penalty
alive_bonus = 1.75                                # Sweep result: all successful S1 runs used 1.75. Slightly less than 2.0 avoids over-rewarding pure standing.
energy_penalty_weight = 0.075                      # Sweep result: 150x higher than previous 0.0005. Strong energy penalty forces efficient standing posture, prevents trembling/flailing.
gait_stability_weight = 0.1
gait_symmetry_weight = 0.0                     # Disabled: balance stage doesn't need alternation
smoothness_weight = 0.0
tail_stability_weight = 0.0
posture_weight = 1.5                               # Sweep result: all successful S1 runs used 1.5. Strong posture signal in balance stage gives S2 a head start on upright body.
nosedive_weight = 0.3
height_weight = 0.0
heading_weight = 0.0
lateral_penalty_weight = 0.0
food_reach_bonus = 0.0
food_approach_weight = 0.0
food_head_proximity_weight = 0.0
food_distance_range = [10.0, 15.0]
food_height_range = [2.0, 3.0]
fall_penalty = -50.0                      # Match raptor/trex stage 1 convention; species default -100 is disproportionate for balance task
max_episode_steps = 1000                  # Match stage 2/3 for consistent episode horizon across curriculum
reset_noise_scale = 0.05                  # Increased from 0.01 default to improve robustness (matches raptor/trex)

[ppo]
learning_rate = 3e-5                    # Sweep result: 3.23e-5 — 10x lower than 3e-4. All successful S1 runs used this; higher LR likely caused instability.
learning_rate_end = 5e-6                # Lowered from 1e-5 so the cosine schedule settles to a gentler late-stage floor.
lr_schedule = "cosine"                  # Cosine decays faster mid-training than linear, protecting the converged policy from late destabilisation.
n_steps = 2048
batch_size = 128                        # Sweep result: doubled from 64. More stable gradient estimates for the large observation space.
n_epochs = 10
gamma = 0.98                            # Sweep result: 0.9797 — slightly shorter horizon than 0.99. Balance is a shorter-term task.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01
ent_coef_end = 0.002                    # Enabled: 5x entropy decay (EntCoefDecayCallback). Brachiosaurus was the only
ent_coef_decay_timesteps = 2500000      # species with this disabled; the bipeds destabilised late under a constant ent_coef
                                        # and this decay fixed them. Anchored to ~40% of the 6M budget so entropy reaches its
                                        # floor once balance has converged. See docs/investigations/STAGE2_RECOMMENDATIONS.md §5.
target_kl = 0.03                        # Early-stop PPO epochs on high approx-KL — caps destabilising late updates on the
                                        # thin 4-env rollouts (mirrors the JAX path's target_kl guard).

[ppo.policy_kwargs]
net_arch = [512, 256]

[sac]
learning_rate = 3e-4              # Match PPO starting LR — SAC tolerates this well with replay buffer
batch_size = 256                  # Larger than PPO's 64 for Brachiosaurus — SAC benefits from bigger batches;
                                 # PPO needed small batches for on-policy variance, SAC does not
gamma = 0.99                     # Match PPO — appropriate for balance task horizon
tau = 0.005
ent_coef = "auto"                # Replaces PPO's manual ent_coef=0.01 (highest among species);
                                 # auto-tuning should discover appropriate exploration for quadruped stability
buffer_size = 300_000            # Sufficient for 6M-step Stage 1
learning_starts = 10_000
train_freq = 4                   # Batch env steps before training — 4× less Python loop overhead
gradient_steps = 4               # Match train_freq to maintain update-to-data ratio

[sac.policy_kwargs]
net_arch = [512, 256]            # Match PPO architecture

[jax]
num_envs = 2048
rollout_len = 64
num_updates = 500
ppo_epochs = 4
minibatch_size = 512
learning_rate = 3e-4
max_grad_norm = 0.5
gamma = 0.98                            # Match SB3 PPO — shorter horizon for balance task
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01                         # Match SB3 PPO (Brachio uses higher entropy than bipeds)
fall_penalty = -10.0
reset_noise_scale = 0.05
init_qpos_noise = 0.01                  # XY position jitter at reset (meters) — JAX-only MJXEnvConfig field
init_yaw_noise = 0.1                    # Yaw rotation perturbation at reset (radians) — JAX-only MJXEnvConfig field

[jax.policy_kwargs]
net_arch = [512, 256]

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "reward_and_length/v1"      # environments/shared/curriculum/gate_schema.py
timesteps = 6000000
min_avg_reward = 100.0
collapse_peak_floor = 100.0    # Explicit: this used to fall back to min_avg_reward, coupling an
                                        # early-stop backstop to an unrelated advancement threshold. Set to
                                        # the value that fallback produced, so behaviour is unchanged.
min_avg_episode_length = 750
required_consecutive = 3
collapse_min_evals = 20                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps before it can fire.
collapse_patience = 10                  # Require 10 consecutive raw per-eval mean drops so transition turbulence won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count. Stage-1 balance learning has a long
                                        # low-reward grind then a noisy breakthrough (run 20260721_004731: dip to ~1.2M,
                                        # turbulent transition at 2.2-2.3M, converged ~2.65M); the old stage-1 defaults
                                        # killed run 20260720_203454 at 1.1M off a variance-inflated 50k peak.
