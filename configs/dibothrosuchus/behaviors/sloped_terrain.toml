# Dibothrosuchus: random gentle slopes
# Supported SB3/PPO behavior. Parent resolves through ../stages.toml.
# Speeds follow the species locomotion target; terrain dimensions match its model scale.
[behavior]
name = "sloped_terrain"
species = "dibothrosuchus"
parent = "locomotion"
timesteps = 2000000

[commands]
cruise_speed = 0.9
speed_scale = 1.25
lateral_speed_scale = 1.25
yaw_rate_scale = 0.6
turn_increment_max = 0.0
yaw_rate_max = 0.3
switch_interval_s = 6.0

[terrain]
enabled = true
mode = "gentle"
template = "sloped"
extent = 30.0 # Half-extent; fits a 25-second cruise plus the full animal
nrow = 601
ncol = 601
apron_radius = 1.25 # Flat spawn disk contains the model, including its tail
blend_width = 0.6
max_height = 2.4
max_slope_degrees = 3.0
roughness_amplitude = 0.0045
wavelength_min = 0.6
wavelength_max = 1.5
episode_variation = 0.15

[env]
max_episode_steps = 2500 # 25 seconds at this species control timestep
course_distance = 9.0 # Radial progress diagnostic, not a success gate
flat_probability = 0.25 # Original-plane retention among heightfield episodes

[ppo]
learning_rate = 0.00005
ent_coef = 0.005
target_kl = 0.03
