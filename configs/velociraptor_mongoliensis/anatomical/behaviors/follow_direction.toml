# Velociraptor: heading changes at cruise speed
# Supported SB3/PPO behavior. Parent resolves through ../stages.toml.
# Speeds follow the species locomotion target; terrain dimensions match its model scale.
[behavior]
name = "follow_direction"
species = "velociraptor_mongoliensis"
embodiment = "anatomical"
parent = "locomotion"
timesteps = 3000000

[commands]
cruise_speed = 2.1 # m/s, the locomotion gate: r4's 2.0 Froude-matched to the r5 hip height (x 1.042)
speed_scale = 2.6 # The locomotion forward_vel_max, r4's 2.5 x 1.042
lateral_speed_scale = 2.6
yaw_rate_scale = 0.6
turn_increment_max = 0.5235987756
yaw_rate_max = 0.3
switch_interval_s = 6.0
switch_jitter_s = 1.0
straight_probability = 0.25

[terrain]
enabled = false

[env]
max_episode_steps = 2500 # 25 seconds at this species control timestep
course_distance = 10.0 # Radial progress diagnostic, not a success gate

[ppo]
learning_rate = 0.00005
ent_coef = 0.005
target_kl = 0.03
