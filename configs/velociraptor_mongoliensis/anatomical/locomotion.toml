[stage]
name = "locomotion"
description = "Learn forward walking/running"

[env]
forward_vel_weight = 2.0                # With forward_vel_max=2.6 (below) gives max reward 2.0; at 1.3 m/s reward = 1.0/step
                                        # Still provides meaningful gradient without saturating at walking speeds
forward_vel_max = 2.6                   # Reduced from 3.0 (to 2.5 on the r4 plant): saturate the speed incentive
                                        # just past the gate instead of paying for robustness-destroying top speed.
                                        # Both July collapses traded stability for speed (see docs/investigations/
                                        # STAGE2_RECOMMENDATIONS.md R4). Physics r5 (the life-size plant, the
                                        # maintainer's decision of 2026-11-08) Froude-matches it with the gate:
                                        # 2.5 x sqrt(0.5488 / 0.5055 m hip height) = 2.605 -> 2.6.
backward_vel_penalty_weight = 0.0       # Redundant: forward_vel_weight already penalizes backward motion (forward_vel_norm goes negative)
alive_bonus = 0.5                       # Reduce from 2.0: was 99% of total reward, drowning forward signal
fall_penalty = -150.0                   # Raised from -50: hedge against late-episode falls, which stay cheap in
                                        # the discounted objective at gamma=0.995 (corrected break-even math in
                                        # docs/investigations/STAGE2_RECOMMENDATIONS.md section 2.1 — the -250
                                        # figure from the original investigation overstated the requirement).
energy_penalty_weight = 0.003
tail_stability_weight = 0.05
posture_weight = 0.2                    # Reduced from 0.8: successful runs used 0.0-0.2; high values trap agent in standing posture
nosedive_weight = 0.3                   # Reduced from 1.0: allows forward lean for gait initiation while preventing face-plants
gait_symmetry_weight = 0.0              # Disabled for sweep: let forward_vel dominate; re-enable post-sweep if gait quality matters
smoothness_weight = 0.05
strike_bonus = 0.0
strike_approach_weight = 0.0
heading_weight = 0.3
lateral_penalty_weight = 0.1
prey_distance_range = [8.0, 12.0]
max_episode_steps = 1000
reset_noise_scale = 0.05               # Was omitted, so SB3 silently fell back to the class default 0.01
                                       # while the retired [jax] table used 0.05. Stage 1 raised it deliberately; stages 2-3
                                       # inherited a 5x narrower reset distribution by accident.

[ppo]
learning_rate = 5e-5
learning_rate_end = 1e-5
n_steps = 4096
batch_size = 256
n_epochs = 10
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.001                # Linearly decay the entropy bonus over the stage
                                    # (EntCoefDecayCallback): action std grew 1.18->1.49 during
                                    # BOTH July collapses under constant ent_coef, with entropy
                                    # still rising at the early stop.
                                    # See docs/investigations/STAGE2_RECOMMENDATIONS.md R4.
ent_coef_decay_timesteps = 4000000      # Anchor the decay to half the 8M budget (the T-Rex locomotion stage's
                                        # value, 2026-11-06). Without the key the decay spans the whole budget
                                        # (train_base._maybe_ent_coef_decay_callback), so ent_coef coasted at
                                        # about 0.003 through the middle of the stage, where both July collapses
                                        # grew the action std. The raptor's one genuine walker (20260922_125248,
                                        # stranded) trained un-anchored, so this is a safeguard, not a measured fix.

target_kl = 0.05                        # Loosened from 0.03 for the locomotion stage (fast early learning).

[ppo.policy_kwargs]
net_arch = [512, 256]

[sac]
learning_rate = 1e-4              # 3x reduction from Stage 1 (vs PPO's 6x) — replay buffer provides more stable gradients, less LR reduction needed
batch_size = 256
gamma = 0.99                     # Keep at 0.99, not 0.995 — off-policy replay staleness amplifies bootstrapping error at high gamma
tau = 0.005
ent_coef = "auto"                # Auto-entropy naturally decreases exploration as locomotion is learned
buffer_size = 1_000_000          # Larger buffer retains Stage 1 balance transitions, reducing catastrophic forgetting
learning_starts = 10_000
train_freq = 16                  # Collect 16 env steps before training — amortises gradient cost over more env steps
gradient_steps = 8               # 2:1 data-to-update ratio — more gradient updates per env batch smooths learning curves

[sac.policy_kwargs]
net_arch = [512, 256]

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "reward_and_length/v1"      # environments/shared/curriculum/gate_schema.py
timesteps = 8000000
min_avg_reward = 100.0
# Collapse backstop: the relative floor pair the T-Rex's locomotion, stance and
# recovery use (2026-11-06; PLANT_VALIDATION §14 item 3), replacing the absolute
# collapse_peak_floor = 100.0, which sat 8x BELOW the measured do-nothing reward
# (796.6, below; 796.0 on r4) and encoded nothing about this stage. The absolute key is
# REMOVED, not shadowed: collapse_settings_from_config lets an explicit
# collapse_peak_floor win over the pair. Either floor sits below the standing
# level a warm-started stance evaluates at from step 0 (evaluation scores the
# full forward weight), so neither alone keeps the backstop from arming on that
# plateau and reading the stand-then-lunge transition as a collapse;
# collapse_peak_warmup_timesteps below does (the D-B5 bound).
collapse_peak_floor_reference = 796.6   # The zero-action locomotion statue's reward at noise 0.05: 796.59 +/- 3.15
                                        # over 40 episodes, seeds 3042-3081, 40/40 full horizon, on physics r5 (the
                                        # life-size plant, the maintainer's decision of 2026-11-08), measured
                                        # 2026-11-09 with environments/shared/scripts/zero_action_baseline.py
                                        # --model-id velociraptor_mongoliensis anatomical --stage 2 --episodes 40
                                        # --seed 3042, with this [env]'s forward_vel_max 2.6 (the statue stands
                                        # still, so the cap moves nothing it earns). r4: 796.00 +/- 3.58 (2026-11-06).
                                        # This [env] sets none of the stance's opt-in terms, and the heading-free
                                        # observation (policy interface r13) moves no reward. Re-measure with the
                                        # same script whenever a reward weight OR the plant changes.
collapse_peak_floor_fraction = 0.45     # The T-Rex's fraction: floor = 0.45 x 796.6 = 358.5 (358.2 on r4's 796.0).
                                        # The raptor's genuine r2 walker's evaluations (2683.6 final, 2687.6 best)
                                        # clear it by 7x, so the backstop arms as soon as collapse_min_evals is met.
statue_constants_physics_revision = 5   # The velociraptor PHYSICS revision the 796.6 reference was measured on.
                                        # test_statue_constant_freshness.py holds this pin against the plant
                                        # manifest, so a plant bump that forgets the re-measure fails CI.
collapse_peak_warmup_timesteps = 2300000 # Evaluations before this step cannot SET the peak: the D-B5 bound,
                                         # warmup_timesteps + ramp_timesteps (300k + 2M), as on the dibothrosuchus
                                         # (3.3M) and brachiosaurus (4.0M) locomotion stages after run
                                         # 20260923_020654, whose locomotion stood at its standing level to the
                                         # clip release, then lunged and fell, and was stopped at 1.45M. The
                                         # velociraptor's walk warm-starts from a stance that now starts quiet
                                         # (2026-11-06), so its first evaluations stand at that level too: the
                                         # dibothrosuchus series scaled to this stage's 796.6 statue stops at 1.45M
                                         # under the pair alone and runs on behind this warm-up. 2.3M leaves 71% of
                                         # the 8M budget protected (test_curriculum_early_stopping.py pins the bound).
# warm_start_log_std is not declared: the walk inherits the stance's learned action std (a warm start keeps the
# parent's log_std; [ppo.policy_kwargs] applies only to a new model), at most about 0.10 now that the stance starts
# there, and lower if the entropy bonus's decay to 0 lets it shrink. The raptor's one genuine run warm-started from
# a std-~1 stance; the T-Rex's walking pilot 1 read STILL on 3/3 seeds from a std-0.095 parent, and its pilot 3
# chose its reset (log_std -2.0) by scanning its trained parent's noise tolerance first. So scan the trained
# velociraptor stance before the first walk (docs/NEXT_STEPS.md), and set a reset only if it lies above the
# parent's learned std and the parent stands at it on every episode of the scan.
min_avg_episode_length = 750
min_avg_forward_vel = 2.1               # m/s. r4's 2.0 gate held at its Froude number on the life-size plant (physics r5,
                                        # the maintainer's decision of 2026-11-08): Fr = v^2 / (g h_hip) = 0.807 at the r4
                                        # plant's 0.5055 m hip height, so 2.0 x sqrt(0.5488 / 0.5055) = 2.084 -> 2.1 m/s
                                        # (Fr 0.819); on the whole-animal CoM height (0.4695 -> 0.5171 m) the factor is
                                        # 1.049, 2.10 m/s. The behaviours cruise at it: 2.1 m/s x 25 s plus the 0.90 m
                                        # footprint is 53.4 m, inside their 55 m terrain (test_behavior_recipes).
required_consecutive = 3
collapse_min_evals = 20                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps before it can fire.
collapse_patience = 10                  # Require 10 consecutive raw per-eval mean drops so a transient dip won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count, so the normal early-locomotion dip survives.
warmup_timesteps = 300000               # Increase from 100k: give critic more time to adapt to new reward landscape
warmup_clip_range = 0.02
warmup_ent_coef = 0.02
ramp_timesteps = 2000000               # Increase from 500k: much slower ramp prevents reward-chasing collapse
ramp_start_value = 0.2                  # Increase from 0.1: start with detectable forward signal
