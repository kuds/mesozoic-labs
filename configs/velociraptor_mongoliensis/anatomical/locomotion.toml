[stage]
name = "locomotion"
description = "Walk: follow a forward command with heading hold, and stand still on a zero command"

# The walk (decision D-D62): every episode draws one whole-episode command at reset ([commands]), a forward cruise
# about a heading near the spawn's or, on about 15% of episodes, an exactly zero command, the stand.  The reward is
# BaseDinoEnv's command-tracking term ([commands] tracking_weight) plus the [env] terms below on every cruise step;
# on a stand step the stand block ([commands.stand_weights]) pays the stance's weights in their place.

[env]
# Kept terms: alive, posture, nosedive, energy, smoothness, tail and the gait terms, at the forward walk's weights.
alive_bonus = 0.5                      # Reduce from 2.0: was 99% of total reward, drowning forward signal
fall_penalty = -150.0                  # Raised from -50: hedge against late-episode falls, which stay cheap in
                                       # the discounted objective at gamma=0.995 (corrected break-even math in
                                       # docs/investigations/STAGE2_RECOMMENDATIONS.md section 2.1 — the -250
                                       # figure from the original investigation overstated the requirement).
energy_penalty_weight = 0.003
tail_stability_weight = 0.05
posture_weight = 0.2                   # Reduced from 0.8: successful runs used 0.0-0.2; high values trap agent in standing posture
nosedive_weight = 0.3                  # Reduced from 1.0: allows forward lean for gait initiation while preventing face-plants
gait_symmetry_weight = 0.0             # Off since the forward-velocity sweep; re-enable if gait quality needs it
smoothness_weight = 0.05
# Terms the command-tracking term subsumes (D-D62): 0.  Under the live command they read the commanded heading
# and the command event's start (BaseDinoEnv._forward_reference_2d, _drift_anchor_2d).
forward_vel_weight = 0.0               # Was 2.0: tracking pays the commanded speed along the commanded heading
backward_vel_penalty_weight = 0.0      # Was 0.0
heading_weight = 0.0                   # Was 0.3: tracking pays the commanded yaw rate, which holds the heading
lateral_penalty_weight = 0.0           # Was 0.1: tracking pays the commanded zero lateral speed
drift_penalty_weight = 0.0             # As before; the stand block pays the stance's position hold
forward_vel_max = 2.6                  # Scales only the forward and backward terms, 0 above; kept so their
                                       # diagnostics and the behavior recipes, which inherit this [env]
                                       # (train_behaviors.read_recipe), keep the scale they had: r4's 2.5
                                       # Froude-matched to the life-size plant (physics r5), 2.5 x sqrt(0.5488 /
                                       # 0.5055 m hip height) = 2.605 -> 2.6.
# Stand-block term settings: the stance's, from the stance.toml line named, where it differs from the constructor
# default.  The stand block swaps weights only (D-D62 (2)), so a stand term's settings are this table's; every term
# they set is at weight 0 above, so no cruise-step reward reads them (test_walk_stand_block.py checks both).
foot_contact_saturation_force = 55.0   # stance.toml:82 (bilateral support; default 50.0)
leg_home_pose_tolerance = 0.2          # stance.toml:95 (leg home pose; default 0.35)
# The episode.
max_episode_steps = 1000
reset_noise_scale = 0.05               # Was omitted, so SB3 silently fell back to the class default 0.01
                                       # while the retired [jax] table used 0.05. Stage 1 raised it deliberately; stages 2-3
                                       # inherited a 5x narrower reset distribution by accident.

[commands]
mode = "heading_and_speed"
# Command scaling: the follow_direction pilot recipe's (behaviors/follow_direction.toml), so the walk and the follow
# nodes that widen it share one scaling.
cruise_speed = 2.1                     # m/s, the recipe's cruise: r4's 2.0 gate Froude-matched to the r5 plant
speed_scale = 2.6                      # The recipe's: the command's v_x is normalised by it
lateral_speed_scale = 2.6
yaw_rate_scale = 0.6
# The walk's distribution: one command event per episode, drawn at reset from the controller's own stream.
speed_range = [1.05, 2.1]              # [0.5, 1] x cruise_speed
stop_probability = 0.15                # Whole-episode stands: no switch comes within the horizon to draw another
initial_heading_offset_max = 0.26      # rad: the requested heading is the spawn's turned by U(-0.26, 0.26) (15 deg)
turn_increment_max = 0.0               # No turns
switch_interval_s = 600.0              # Longer than the 10 s horizon (1000 steps x 0.01 s), so no scheduled switch
switch_jitter_s = 0.0
turn_slowdown = true
yaw_rate_max = 0.3
# The tracking term: the Gaussian of D-D60, sigmas and tolerances at their speed_scale defaults.  2.5, the pilot
# recipes' weight, on every model.
tracking_weight = 2.5
# The tracking window (D-D64): at a moving command the term, the metrics and the gate read the trailing mean of the
# last 0.70 s (70 steps of 0.01 s), so a gait's within-stride sway cancels over a stride; a stop is scored per step.
# The rule on every walk: the stride at the slowest end-state command, 0.5 x cruise (1.05 m/s); the reference walks
# slower, so its own stride is an upper bound (strides shorten with speed).  Measured with it (2026-11-26, the walk
# panel's 20 cruise episodes): the reference walk under a command matched to its 0.257 m/s earns 2.22 a step of the
# 2.5 (quality 0.96 after 2 s; 1.91 and 0.79 per step) and is in tolerance on 99% of its steps after the settle
# (97% per step), settling 20/20 (18/20 per step); one episode, seed 3045, falls at step 373 and its truncated
# trace also fails the lead-swap bar, the other 19 passing every bar.  The statue earns 0.0004.
tracking_window_s = 0.70               # D-D64: the reference's own 0.70 s stride at 0.257 m/s (0.12 x cruise)
# The cruise ramp (D-D62 (5)): training commands start at 0.25 x these speeds and reach them at 2M steps; the
# evaluation env and the gate panels run the end state.
cruise_ramp_start_fraction = 0.25
cruise_ramp_timesteps = 2000000

[commands.stand_weights]
# The stand block (D-D62 (2)): paid in place of the [env] weights on every step under an exactly zero command.
# Each is the stance's weight, from the stance.toml line named, wherever it differs from the [env] above (a weight
# both share is paid anyway); test_walk_stand_block.py pins each one and lists every deliberate difference.
drift_penalty_weight = 0.3             # stance.toml:8
alive_bonus = 1.75                     # stance.toml:9
support_conditioned_alive_fraction = 0.2  # stance.toml:67
bilateral_support_weight = 0.5         # stance.toml:75
leg_home_pose_weight = 0.5             # stance.toml:88
action_saturation_weight = 0.5         # stance.toml:102
action_jerk_weight = 1.0               # stance.toml:111
tail_home_pose_weight = 0.25           # stance.toml:119
floor_impact_weight = 0.5              # stance.toml:136
neck_home_pose_weight = 0.25           # stance.toml:159
airborne_substep_weight = 1.0          # stance.toml:181
energy_penalty_weight = 0.075          # stance.toml:193
tail_stability_weight = 0.02           # stance.toml:194
posture_weight = 1.5                   # stance.toml:195
nosedive_weight = 1.5                  # stance.toml:196
spin_penalty_weight = 0.1              # stance.toml:204
speed_penalty_weight = 0.3             # stance.toml:205

[ppo]
learning_rate = 5e-5
learning_rate_end = 1e-5
n_steps = 4096
batch_size = 256
n_epochs = 10
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.001                # Linearly decay the entropy bonus over the stage
                                    # (EntCoefDecayCallback): action std grew 1.18->1.49 during
                                    # BOTH July collapses under constant ent_coef, with entropy
                                    # still rising at the early stop.
                                    # See docs/investigations/STAGE2_RECOMMENDATIONS.md R4.
ent_coef_decay_timesteps = 4000000      # Anchor the decay to half the 8M budget (the T-Rex locomotion stage's
                                        # value, 2026-11-06). Without the key the decay spans the whole budget
                                        # (train_base._maybe_ent_coef_decay_callback), so ent_coef coasted at
                                        # about 0.003 through the middle of the stage, where both July collapses
                                        # grew the action std. The raptor's one genuine walker (20260922_125248,
                                        # stranded) trained un-anchored, so this is a safeguard, not a measured fix.

target_kl = 0.05                        # Loosened from 0.03 for the locomotion stage (fast early learning).

[ppo.policy_kwargs]
net_arch = [512, 256]

[sac]
learning_rate = 1e-4              # 3x reduction from Stage 1 (vs PPO's 6x) — replay buffer provides more stable gradients, less LR reduction needed
batch_size = 256
gamma = 0.99                     # Keep at 0.99, not 0.995 — off-policy replay staleness amplifies bootstrapping error at high gamma
tau = 0.005
ent_coef = "auto"                # Auto-entropy naturally decreases exploration as locomotion is learned
buffer_size = 1_000_000          # Larger buffer retains Stage 1 balance transitions, reducing catastrophic forgetting
learning_starts = 10_000
train_freq = 16                  # Collect 16 env steps before training — amortises gradient cost over more env steps
gradient_steps = 8               # 2:1 data-to-update ratio — more gradient updates per env batch smooths learning curves

[sac.policy_kwargs]
net_arch = [512, 256]

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "command_tracking/v1"       # environments/shared/curriculum/gate_schema.py.  Judged once, after the
                                        # stage, on the command-tracking panel (command_tracking_report.json); the
                                        # in-training manager never advances on it (decision D-D61).
timesteps = 8000000
# The walk profile: PROVISIONAL_WALK_THRESHOLDS (environments/shared/curriculum/command_tracking_gate.py), each the
# bar of configs/behavior_certification.toml named on its line.  PROVISIONAL: to be frozen from the first walk
# pilot's panel; a verdict minted under a provisional bar is re-judged, never retrained, when the bar moves (D-B7/D-B8).
profile = "walk"
min_cruise_episodes = 20                # episodes_per_family = 20
min_stand_episodes = 5                  # minimum_command_episodes = 5
min_cruise_survival_lcb = 0.80          # minimum_survival_lcb = 0.80: at 20 episodes only 20/20 clears it
min_cruise_success_lcb = 0.60           # minimum_success_lcb = 0.60: 17/20 clears it, 16/20 does not
min_cruise_tracking_fraction = 0.60     # minimum_tracking_fraction = 0.60, read after the settle
min_cruise_speed_ratio = 0.50           # minimum_course_fraction = 0.50, as speed along the commanded heading
min_stand_hold_fraction = 0.60          # minimum_tracking_fraction = 0.60, the stop criterion at a zero command
min_stand_success_fraction = 0.60       # minimum_stop_settle_fraction = 0.60
max_stand_falls = 0                     # The walk design (D-D61): a stand episode does not fall
# The biped gait clause: PROVISIONAL_BIPED_GAIT_THRESHOLDS (GAIT_QUALITY_PLAN_2026_09.md §4.3 A, GQ-8 (a)),
# PROVISIONAL, each with the per-episode ranges it separates on the 2026-09-28 replays.
gait_limbs = 2
min_alternation_index = 0.75            # Walkers 0.857-1.0, hops 0-0.058
max_simultaneous_fraction = 0.15        # Walkers 0-0.043, hops 0.811-1.0
max_hop_flight_fraction = 0.15          # Walkers 0-0.069, hops 0.323-0.49
min_lead_swaps_per_stride = 1.0         # Walkers 1.38-2.16, hops 0-0.05; the reference walks 1.58-2.02 (gait v2)
max_foot_contact_fraction = 0.02        # 0 on every walker and hop but the robot's stacked feet (0.949-0.966)
max_phantom_support_fraction = 0.05     # 0 on every walker and hop but the robot's (0.526-0.592)
# The flight cap: Froude = v^2 / (g L) = 2.1^2 / (9.81 x 0.546) = 0.82 at the cruise (0.21 at the range's 1.05 m/s
# floor), with L = 0.546 m the gait module's leg length (gait.locomotion_metrics: the spawn root's height above the
# spawn foot sites, the mean of seeds 3042-3044, 0.544-0.547).  At or above Froude 0.5 a biped may run, so the walk
# declares no max_flight_fraction (D-D61), and the staggered-hop risk of D-D61 (7) stays open on this model.
#
# Training-loop keys, read by no gate: the collapse backstop and the stage-entry warm-up.
# Collapse backstop: the relative floor pair (PLANT_VALIDATION §14 item 3); an explicit collapse_peak_floor would win
# over the pair (collapse_settings_from_config), so none is set.  On this walk the floor stands ABOVE the statue: a
# policy that only stands earns the stand block on its stand episodes, and the in-training evaluation mixes the two
# families (30 episodes, each a stand with probability 0.15), so a floor under what a stander evaluates at would arm
# the backstop on a standing plateau.  Since D-D62 (20) the evaluation env is reseeded with the run's evaluation seed
# before every evaluation, so a run's stand count k is fixed by that seed (the default seed 42's evaluation seed 1042
# draws k = 4) and a stander's evaluations hold one level.
collapse_peak_floor_reference = 891.3   # The zero-action statue's reward on this walk: 891.35 +/- 1375.22 over 40
                                        # episodes, seeds 3042-3081, 40/40 full horizon, physics r6, measured
                                        # 2026-11-24 with environments/shared/scripts/zero_action_baseline.py
                                        # --model-id velociraptor_mongoliensis anatomical --stage 2 --episodes 40
                                        # --seed 3042, and again on 2026-11-26 with the tracking window (D-D64):
                                        # unchanged at this precision. A mix of the two families: 37 cruise episodes
                                        # 499.76 +/- 0.92 (+/- 0.93 per step; 0.500 a step, the alive bonus; tracking
                                        # 0.30 an episode: the statue tracks no cruise command) and 3 stand episodes
                                        # (seeds 3052, 3060, 3074; a stop is scored per step either way). Over
                                        # those 3 and the next 7 stand seeds (3082, 3112, 3117, 3120, 3121, 3127,
                                        # 3130) a stand episode reads 5709.2 +/- 25.8 (5.71 a step: 2743.4 of it the
                                        # stand block's weights, 2466.2 the stop's tracking, 499.7 the [env] terms);
                                        # at the 15% stand rate the mix averages 1281.2. The forward walk's statue
                                        # was 798.4. Re-measure with the same script whenever a reward weight, the
                                        # command distribution OR the plant changes, and re-derive the fraction.
collapse_peak_floor_fraction = 2.4      # floor = 2.4 x 891.3 = 2139.1, above every evaluation a stander reads with
                                        # at most 9 of its 30 episodes stands: 499.8 + 5209.5 k / 30 is 1281 at the
                                        # expected k = 4.5, 2062.6 at k = 9 and 2236.3 at k = 10.  With k fixed by
                                        # the run's evaluation seed (D-D62 (20)), a stander arms the floor only on a
                                        # run whose seed draws k >= 10, 0.97% of seeds (P(k >= 10) = 0.0097; the
                                        # default seed 42 draws 4), and a level that holds steady never reads as a
                                        # collapse.  The floor was sized with k drawn afresh at every evaluation, a
                                        # superset of that variance: then a stander's peak, the best 5-evaluation
                                        # median of the 115 evaluations past the warm-up (8M at 50k steps), reached
                                        # the floor on 0.06% of 200,000 simulated runs.  The cruise statue alone
                                        # (499.8) is 0.23 of it.  A walker clears it at a mean cruise-episode reward
                                        # of (2139.1 - 0.15 x 5709.2) / 0.85 = 1509, a tracking quality of 0.40 on
                                        # top of the 0.5 alive bonus: the reference walk (scripts/reference_walk.py)
                                        # under a command matched to its own 0.257 m/s reads 2623.4 a cruise episode
                                        # on the walk panel with the tracking window (2.71 a step, quality 0.96 after
                                        # 2 s; seed 3045's fall at step 373 included; per step 2322.1, 2.40 and
                                        # 0.79), an expected evaluation of 0.85 x 2623.4 + 0.15 x 5709.2 = 3086,
                                        # 1.44 x the floor (decisions D-D62, D-D64; the shared forward walk's 0.45
                                        # put the floor at 401.1, under the cruise statue).
statue_constants_physics_revision = 6   # The velociraptor PHYSICS revision the reference was measured on.
                                        # test_statue_constant_freshness.py holds this pin against the plant
                                        # manifest, so a plant bump that forgets the re-measure fails CI.
collapse_peak_warmup_timesteps = 2300000 # Evaluations before this step cannot SET the peak: the D-B5 bound,
                                         # warmup_timesteps + [commands] cruise_ramp_timesteps (300k + 2M), as on
                                         # the dibothrosuchus and brachiosaurus walks. The evaluation env runs the
                                         # end-state command from step 0 (the cruise ramp swaps only the training
                                         # workers), so a walk warm-started from a quiet stance evaluates at its
                                         # standing level until it walks, the shape that stopped dibothrosuchus run
                                         # 20260923_020654 at 1.45M (the floor above keeps that level from arming
                                         # too; the warm-up also keeps the ramp's window out of the peak); 2.3M
                                         # leaves 71% of the 8M budget protected (test_curriculum_early_stopping.py
                                         # pins the bound).
collapse_min_evals = 10                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps (10 evals x 100k) before it can fire.
collapse_patience = 10                  # Require 10 consecutive raw per-eval mean drops (~1M steps at 100k; a count, kept at the 100k cadence: D-D79) so a transient dip won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count, so the normal early-locomotion dip survives.
# warm_start_log_std is not declared: the walk inherits the stance's learned action std (a warm start keeps the
# parent's log_std; [ppo.policy_kwargs] applies only to a new model), at most about 0.10 now that the stance starts
# there, and lower if the entropy bonus's decay to 0 lets it shrink. The velociraptor's one genuine run warm-started
# from a std-~1 stance; the T-Rex's walking pilot 1 read STILL on 3/3 seeds from a std-0.095 parent, and its pilot 3
# chose its reset (log_std -2.0) by scanning its trained parent's noise tolerance first. So scan the trained
# velociraptor stance before the first walk (docs/NEXT_STEPS.md), and set a reset only if it lies above the
# parent's learned std and the parent stands at it on every episode of the scan.
warmup_timesteps = 300000               # Increase from 100k: give critic more time to adapt to new reward landscape
warmup_clip_range = 0.02
warmup_ent_coef = 0.02
