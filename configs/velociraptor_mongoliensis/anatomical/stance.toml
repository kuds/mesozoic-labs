[stage]
name = "stance"
description = "Learn to stand and balance without falling"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0              # Redundant with drift_penalty — drift covers all horizontal directions equally
drift_penalty_weight = 0.3                     # Penalize horizontal displacement from spawn; prevents hop-to-balance exploit
alive_bonus = 1.75                                # Setting 4 sweep: all best end-to-end runs (03-15: S1→S2→S3 all passed) used 1.75.
# Stance-quality terms (TyrannosaurusRexAnatomicalEnv's names), added with the physics-r3 plant (plant_versions note 14; D-D25). Each
# weight is MEASURED, on three panels: the r3 statue (zero action, noise 0.05, seeds 3042-3081); the audit's
# crouch/chatter stance 20260922_125248 (robust_best and final, 40 episodes each on the same seeds), replayed on the
# r2 plant its checkpoints load on and re-scored under these terms from its recorded actions, joint angles and
# per-foot floor force; and a fresh PPO policy (log_std_init = 0, so actions ~ clip(N(0, 1))) on r3.
#   * The statue stays the reward optimum: it scores the maximum of every term below (support 0.997, leg pose
#     0.9993, no saturation, no jerk), standing at 2842.8 +/- 2.6 of a 2850 ceiling for this [env].
#   * The audit policy GAINED 53.5 (robust_best) / 58.2 (final) per full-horizon episode over the r2 statue, by
#     escaping the -95/episode nosedive charge that statue paid on its 24-degree settle (the r3 statue pays -3).
#     These terms price its least-priced episode 876 / 724 below the r3 statue, and each family alone prices it
#     above that gain (least-priced episode: support 384/138, leg pose 334/351, saturation 112/175). Jerk does
#     not: its parked commands barely move.
#   * At init the penalties cost 0.70/step, 40% of the alive bonus (conditioned alive 0.34, jerk 0.19, saturation
#     0.17), 0.35/step net of the leg-pose credit: surviving still pays.
# The gait plan's suggested metatarsus penalty (§5.4) is not used: the r3 statue carries 28% of each foot's load
# on the metatarsal head, so it would charge the optimum. Nor is foot_load_balance: the bilateral term below already
# pays the weaker-loaded foot. No term sees a single digit unloading (the per-foot sums stay saturated), which is
# why the stance gate's support-geom bars sit mid-gap ([curriculum]). Re-measure all of this with any plant or
# [env] change. Re-measured on physics r4 (plant_versions note 17: the elliptic friction cone): the statue still
# scores the maximum of every term (support 0.997, leg pose 0.9989, no saturation, no jerk) at 2843.0 +/- 2.7, pays
# -2.4 of nosedive charge and carries 29% of each foot's load on the metatarsal head, so every weight carries.
# 2026-11-06 (the maintainer's decision that day, the T-Rex's stance lessons ported): the start moves to action std 0.07
# ([ppo.policy_kwargs] log_std_init) and three T-Rex terms join below (tail home pose, floor impact, airborne
# substeps). Re-measured on r4 with clip(N(0, sigma)) commands, seeds 3042-3081: at sigma 1.0 (the old start)
# the noise IS a hop -- no foot down on 49% of steps, 59% of substeps airborne -- and the penalties above cost
# 1.10/step plus 0.34/step of conditioned alive, 63% + 19% of the alive bonus, past the T-Rex's init rule (a
# fresh policy's penalties under about half of it); at sigma 0.07 they cost 0.021 + 0.110/step and about 2e-5
# of substeps are airborne. With the three terms on, the per-step reward with the -50 fall penalty set aside is
# +2.81 at sigma 0.07, +1.84 at 0.22, +1.28 at 0.37, +0.96 at 0.5 and +0.29 at the old sigma 1.0 (+0.78 there
# without the terms; the airborne term's -0.59 takes most of the margin), so surviving pays at every sigma
# measured and none of the terms pays a noisy policy to fall sooner; averaged with the fall penalty in, it is
# -0.50 at sigma 1.0 (-0.01 without the terms), where every episode falls within about 63 steps.
# No term here is paid on the episode step. The T-Rex's settled stance width (paid after step 200, on in its
# committed stance), its lateral lean and settled leg target (off on main) and the screens' stagger and CoP band
# are step-gated or settle-referenced, and the T-Rex's tail habit was traced in part to that hidden clock: the
# critic reads the step from the tail angle (the 2026-10-30 why-probe and the critic-phase screen, on the
# never-merged branches claude/handoff-day-2026-10-30 and claude/records-phase-screen). None is ported; one
# would need [ppo] critic_phase, which reads a stance_width_settle_steps attribute this env does not have. No
# clock does not rule a tail habit out: the r2 audit stance parked tail_1_pitch at its stop with none.
# Physics r5 (the life-size plant, plant_versions note 22; the maintainer's decision of 2026-11-08) re-measured
# every constant below on its statue (zero action, this [env], reset noise 0.05, seeds 3042-3081, and out of
# sample 3082-3121 and 7042-7081) and its noise start (clip(N(0, sigma)) commands, seeds 3042+i, stream
# default_rng(123456 + 17 i)); the r2 audit numbers stay as measured (its checkpoints load only on r2).
#   * The statue stays the reward optimum: 3341.03 +/- 2.72 (40/40) of a 3350 ceiling, with support 0.995
#     (1.000 after step 100; the reset pop's first steps sit under the saturation), leg pose 0.9991, tail pose
#     0.9983, neck pose 0.9978 (the new neck term, below), no saturation, no jerk, no impact charge; it pays -2.0
#     of nosedive charge and -0.10 of airborne substeps per episode (the spawn's first one or two substeps,
#     before a foot touches, which no command reaches). Without the neck term a 0.10 rad head raise EARNED +0.85
#     per episode (less nosedive charge); with it every measured carriage change pays (neck term, below).
#   * At the new start (sigma 0.10, [ppo.policy_kwargs] log_std_init) the penalties cost 0.040/step plus 0.161
#     of conditioned alive (2% + 9% of the alive bonus), the impact and airborne terms 0.002/step, and
#     the per-step reward with the fall penalty set aside is +2.88 (+2.41 without the four opt-in terms); +2.99
#     at 0.07, +2.26 at 0.22, +1.74 at 0.37, +1.43 at 0.5 and +0.80 at sigma 1.0 (+1.09 without the terms: the
#     airborne term's -0.49 and the impact's -0.05 against the pose terms' +0.24), so surviving pays at every sigma measured; with the fall
#     penalty in it is -0.03 at sigma 1.0 (+0.27 without the terms), where every episode falls within about 58
#     steps. At sigma 1.0 the penalties above cost 0.86/step and conditioned alive 0.34 (49% + 19%; r4 63% + 19%).
support_conditioned_alive_fraction = 0.2      # Fraction of alive_bonus paid in proportion to bilateral support.
                                               # Costs the audit policy 239/188 per episode against the statue's
                                               # 1.1, and 0.34/step at init, where random commands keep the
                                               # weaker foot at 2.8 N on average (support 0.024). 0.5 (the T-Rex
                                               # value) would cost 0.85/step there on its own -- the whole budget.
                                               # r5: 0.34/step at sigma 1.0 (weaker foot 4.4 N, support 0.039 at
                                               # 55 N), 0.16/step at the sigma-0.10 start (31.7 N, support 0.54);
                                               # the statue 0.002/step, all in the reset's first 84 steps.
bilateral_support_weight = 0.5                 # Pays the weaker-loaded foot, so both feet must carry weight. Since
                                               # r3 the summed touch IS the floor force (d3 + metatarsus + d4, rel
                                               # 1e-6; since r5 MTP pad + d3 + d4, to 6e-16 on every substep), so
                                               # this is floor-true support. The audit policy averaged
                                               # 0.32/0.46 support (its feet chatter at ~10 touchdowns/s) against
                                               # the statue's 0.997: 341/269 per episode. Free at init (+0.01/step;
                                               # r5 +0.02 at sigma 1.0, +0.27 at the sigma-0.10 start; statue 0.995).
foot_contact_saturation_force = 55.0           # N per foot, 0.37 BW of the r5 plant's 147.15 N (the life-size plant;
                                               # r4 50 N, 0.38 BW of 132.4 N, scaled and rounded down): the quiet
                                               # statue stands at 73.6 N per foot (p5 of the per-step weaker foot,
                                               # steps 100-999, 71.8 N; at least 63.7 N on the 120 seeds of
                                               # 3042-3081, 3082-3121 and 7042-7081), so it earns full credit, and
                                               # an impact spike cannot earn more than that. (r4: 66.2 N, p5 60.7 N.)
leg_home_pose_weight = 0.5                     # Soft retention of the home keyframe's leg stance, hips to ankles (8
                                               # servoed joints since r5, the T-Rex's set: the digits are passive;
                                               # r3/r4 12 joints, hips to toes): since r3 the keyframe IS the
                                               # standing equilibrium (springs anchored there, servos preloaded
                                               # against gravity). The audit's crouch held hip pitch +42 deg, knee
                                               # 45-59 deg and the right d4 toe 20-22 deg from home: 344/381 per
                                               # episode. +0.34/step at init (r5: +0.42 at sigma 1.0, +0.50 at 0.10).
leg_home_pose_tolerance = 0.20                 # rad. The statue's p99 per-joint settle error is 1.85 deg (hip roll;
                                               # every other joint <= 0.44 deg), worth 0.9993 of the maximum (r4:
                                               # 2.20 deg, <= 0.59 deg and 0.9989; r5, steps 100-999: 1.59 deg on
                                               # 3042-3081 and at most 2.01 on 3082-3121 / 7042-7081, the hip rolls;
                                               # every other joint <= 0.60 deg; 0.9993 in the window). 0.10
                                               # would price the crouch only 18-26% more (434/451) with no capture
                                               # range past ~0.2 rad, and this env has no broad component.
action_saturation_weight = 0.5                 # Prices commands parked past |action| = threshold. A saturated
                                               # command cannot oscillate, so smoothness and jerk cannot see it, and
                                               # the audit policy parked both hip pitches, the right knee and the
                                               # right shoulder roll at +-1 on 92-98% of steps (the final also the
                                               # left knee, the left hip roll, the right d4 toe and tail_1 pitch):
                                               # 128/184 per episode. 0.17/step at init, where a third of every
                                               # clip(N(0, 1)) command sits at a limit (r5 0.17/step, 32% of
                                               # commands at a limit; 0 at the sigma-0.10 start and on the statue).
action_saturation_threshold = 0.9              # Ramp start; below this saturation is free (the T-Rex value).
action_jerk_weight = 1.0                       # Second difference of actions: the guard against command chatter
                                               # that the first-difference smoothness term is blind to (the T-Rex's
                                               # 2026-08 stance runs stood on 16.8-18.7 Hz chatter). It is NOT a
                                               # lever on the audit policy -- 9.3/4.7 per episode at this weight --
                                               # whose chatter is contact chatter under parked commands. Sized to the
                                               # init budget: 0.19/step, against a full-scale Nyquist toggle on one
                                               # actuator at 45 per episode (r5: 0.19/step at sigma 1.0, 0.004 at
                                               # the sigma-0.10 start; the toggle 59 per episode over 17 actuators).
tail_home_pose_weight = 0.25                   # The T-Rex's tail term (2026-11-06): the four servoed tail joints around the
                                               # statue's own settled tail (VelociraptorMongoliensisEnv._TAIL_SETTLED_QPOS,
                                               # 4.5 deg down at tail_1 on r4; the keyframe zeros since r5, where
                                               # springref preloads carry the tail; clear of every stop). tail_stability below reads
                                               # only the tail-tip gyro, which a tail parked on a stop satisfies; the
                                               # r2 audit stance held tail_1_pitch at -15 deg, its stop, on 95% of
                                               # steps, and the T-Rex's 2026-08 run parked three tail joints that way.
                                               # Statue quality 0.993 (+248/episode; per seed 0.988-0.998 over the 120
                                               # seeds of 3042-3081, 3082-3121 and 7042-7081, the three 40-seed block
                                               # means 0.9929-0.9937); 0.986-0.988 at the sigma-0.07 start; one joint
                                               # on its stop forfeits a quarter of the term. r5: statue 0.998
                                               # (+249.6/episode; per seed 0.9958-0.9996 on the same 120 seeds, block
                                               # means 0.9982-0.9984); 0.978 at the sigma-0.10 start.
tail_home_pose_tolerance = 0.05                # rad, the T-Rex's: the statue's per-seed window means (seeds 3042-3081)
                                               # sit within 4.1e-4 rad of the target (tail_1_yaw; 1.2e-4 on the pitch
                                               # joints), their pooled mean within 1e-5. r5, 120 seeds: within 2.9e-4
                                               # rad (tail_1_yaw; 1.7e-5 on the pitch joints), pooled within 6e-6.
floor_impact_weight = 0.5                      # The T-Rex's D-D27 impact term in the anatomical Compsognathus's capped
                                               # form (2026-11-06): per step, weight x min(peak summed foot force in body
                                               # weights - threshold, 1), over every substep of the whole episode,
                                               # settle included. The r3 pilots' control panels peaked at 11-12.6 BW
                                               # (median window peaks; both r3 6M stances hopped at ~10 Hz), so a hop
                                               # landing pays the full cap, 0.5 per landing step;
                                               # uncapped, a few landings would out-price the -50 fall penalty. Costs
                                               # sigma 0.22 0.011/step and sigma 1.0 0.085/step (r5 at 3.0 BW: 0.012
                                               # and 0.052/step; 0.001/step at the sigma-0.10 start).
floor_impact_threshold_bw = 3.0                # r5 (the life-size plant): the statue's reset pop -- the shared reset's
                                               # uniform noise on every joint, the stiff passive toe springs answering
                                               # it -- peaks at 2.46 BW on the 120 seeds of 3042-3081 (2.25),
                                               # 3082-3121 and 7042-7081 (seed 7056), and at 2.56 on 3000 more seeds
                                               # (10000-12999, steps 0-29; 2 over 2.5, none over 2.75); after step 10
                                               # it stays under 1.18. So r4's 2.5 would charge the statue, and 3.0
                                               # (the env default; 17% over the 3000-seed worst) keeps it at 0. The
                                               # noisy start's floor force rings far higher than r4's: the sigma-0.10
                                               # start crosses 3.0 on 285 of 39047 steps (every episode, worst 4.86 BW,
                                               # 0.001/step), sigma 0.07 on 26 of 40 episodes (worst 4.46). r4 (2.5):
                                               # the statue's largest peak on 120 seeds was 2.02 BW and the sigma-0.07
                                               # start reached 2.75 on 1 of 120 episodes. The Compsognathus's 2.5; the
                                               # T-Rex's 1.4 sits under its own statue's settle bar, which on this
                                               # plant the reset pop already crosses.
neck_home_pose_weight = 0.25                   # The neck and head carriage term of the life-size plant (physics r5, the
                                               # maintainer's decision of 2026-11-08), the tail term's shape and size:
                                               # neck_pitch, neck_yaw and head_pitch around the statue's settled carriage
                                               # (VelociraptorMongoliensisEnv._NECK_SETTLED_QPOS; the servos are preloaded
                                               # against gravity, so it is the keyframe's to 3e-5 rad). The posture term
                                               # reads only the pelvis, so the head rode free: with this term off a 0.10
                                               # rad head raise EARNED +0.85 per episode over the statue (less nosedive
                                               # charge) and drooped heads cost 2.5-10 (energy and nosedive; seeds
                                               # 3042-3051, constant residuals on the neck and head servos). On, the
                                               # statue keeps 0.9978 of it (+249.5/episode; per seed 0.9935-0.9996 on
                                               # the 120 seeds, block means 0.9973-0.9978) and is the optimum again:
                                               # against it the unpreloaded head (each servo's control back at its
                                               # pose, settling 4.9 / 4.4 deg low) pays -156 per episode net of every
                                               # other term, a 0.10 rad droop -165, 0.20 -172, 0.35 -176, the neck
                                               # alone drooped 0.10 -85 and a 0.10 rad raise -162. 0.89 at the sigma-0.10
                                               # start (0.027/step forfeit), 0.37 at sigma 1.0. The T-Rex's neck_posture
                                               # (0.20, tolerance 0.35 rad) would price the same 0.10 rad droop at -14.
neck_home_pose_tolerance = 0.05                # rad, the tail term's: the statue's per-seed window means (steps 200-999)
                                               # sit within 3.1e-4 rad of the target on the 120 seeds (neck_yaw; 2.8e-4
                                               # neck_pitch, 7e-5 head_pitch), their pooled mean within 4.3e-5. 0.10
                                               # would halve the price of the 0.10 rad droop (-108) for a 0.0016 gain
                                               # in statue quality.
airborne_substep_weight = 1.0                  # The T-Rex's D-D27 flight term (2026-11-06): the share of a step's substeps on
                                               # which every foot is unloaded (touch <= 0.1 N), over the whole episode.
                                               # A fully airborne step forfeits 57% of the alive bonus. Statue 0, the
                                               # sigma-0.07 start about 2e-5/step; sigma 0.22 0.11/step and sigma 1.0
                                               # 0.59/step (r5: statue 1e-4/step, -0.10 per episode, all on steps
                                               # 0-1, the spawn's first substeps before a foot touches; the sigma-0.10
                                               # start 0.001/step, 0.22 0.044 and 1.0 0.49); the r3 pilots' control
                                               # panels had no foot down on 0.54-0.69 of window steps. With the other terms the per-step reward, the fall
                                               # penalty aside, stays positive at every sigma measured (+0.29 at 1.0;
                                               # r5 +0.80; header above), so it prices flight without paying a policy
                                               # to fall.
fall_penalty = -50.0                   # Match stage 2 and T-Rex stage 1; default -100 is disproportionate with alive_bonus=2.0
energy_penalty_weight = 0.075                      # Setting 4 sweep: 0.075 forces efficient standing posture. Proven across all three species.
tail_stability_weight = 0.02
posture_weight = 1.5
nosedive_weight = 1.5
gait_symmetry_weight = 0.0
smoothness_weight = 0.05
heading_weight = 0.1                             # Small heading reward to prevent spin-to-balance exploits
spin_penalty_weight = 0.1                        # Penalize pelvis angular velocity to directly discourage spinning
speed_penalty_weight = 0.3                       # Penalize absolute 2D speed above threshold — complements drift penalty with instantaneous signal
speed_penalty_threshold = 0.10                   # m/s — any speed above this incurs penalty
strike_bonus = 0.0
strike_approach_weight = 0.0
prey_distance_range = [10.0, 15.0]
max_episode_steps = 1000                  # Match stage 2/3 for consistent episode horizon across curriculum
reset_noise_scale = 0.05                  # Increased from 0.01 default to improve robustness and reduce eval variance

[ppo]
learning_rate = 3e-5                             # Setting 4 sweep: 3.23e-5 — 10x lower. Old 3e-4 produced inconsistent results (512–1702 range). Lower LR gives stable ~1500–2400.
learning_rate_end = 5e-6                          # Lowered from 1e-5 for a gentler late-stage cosine floor.
lr_schedule = "cosine"                            # Cosine LR protects the converged balance policy from the late collapse seen on 07-12.
n_steps = 2048
batch_size = 128                                 # Setting 4 sweep: halved from 256. All successful Setting 4 runs used 128.
n_epochs = 10                                    # Setting 4 sweep: restored from 6. With batch=128, minibatch count doubles — 10 epochs is validated by data.
gamma = 0.98                                     # Setting 4 sweep: 0.9797. Slightly shorter horizon than 0.99 — confirmed across all three species.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.0                               # Decay entropy over the stage (EntCoefDecayCallback), to 0 rather than a
                                                 # floor (2026-11-06, the T-Rex's and the anatomical Compsognathus's value).
                                                 # The decay itself stays: run 20260711_235303 stage 1 collapsed late
                                                 # (peak 1524 @ 2.45M -> 385 @ 3.95M, bimodal falls) under constant
                                                 # ent_coef on the 1.5x-kp r2-era plant (STAGE2_RECOMMENDATIONS.md
                                                 # section 5). The 0.001 floor goes: any floor sets a non-zero std
                                                 # equilibrium for the rest of the run -- on the T-Rex's run
                                                 # 20260804_143747 it held the std at ~0.375 for 7M steps, a 16.7 Hz limit
                                                 # cycle that scored under the statue (issue #486) -- and on this plant
                                                 # the statue survives only sigma ~0.10 (r4 ~0.07; log_std_init below).
ent_coef_decay_timesteps = 7000000               # The bonus reaches 0 at 7M of the 12M budget (the T-Rex's and the
                                                 # Compsognathus's anchor; hop_watch_after_timesteps moves with it). Was
                                                 # 3M, anchored to that r2-era collapse point when the budget was 6M,
                                                 # and left there when the budget doubled (cdffea8, 2026-10-11), so the
                                                 # floor governed 9M of the 12M steps.
target_kl = 0.03                                # Early-stop PPO epochs on high approx-KL — extra guard against the late destabilisation that collapsed the 07-12 run.

[ppo.policy_kwargs]
net_arch = [512, 256]
log_std_init = -2.30                             # Initial action std exp(-2.30) = 0.100 on every actuator since physics r5
                                                 # (r4 -2.66, std 0.070; SB3's default 0, std 1.0, before 2026-11-06).
                                                 # The T-Rex's D-D27 lesson: start quiet, because
                                                 # at std 1.0 the stochastic policy's flight IS the exploration noise and
                                                 # both physics-r8 T-Rex runs entered a hop regime (unsupported duty
                                                 # 0.52-0.57 at 0.1M); since D-D27 (-1.5) no full-budget T-Rex stance has
                                                 # failed by hopping. Every velociraptor stance trained at std 1.0 (both
                                                 # r3 6M runs 0/40 clean on a ~10 Hz hop; 312 of the 360 r3 pilot
                                                 # evaluations ended early; learned std still ~0.97 at 1M). The value is
                                                 # this plant's own, not the T-Rex's -1.5: under clip(N(0, sigma)) commands
                                                 # the r4 statue reaches the horizon on 40/40 episodes at sigma 0.05 and
                                                 # 0.06, 37/40 at 0.07 (40/40 on 7042-7081), 32/40 at 0.08, 7/40 at 0.10,
                                                 # 0/40 at 0.135 and at 0.22 (the T-Rex's start), every fall at 0.07-0.135
                                                 # on the tail: the home-residual map's asymmetry turns zero-mean noise
                                                 # into a backward lean. 0.07 starts at the cliff's edge, the rule the
                                                 # anatomical Compsognathus's -2.0 follows (its statue 151/160 at its
                                                 # 0.135, D-D26). Re-measured on the life-size plant (physics r5, the
                                                 # maintainer's decision of 2026-11-08), same protocol (seeds 3042+i,
                                                 # stream default_rng(123456 + 17 i)): 40/40 at every sigma from 0.05
                                                 # to 0.09, 38/40 at 0.10, 37/40 at 0.11, 33/40 at 0.12, 19/40 at 0.135,
                                                 # 8/40 at 0.15, 1/40 at 0.17, 0/40 at 0.20 and above; at 0.10 37/40 on
                                                 # 3082-3121 and 40/40 on 7042-7081 (default_rng(700001 + 31 i)), 115/120
                                                 # pooled (r4 at its 0.07: 114/120), every fall at 0.10-0.12 a nosedive
                                                 # (the level trunk tips forward; r4's fell on the tail; 20 of the 21 at
                                                 # 0.135). So the start moves to the
                                                 # new edge, 0.10. test_anatomical_noise_tolerance.py pins the cliff;
                                                 # move this with it. Enters hyperparameters_sha256.PPO only.

[sac]
learning_rate = 3e-4              # Match PPO starting LR — SAC tolerates higher LR due to replay buffer stability
batch_size = 256                  # Standard SAC batch size; matches PPO
gamma = 0.99                     # Match PPO Stage 1; shorter horizon suits balance task
tau = 0.005                      # Soft target update rate — standard default
ent_coef = "auto"                # SAC's key advantage: auto-tuned entropy eliminates manual exploration tuning
buffer_size = 300_000            # Sized for the stage when it was 6M steps (now 12M); smaller buffer keeps transitions recent
learning_starts = 10_000         # Collect 10K random transitions before gradient updates begin
train_freq = 16                  # Collect 16 env steps before training — amortises gradient cost over more env steps
gradient_steps = 8               # 2:1 data-to-update ratio — more gradient updates per env batch smooths learning curves

[sac.policy_kwargs]
net_arch = [512, 256]            # Match PPO architecture for fair comparison

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "stance_quality_heading/v1" # environments/shared/curriculum/gate_schema.py
timesteps = 12000000

# ---------------------------------------------------------------------------
# The six-heading certificate (the maintainer's decision of 2026-11-06; the T-Rex's and the anatomical
# Compsognathus's since D-D32). Since policy interface r13 the observation
# reads no world heading (plant_versions note 21), so the certificate judges
# the v2 classification below at every whole-scene turn of -90, -45, 0, 45, 90
# and 180 deg, each against the statue rolled at that heading, and certifies
# the bound on seeds clean at EVERY heading
# (environments/shared/curriculum/stance_heading_gate.py). A single-heading v2
# pass can be heading-dependent: the T-Rex stance 20261009_155723 passed v2 at
# 39/40 and stands 0/8 with the whole scene turned -90 or -45 deg. Every bar
# below is v2's own and is read at each heading. The r4 statue's six-heading
# panel: see the rails below; the r5 statue's (120 seeds, all clean at every
# heading): the gate block's Physics r5 paragraph.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The stance gate: physical stance quality on floor truth, not return.
#
# Adopted 2026-10-06 with the physics-r3 plant (decision D-D25), replacing
# reward_and_length/v1. That gate was passable by doing nothing: the r2
# statue scored 1745.8 against its 1050 rail at 100% of the horizon. Worse,
# it certified run 20260922_125248's stance, which the 2026-10 stance-hack
# audit (docs/investigations/STANCE_HACK_AUDIT_2026_10.md §3.2) found holding
# a saturated hip-extension crouch on a wide stance, one outer toe carrying
# no load, its feet chattering at about 20 Hz and its body sliding 0.6 m --
# and scoring 0.6% ABOVE the statue (1755.6, 40 episodes), so no reward rail
# could have refused it.
#
# Every bar below was measured through the report path
# (build_stance_gate_report) on the r3 statue: zero action, this [env], reset
# noise 0.05, the 40-episode panel (seeds 3042-3081), clean on 40/40, and
