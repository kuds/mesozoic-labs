# Compsognathus: heading and speed changes over bumps and depressions
# Supported SB3/PPO behavior. Parent resolves through ../stages.toml.
# Speeds follow the species locomotion target; terrain dimensions match its model scale.
[behavior]
name = "combined_mixed_terrain"
species = "compsognathus"
parent = "locomotion"
timesteps = 3000000

[commands]
cruise_speed = 0.08
speed_scale = 0.12
lateral_speed_scale = 0.12
yaw_rate_scale = 0.6
speed_range = [0.04, 0.08]
stop_probability = 0.15
turn_increment_max = 0.5235987756
yaw_rate_max = 0.3
switch_interval_s = 6.0
switch_jitter_s = 1.0
straight_probability = 0.25

[terrain]
enabled = true
mode = "gentle"
template = "mixed"
extent = 4.0 # Half-extent; fits a 25-second cruise plus the full animal
nrow = 401
ncol = 401
apron_radius = 0.8 # Flat spawn disk contains the model, including its tail
blend_width = 0.3
max_height = 0.32
max_slope_degrees = 3.0
roughness_amplitude = 0.00375
wavelength_min = 0.25
wavelength_max = 0.75
episode_variation = 0.15
feature_height = 0.005 # Metres; final physical heights also obey the grade cap
feature_radius_min = 0.18
feature_radius_max = 0.32
feature_density = 6.0 # Planned centers per square metre

[env]
max_episode_steps = 1250 # 25 seconds at this species control timestep
course_distance = 0.8 # Radial progress diagnostic, not a success gate
flat_probability = 0.25 # Original-plane retention among heightfield episodes

[ppo]
learning_rate = 0.00005
ent_coef = 0.005
target_kl = 0.03
