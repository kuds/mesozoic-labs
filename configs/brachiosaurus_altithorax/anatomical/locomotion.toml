[stage]
name = "locomotion"
description = "Walk: follow a forward command with heading hold, and stand still on a zero command"

# The walk (decision D-D62): every episode draws one whole-episode command at reset ([commands]), a forward cruise
# about a heading near the spawn's or, on about 15% of episodes, an exactly zero command, the stand.  The reward is
# BaseDinoEnv's command-tracking term ([commands] tracking_weight) plus the [env] terms below on every cruise step;
# on a stand step the stand block ([commands.stand_weights]) pays the stance's weights in their place.

[env]
# Kept terms: alive, posture, nosedive, energy, smoothness, tail and the gait terms, at the forward walk's weights.
alive_bonus = 0.26                     # Sweep winner: 0.264 — modest increase from 0.2 stabilizes early training without the 0.3 collapse seen 03-22.
fall_penalty = -50.0                   # Reduced from -100: overly harsh penalty caused conservative policies that avoid movement. Align with T-Rex/Velociraptor.
energy_penalty_weight = 0.004          # Sweep winner: 0.00384 — lighter than 0.005, top-3 trials all clustered 0.0035–0.004.
tail_stability_weight = 0.11           # Sweep winner: 0.113 — slightly lower than 0.15, less pressure on tail lets locomotion dominate.
gait_stability_weight = 0.065          # Sweep winner: 0.0645 — slight increase from 0.05.
gait_symmetry_weight = 2.2             # Sweep winner: 2.224 — confirmed: >2.0 is safe and beneficial. Top-3 all in 2.2–2.4 range.
                                       # Measured on the walk (2026-11-24): the zero-action statue collects all of
                                       # it on every cruise step (its diagonal pairs land in the settle and never
                                       # lift, so the alternation ratio holds at 1: 2195.5 of a 2214.8 cruise
                                       # episode), the reference walk's lateral sequence 0.71-0.77 of it.
smoothness_weight = 0.05               # Penalize jerky actions for smoother movement
posture_weight = 0.29                  # Sweep winner: 0.286 — close to current 0.3, marginal reduction.
nosedive_weight = 1.0                  # Sweep winner: 0.991 — strong increase confirmed by top-3 (0.75–1.0). Nosedive was a real problem.
natural_pitch = -0.15                  # Slight upward neck angle target (radians).
height_weight = 0.14                   # Sweep winner: 0.140 — reduced from 0.2. Less height pressure lets agent find natural gait posture.
idle_penalty_weight = 0.26             # Sweep winner: 0.256. Paid on cruise steps only: never at a zero command (D-D62 (3)).
idle_velocity_threshold = 0.1          # Speed (m/s) at which idle penalty reaches zero. Below this, agent is penalised for inaction.
# Terms the command-tracking term subsumes (D-D62): 0.  Under the live command they read the commanded heading
# and the command event's start (BaseDinoEnv._forward_reference_2d, _drift_anchor_2d).
forward_vel_weight = 0.0               # Was 4.4: tracking pays the commanded speed along the commanded heading
backward_vel_penalty_weight = 0.0      # Was 0.0 (the constructor default)
heading_weight = 0.0                   # Was 0.07: tracking pays the commanded yaw rate, which holds the heading
lateral_penalty_weight = 0.0           # Was 0.11: tracking pays the commanded zero lateral speed
drift_penalty_weight = 0.0             # Was 0.0 (the constructor default), as in the stance
forward_vel_max = 0.89                 # Scales only the forward and backward terms, 0 above; kept so their
                                       # diagnostics and the behavior recipes, which inherit this [env]
                                       # (train_behaviors.read_recipe), keep the scale they had (the sweep's 0.89).
# Stand-block term settings: none.  Every setting of a stand term is the stance's already (test_walk_stand_block.py
# lists the settings that differ on purpose).
# The episode.
max_episode_steps = 1000
reset_noise_scale = 0.05               # Was omitted, so SB3 silently fell back to the class default 0.01
                                       # while the retired [jax] table used 0.05. Stage 1 raised it deliberately; stages 2-3
                                       # inherited a 5x narrower reset distribution by accident.
healthy_z_range = [0.85, 3.5]          # Lowered fall floor from the env default 1.0: settled stance is ~1.13 m and normal gait bob dips to ~1.10 m, so a 1.0 floor fired spurious "fallen" terminations mid-gait (short 642/1000-step episodes, high variance). 0.85 keeps real falls detectable while letting the gait breathe.

[commands]
mode = "heading_and_speed"
# Command scaling: the follow_direction pilot recipe's (behaviors/follow_direction.toml), so the walk and the follow
# nodes that widen it share one scaling.
cruise_speed = 0.75                    # m/s, the recipe's cruise
speed_scale = 1.0                      # The recipe's: the command's v_x is normalised by it
lateral_speed_scale = 1.0
yaw_rate_scale = 0.6
# The walk's distribution: one command event per episode, drawn at reset from the controller's own stream.
speed_range = [0.375, 0.75]            # [0.5, 1] x cruise_speed
stop_probability = 0.15                # Whole-episode stands: no switch comes within the horizon to draw another
initial_heading_offset_max = 0.26      # rad: the requested heading is the spawn's turned by U(-0.26, 0.26) (15 deg)
turn_increment_max = 0.0               # No turns
switch_interval_s = 600.0              # Longer than the 10 s horizon (1000 steps x 0.01 s), so no scheduled switch
switch_jitter_s = 0.0
turn_slowdown = true
yaw_rate_max = 0.3
# The tracking term: the Gaussian of D-D60, sigmas and tolerances at their speed_scale defaults.  2.5, the pilot
# recipes' weight, on every model.
tracking_weight = 2.5
# Measured on this plant (2026-11-24, scored per step): the reference walk (scripts/reference_walk.py, its root servo
# steered to the commanded heading) under a command it matches (0.35 m/s) earns 0.80 a step of the 2.5 and is in
# tolerance on 27-30% of its steps, though a one-stride trailing mean of its velocity tracks the command at 0.99:
# within the stride its lateral speed swings 0.13 m/s RMS against the 0.167 m/s sigma.
# Measured on the window below (2026-11-26, the walk panel's 20 cruise episodes from 3042, matched at 0.35 m/s along
# the spawn heading): tracking quality 0.98 after 2 s (0.34 per step), in tolerance on every step after the settle
# (0.28-0.40 per step) and its heading settled on 20 of 20 (0 per step), so it passes the whole walk gate (also at a
# 0.26 rad heading offset: quality 0.97, settled on 20 of 20).  It earns 3.93 a step there to the statue's 2.24 (+75%;
# per step 2.71, +21%), its tracking (2.05) now above its gait_symmetry (1.65).  On the committed commands it earns
# 2.62 a step steered and 2.11 unsteered (2.42 and 2.03 per step), to the statue's 2.22: it walks its own speed,
# slower than most cruise commands, and steered it clears the cruise bars only on the 5 of 20 commanded at
# 0.39-0.47 m/s.
# The tracking window (D-D64): at a moving command the term, the metrics and the gate read the trailing mean of the
# last 1.40 s (140 steps of 0.01 s), so the within-stride sway above cancels over a stride; a stop is scored per step.
# The rule on every walk: the stride at the slowest end-state command, 0.5 x cruise (0.375 m/s).
tracking_window_s = 1.40               # D-D64: the reference's own 1.40 s stride at 0.35 m/s, below 0.5 x cruise
# The cruise ramp (D-D62 (5)): training commands start at 0.25 x these speeds and reach them at 2M steps; the
# evaluation env and the gate panels run the end state.
cruise_ramp_start_fraction = 0.25
cruise_ramp_timesteps = 2000000

[commands.stand_weights]
# The stand block (D-D62 (2)): paid in place of the [env] weights on every step under an exactly zero command.
# Each is the stance's weight, from the stance.toml line named, wherever it differs from the [env] above (a weight
# both share is paid anyway); test_walk_stand_block.py pins each one and lists every deliberate difference.
speed_penalty_weight = 0.3             # stance.toml:10
alive_bonus = 1.75                     # stance.toml:12
energy_penalty_weight = 0.075          # stance.toml:13
gait_stability_weight = 0.1            # stance.toml:14
gait_symmetry_weight = 0.0             # stance.toml:15
smoothness_weight = 0.0                # stance.toml:16
tail_stability_weight = 0.0            # stance.toml:17
posture_weight = 1.5                   # stance.toml:18
nosedive_weight = 0.3                  # stance.toml:19
height_weight = 0.0                    # stance.toml:20

[ppo]
learning_rate = 6e-5                    # Sweep winner: 6.03e-5 — slightly higher than 5e-5, better gradient signal without catastrophic forgetting.
learning_rate_end = 5e-6                # Lowered from 1e-5 for a gentler late-stage cosine floor.
lr_schedule = "cosine"                  # Cosine LR protects the converged gait from the post-peak collapse (best 6625 @3.8M -> final 3495).
n_steps = 2048                          # Sweep winner: 2048 — smaller rollout buffer performed better; faster policy updates.
batch_size = 512                        # Sweep winner: 512 — larger minibatches gave more stable gradients. Key differentiator of the top trial.
n_epochs = 10
gamma = 0.993                           # Sweep winner: 0.9929 — all top-3 trials at 0.991–0.993. Slightly shorter horizon than 0.995 reduces stale value estimates.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01                         # Sweep winner: 0.0104 — reduced from 0.015. Less entropy lets policy commit to discovered gaits sooner.
ent_coef_end = 0.002                    # Enabled: 5x entropy decay (EntCoefDecayCallback) — the documented fix for this exact
ent_coef_decay_timesteps = 6000000      # post-peak collapse, previously disabled only on Brachiosaurus. Anchored to 6M (~the
                                        # gait-consolidation point, just after the 4M ramp) rather than the padded 16M budget,
                                        # so entropy reaches its floor before the late drift. See STAGE2_RECOMMENDATIONS.md §5.
target_kl = 0.05                        # Loosened from 0.03: locomotion learns fast early, so a tight KL cap early-stops epochs and throttles gait development.

[ppo.policy_kwargs]
net_arch = [512, 256]                  # Larger first layer to match Stage 1 setting 4 architecture

[sac]
learning_rate = 1e-4              # 3x reduction from Stage 1 — gentler than PPO's 6x drop; replay buffer smooths gradients
batch_size = 256
gamma = 0.99                     # Keep at 0.99 — quadruped locomotion is mechanically simpler than biped,
                                 # doesn't need longer horizon; replay staleness risk at higher gamma
tau = 0.005
ent_coef = "auto"                # Auto-entropy handles the standing-still exploit naturally —
                                 # maintains exploration when alive_bonus=0.1 could trap the policy
buffer_size = 1_000_000          # Large buffer retains Stage 1 balance transitions;
                                 # Brachiosaurus (81 obs dims) × 1M ≈ 650MB — fits in Colab RAM
learning_starts = 10_000
train_freq = 4                   # Batch env steps before training — 4× less Python loop overhead
gradient_steps = 4               # Match train_freq to maintain update-to-data ratio

[sac.policy_kwargs]
net_arch = [512, 256]            # Larger first layer to match PPO's tapered architecture for Brachiosaurus's 81 obs dims

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "command_tracking/v1"       # environments/shared/curriculum/gate_schema.py.  Judged once, after the
                                        # stage, on the command-tracking panel (command_tracking_report.json); the
                                        # in-training manager never advances on it (decision D-D61).
timesteps = 16000000                   # Reverted to 16M: 20M run (03-22) showed late-training collapse (2396→809). 16M was sufficient for the only S2 pass.
# The walk profile: PROVISIONAL_WALK_THRESHOLDS (environments/shared/curriculum/command_tracking_gate.py), each the
# bar of configs/behavior_certification.toml named on its line.  PROVISIONAL: to be frozen from the first walk
# pilot's panel; a verdict minted under a provisional bar is re-judged, never retrained, when the bar moves (D-B7/D-B8).
profile = "walk"
min_cruise_episodes = 20                # episodes_per_family = 20
min_stand_episodes = 5                  # minimum_command_episodes = 5
min_cruise_survival_lcb = 0.80          # minimum_survival_lcb = 0.80: at 20 episodes only 20/20 clears it
min_cruise_success_lcb = 0.60           # minimum_success_lcb = 0.60: 17/20 clears it, 16/20 does not
min_cruise_tracking_fraction = 0.60     # minimum_tracking_fraction = 0.60, read after the settle
min_cruise_speed_ratio = 0.50           # minimum_course_fraction = 0.50, as speed along the commanded heading
min_stand_hold_fraction = 0.60          # minimum_tracking_fraction = 0.60, the stop criterion at a zero command
min_stand_success_fraction = 0.60       # minimum_stop_settle_fraction = 0.60
max_stand_falls = 0                     # The walk design (D-D61): a stand episode does not fall
# The quadruped gait clause: PROVISIONAL_QUADRUPED_GAIT_THRESHOLDS (GAIT_QUALITY_PLAN_2026_09.md §4.3 B, GQ-9 (a)),
# PROVISIONAL, each with the per-episode ranges it separates (the July brachiosaurus bound, the dibothrosuchus skid).
gait_limbs = 4
max_flight_fraction = 0.05              # The July bound 0.013-0.041, the skid 0.15-0.46
min_limb_duty = 0.20                    # The July bound 0.25-0.42, the skid 0-0.12
min_pair_alternation_index = 0.75       # The July bound's fore 0.18-0.87 and hind 0.19-0.53, the skid 0-0.53;
                                        # the reference walk 0.79-0.92 on this walk's panel (its hind pair; fore 1.0)
# Optional on a quadruped (D-D61): the lower of the fore and hind pairs' lead swaps a stride, counted through the
# 0.03 leg-length dead band (gait.locomotion_metrics, locomotion-gait/v2).  A flightless bound whose pair feet land
# more than 20 ms apart clears the three floors above.  This bar refuses such a bound only while each pair's feet
# stay side by side, within the dead band; a bound whose pair feet swing their lead past the band reads about two
# lead swaps a stride and clears it as well, so the bar narrows that gap and does not close it (an open risk).
min_lead_swaps_per_stride = 1.0         # The brachiosaurus reference walk reads 1.88 (locomotion-gait/v2, D-D61),
                                        # 1.67-1.82 on this walk's panel (the 20 cruise episodes from 3042, reset
                                        # noise 0.05; 1.44-1.87 steered to the commanded heading).  Each pair's
                                        # touchdown phase (the right foot's in the left foot's stride) reads 0.47-0.54
                                        # on the reference walk and 0.92-0.96 on the gait tests' synthetic staggered
                                        # bounds (40-80 ms), whatever their lead does; no module computes it for a
                                        # quadruped (measured with gait.locomotion_metrics' phase helpers).
# Froude = v^2 / (g L) = 0.75^2 / (9.81 x 1.163) = 0.05 at the cruise (0.01 at the range's 0.375 m/s floor), with
# L = 1.163 m the gait module's leg length (gait.locomotion_metrics: the spawn root's height above the spawn foot
# sites, the mean of seeds 3042-3044, 1.162-1.163).  A quadruped's flight cap is one of its required floors whatever
# its Froude number.  The reference walk (0.35 m/s, Froude 0.010) reads flight 0 and limb duty 0.59-0.61 on the walk
# panel's 20 cruise episodes.
#
# Training-loop keys, read by no gate: the collapse backstop and the stage-entry warm-up.
# Collapse backstop: the relative floor pair stance and recovery use (PLANT_VALIDATION §14 item 3); an explicit
# collapse_peak_floor would win over the pair (collapse_settings_from_config), so none is set.  The forward walk's
# absolute 100.0, which this walk kept until decision D-D65 (1), is gone.
collapse_peak_floor_reference = 2359.7  # The zero-action statue's reward on this walk: 2359.75 +/- 509.11 over 40
                                        # episodes, seeds 3042-3081, 40/40 full horizon, physics r7, measured 2026-11-26
                                        # with environments/shared/scripts/zero_action_baseline.py --model-id
                                        # brachiosaurus_altithorax anatomical --stage 2 --episodes 40 --seed 3042, with
                                        # the tracking window (D-D64).  A mix of the two families: 37 cruise episodes
                                        # 2214.82 +/- 10.17 (2195.5 of it gait_symmetry, which the statue collects
                                        # whole; tracking 0.79 an episode: the statue tracks no cruise command) and 3
                                        # stand episodes (seeds 3052, 3060, 3074) 4147.17 +/- 27.42; at the 15% stand
                                        # rate the mix would average 2504.7.  The first 10 stand seeds from 3042
                                        # (3052-3130) read 4149.84 +/- 28.83: the stance's weights plus the stop's
                                        # tracking (2445.1; a stop is scored per step).  Re-measure with the same script
                                        # whenever a reward weight, the command distribution OR the plant changes, and
                                        # re-derive the fraction.
collapse_peak_floor_fraction = 1.20     # floor = 1.20 x 2359.7 = 2831.6, above every evaluation a stander reads with at
                                        # most 9 of its 30 episodes stands: 2214.8 + 1935.0 k / 30 is 2505.1 at the
                                        # expected k = 4.5, 2795.3 at k = 9 and 2859.8 at k = 10 (the floor is their
                                        # midpoint, 2827.6, to the fraction's two decimals).  With k fixed by the run's
                                        # evaluation seed (D-D62 (20)), a stander arms the floor only on a run whose
                                        # seed draws k >= 10, 0.97% of seeds, and a level that holds steady never reads
                                        # as a collapse: the statue's own evaluation reads 2475.0 at the default seed 42
                                        # (k = 4), 2793.8 at seed 45 (k = 9) and 2851.3 at seed 4 (k = 10).  Sized with
                                        # k drawn afresh at every evaluation, a superset of that variance, a stander's
                                        # peak (the best 5-evaluation median of the evaluations past the warm-up)
                                        # reached the floor on 0.14% of 200,000 simulated 16M runs.  The cruise statue
                                        # alone (2214.8) is 0.78 of it.  A walker clears it at a mean cruise-episode
                                        # reward of (2831.6 - 0.15 x 4149.8) / 0.85 = 2599: the reference walk
                                        # (scripts/reference_walk.py, its root servo steered to the commanded heading)
                                        # under a command matched to its own 0.35 m/s along the spawn heading reads
                                        # 3932.9 a cruise episode on the walk panel with the tracking window (3.93 a
                                        # step; 3854.4 unsteered; 2709.9 scored per step), an expected evaluation of
                                        # 3965 (3962 at k = 4), 1.40 x the floor, so it arms the floor at every k.  The
                                        # rule (D-D62 (15), read on the matched basis on every model, D-D65 (1)): the
                                        # floor stands above a stander's mix where a walk as steady as the reference,
                                        # under a command it matches, evaluates above the mix's 10-stand level.  On the
                                        # committed panel's commands (0.375-0.75 m/s, faster than it walks) the steered
                                        # reference reads 2619.9 a cruise episode, an expected 2849, between the 9- and
                                        # 10-stand levels: D-D64 read the rule there and kept the absolute 100.  The
                                        # trade the maintainer accepted (D-D65 (1)): a standing plateau no longer arms
                                        # the backstop (under the 100 it armed once past the warm-up), so a collapse
                                        # from standing is not caught here; in exchange the dip while a policy starts to
                                        # walk cannot stop the run before its evaluations have reached the floor.
statue_constants_physics_revision = 7   # The brachiosaurus PHYSICS revision the reference was measured on.
collapse_peak_warmup_timesteps = 3000000 # Evaluations before this step cannot SET the peak: the D-B5 bound,
                                         # warmup_timesteps + [commands] cruise_ramp_timesteps (1M + 2M; 4.0M with the
                                         # forward-weight ramp's 3M). The evaluation env runs the end-state command from
                                         # step 0 (the cruise ramp swaps only the training workers), so a warm-started
                                         # policy still standing evaluates at its standing level, the shape that stopped
                                         # dibothrosuchus run 20260923_020654 at 1.45M of 12M. On every run whose
                                         # evaluation seed draws k <= 9 stands (99% of seeds) that level is under the
                                         # floor above, so it never arms the backstop, with this warm-up or without it
                                         # (under the absolute 100 it armed at 1.0M without one); the warm-up also keeps
                                         # the cruise ramp's 2M steps out of the peak. 3.0M leaves 13M of the 16M budget
                                         # protected.
collapse_min_evals = 10                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps (10 evals x 100k) before it can fire.
collapse_patience = 5                   # Require 5 consecutive raw per-eval mean drops (~500k steps) so a transient dip won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count, so the normal early-locomotion dip survives until entropy decay (floor ~6M) stabilises the gait.
warmup_timesteps = 1000000              # Sweep winner: 1M — 3x longer warmup was the biggest signal. Gives critic much more time to adapt to new reward landscape before policy changes accelerate.
warmup_clip_range = 0.035               # Sweep winner: 0.0335 — more clip room during warmup lets policy adjust faster once critic is ready.
warmup_ent_coef = 0.018                 # Sweep winner: 0.0175 — slightly lower than 0.02, less random during warmup since critic has longer to stabilize.
