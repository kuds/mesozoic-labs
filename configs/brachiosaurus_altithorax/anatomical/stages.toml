# brachiosaurus_altithorax/anatomical stage manifest (mesozoic.stage-manifest/v2;
# BEHAVIOR_RECIPES_PLAN §4.1/§4.8, 2026-09-05). It declares the three
# historical stages — same ids and legacy numbers, so every existing artifact
# and integer reference keeps its meaning — and makes their edges explicit so
# stand and walk publish as deliverables instead of only food_reach. Each stage
# file is named by its stage, with no number (decision D-D33).

schema = "mesozoic.stage-manifest/v2"

[[stages]]                       # quiet stance; gate reward-cleared by the statue (plan §4.8)
id = "stance"
config = "stance.toml"
legacy_number = 1
recipe = "stand"
deliverable = true

[[stages]]
id = "locomotion"
config = "locomotion.toml"
legacy_number = 2
warm_start_from = "stance"
recipe = "walk"
deliverable = true

[[stages]]                       # id stays "behavior"; the task name (food_reach) is the TOML's [stage] name
id = "behavior"
config = "food_reach.toml"
legacy_number = 3
warm_start_from = "locomotion"
recipe = "hunt"
deliverable = true
