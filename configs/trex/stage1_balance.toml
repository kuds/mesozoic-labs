[stage]
name = "balance"
description = "Learn to stand and balance without falling"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0              # Redundant with drift_penalty — drift covers all horizontal directions equally
drift_penalty_weight = 0.3                     # Penalize horizontal displacement from spawn; prevents hop-to-balance exploit
spin_penalty_weight = 0.1                      # Penalize pelvis angular velocity to directly discourage spinning
speed_penalty_weight = 0.3                     # Penalize absolute 2D speed above threshold — complements drift penalty with instantaneous signal
speed_penalty_threshold = 0.10                 # m/s — any speed above this incurs penalty
alive_bonus = 1.75                              # Now gated on height AND foot contact in mjx_env: no reward for nose-balancing
foot_contact_gate = 1.0                        # Gate alive bonus on foot contact (>0 enables gating). JAX-only: SB3 handles this via head-contact termination instead.
foot_contact_weight = 0.8                      # Per-step bonus for having at least one foot on the ground. JAX-only: SB3 does not use this signal.
energy_penalty_weight = 0.075                  # Setting 4 sweep: 0.075 forces efficient posture. Led to best downstream S2/S3 results (03-16, 03-17).
tail_stability_weight = 0.15
posture_weight = 1.5                           # Increased from 1.5: with lower alive_bonus, stronger tilt penalty drives upright stance
nosedive_weight = 1.5                          # Increased from 3.0: complement posture weight to prevent forward pitch exploit
nosedive_termination_threshold = 0.47          # Terminates at forward_z < -0.519 (~31° nose-down), unchanged from the
                                               # 0.35 that preceded the natural_pitch 0.17 -> 0.05 correction. natural_pitch
                                               # now describes the measured neutral pose, so the threshold absorbs the
                                               # 0.12 shift and the absolute termination envelope is identical.
smoothness_weight = 0.7                        # Raised from 0.1: the action-rate penalty was a rounding error.
                                               # Measured on run 20260725_194916, the term paid -0.0259/step against
                                               # an alive bonus of 1.75 -- 1.0% of return -- while RMS action change
                                               # per joint sat at 1.018, 2-3x beyond the 0.3-0.5 "severe" band in
                                               # docs/investigations/TREX_STAGE1_LEG_JITTER.md. That run confirmed the
                                               # doc's escalation condition: anchoring the entropy decay annealed
                                               # algo_std (1.012 -> 0.959, vs 1.012 -> 1.038 un-anchored) but left the
                                               # deterministic action rate unchanged. Sized from the penalty formula
                                               # -w*sum(da^2)/(n*4): 0.7 puts smoothness at ~10% of the alive bonus
                                               # (~6.8% of return) instead of 1.0%. Single-variable change.
heading_weight = 0.1                           # Small heading reward to prevent spin-to-balance exploits
gait_symmetry_weight = 0.0                     # Disable: default formula rewards single-foot stance, bad for balance
height_weight = 1.0                            # Increased from 1.0: stronger signal to maintain pelvis at target 0.90m
fall_penalty = -100.0                          # Restored to -100: stronger penalty needed to discourage lying-flat exploit
bite_bonus = 0.0
bite_approach_weight = 0.0                     # Must be explicit — species default was leaking into stage 1 via key mismatch bug
prey_distance_range = [10.0, 15.0]
max_episode_steps = 1000                       # Match stage 2/3 for consistent episode horizon across curriculum
reset_noise_scale = 0.10                       # Calibrated against the zero-action baseline
                                               # (environments/shared/scripts/zero_action_baseline.py): at 0.05 the
                                               # do-nothing policy already reaches the full horizon in 93% of episodes,
                                               # so the stage rewards a statue and training can only lose ground. 0.10
                                               # drops that floor to ~67%, leaving real headroom; 0.15 drops it to 23%,
                                               # which starts to look unlearnable.

[ppo]
learning_rate = 3e-5                    # Setting 4 sweep: 3.23e-5 — 10x lower. All successful S1→S3 runs used this. Old 3e-4 caused instability.
learning_rate_end = 1e-5
n_steps = 2048                          # Setting 4 sweep: smaller rollout buffer. Matches brachio Setting 4.
batch_size = 128
n_epochs = 10
gamma = 0.98                            # Setting 4 sweep: 0.9797. Previous 0.998 was too high for balance task — shorter horizon stabilizes value estimates.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.001                    # Decay entropy over the stage (EntCoefDecayCallback). Velociraptor
                                        # stages 1 & 2 both destabilized late under constant ent_coef
                                        # (bimodal falls, action std growth); decay fixed its stage 2 and is
                                        # enabled for its stage 1. See docs/investigations/STAGE2_RECOMMENDATIONS.md §5.
ent_coef_decay_timesteps = 3000000      # Anchor the decay to ~half the 6M budget so ent_coef hits its 0.001 floor
                                        # BEFORE the late std drift, instead of coasting high for the whole run. When
                                        # unset, decay_timesteps defaults to the full stage budget
                                        # (train_base._maybe_ent_coef_decay_callback), which is why run 20260723_204941
                                        # never annealed: algo_std rose 1.01 -> 1.04 and the legs jittered at ~1.0
                                        # RMS/joint for the entire run. Velociraptor stage 1 (annealed 1.01 -> 0.93,
                                        # lowest jitter of any stage) and T-Rex stage 3 both anchor at 3M; stage 1 was
                                        # the only balance stage missing it. See docs/investigations/TREX_STAGE1_LEG_JITTER.md.

target_kl = 0.03                        # Cap destabilising late PPO updates (early-stop epochs on high approx-KL); mirrors the JAX target_kl guard.

[ppo.policy_kwargs]
net_arch = [512, 256]

[sac]
learning_rate = 3e-4              # Match PPO starting LR — SAC tolerates higher LR due to replay buffer stability
batch_size = 256                  # Larger than PPO's 128 for T-Rex — SAC benefits from bigger batches with replay buffer
gamma = 0.99                     # Lower than PPO's 0.998 — off-policy replay staleness at high gamma causes value overestimation;
                                 # 0.99 is sufficient for balance (PPO needed 0.998 due to on-policy variance, not task structure)
tau = 0.005
ent_coef = "auto"                # Auto-tuned entropy — replaces PPO's manual ent_coef=0.005
buffer_size = 300_000            # Sufficient for 6M-step Stage 1; smaller buffer keeps transitions recent
learning_starts = 10_000         # Collect 10K random transitions before gradient updates begin
train_freq = 16                  # Collect 16 env steps before training — matches proven raptor SAC config
gradient_steps = 8               # 2:1 data-to-update ratio — matches raptor; reduces overfitting risk on small buffer

[sac.policy_kwargs]
net_arch = [512, 256]            # Match PPO architecture (obs is 61 since the arms/distal tail were welded)

[jax]
num_envs = 2048                         # Parallel MJX environments on GPU
rollout_len = 64                        # Steps per rollout before PPO update
num_updates = 500                       # Total PPO updates (balance converges fast)
ppo_epochs = 4                          # Gradient epochs per PPO update
minibatch_size = 512                    # Minibatch size for PPO gradient steps
learning_rate = 3e-5                    # Match SB3 PPO — 3e-4 caused gradient explosion and entropy divergence
learning_rate_end = 1e-5                # Linear decay to 1e-5 over training — prevents late-training instability
max_grad_norm = 5.0                     # Increased from 0.5: at init grad_norm≈356 was clipped 712x, starving value function convergence
gamma = 0.98                            # Match SB3 PPO — shorter horizon for balance task
gae_lambda = 0.95
clip_range = 0.2
vf_coef = 0.25                          # Reduced from 0.5: prevents value loss from dominating total loss during early training
vf_clip_range = 10.0                    # Clip value function updates to prevent catastrophic value loss spikes
ent_coef = 0.005                        # Match SB3 PPO — 0.01 caused entropy to increase and policy std to diverge
target_kl = 0.05                        # Early-stop PPO epochs when approx KL exceeds this — prevents policy collapse
fall_penalty = -10.0                    # Reduced from -50: large penalties cause value loss to dominate early training (v≈1174 at init → divergence)
reset_noise_scale = 0.10               # Match [env]: calibrated against the zero-action baseline
init_qpos_noise = 0.01                 # XY position jitter at reset (meters) — JAX-only MJXEnvConfig field
init_yaw_noise = 0.1                   # Yaw rotation perturbation at reset (radians) — JAX-only MJXEnvConfig field

[jax.policy_kwargs]
net_arch = [512, 256]                  # Match SB3 PPO architecture

[curriculum]
timesteps = 6000000
min_avg_reward = 1900.0                 # Raised from 100.0, which could not bind: the zero-action policy scores
                                        # 1800.56 +/- 1267.66 over 40 episodes on this plant and config
                                        # (environments/shared/scripts/zero_action_baseline.py trex), so a statue
                                        # cleared the old gate eighteen times over and advanced into stage 2. The
                                        # July 2026 runs that scored below the do-nothing floor all passed it.
                                        # 1900 sits just above the measured floor; run 20260725_194916 reached
                                        # 2696.83 +/- 40.6, so a healthy run keeps ~800 of headroom.
                                        # NOTE: this is a measured constant and will go stale if the plant or the
                                        # reward weights change -- re-run the baseline script and update it, or
                                        # better, wire that script in as an automatic pre-stage check.
                                        #
                                        # Two couplings this value carries, neither obvious from the name:
                                        #  * A stage that misses its gate STOPS the curriculum -- stages 2 and 3
                                        #    never run (train_base.py:1282-1292, "advancing with a weak policy
                                        #    causes catastrophic forgetting"). With the old 100 that branch was
                                        #    unreachable. A failed stage 1 now costs 3.7h instead of 13h, which is
                                        #    the intent, but it means a bad stage-1 experiment ends the run.
                                        #  * It also sets the collapse detector's arming threshold: peak_floor
                                        #    falls back to min_avg_reward when collapse_peak_floor is unset
                                        #    (curriculum.py:1014), and no config sets the latter. Detection now
                                        #    arms only once the rolling-median peak clears 1900 rather than 100 --
                                        #    safer against the long pre-convergence grind, but a run that plateaus
                                        #    below 1900 gets no collapse protection at all.
                                        # Note the floor itself pays no smoothness penalty (a constant action has
                                        # no action delta), so raising smoothness_weight lowers a real policy's
                                        # score against a gate calibrated on a statue. At the predicted ~2542 the
                                        # margin is ~640; re-check this gate if that weight rises much further.
min_avg_episode_length = 750
required_consecutive = 3
collapse_min_evals = 20                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps before it can fire.
collapse_patience = 10                  # Require 10 consecutive raw per-eval mean drops so transition turbulence won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count. Stage-1 balance learning has a long
                                        # low-reward grind then a noisy breakthrough (run 20260721_004731: dip to ~1.2M,
                                        # turbulent transition at 2.2-2.3M, converged ~2.65M); the old stage-1 defaults
                                        # killed run 20260720_203454 at 1.1M off a variance-inflated 50k peak.
