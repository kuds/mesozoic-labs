[stage]
name = "balance"
description = "Learn to stand and balance without falling"

[env]
forward_vel_weight = 0.0
alive_bonus = 1.0
energy_penalty_weight = 0.0005
tail_stability_weight = 0.1
bite_bonus = 0.0
bite_approach_weight = 0.0
prey_distance_range = [10.0, 15.0]
max_episode_steps = 500

[ppo]
learning_rate = 3e-4
n_steps = 2048
batch_size = 64
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01

[sac]
learning_rate = 3e-4
batch_size = 256
gamma = 0.99
tau = 0.005
ent_coef = "auto"

[curriculum]
timesteps = 4000000
min_avg_reward = 50.0
min_avg_episode_length = 400
required_consecutive = 3
