[stage]
name = "balance"
description = "Learn to stand and balance without falling"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0              # Redundant with drift_penalty — drift covers all horizontal directions equally
drift_penalty_weight = 0.3                     # Penalize horizontal displacement from spawn; prevents hop-to-balance exploit
spin_penalty_weight = 0.1                      # Penalize pelvis angular velocity to directly discourage spinning
speed_penalty_weight = 0.3                     # Penalize absolute 2D speed above threshold — complements drift penalty with instantaneous signal
speed_penalty_threshold = 0.10                 # m/s — any speed above this incurs penalty
alive_bonus = 1.0                              # Half of this bonus is conditioned on bilateral support below
foot_contact_gate = 0.0                        # Disable the legacy binary MJX gate; bounded bilateral support gives a smoother signal
foot_contact_weight = 0.0                      # Disable the legacy any-foot bonus, which permits a one-leg stance
bilateral_support_weight = 0.6                 # Reward the weaker-loaded foot, so both feet must carry weight
foot_contact_saturation_force = 350.0          # N per foot; quiet home support (~421 N/foot) already earns full credit
foot_load_balance_weight = 0.3                 # Penalize normalized left/right load imbalance
foot_load_balance_min_support_force = 42.0     # 5% of the animal's own weight (85.72 kg excluding the prey prop =
                                               # 840.9 N), which is the smallest load that is unambiguously bearing
                                               # rather than grazing. The previous 0.0 was a measured NO-OP: two
                                               # MuJoCo touch readings essentially never sum to exactly zero, so over
                                               # all 709 logged rollouts of run 20260731_132102 the airborne branch
                                               # never fired once (PLANT_VALIDATION §11.1). Well above the duty
                                               # metrics' 0.1 N/foot, so a foot the diagnostics call unsupported is
                                               # now unsupported in the reward too, instead of the two disagreeing.
foot_load_balance_airborne_penalty = 0.3       # Makes the ordering MONOTONE. Without it airborne and single support
                                               # both scored -0.300 -- a flat region with no gradient out of the air,
                                               # on the stage whose entire job is to stay on the ground. Now:
                                               # both feet even +0.600 > single support -0.300 > airborne -0.600.
                                               # Run 20260801_021545 ended at 28.4% unsupported duty against the
                                               # statue's 0.000, so the tie was not academic.
action_jerk_weight = 3.0                       # Frequency-aware smoothness: penalises the SECOND difference of
                                               # actions, which smoothness_weight cannot see. Motivation, measured on
                                               # run 20260731_132102 best -> final: action_delta FELL 12.0 -> 10.5 and
                                               # the smoothness penalty IMPROVED -0.286 -> -0.250 while toe-motion
                                               # power above 4 Hz DOUBLED (35% -> 71%). A small-amplitude
                                               # high-frequency limit cycle is nearly free under a first-difference
                                               # term and expensive under a second-difference one.
                                               #
                                               # CALIBRATED against the real policy, not inferred: run
                                               # 20260801_021545's stage-1 robust_best_model rolled out on this plant
                                               # at this noise (8 episodes, all full-horizon, VecNormalize stats
                                               # applied) measures action_delta 5.72, action_jerk 9.82 per step, and
                                               # 98.1% of action-space power above 4 Hz -- far buzzier than the
                                               # 35-71% the VIDEO analysis suggested, with a jerk/delta ratio of 1.72
                                               # implying an effective 22.7 Hz. Measuring mattered: an estimate from
                                               # the video figures put this weight at 12.0, which the rollout shows
                                               # would cost an UNTRAINED policy 1.49/step -- more than the entire
                                               # 1.00 alive_bonus, i.e. it would pay PPO to stop surviving.
                                               #
                                               # The cap is the UNTRAINED regime: a fresh PPO policy (log_std_init
                                               # = 0, so actions ~ clip(N(0,1))) measures jerk 65.4/step, which an
                                               # earlier iid-uniform estimate understated by 57% (41.8). Corrected,
                                               # the design target "roughly half the 1.00 alive_bonus at init, so
                                               # the term never pays PPO to stop surviving" lands at w ~ 2.6-3.0,
                                               # not the 4.0 that estimate produced -- 4.0 actually costs 0.78/step
                                               # at init, 78% of the alive bonus.
                                               #
                                               # At 3.0: init pays 0.58/step (clear margin under the alive bonus),
                                               # the measured buzz pays 88/episode (65% of the smoothness term that
                                               # demonstrably failed to suppress it), and a smooth 1.5 Hz
                                               # corrective policy pays ~0.001/episode -- a discrimination ratio of
                                               # ~8e4, so the term is nearly free for the behaviour we want and is
                                               # charged almost entirely to chatter.
support_conditioned_alive_fraction = 0.5       # Keep recovery headroom while making one-foot survival less profitable
leg_home_pose_weight = 0.5                     # Softly retain the authored p5 theropod leg stance
leg_home_pose_tolerance = 0.20                 # rad; broad enough for balancing corrections without joint locking
head_clearance_weight = 0.35                   # Prevent the learned head-droop posture
head_clearance_target = 0.90                   # m; settled home head tip is ~0.94 m
head_clearance_tolerance = 0.15                # Smooth transition from zero credit at 0.75 m
neck_posture_weight = 0.20                     # Softly retain the authored neck/head pose
neck_posture_tolerance = 0.35                  # rad; accommodates the passive settled offset from the XML keyframe
energy_penalty_weight = 0.075                  # Setting 4 sweep: 0.075 forces efficient posture. Led to best downstream S2/S3 results (03-16, 03-17).
tail_stability_weight = 0.15
posture_weight = 1.5                           # Increased from 1.5: with lower alive_bonus, stronger tilt penalty drives upright stance
nosedive_weight = 1.5                          # Increased from 3.0: complement posture weight to prevent forward pitch exploit
nosedive_termination_threshold = 0.493         # Terminates at forward_z < -0.520 (~31.3° nose-down), unchanged from the
                                               # 0.35 that preceded the natural_pitch 0.17 -> 0.05 correction. natural_pitch
                                               # describes the measured neutral pose, so the threshold absorbs every shift in
                                               # it and the absolute termination envelope stays put. The theropod stance
                                               # correction moved natural_pitch 0.05 -> 0.027 (the flexed limb settles 1.55°
                                               # nose-down where the columnar one settled 2.9°), so this re-derives as
                                               #   0.493 = sin(0.05) + 0.47 - sin(0.027)
                                               # and the plant still terminates at the same absolute -0.520.
smoothness_weight = 2.0                        # Second escalation: 0.1 -> 0.7 -> 2.0. The lever works but was
                                               # under-dosed. 0.1 was a rounding error (-0.0259/step, 1.0% of
                                               # return) and left RMS action change per joint flat at 1.018 for a
                                               # whole run, 2-3x beyond the 0.3-0.5 "severe" band in
                                               # docs/investigations/TREX_STAGE1_LEG_JITTER.md.
                                               #
                                               # 0.7 is the first setting that moved that number at all. Measured
                                               # with compare_run_diagnostics.py across the single-variable pair
                                               # 20260725_194916 (pre) -> 20260726_191730 (post):
                                               #   RMS action change / joint   1.018 -> 0.747  (-27%)
                                               #   policy std (algo_std)       0.959 -> 0.850
                                               #   tail_contact terminations   39.1% -> 11.5%
                                               # Still deep in thrash territory, and the legs visibly bounce in
                                               # trex_ppo_stage1_best.mp4 from the post run.
                                               #
                                               # Sized from the penalty formula -w*sum(da^2)/(n*4), which reduces
                                               # to w*r^2/4 per step at RMS rate r (it reproduces the doc's
                                               # -0.0255 exactly at w=0.1, r=1.010). At the observed r=0.747,
                                               # w=0.7 pays only 0.098/step (~98/episode, 3.9% of return) -- the
                                               # policy absorbed most of the 7x increase by lowering r. w=2.0 pays
                                               # 0.279/step (~279/episode, ~15% of return) before the policy
                                               # adapts down, which is a dose that should bind.
                                               #
                                               # Not free. The 0.7 run gave up reward and stability for the 27%:
                                               #   final eval reward       2699.8 -> 2516.9
                                               #   explained variance      0.748 -> 0.482
                                               #   fallen terminations     35.2% -> 49.1%
                                               # Watch explained_variance on the next run -- the value function was
                                               # already fitting worse at 0.7, and this term is what got bigger.
                                               # Single-variable change; see min_avg_reward for the gate margin.
heading_weight = 0.1                           # Small heading reward to prevent spin-to-balance exploits
gait_symmetry_weight = 0.0                     # Disable: default formula rewards single-foot stance, bad for balance
height_weight = 0.6                            # Bounded target-centred height shaping; no reward for standing taller than home
height_target_tolerance = 0.06                 # m Gaussian scale around the measured 0.926 m settled pelvis height
fall_penalty = -100.0                          # Restored to -100: stronger penalty needed to discourage lying-flat exploit
bite_bonus = 0.0
bite_approach_weight = 0.0                     # Must be explicit — species default was leaking into stage 1 via key mismatch bug
prey_distance_range = [10.0, 15.0]
max_episode_steps = 1000                       # Match stage 2/3 for consistent episode horizon across curriculum
reset_noise_scale = 0.05                       # Stage 1a operating point (PLANT_VALIDATION §7/§12): the noise sweep on
                                               # the repaired plant showed reset noise does not make STANDING harder
                                               # (statue standing reward 3288 -> 3167 across 0.01-0.20), it decides how
                                               # often you get to stand at all (full-horizon 100% at <=0.05, 65% at
                                               # 0.10, 22% at 0.20). At 0.10 survival and stance quality were
                                               # inseparable, which is why no scalar gate over both ever worked. At
                                               # 0.05 a statue survives 100%, so survival stops being the binding
                                               # constraint and stance-quality gates measure stance quality. The old
                                               # 0.10 rationale ("leave headroom below the statue") optimised for a
                                               # reward gate, which §9 retired: the statue is the reward optimum at
                                               # every noise level. Robustness is stage 1b's job, via perturbations,
                                               # not lucky-draw reset noise (§13).

[ppo]
learning_rate = 3e-5                    # Setting 4 sweep: 3.23e-5 — 10x lower. All successful S1→S3 runs used this. Old 3e-4 caused instability.
learning_rate_end = 1e-5
n_steps = 2048                          # Setting 4 sweep: smaller rollout buffer. Matches brachio Setting 4.
batch_size = 128
n_epochs = 10
gamma = 0.98                            # Setting 4 sweep: 0.9797. Previous 0.998 was too high for balance task — shorter horizon stabilizes value estimates.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.0                      # Decay entropy to ZERO, not to a 0.001 floor. The floor is what kept run
                                        # 20260804_143747 from ever standing still: ent_coef hit 0.001 at 3M and held
                                        # there for the remaining 7M, and across 21 action dims that bonus holds the
                                        # policy std at equilibrium ~0.375 indefinitely (`algo_std` 0.47 at 5.9M,
                                        # 0.375 at 8.4M, still falling ~0.01/M -- it was never going to converge).
                                        #
                                        # In joint terms that std is enormous. Through `_scale_action`'s residual
                                        # mapping and this model's ctrlranges, std 0.375 is a 1-sigma command noise of
                                        # 24.4 deg at the hips and 18.8 deg at knee and ankle -- mean 20.6 deg across
                                        # the major leg joints, resampled every control step at 100 Hz. A policy
                                        # cannot learn to hold a pose it is being told to shake by 20 deg. PPO
                                        # optimises expected return UNDER that noise, so the mean action it converges
                                        # to is not the deterministic optimum but whatever survives its own tremor --
                                        # in that run, a 16.7 Hz limit cycle with unsupported duty 0.1668 (issue #486).
                                        #
                                        # The target is known reachable and known still: `action = 0` IS the home
                                        # keyframe under home-keyframe-residual/v1, and scores 3274.4 +/- 7.6 with
                                        # duty 0.0000 (measured, stance_gate_report.py trex --stage 1 --zero-action).
                                        # The trained policy scored 2686.9 -- 588 BELOW the do-nothing policy. This is
                                        # a convergence failure, not a reward-shaping one, so the usual risk of
                                        # zeroing entropy (premature convergence to a bad optimum) is unusually low:
                                        # the good optimum is trivially reachable and the run's actual failure was
                                        # never converging at all.
                                        #
                                        # 0.0 rather than a smaller floor because any floor sets a non-zero std
                                        # equilibrium; std 0.05 (2.75 deg/joint, a plausible standing policy) needs
                                        # the bonus to go away, not to get smaller.
ent_coef_decay_timesteps = 7000000      # 70% of the 10M budget, not 30%. The old 3M anchor was chosen for a 6M
                                        # stage (~half of it) and was never revisited when stage 1 went to 10M, so
                                        # decay finished in the first third and the floor governed the rest. Keeping
                                        # the decay live through 7M means entropy is still falling while the policy
                                        # consolidates, instead of being pinned during the whole second half.
                                        #
                                        # Early exploration is deliberately unchanged: ent_coef still starts at 0.005
                                        # and the first 3M now decays MORE slowly than before, so nothing about the
                                        # early-training regime this stage depends on is tightened.
                                        #
                                        # Falsifiable prediction for the next run, to be checked at ~4M rather than
                                        # at the end: `algo_std` should be well under 0.2 (it was 0.55 at 4.6M and
                                        # 0.47 at 5.9M last run), and `unsupported_duty` should be below the 0.28 it
                                        # showed at 4.34M. If either tracks the old curve, this hypothesis is wrong
                                        # and the next suspect is the learning rate (3e-5 -> 1e-5 is very low).

target_kl = 0.03                        # Cap destabilising late PPO updates (early-stop epochs on high approx-KL); mirrors the JAX target_kl guard.

[ppo.policy_kwargs]
net_arch = [512, 256]

[sac]
learning_rate = 3e-4              # Match PPO starting LR — SAC tolerates higher LR due to replay buffer stability
batch_size = 256                  # Larger than PPO's 128 for T-Rex — SAC benefits from bigger batches with replay buffer
gamma = 0.99                     # Lower than PPO's 0.998 — off-policy replay staleness at high gamma causes value overestimation;
                                 # 0.99 is sufficient for balance (PPO needed 0.998 due to on-policy variance, not task structure)
tau = 0.005
ent_coef = "auto"                # Auto-tuned entropy — replaces PPO's manual ent_coef=0.005
buffer_size = 300_000            # Sufficient for 6M-step Stage 1; smaller buffer keeps transitions recent
learning_starts = 10_000         # Collect 10K random transitions before gradient updates begin
train_freq = 16                  # Collect 16 env steps before training — matches proven raptor SAC config
gradient_steps = 8               # 2:1 data-to-update ratio — matches raptor; reduces overfitting risk on small buffer

[sac.policy_kwargs]
net_arch = [512, 256]            # Match PPO architecture (obs is 61 since the arms/distal tail were welded)

[jax]
num_envs = 2048                         # Parallel MJX environments on GPU
rollout_len = 64                        # Steps per rollout before PPO update
num_updates = 500                       # Total PPO updates (balance converges fast)
ppo_epochs = 4                          # Gradient epochs per PPO update
minibatch_size = 512                    # Minibatch size for PPO gradient steps
learning_rate = 3e-5                    # Match SB3 PPO — 3e-4 caused gradient explosion and entropy divergence
learning_rate_end = 1e-5                # Linear decay to 1e-5 over training — prevents late-training instability
max_grad_norm = 5.0                     # Increased from 0.5: at init grad_norm≈356 was clipped 712x, starving value function convergence
gamma = 0.98                            # Match SB3 PPO — shorter horizon for balance task
gae_lambda = 0.95
clip_range = 0.2
vf_coef = 0.25                          # Reduced from 0.5: prevents value loss from dominating total loss during early training
vf_clip_range = 10.0                    # Clip value function updates to prevent catastrophic value loss spikes
ent_coef = 0.005                        # Match SB3 PPO — 0.01 caused entropy to increase and policy std to diverge
target_kl = 0.05                        # Early-stop PPO epochs when approx KL exceeds this — prevents policy collapse
fall_penalty = -10.0                    # Reduced from -50: large penalties cause value loss to dominate early training (v≈1174 at init → divergence)
reset_noise_scale = 0.05               # Match [env]: stage 1a operating point (PLANT_VALIDATION §7/§12)
init_qpos_noise = 0.01                 # XY position jitter at reset (meters) — JAX-only MJXEnvConfig field
init_yaw_noise = 0.1                   # Yaw rotation perturbation at reset (radians) — JAX-only MJXEnvConfig field

[jax.policy_kwargs]
net_arch = [512, 256]                  # Match SB3 PPO architecture

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "stance_quality/v1"         # environments/shared/curriculum/gate_schema.py
timesteps = 10000000

# ---------------------------------------------------------------------------
# The 1a gate: physical stance quality, not return.
#
# Adopted 2026-08-01, replacing reward_and_length/v1. That gate was passable by
# doing nothing: the statue scores 3271.8 (clearing min_avg_reward = 1950) at
# 1000.0 steps (clearing min_avg_episode_length = 950), which this run's own
# zero_action_baseline.json reported as "FAILS — a statue clears this gate".
# Worse, it also passed the policy we actually needed to reject — run
# 20260801_021545's best checkpoint, re-rolled on this plant and reward over 40
# episodes (seeds 3042-3081), reaches the horizon 40/40 and scores 2133.4 while
# spending 0.319 of its post-settling steps with neither foot loaded. Two
# earlier figures for it are superseded: 0.284 duty came from an 8-episode
# sample, and 2347.67 was its evaluation mean under the pre-§14 reward.
#
# The gate is NOT trying to beat the statue. STAGE1_SPLIT_PLAN §2.3.1 is
# explicit that the statue's numbers are what a 1a policy must MATCH, not
# beat: it defines the quality ceiling, and 1a's job is to certify a policy
# has not bought stability with actuation. Robustness belongs to 1b, via
# declared xfrc_applied perturbations rather than reset noise, where a lucky
# draw and a good controller are indistinguishable.
#
# Duty is derive_stance_info's unsupported_duty at its default 0.1 N contact
# threshold — deliberately NOT the reward's 42 N min_support_force. Every
# calibration point below is measured at 0.1 N.
# ---------------------------------------------------------------------------
min_full_horizon_fraction = 0.95         # Statue: 99.17% pooled over three independent 40-seed blocks (119/120).
                                         # A floor to MATCH, not beat. Replaces min_avg_episode_length = 950, which
                                         # encoded the same §12 requirement through the only field the old gate had.
max_unsupported_duty = 0.02              # Screening ceiling. Statue 0.000; the chatterer we must reject 0.319, i.e.
                                         # 16x over. Set well above 0.000 so ordinary weight-shifting is not
                                         # penalised — note the repaired plant moved raw contact-switch count UP
                                         # (0.86 -> 1.00 /s) while duty went to zero, because the extra switches are
                                         # weight shifts. Gate on duty; switch rate stays diagnostic until it is
                                         # decomposed into bilateral<->single vs bilateral<->airborne.
max_unsupported_duty_ucb = 0.02          # The CERTIFYING criterion: one-sided 95% UPPER bound on mean duty.
                                         # Binarising instead costs nearly all the power at this panel size — a
                                         # binomial LCB95 >= 0.90 at n=40 needs a clean 40/40 and would reject the
                                         # statue 28% of the time (true rate 0.9917 -> P(40/40) = 71.6%). Duty is
                                         # continuous with tiny variance, so an interval on it has real power at 40
                                         # where the pass/fail count has almost none. UCB >= mean by construction,
                                         # so this subsumes the screening ceiling while both sit at 0.02; both are
                                         # kept configurable in case a tighter screen than bound is ever wanted.
settle_steps = 200                       # [inferred], NOT measured. Duty is scored only after this prefix, because
                                         # a policy that corrects reset randomisation may legitimately move a foot
                                         # doing it — and settling is the capability 1a exists to certify. 20% of
                                         # the horizon. Calibrate against rollout data before treating as evidence.
min_eval_episodes = 40                   # The panel size every figure above is specified at. n_eval_episodes must
                                         # match: at n=30 the bound's power and the 28%-rejection analysis no longer
                                         # describe this gate.
min_avg_reward = 1950.0                 # Collapse RAIL, not the gate (PLANT_VALIDATION §9/§12): no reward threshold
                                        # can separate a competent policy from a statue, because the statue is the
                                        # reward optimum (3271.8 = 97.7% of the 3.35/step ceiling with zero actuation
                                        # cost; the 97.0% quoted elsewhere is the pre-repair 3250.27 measurement).
                                        # Sized to the one job a rail CAN do — rejecting a policy that discarded
                                        # most of the available return — at 0.60 x the statue's standing reward at
                                        # the 0.05 operating point (3271.8 +/- 12.0, 40 episodes).
                                        #
                                        # Why 0.60 and not §12's 0.89: the measured collapse (run 20260731_132102,
                                        # full-horizon 93% -> 7%) bottomed at 888 = 0.27 x statue, so 0.60 clears
                                        # it by better than 2x. Meanwhile 0.89 = 2900 sat within ~2.4% of a
                                        # competent policy's estimated ceiling (statue minus the ~0.30/step
                                        # smoothness cost = ~2970, before energy and the posture terms a moving
                                        # policy inevitably gives up) — close enough to reject the very policy it
                                        # was meant to admit. §12 chose 0.89 to sit just under a good policy, which
                                        # is competence-bar reasoning, and §9 is the argument that a competence bar
                                        # cannot work here.
                                        #
                                        # The real 1a gate is now the stance criteria above; this stays purely as a
                                        # rail. The old 1840 was cleared by the statue itself and certified nothing.
                                        #
                                        # Superseded, kept for the record:
                                        # min_avg_episode_length = 950 — encoded §12's full-horizon >= 95% through
                                        # the only field reward_and_length/v1 had. min_full_horizon_fraction states
                                        # the same requirement directly, so the schema now rejects this key for this
                                        # gate kind rather than letting both express it.
required_consecutive = 3                # Scheduler hysteresis ONLY. Re-running a deterministic panel is not
                                        # statistical replication (§3.4 caution 3) — the certified claim comes from
                                        # the bound above, not from repeating the same evaluation three times.
max_checkpoints = 5                     # Periodic checkpoints kept (CheckpointRetentionCallback). At save_freq = 500k this stage
                                        # wrote 12 and kept all of them: 48 MB of the 60 MB models/ on run 20260801_021545, on a
                                        # Drive mount, for files nothing in this repository reads — they exist for manual rollback,
                                        # which needs recent history, not all of it. 5 matches the JAX backend's max_checkpoints so a
                                        # stage keeps the same rollback depth whichever backend produced it. best_model,
                                        # robust_best_model and stage1_final are never periodic checkpoints and are never pruned.
                                        # Set 0 to keep every one.
collapse_min_evals = 20                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps before it can fire.
collapse_patience = 10                  # Require 10 consecutive raw per-eval mean drops so transition turbulence won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count. Stage-1 balance learning has a long
                                        # low-reward grind then a noisy breakthrough (run 20260721_004731: dip to ~1.2M,
                                        # turbulent transition at 2.2-2.3M, converged ~2.65M); the old stage-1 defaults
                                        # killed run 20260720_203454 at 1.1M off a variance-inflated 50k peak.
collapse_peak_warmup_timesteps = 1000000 # Evaluations before this step cannot SET the peak. Not a tightening of
                                         # the detector (see collapse_settings_from_config on why tightening
                                         # aborts healthy runs) -- a separate axis, and the only one that works on
                                         # this stage. With home-keyframe-residual/v1 and log_std_init = 0,
                                         # action = 0 commands the nominal stance, so the UNTRAINED policy already
                                         # scores near the reward optimum: run 20260803_012355 peaked at 2469.4 on
                                         # its SECOND evaluation (100k steps), 75% of the 3271.8 baseline. The
                                         # floor below (1472.3) therefore armed on initialisation, and the
                                         # ordinary exploration dip that follows read as a collapse: it stopped at
                                         # 1.45M of a 10M budget and stages 2-3 spent 9 1/4 hours on the
                                         # near-statue checkpoint. No floor separates those two -- above
                                         # initialisation (>0.75x) is above what a learning policy passes through,
                                         # which is exactly how the two absolute floors below failed.
                                         #
                                         # 1.0M is MEASURED by simulating this detector over 20260803_012355's own
                                         # 29-evaluation series (STAGE1_SPLIT_PLAN §12.4). The initialisation
                                         # advantage is brief and sharp: full-horizon runs 50.0% -> 70.0% -> 37.5%
                                         # -> 7.5% -> 0.0% across evaluations 1-5, so it is gone by 200k. 1.0M is
                                         # 10x that, and sits past the trough bottom at 700k. Replaying the series:
                                         # warm-up 0 stops at exactly 1,450,000 (the real stopping point);
                                         # >= 150k never arms.
                                         #
                                         # NOT set higher, though 2.5M was the first guess from breakthrough
                                         # timings: the warm-up's only job is excluding the initialisation spike,
                                         # because the FLOOR already blocks arming during the trough -- the best
                                         # post-150k rolling median in that run is 580.5, well under 1472.3. A
                                         # larger warm-up buys nothing and costs coverage: 1.0M leaves 88% of a 10M
                                         # budget protected, 2.5M only 72%.
collapse_peak_floor_reference = 3271.8   # The zero-action statue's standing reward at noise 0.05, 40 episodes.
collapse_peak_floor_fraction = 0.45      # RELATIVE floor (PLANT_VALIDATION §14 item 3). An absolute floor has now
                                         # failed to arm TWICE for the same reason: 2200 against run 20260731_132102
                                         # (peak 1934.1, watched a -59% collapse), then 2450 against run
                                         # 20260801_021545 (best eval 2347.67 -- still under it, watched
                                         # 2347.67 -> 1666.33). Deriving from the statue was only half the fix: the
                                         # statue bounds what is ACHIEVABLE, not what a learning policy passes
                                         # through. 0.45 x 3271.8 = 1472, which the 2026-08-01 run cleared by ~2M
                                         # steps, so the detector would have been armed for the degradation it
                                         # missed -- while still sitting well above the 888 (0.27x) collapse floor,
                                         # so the pre-convergence grind cannot trip it. Re-derive the reference,
                                         # not this fraction, whenever the reward changes.
                                         #
                                         # Superseded absolute value, kept for the record:
                                         # collapse_peak_floor = 2450.0  # 0.75 x the statue's standing reward at noise 0.05 (3271.8): above the
                                         # pre-convergence grind, below a plausible active-policy peak (~2970 =
                                         # statue minus the ~300 smoothness cost). The old absolute 2200 was
                                         # calibrated against a run whose reward scale then shifted, and sat above
                                         # the 7/31 run's peak forever — the detector never armed through a -59%
                                         # collapse (PLANT_VALIDATION §11.4). Still an absolute number: making it
                                         # RELATIVE to the zero-action baseline needs code (§14 item 3) and waits
