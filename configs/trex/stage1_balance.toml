[stage]
name = "balance"
description = "Learn to stand and balance without falling"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0              # Redundant with drift_penalty — drift covers all horizontal directions equally
drift_penalty_weight = 0.3                     # Penalize horizontal displacement from spawn; prevents hop-to-balance exploit
spin_penalty_weight = 0.1                      # Penalize pelvis angular velocity to directly discourage spinning
speed_penalty_weight = 0.3                     # Penalize absolute 2D speed above threshold — complements drift penalty with instantaneous signal
speed_penalty_threshold = 0.10                 # m/s — any speed above this incurs penalty
alive_bonus = 1.75                                # Setting 4 sweep: all successful S1→S2→S3 runs used 1.75. Previous 2.0 over-rewarded standing.
energy_penalty_weight = 0.075                      # Setting 4 sweep: 0.075 forces efficient posture. Led to best downstream S2/S3 results (03-16, 03-17).
tail_stability_weight = 0.15
posture_weight = 1.5                              # Setting 4 sweep: 1.5 across all species. 2.0 was T-Rex specific but the cross-species config performed better.
nosedive_weight = 3.0
smoothness_weight = 0.1
heading_weight = 0.1                  # Small heading reward to prevent spin-to-balance exploits
gait_symmetry_weight = 0.0     # Disable: default formula rewards single-foot stance, bad for balance
height_weight = 1.0            # Reward maintaining pelvis height near target (0.90m)
fall_penalty = -50.0           # Reduce from -100 to lower gradient variance
bite_bonus = 0.0
bite_approach_weight = 0.0
prey_distance_range = [10.0, 15.0]
max_episode_steps = 1000                  # Match stage 2/3 for consistent episode horizon across curriculum
reset_noise_scale = 0.05                  # Increased from 0.01 default to improve robustness (matches raptor)

[ppo]
learning_rate = 3e-5                    # Setting 4 sweep: 3.23e-5 — 10x lower. All successful S1→S3 runs used this. Old 3e-4 caused instability.
learning_rate_end = 1e-5
n_steps = 2048                          # Setting 4 sweep: smaller rollout buffer. Matches brachio Setting 4.
batch_size = 128
n_epochs = 10
gamma = 0.98                            # Setting 4 sweep: 0.9797. Previous 0.998 was too high for balance task — shorter horizon stabilizes value estimates.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005

[ppo.policy_kwargs]
net_arch = [512, 256]

[sac]
learning_rate = 3e-4              # Match PPO starting LR — SAC tolerates higher LR due to replay buffer stability
batch_size = 256                  # Larger than PPO's 128 for T-Rex — SAC benefits from bigger batches with replay buffer
gamma = 0.99                     # Lower than PPO's 0.998 — off-policy replay staleness at high gamma causes value overestimation;
                                 # 0.99 is sufficient for balance (PPO needed 0.998 due to on-policy variance, not task structure)
tau = 0.005
ent_coef = "auto"                # Auto-tuned entropy — replaces PPO's manual ent_coef=0.005
buffer_size = 300_000            # Sufficient for 6M-step Stage 1; smaller buffer keeps transitions recent
learning_starts = 10_000         # Collect 10K random transitions before gradient updates begin
train_freq = 16                  # Collect 16 env steps before training — matches proven raptor SAC config
gradient_steps = 8               # 2:1 data-to-update ratio — matches raptor; reduces overfitting risk on small buffer

[sac.policy_kwargs]
net_arch = [512, 256]            # Match PPO architecture; T-Rex's 83 obs dims handled by input layer, not hidden width

[jax]
num_envs = 2048                         # Parallel MJX environments on GPU
rollout_len = 64                        # Steps per rollout before PPO update
num_updates = 500                       # Total PPO updates (balance converges fast)
ppo_epochs = 4                          # Gradient epochs per PPO update
minibatch_size = 512                    # Minibatch size for PPO gradient steps
learning_rate = 3e-4                    # Higher than SB3 PPO — MJX's massive batch size stabilizes gradients
max_grad_norm = 0.5                     # Gradient clipping threshold
gamma = 0.98                            # Match SB3 PPO — shorter horizon for balance task
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.01                         # Slightly higher than SB3 PPO (0.005) — exploration helps with 2048 parallel envs
fall_penalty = -10.0                    # Less punitive than SB3 (-50) — high env count means more recovery samples
reset_noise_scale = 0.05               # Joint angle perturbation range (radians) at reset
init_qpos_noise = 0.01                 # XY position jitter at reset (meters)
init_yaw_noise = 0.1                   # Yaw rotation perturbation at reset (radians)

[jax.policy_kwargs]
net_arch = [512, 256]                  # Match SB3 PPO architecture

[curriculum]
timesteps = 6000000
min_avg_reward = 100.0
min_avg_episode_length = 750
required_consecutive = 3
