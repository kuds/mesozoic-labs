[pilot]
name = "T-Rex T1: randomized shallow solid depressions"
timesteps = 2000000

[commands]
cruise_speed = 1.05
turn_increment_max = 0.0
yaw_rate_max = 0.3
switch_interval_s = 6.0

[terrain]
enabled = true
mode = "gentle"
template = "depressions"
extent = 35.0 # Half-extent: a 70 m square with room for a 25-second cruise
nrow = 351
ncol = 351
apron_radius = 3.0
max_slope_degrees = 3.0
feature_height = 0.02 # Requested component height in metres; the grade cap can reduce it
feature_radius_min = 0.7
feature_radius_max = 1.2
feature_density = 0.25 # Planned centers per square metre; edges and the apron are excluded
episode_variation = 0.15
# These templates have a level base. The sloped template's Fourier roughness
# and wavelength settings do not apply. Depressions retain a solid surface.

[env]
max_episode_steps = 2500
flat_probability = 0.25

[ppo]
learning_rate = 0.00005
ent_coef = 0.005
target_kl = 0.03
