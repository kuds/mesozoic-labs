# T-Rex recovery stage (stage 1b): hold the certified stance against
# scheduled external pushes. STAGE1_SPLIT_PLAN §3; plan doc W-streams;
# decisions of 2026-08-15 (semantic manifest, SB3 first, full resolver
# before the first training run).
#
# DERIVATION BY REFERENCE: the [env] block below is stance.toml's
# [env] verbatim — every value's derivation record lives THERE — plus
# exactly one delta: the five perturbation_* keys, at the adopted §3.3
# values. On the r7 plant the multiple derives to 165.5 N over 0.20 s
# (capture-point argument; pinned in test_perturbation.py). The same
# reward, observations, and terminations are deliberate: the push changes
# the task, not the interface, and the recovery gate (W4) measures
# per-shove recovery rather than reward. test_stage_manifest.py pins the
# [env] mirror so stage-1 shaping changes cannot silently strand this
# file.
#
# RUNNABLE AS A GATED STAGE since 2026-08-28 (plan P5): gate_kind below is
# recovery_quality/v1 at measured thresholds, replacing the none/v1
# placeholder. W4, W5, the §8.1 transfer pilot (first-runs record §3.3: the
# certified stance policy survives the real 165.5 N schedule unramped), the
# P3 calibration (§4) and the off-distribution/checkpoint panels (§9) are
# all done.
#
# Advancement is NOT implied by this file. The verdict comes only from the
# stage directory's frozen gate_resolution.json — written by
# environments/shared/harnesses/freeze_recovery_gate.py, enforced by
# environments/shared/curriculum/gate_resolver.py — and its absence,
# staleness, or tampering REFUSES, fail-closed. The thresholds below must
# AGREE with that record; they never substitute for it.
#
# Measured capability envelope (first-runs record §9), the honest statement
# of what a PASS here means:
#   - Certified at the declared 165.5 N. On the training schedule per-shove
#     recovery is 83.7% (3M) / 83.0% (5M) against the statue's 36.0%, and
#     every null — statue and brace alike — scores 0/40 episodes.
#   - The policy's ceiling lies between 165.5 N and 210 N (§9.2): at 210 N
#     the paired margin over the statue collapses to LCB95 −0.009 (3M) /
#     +0.019 (5M). Magnitude, not the push clock, is the limit.
#   - Rejection GENERALIZES across push timing (§9.1): per-shove recovery is
#     HIGHER at the never-trained 3.5 ± 1.5 s cadence (86.9% / 89.5%) than
#     at the trained 2.0 ± 0.5 s one. The stage measures disturbance
#     rejection, not schedule familiarity, so the per-episode randomization
#     of the push clock held in reserve by §6.1 is not required.

[stage]
name = "recovery"
description = "Hold the stance against scheduled external pushes and recover from each"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0
drift_penalty_weight = 0.3
spin_penalty_weight = 0.1
speed_penalty_weight = 0.3
speed_penalty_threshold = 0.1
alive_bonus = 1.0
foot_contact_gate = 0.0
foot_contact_weight = 0.0
bilateral_support_weight = 0.6
foot_contact_saturation_force = 350.0
foot_load_balance_weight = 0.3
foot_load_balance_min_support_force = 42.0
foot_load_balance_airborne_penalty = 0.3
action_jerk_weight = 3.0
support_conditioned_alive_fraction = 0.5
leg_home_pose_weight = 0.5
leg_home_pose_tolerance = 0.1
leg_home_pose_broad_fraction = 0.25
leg_home_pose_broad_scale = 6.0
tail_home_pose_weight = 0.25
tail_home_pose_tolerance = 0.05
action_saturation_weight = 0.5
action_saturation_threshold = 0.9
head_clearance_weight = 0.35
head_clearance_target = 0.9
head_clearance_tolerance = 0.15
neck_posture_weight = 0.2
neck_posture_tolerance = 0.35
energy_penalty_weight = 0.075
tail_stability_weight = 0.15
posture_weight = 1.5
nosedive_weight = 1.5
nosedive_termination_threshold = 0.493
smoothness_weight = 2.0
heading_weight = 0.1
gait_symmetry_weight = 0.0
height_weight = 0.6
height_target_tolerance = 0.06
fall_penalty = -100.0
bite_bonus = 0.0
bite_approach_weight = 0.0
prey_distance_range = [10.0, 15.0]
max_episode_steps = 1000
reset_noise_scale = 0.05

# The one delta vs stance: the declared disturbance (adopted §3.3 values).
perturbation_capture_velocity_multiple = 1.5
perturbation_interval = 2.0
perturbation_jitter = 0.5
perturbation_duration = 0.2
perturbation_direction = "uniform_horizontal"

# Stance.toml's [ppo] as the warm-start default, with exactly one delta:
# ent_coef_decay_timesteps is anchored to THIS stage's 3M budget (record
# below) after both field pilots (3M run 20260819_154702, 5M run
# 20260821_142144) measured the mirrored stance horizon never completing
# (first-runs record §6.3; 2026-08 review §3.4). The LR schedule is still
# stance's, unvalidated on a warm start — the P4 gated rerun re-derives
# it. test_stage_manifest.py pins the mirror-except-this-delta shape.
[ppo]
learning_rate = 3e-05
learning_rate_end = 1e-05
n_steps = 2048
batch_size = 128
n_epochs = 10
gamma = 0.98
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.0
ent_coef_decay_timesteps = 2000000      # 2/3 of the 3M budget — the same ~64% anchor stance uses (7M of
                                        # 11M) — so the decay to ent_coef_end = 0.0 COMPLETES before stage
                                        # end. The previous 7000000 was stance's 11M-budget value mirrored
                                        # verbatim: the 5M pilot (20260821_142144) never finished it, so the
                                        # entire run trained at ent_coef >= 0.0014, above the 0.001 floor
                                        # stance's ent_coef_end record calls stand-still-unlearnable — on
                                        # the stage whose success event is quiet stance between pushes
                                        # (2026-08 review §3.4). Still pilot-dependent: the P4 gated rerun
                                        # re-derives it. test_schedule_budget_coherence.py pins
                                        # decay <= budget for every committed stage.
target_kl = 0.03

[ppo.policy_kwargs]
net_arch = [512, 256]

[curriculum]
gate_schema_version = 1
gate_kind = "recovery_quality/v1"       # environments/shared/curriculum/gate_schema.py. Frozen 2026-08-28
                                        # (plan P5) with MEASURED thresholds, replacing the none/v1
                                        # placeholder this file launched with: the gate statistic shipped
                                        # 2026-08-16 (curriculum/recovery_gate.py), the P3 calibration
                                        # measured the safe set it judges against (first-runs record §4),
                                        # and the resolver's frozen null panels (W5) supply the paired
                                        # criterion. Declaring it earlier, with guessed thresholds, would
                                        # have been the we-could-not-check-reads-as-pass trap the schema
                                        # forbids.
timesteps = 3_000_000                   # Measured, no longer provisional: both field pilots — the 3M run
                                        # 20260819_154702 and the 5M run 20260821_142144 — peaked at ~1.6M
                                        # (5M run: best eval 3055.63 ± 208.86) and declined ~5% to stage
                                        # end, so the 3M -> 5M bump (commit 0836043) did not pay and is
                                        # REVERSED on that evidence (first-runs record §2.3/§6.3). The
                                        # binding constraint is the warm-started entropy/LR schedule, not
                                        # steps. Warm-started from the certified stance checkpoint via
                                        # initialize_next_stage, not trained from scratch.

# ---------------------------------------------------------------------------
# The 1b gate: per-shove recovery. FROZEN 2026-08-28 (plan P5), on the
# measurements in docs/investigations/TREX_RECOVERY_STAGE_FIRST_RUNS_2026_08.md
# §4 (P3 calibration) and §9 (off-distribution and checkpoint panels).
#
# What it certifies (environments/shared/curriculum/recovery_gate.py): an
# episode succeeds when it reaches the full horizon AND every scheduled push
# in it was recovered — the body re-enters the calibrated safe set within
# recovery_t_recover_steps of pulse end and DWELLS there recovery_dwell_steps,
# because a body that touches the safe set mid-fall and leaves again has not
# recovered. The gate is an exact one-sided 95% Clopper-Pearson lower bound on
# that episode-success probability, plus the paired same-seed same-schedule
# superiority test against the frozen statue null. Pairing is structural: the
# schedule derives from the reset seed through a PRF, so the null saw exactly
# the same shoves and the difference isolates control.
#
# The SAFE SET is deliberately not declared here. It lives with the judge
# (environments/shared/recovery_evaluation.py: CALIBRATED_POSTURE_ONLY and
# CALIBRATED_HEIGHT_REFERENCE_M) and is frozen into gate_resolution.json —
# height error ≤ 0.0168 m against the FIXED measured settled reference
# 0.9267 m (not the per-episode reset stamp), tilt ≤ 0.0825 rad, planar speed
# ≤ 0.3203 m/s, and NO per-step support term. §4.2 is why there is no support
# term: quiet CERTIFIED stance itself transiently reads 0.0 N on a foot (p0.1
# of min foot force is exactly 0.0), so the per-step criterion fails the very
# thing it certifies — it denied 22 of the trained policy's shoves and masked
# 13 of its 21 real recoveries, against 0 denials from height or tilt. Any
# future support term must be windowed and re-derived from certified stance
# before it can gate.
#
# Every value below must AGREE with the stage's frozen gate_resolution.json:
# reporting/gates.py::_recovery_spec_disagreements refuses on any mismatch, so
# editing this block without re-freezing does not move the gate, it BLOCKS it.
# Re-freeze with environments/shared/harnesses/freeze_recovery_gate.py, whose
# module constants carry the same derivation records as the values here.
# ---------------------------------------------------------------------------
min_recovery_success_lcb = 0.30         # PROJECT-OWNER DECISION, 2026-08-28, on the §9.1/§9.5 measurements.
                                        # The certifying criterion: LCB95 of P(full horizon AND every shove
                                        # recovered). ATTAINABLE, not aspirational — the measured LCB at the
                                        # training schedule is 0.361 for the 3M checkpoint (20/40) and 0.338
                                        # for the 5M (19/40), against a statue null whose one-sided UCB95 is
                                        # 0.072. 0.30 sits below both policies and >4x clear of the null
                                        # ceiling, so it certifies what the stage can actually do today. The
                                        # plan's aspirational 0.725 (the LCB of 34/40) needs a materially
                                        # stronger policy; freezing it now would declare a criterion nothing
                                        # in the project can pass, and the honest envelope — a capability
                                        # ceiling between 165.5 N and 210 N (§9.2) — is recorded in the
                                        # header rather than hidden inside a number.
recovery_t_recover_steps = 100          # 2.0 s at the 50 Hz control rate. VALIDATED by measurement, not
                                        # merely retained from the provisional design: measured re-entry
                                        # times have p90 = 84 steps (§4.1), comfortably inside this window,
                                        # so the clock is not what fails a shove.
recovery_dwell_steps = 50               # 1.0 s of continuous safe-set occupancy after re-entry — what makes
                                        # re-entry mean recovery rather than a touch-and-go
                                        # (recovery_gate.per_push_recovery). The window every §4.3 and §9
                                        # panel was judged under; changing it invalidates all of them.
min_paired_success_delta_lcb = 0.20     # PROJECT-OWNER DECISION, 2026-08-28, on the §9.1 measurements. The
                                        # AUTHORITATIVE criterion per split plan §6: a one-sided 95% lower
                                        # bound on the mean per-seed policy-minus-statue success difference,
                                        # measured at +0.365 (3M) and +0.340 (5M) on the training schedule.
                                        # 0.20 sits below both and far above zero, so a pass is a real
                                        # superiority claim rather than a not-worse-than-nothing one. It
                                        # consumes the resolver's FROZEN null panel, never a fresh roll, so
                                        # the baseline cannot drift between evaluations; declared without a
                                        # frozen panel to pair against, it fails closed.
min_eval_episodes = 40                  # The registered panel: 40 episodes, seeds 3042-3081, the block every
                                        # measured panel in §3, §4.3 and §9 used. Frozen AT the panel size
                                        # because nothing else notices a claim certified on a DIFFERENT
                                        # panel: at 30 episodes the same 50% success rate still clears both
                                        # bounds above (LCB 0.339), so only this criterion refuses it.
                                        # n_eval_episodes must match.
required_consecutive = 3                # Scheduler hysteresis ONLY, and inert for this kind: the in-training
                                        # curriculum refuses recovery_quality/v1 outright (manager.py) and the
                                        # verdict is produced once, after the stage, by
                                        # reporting.gates.evaluate_stage_gate from the frozen resolution.
                                        # Declared at the repo-wide value anyway so the number the species
                                        # catalog publishes is one this file states rather than a default it
                                        # inherited silently.

# NOT declared: min_avg_reward. The kind allows an optional reward RAIL, but
# no rail has been derived for the pushed task and inventing one would gate on
# an unmeasured number. The failure mode a rail catches — a policy that threw
# away most of the available return — is already covered here by the collapse
# backstop below, which is anchored to the pushed statue (974.7). The frozen
# capability spec records no rail either, so a declared one could only ever be
# an extra refusal conjunct (reporting/gates.py::_recovery_reward_rail).

# Collapse backstop (PLANT_VALIDATION §14 item 3): the relative floor pair,
# same mechanism as stance.toml — the fraction re-anchors if the shared
# shaping ever changes, and test_curriculum_early_stopping refuses any
# committed stage that resolves no finite floor (a backstop that never arms
# fails silently).
#
# The reference is the PUSHED task's own zero-action statue, replacing the
# un-pushed 3495.2 placeholder this file launched with (first-runs record
# §6.5 prescribes exactly this re-anchor; 2026-08 review §5.1/§5.2).
# Measured 2026-08-23 on physics r7 by the panel judge that reproduces the
# committed panels exactly (0/40 success, 26/50 per-shove, mean length
# 360.2 — review §5.1): 40 episodes, seeds 3042-3081, 974.7 ± 216.6, which
# is the first-runs record §3 statue row. Floor = 0.45 x 974.7 = 438.6; the
# 5M pilot's post-warmup minimum (1910.45) clears it ~4.4x, so the backstop
# arms at the first qualifying eval and still sits far below anything a
# warm-started policy passes through. Re-measure by re-rolling the statue
# panel (roll_recovery_panel, environments/shared/recovery_evaluation.py,
# same seeds and episode count) whenever a reward weight, the
# perturbation_* block, or the plant changes.
collapse_peak_floor_reference = 974.7   # Pushed-task statue reward, noise 0.05, 40 episodes, seeds
                                        # 3042-3081 (first-runs record §3/§6.5; reproduced exactly
                                        # 2026-08-23, review §5.1).
collapse_peak_floor_fraction = 0.45     # Same fraction as stance; the ratio, not the product, is what carries.
statue_constants_physics_revision = 7   # The trex PHYSICS revision the 974.7 reference was measured on
                                        # (the 2026-08-23 panel, review §5.1 — the same r7 plant as the
                                        # frozen first-runs panels; the perturbation engine, plant_versions
                                        # note 11, bumped only the POLICY interface, so the pushed dynamics
                                        # are r7's). The freshness test holds this pin against the manifest
                                        # so any real physics move forces a re-measure or a conscious
                                        # update here.
collapse_peak_warmup_timesteps = 1000000 # Same arming delay as stance; 1/3 of this stage's 3M budget —
                                        # stale while the budget was 5M (commit 0836043), true again since
                                        # the reversal above — and inside the companion budget test's
                                        # warmup <= 0.5 x budget bound (test_curriculum_early_stopping.py::
                                        # test_every_committed_stage_can_still_arm_within_its_budget). A
                                        # warm-started policy evals near its final level immediately, so it
                                        # loses no protection that matters.
