[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "stance_quality/v2"         # environments/shared/curriculum/gate_schema.py
timesteps = 11000000

# ---------------------------------------------------------------------------
# The 1a gate: physical stance quality, not return.
#
# Adopted 2026-08-01, replacing reward_and_length/v1. That gate was passable by
# doing nothing. Every reward figure in this block is on the leg_home_pose_weight
# 0.5 scale in force at adoption; weight is now 1.5, which moves the statue to
# 4250.4 and the rail to 2550 (issue #489). Kept as written because it is the
# record of WHY the gate changed -- read the numbers as ratios to the statue.
# The statue scored 3271.8 (clearing min_avg_reward = 1950) at
# 1000.0 steps (clearing min_avg_episode_length = 950), which this run's own
# zero_action_baseline.json reported as "FAILS — a statue clears this gate".
# Worse, it also passed the policy we actually needed to reject — run
# 20260801_021545's best checkpoint, re-rolled on this plant and reward over 40
# episodes (seeds 3042-3081), reaches the horizon 40/40 and scores 2133.4 while
# spending 0.319 of its post-settling steps with neither foot loaded. Two
# earlier figures for it are superseded: 0.284 duty came from an 8-episode
# sample, and 2347.67 was its evaluation mean under the pre-§14 reward.
#
# The gate is NOT trying to beat the statue. STAGE1_SPLIT_PLAN §2.3.1 is
# explicit that the statue's numbers are what a 1a policy must MATCH, not
# beat: it defines the quality ceiling, and 1a's job is to certify a policy
# has not bought stability with actuation. Robustness belongs to 1b, via
# declared xfrc_applied perturbations rather than reset noise, where a lucky
# draw and a good controller are indistinguishable.
#
# Duty is derive_stance_info's unsupported_duty at its default 0.1 N contact
# threshold — deliberately NOT the reward's 42 N min_support_force. Every
# calibration point below is measured at 0.1 N.
# ---------------------------------------------------------------------------
# Superseded by stance_quality/v2 on 2026-10-06 (decision D-D24), kept for
# the record as they read: v1's certifying pair and the unscored settle prefix
# it judged after. v2's schema rejects both duty keys; settle_steps and
# min_full_horizon_fraction carry on below, with v2's meaning.
# max_unsupported_duty = 0.02              # Screening ceiling. Statue 0.000; the chatterer we must reject 0.319, i.e.
#                                          # 16x over. Set well above 0.000 so ordinary weight-shifting is not
#                                          # penalised — note the repaired plant moved raw contact-switch count UP
#                                          # (0.86 -> 1.00 /s) while duty went to zero, because the extra switches are
#                                          # weight shifts. Gate on duty; switch rate stays diagnostic until it is
#                                          # decomposed into bilateral<->single vs bilateral<->airborne.
# max_unsupported_duty_ucb = 0.02          # The CERTIFYING criterion: one-sided 95% UPPER bound on mean duty.
#                                          # Binarising instead costs nearly all the power at this panel size — a
#                                          # binomial LCB95 >= 0.90 at n=40 needs a clean 40/40 and would reject the
#                                          # statue 28% of the time (true rate 0.9917 -> P(40/40) = 71.6%). Duty is
#                                          # continuous with tiny variance, so an interval on it has real power at 40
#                                          # where the pass/fail count has almost none. UCB >= mean by construction,
#                                          # so this subsumes the screening ceiling while both sit at 0.02; both are
#                                          # kept configurable in case a tighter screen than bound is ever wanted.
# settle_steps = 200                       # [inferred], NOT measured. Duty is scored only after this prefix, because
#                                          # a policy that corrects reset randomisation may legitimately move a foot
#                                          # doing it — and settling is the capability 1a exists to certify. 20% of
#                                          # the horizon. Calibrate against rollout data before treating as evidence.

# ---------------------------------------------------------------------------
# stance_quality/v2: each panel episode judged on floor truth (decision D-D24,
# adopted 2026-10-06 with physics r8; the kind itself is D-D23).
#
# v1 certified two panel numbers -- the full-horizon share and the upper bound
# on touch-sensor unsupported duty after an unscored 200-step prefix -- and the
# 2026-10 stance-hack audit (docs/investigations/STANCE_HACK_AUDIT_2026_10.md
# §3.1) found both met by policies that are not standing. All three v1 passes
# (seed 42 20260914_123816, seed 44 20260920_010912 and 20260930_024929) push
# off at 2.0-2.4 BW right after reset, replant 5-7 cm wider inside the unscored
# prefix and then stand on one pad rolled 3-4.4 degrees onto its corner, at a
# touch duty under 0.005 and within 2.2% of the statue's reward. v2 reads the
# floor normal force under each leg on every substep (environments/shared/
# gait/), scores the settle window too, and certifies the exact one-sided 95%
# lower bound on the share of CLEAN episodes: an episode is clean when it
# reaches the horizon and every bar below holds on a finite metric.
#
# Calibration. Each bar's comment gives the zero-action statue's least
# favourable episode on the certification panel (physics r8, this [env],
# seeds 3042-3081; "out of sample": 80 more seeds, 3082-3161) and the
# nearest-passing episode of the four audited r7 checkpoints ("hacks": the
# three v1 passes above and the failed seed-45 node 20261001_225601, which
# micro-hops on both feet at 11.6 Hz; 0914, 0920, 0930 and 1001 for short).
# The hacks load only on the r7 plant, so they were rolled on a checkout of
# the commit that registered the kind, with this block swapped in; floor truth
# does not read the reward, so the r7 [env] they ran under moves no bar.
# Result: the statue is clean on 40/40 (bound 0.928) and 80/80 out of sample;
# every hack is clean on 0/40, each unclean episode failing at least 3 bars
# (0914, 0920), 4 (0930) or 7 (1001). The two families back each other up:
# the sole bars alone fail every hack episode, the settle bars alone all but
# one (0920 on seed 3045, 4 mBW under the peak bar), and without both the
# window bars pass 0914 on 40/40 and 0930 on 37/40 (bound 0.817, a PASS),
# which is why trex declares both. The r7 statue is clean on only 36/40 here
# (bound 0.786; pads rolled up to 3.4 degrees, corners up to 5.5 mm, on the
# soft hip-roll servos). On r7 a flatness bar loose enough for its statue
# still refuses the props (6 mm of corner lift: the statue clean on 40/40,
# every hack panel failing; the audit note's §5.2), but the margins are
# sub-millimetre and sub-degree (statue corner lift up to 5.54 mm against the
# nearest hack's 5.06, tilt up to 3.42 degrees against 2.11); the r8 statue's
# 2.27 mm and 1.15 degrees are what let the bars tighten to 4 mm and 2
# degrees, which is why these bars need physics r8. Every statue figure below
# is the extreme of the panels named, not a bound: a further 40 seeds
# (3162-3201) leave the statue clean on 39/40 (bound 0.887, a PASS; seed 3174
# nosedives at step 265 on reset noise alone) with its settle peak at 1.331 BW
# and its windowed share at 0.469. The audit note's appended §7 holds the
# panels, per-bar counts and margins.
# ---------------------------------------------------------------------------
min_eval_episodes = 40                   # The panel the bound is specified at (seeds 3042-3081, D-B17); n_eval_episodes
                                         # must match. At n = 40 the bound is 0.928 at 40 clean, 0.887 at 39, 0.851
                                         # at 38, 0.817 at 37 and 0.786 at 36.
min_clean_stance_lcb = 0.80              # Admits 37/40 and refuses 36/40 (the gait plan's GQ-7 (a), GQ-12's 0.80). A
                                         # policy clean on 99% of its episodes fails 0.1% of panels at this bar.
settle_steps = 200                       # Splits each episode: the max_settle_* bars read steps 10-199 (after the
                                         # 0.1 s spawn grace, the reset pop being a plant property), every other bar
                                         # steps 200-999. Measured on the r8 statue: the floor force peaks at step 26
                                         # (29 at most) and stays within 5% BW of its weight from step 44 (47 at
                                         # most), so 200 holds the settle 4x over; the hacks push off at steps 5-9
                                         # and replant within 40 steps, inside the scored window. v1 judged after
                                         # the same 200 steps and never scored them (the record above).
min_full_horizon_fraction = 0.95         # Statue: 99.17% pooled over three independent 40-seed blocks (119/120).
                                         # A floor to MATCH, not beat. Replaces min_avg_episode_length = 950, which
                                         # encoded the same §12 requirement through the only field the old gate had.
                                         # Kept under v2 as a panel rail beside the bound (an episode that ends
                                         # early is unclean anyway). The 119/120 above is physics r7's; the r8
                                         # statue reaches the horizon on 40/40 and 80/80 out of sample, and on
                                         # 39/40 of seeds 3162-3201 (seed 3174 nosedives at step 265).
min_all_feet_support = 0.98              # Share of window steps with both legs down. Statue 1.000 on every episode;
                                         # 1001 at most 0.724 (fails 40/40), 0920 fails 5, 0930 1. The props stand
                                         # on both feet (best 1.000): the sole bars catch them.
max_touchdown_rate = 0.25                # Debounced touchdowns per foot per second over the window. Statue 0;
                                         # 1001 at least 9.5 (fails 40/40), 0920 fails 5 and 0930 2 episodes
                                         # (catch-up hops); 0914's best is 0.
max_window_displacement_m = 0.10         # Horizontal root travel over the window. Statue at most 0.023 m, out of
                                         # sample too; hop drift reaches 0.49 m (0920, fails 5), 0.62 m (0930,
                                         # fails 3) and 0.82 m (1001, fails 37).
min_foot_load_share = 0.40               # The lighter foot's share of the window's floor load. Statue at least
                                         # 0.498 (out of sample 0.498; 0.500 is symmetric); no hack episode goes
                                         # below 0.436, so this guards against standing on one leg rather than
                                         # separating the hacks. 0.40, not the pre-adoption candidates' 0.30,
                                         # because the r8 statue is symmetric to 0.002.
max_actuator_saturation_fraction = 0.10  # The most saturated actuator's share of window steps at |a| >= 0.99. Statue
                                         # 0 (it commands zero); 1001 at least 0.81 (fails 40/40), 0920 fails 8 and
                                         # 0930 1 episode.
max_settle_airborne_substeps = 0         # Substeps with both legs unloaded in steps 10-199. Statue 0 on every
                                         # episode, out of sample too: its feet never leave the floor after the
                                         # spawn grace, so 0 is structural rather than a tuned margin. The reset hop
                                         # fails 30 (0914), 37 (0920), 39 (0930) and 40 (1001, at least 175) episodes.
max_settle_peak_floor_force_bw = 1.5     # Peak total floor force in steps 10-199, in body weights. Statue at most
                                         # 1.272 (1.276 out of sample); the hacks' push-off and landing at least
                                         # 1.41 (0920, fails 37), 1.55 (0914, fails 40), 1.84 (0930, fails 40) and
                                         # 2.48 (1001, fails 40).
min_foot_load_share_windowed = 0.35      # The lowest foot share over the window's 1 s blocks. Statue at least 0.477
                                         # (0.474 out of sample); no hack episode goes below 0.372: a guard against
                                         # shifting the weight onto one leg a second at a time.
max_foot_contact_fraction = 0.02         # Substeps with one foot on the other. Statue and hacks 0: a guard (the
                                         # stacked soles of the compsognathus_robot stance the audit found).
max_phantom_support_fraction = 0.05      # Window steps where touch reads a load the floor does not. Statue and
                                         # hacks 0 (trex touch agrees with the floor): a guard.
max_nonfoot_load_fraction = 0.02         # Floor load on the tail, trunk or head. Statue and hacks 0: a guard.
max_sole_tilt_deg = 2.0                  # The worse pad's window-mean tilt from level. Statue at most 1.15 deg (1.53
                                         # out of sample; the r7 statue 3.42); hacks at least 2.11 (0920), 3.03
                                         # (0914), 3.98 (0930) and 4.28 (1001): every episode of each fails.
max_sole_corner_lift_m = 0.004           # The worse pad's window-mean highest-minus-lowest bottom corner. Statue at
                                         # most 2.3 mm (2.8 out of sample; the r7 statue 5.5); hacks at least 5.1 mm
                                         # (0920), 6.6 (0930), 8.4 (0914) and 11.1 (1001): every episode fails.
min_sole_contacts = 1.5                  # The worse pad's window-mean loaded contact points (4 flat, 2 on an edge,
                                         # 1 on a corner). Statue at least 2.35, and exactly 2.0 on one out-of-sample
                                         # episode, which is why the bar is 1.5 rather than 2; the props stand on an
                                         # edge or a corner: 0914 fails 39, 0920 16, 0930 39 and 1001 2 episodes.
                                         # Not raised for the r8 seed-44 left foot on its pad's front edge (2.0-2.2
                                         # loaded points; D-D27): the statue reaches 2.086 on 7042-7081, 2/40 under
                                         # 2.25. max_sole_cop_fore_aft below refuses that foot instead (D-D28).
max_sole_cop_fore_aft = 0.80             # The worse pad's window mean of its per-step |fore-aft CoP| / half-length
                                         # (D-D28; 0 centred, 1 on the heel or toe edge, a step with no loaded sole
                                         # contact 1). Statue 0.206-0.362 on 3042-3081 and at most 0.362 on 7042-7081
                                         # and 3162-3201; out of sample 0.480 (seed 5048, a fore-aft sway clean on
