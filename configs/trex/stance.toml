[stage]
name = "stance"
description = "Learn to stand and balance without falling"

[env]                                          # recovery.toml inherits this table (`extends`), all but the keys it writes out (the foot_contact_* keys, and stance_width_settle_steps since D-D27): an edit here moves recovery's task too, and a reward-weight edit means re-measuring recovery.toml's pushed-statue collapse_peak_floor_reference (1329.1 since D-D27), as its note there says
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0              # Redundant with drift_penalty — drift covers all horizontal directions equally
drift_penalty_weight = 0.3                     # Penalize horizontal displacement from spawn; prevents hop-to-balance exploit
spin_penalty_weight = 0.1                      # Penalize pelvis angular velocity to directly discourage spinning
speed_penalty_weight = 0.3                     # Penalize absolute 2D speed above threshold — complements drift penalty with instantaneous signal
speed_penalty_threshold = 0.10                 # m/s — any speed above this incurs penalty
alive_bonus = 1.0                              # Half of this bonus is conditioned on bilateral support below
foot_contact_gate = 0.0                        # Read only by the retired MJX reward (a binary foot-contact gate); SB3 ignores it. Kept by the cleanup plan (§4.9); 0.0 is TRexEnv's default, so task_sha256 is the same without it. Bilateral support below is the smoother signal
foot_contact_weight = 0.0                      # Read only by the retired MJX reward (an any-foot bonus, which permits a one-leg stance); SB3 ignores it
bilateral_support_weight = 0.6                 # Reward the weaker-loaded foot, so both feet must carry weight
foot_contact_saturation_force = 350.0          # N per foot; quiet home support (~421 N/foot) already earns full credit
foot_load_balance_weight = 0.3                 # Penalize normalized left/right load imbalance
foot_load_balance_min_support_force = 42.0     # 5% of the animal's own weight (85.72 kg excluding the prey prop =
                                               # 840.9 N), which is the smallest load that is unambiguously bearing
                                               # rather than grazing. The previous 0.0 was a measured NO-OP: two
                                               # MuJoCo touch readings essentially never sum to exactly zero, so over
                                               # all 709 logged rollouts of run 20260731_132102 the airborne branch
                                               # never fired once (PLANT_VALIDATION §11.1). Well above the duty
                                               # metrics' 0.1 N/foot, so a foot the diagnostics call unsupported is
                                               # now unsupported in the reward too, instead of the two disagreeing.
foot_load_balance_airborne_penalty = 0.3       # Makes the ordering MONOTONE. Without it airborne and single support
                                               # both scored -0.300 -- a flat region with no gradient out of the air,
                                               # on the stage whose entire job is to stay on the ground. Now:
                                               # both feet even +0.600 > single support -0.300 > airborne -0.600.
                                               # Run 20260801_021545 ended at 28.4% unsupported duty against the
                                               # statue's 0.000, so the tie was not academic.
action_jerk_weight = 3.0                       # Frequency-aware smoothness: penalises the SECOND difference of
                                               # actions, which smoothness_weight cannot see. Motivation, measured on
                                               # run 20260731_132102 best -> final: action_delta FELL 12.0 -> 10.5 and
                                               # the smoothness penalty IMPROVED -0.286 -> -0.250 while toe-motion
                                               # power above 4 Hz DOUBLED (35% -> 71%). A small-amplitude
                                               # high-frequency limit cycle is nearly free under a first-difference
                                               # term and expensive under a second-difference one.
                                               #
                                               # CALIBRATED against the real policy, not inferred: run
                                               # 20260801_021545's stage-1 robust_best_model rolled out on this plant
                                               # at this noise (8 episodes, all full-horizon, VecNormalize stats
                                               # applied) measures action_delta 5.72, action_jerk 9.82 per step, and
                                               # 98.1% of action-space power above 4 Hz -- far buzzier than the
                                               # 35-71% the VIDEO analysis suggested, with a jerk/delta ratio of 1.72
                                               # implying an effective 22.7 Hz. Measuring mattered: an estimate from
                                               # the video figures put this weight at 12.0, which the rollout shows
                                               # would cost an UNTRAINED policy 1.49/step -- more than the entire
                                               # 1.00 alive_bonus, i.e. it would pay PPO to stop surviving.
                                               #
                                               # The cap is the UNTRAINED regime: a fresh PPO policy (log_std_init =
                                               # 0 then, so actions ~ clip(N(0,1)); -1.5 since D-D27, see
                                               # [ppo.policy_kwargs] and action_penalty_source below, which prices
                                               # the raw command this calibration was made on, unfiltered) measures
                                               # jerk 65.4/step, which an earlier iid-uniform estimate understated
                                               # by 57% (41.8). Corrected, the design target "roughly half the 1.00
                                               # alive_bonus at init, so the term never pays PPO to stop surviving"
                                               # lands at w ~ 2.6-3.0, not the 4.0 that estimate produced -- 4.0
                                               # actually costs 0.78/step at init, 78% of the alive bonus.
                                               #
                                               # At 3.0: init pays 0.58/step (clear margin under the alive bonus),
                                               # the measured buzz pays 88/episode (65% of the smoothness term that
                                               # demonstrably failed to suppress it), and a smooth 1.5 Hz
                                               # corrective policy pays ~0.001/episode -- a discrimination ratio of
                                               # ~8e4, so the term is nearly free for the behaviour we want and is
                                               # charged almost entirely to chatter.
support_conditioned_alive_fraction = 0.5       # Keep recovery headroom while making one-foot survival less profitable
leg_home_pose_weight = 0.5                     # Softly retain the authored p5 theropod leg stance.
                                               # REVERTED from 1.5 (issue #491): the 1.5 experiment could not have
                                               # worked, and measurement says why. This term governs 8 joints --
                                               # r/l hip_pitch, hip_roll, knee, ankle -- and those 8 carry only
                                               # 1.2% of the policy's commanded pose offset. 98.8% sat in the
                                               # tail, neck, head and toes, which no term here touches, and 10-12
                                               # of 21 actuators were pinned at |action| = 1.000 (measured on the
                                               # physics-r6 plant; the six toe actuators are gone as of r7, note
                                               # 9 in plant_versions.toml). The governed
                                               # joints were ALREADY near home (|DC| 0.035-0.263), so tripling the
                                               # weight had nothing to pull on: measured DC moved 0.766 -> 0.738,
                                               # 3.7%, while the run took ~2M extra steps to escape its early
                                               # collapse. The list, not the weight, is the problem (#491).
leg_home_pose_tolerance = 0.10                 # rad; Gaussian width of the home-pose bonus, narrowed from 0.20
                                               # after the 20260808 run (postmortem: TREX_STAGE1_PASSIVE_TOES_RUN_
                                               # 2026_08.md section 6). At 0.20 the statue-breaking left-knee/ankle
                                               # offsets the release ablation convicted (0.21/0.17 rad measured)
                                               # cost only ~29 of this term's 500 points; measured pricing at 0.10
                                               # doubles the statue-vs-chatterer differential (109 -> 180 points)
                                               # while staying 2x above the statue's own p99 settle error
                                               # (~0.05 rad, hip-pitch gravity sag). 0.075/0.05 are past the knee:
                                               # +23/+33 more differential for -26/-83 more statue reward. The
                                               # statue-derived constants below are re-measured at this width.
leg_home_pose_broad_fraction = 0.25            # Mixes a second Gaussian 6x wider into the leg term:
                                               # 0.75*exp(-(e/0.10)^2) + 0.25*exp(-(e/0.60)^2). The 20260809 run
                                               # falsified the narrow Gaussian as a capture mechanism: home error
                                               # rose monotonically 0.20 -> 0.545 rad because the gradient is zero
                                               # a few widths out (narrow-tolerance postmortem section 5). The
                                               # broad component keeps a pull alive at the crouch's measured
                                               # distances (0.44 quality at 0.545 rad vs numerically zero) while
                                               # the narrow one still prices precision; at home both are 1, so the
                                               # maximum and the statue's near-home pricing are unchanged.
leg_home_pose_broad_scale = 6.0                # Width multiplier of the broad component. 6x0.10 = 0.60 rad
                                               # reaches the measured knee-lock offsets (~0.87 rad commanded)
                                               # with usable gradient; 4x dies by 0.6 rad.
foot_flatness_weight = 0.15                    # Prices each plantar pad's tilt from level, exp(-(tilt/tol)^2) per
                                               # pad averaged over both feet (TRexEnv reads the boxes' own frames).
                                               # The ankle has no roll joint, so hip roll alone sets a pad's roll,
                                               # and every 2026-09 stance (20260914 seed 42, 20260920 and 20260930
                                               # seed 44) propped one splayed leg on its pad's front-inner corner:
                                               # 2.2-8.3 deg on the worse foot (episode means), which the touch
                                               # sensors, the support terms and stance_quality/v1 all counted as
                                               # full support.
                                               #
                                               # CALIBRATED on replays of those checkpoints on the physics-r7 plant
                                               # they were trained on (40 episodes, seeds 3042-3081; a trajectory
                                               # does not depend on the reward, so re-scoring it is exact), against
                                               # the r7 statue on the same seeds. This term costs the three propped
                                               # stances 61.4 / 56.5 / 68.4 per episode and the failed seed-45
                                               # hopper (20261001, both pads rocking 3.6-5.2 deg) 104.7. Each one's
                                               # whole positive-component advantage over the statue under the r7
                                               # reward was 35.6 / 29.0 / 32.0 / 51.3 (head clearance, neck posture
                                               # and nosedive: the head-lift payoff), so this term alone prices
                                               # every one of them above its gain. The r8 statue earns 141.4 +/- 7.2
                                               # of the 150 available (worst pad 1.15 deg over the post-settle
                                               # window, against 3.42 on r7); 141.2 since D-D27 gates the term on
                                               # load (foot_terms_min_support_force below), which costs it only
                                               # spawn steps. The 8.6 it misses is the reset's own hip-roll noise,
                                               # inside its 25.9 episode sd, and a policy that corrects its spawn
                                               # wins part of it back (stance_width_weight below has the
                                               # measurement). A constant +-0.05 hip-roll splay now costs the statue
                                               # 3.7-5.2 per episode against 0.5 before (40 seeds), and 0.1 of
                                               # inward roll 19.0 against 2.0.
foot_flatness_tolerance_deg = 3.0              # deg; a pad at 2 deg keeps 0.64 of its share, one at 5 deg 0.06.
                                               # Per unit weight on the same replays: 2 deg would double the
                                               # statue's shortfall (57 -> 110) for -4% to +10% hack cost; 4 deg
                                               # would cut the hacks' cost 7-17% (377-698 -> 315-583).
stance_width_weight = 0.1                      # Gaussian on the planar (x-y) foot-site distance around the home
                                               # keyframe's own 0.280 m (computed plant-side, so it tracks the XML).
                                               # Planar, not lateral: a fore-aft stagger counts as width error too
                                               # (feet 0.28 m apart laterally and 0.10 / 0.20 / 0.30 m fore-aft
                                               # score 0.89 / 0.19 / 0.001), unlike the lateral stance_width column
                                               # of stance_diagnostics.
                                               # The same stances settled 0.314-0.388 m wide (means 0.344-0.347,
                                               # +6.5 cm) where the r7 statue settled 0.218-0.337: the propped leg is
                                               # what widens them, so this prices the exploit through a second,
                                               # independent measurement. Same replays: it costs them 53.3 / 55.6 /
                                               # 60.1 per episode, each again above its 29.0-35.6 gain. The hopper
                                               # keeps its width (0.268-0.291) and gains 16.5 here, which its -714
                                               # total deficit (mostly support and survival terms) swamps.
                                               # The rest of this comment is the keyframe-target record (r8, D-D24);
                                               # since D-D27 stance_width_reference below centres the term on the
                                               # animal's own settled width, which the re-seat cannot buy. The r8
                                               # statue earns 86.5 +/- 13.1 of the 100: its settled width is set by
                                               # the reset's hip-roll noise (0.244-0.316 m on the stiff r8 hips), so
                                               # the statue is not this term's optimum. A policy that reads its
                                               # spawn wins part of the 13.5 back without a step: the best constant
                                               # hip-roll offset per seed (+-0.03 / 0.05 / 0.10 on both legs) beats
                                               # the statue on 36/40 seeds, by 15.2 per episode on average (width
                                               # +8.7, flatness +4.2; +53.4 on the narrow-spawn seed 3074), which is
                                               # the correction this term asks for. No constant offset in a hack
                                               # direction pays: over 40 seeds 0.1 of inward roll on both legs loses
                                               # 19.0 in all and 0.1 outward 16.0.
stance_width_tolerance_m = 0.05                # m; between the statue's settled spread (at most 3.6 cm from home)
                                               # and the hacks' +6.5 cm. Per unit weight: 0.04 would raise the
                                               # statue's shortfall 135 -> 190 for 5-7% more hack cost; 0.06 or
                                               # 0.08 would cut the hacks' cost 11% / 32-34%.
stance_width_reference = "settled"             # Centres stance_width on the animal's OWN planar foot-site width at the
                                               # end of the settle (stance_width_settle_steps) and pays it only after, in
                                               # place of the keyframe's 0.280 m (D-D27). Both physics-r8 stance runs
                                               # (20261006_185343 seed 42, 20261006_185704 seed 44) re-seated their feet in
                                               # the settle by an amount the spawn set -- median settle width change 2.80 /
                                               # 2.68 cm on seeds 3042-3081 against the statue's 0.64, the two seeds'
                                               # per-seed changes correlating at rho 0.88 (0.91 on 7042-7081) -- and both
                                               # ended at the keyframe width (0.279 / 0.283 m; the statue settles at
                                               # 0.288-0.293), which the keyframe target paid: +12.5 per episode to seed 44
                                               # over the statue. Re-scored exactly on the recorded panels (a trajectory
                                               # does not depend on the reward): the statue earns 77.4 +/- 2.8 of the 80
                                               # the window can pay (77.1 on 7042-7081, 76.5 on 5042-5081), and a quiet
                                               # constant hip-roll re-seat (best of 4 per seed, 3042-3061) no longer gains
                                               # width (+6.7 -> -2.0 per episode); seed 44's width advantage over the
                                               # statue falls +12.5 -> +2.5 (+16.8 -> +3.4 on 5042-5081). A SPAWN reference
                                               # was measured and rejected: the statue's own settle moves its width by up
                                               # to 5.2 cm, so it scored 88.7 +/- 14.5 (25.0 at worst) and a policy could
                                               # still farm a correction. What this gives up is pricing a stance widened
                                               # DURING the settle: a constant +-0.15 hip-roll splay (3042-3061) went from
                                               # -54.1 to -28.5 per episode against the statue, still below it, and stays
                                               # priced by foot_flatness, the v2 sole bars, max_settle_stance_width_change_m
                                               # and the floor_impact / airborne terms below. The statue pays 9.1 per
                                               # episode for it (800 paid steps, not 1000).
stance_width_settle_steps = 200                # Equal to [curriculum] settle_steps, the gate's settle window (a test pins
                                               # the two equal). The statue's floor force is within 5% BW of its weight
                                               # from step 44 (47 at most), so its width at 200 is its settled width.
                                               # recovery.toml moves it to 140, before its first push.
foot_terms_min_support_force = 168.0           # N, 0.20 body weight (840.9 N): a foot earns its foot_flatness share, and
                                               # the pair the stance_width term, only while its substep-MIN touch carries
                                               # this much. Both terms read geometry alone, so seed 42's lifted feet earned
                                               # ~80% of flatness and ~98% of width on its airborne steps; gated, its
                                               # flatness falls 131.2 -> 86.2 per episode (-45.1 out of sample on
                                               # 5042-5061). The statue's lightest foot after the 0.1 s spawn grace carries
                                               # 0.312 / 0.244 / 0.303 BW on seeds 3042 / 7042 / 3162 (0.316 / 0.292 on
                                               # 5042 / 9042; the review's 0.25 BW would cut it on 7042-7081), so 0.20
                                               # costs it only spawn steps: flatness 141.4 -> 141.2. The gate can only
                                               # remove credit, so lifting a foot cannot dodge a flatness cost.
floor_impact_weight = 2.0                      # Per body weight of excess, per step: the PEAK over the step's substeps of
                                               # the summed foot touch (pad + digits, both feet) above
                                               # floor_impact_threshold_bw, over the WHOLE episode, settle included.
                                               # Nothing priced seed 44's settle stomp (27/40 settle peaks over 1.5 BW,
                                               # 6/40 airborne on 3042-3081; statue 0) or seed 42's 2.8 BW landings:
                                               # the support terms read the step's MIN, and v1 never scored the settle.
                                               # Touch equals floor truth here to 1e-12 N on every recorded step (only
                                               # the feet touch the floor), so it reads the touch block
                                               # BaseDinoEnv.step keeps and adds no contact loop. Costs seed 44 3.05
                                               # per episode on 3042-3081 (12.0 on 7042-7081, 1.9 on 5042-5081; its hop
                                               # episodes 56-210), seed 42 602. It prices stiff-contact vibration too,
                                               # not only landings: the statue under N(0, 0.05) command jitter
                                               # (9042-9061; all-feet support 1.0, no airborne substep after the spawn
                                               # grace) peaks at 1.52-1.86 BW in the settle and pays 10.0 per episode
                                               # here, and v2's settle-peak bar refuses it 20/20. Sized by this file's
                                               # init rule (action_jerk_weight above): a fresh policy at std 0.22 pays
                                               # 0.29 per step here (0.30 re-measured on other seeds, mostly
                                               # single-foot re-landings); 5.0 would pay 0.72, alone over half the
                                               # alive bonus.
floor_impact_threshold_bw = 1.4                # The statue's per-step peak never passes 1.331 BW after the 0.1 s spawn
                                               # grace (1.272 / 1.316 / 1.331 on 3042 / 7042 / 3162, 1.277 / 1.294 on
                                               # 5042 / 9042); its spawn pop reaches 1.345 / 1.370 / 1.560 at steps 3-8,
                                               # which this charges 0 / 0 / 1.19 in total over 40 episodes. Below the v2
                                               # settle bar (1.5), so pricing starts before refusal does.
airborne_substep_weight = 1.0                  # Per fully airborne step: the share of the step's substeps on which every
                                               # foot's touch is at or below 0.1 N (the floor-truth contact threshold),
                                               # so one alive bonus per step in the air. Touch-airborne substeps equal
                                               # floor-truth ones episode by episode on seed 44. Costs seed 44 1.15 per
                                               # episode (5.8 on 7042-7081, 0.8 on 5042-5081), seed 42 308; the statue 0
                                               # after its spawn steps (one substep in 120 episodes). Neither this nor the
                                               # impact term sees a QUIET single-foot re-plant in the settle (single
                                               # support, landing under 1.4 BW): [curriculum] max_settle_touchdowns gates
                                               # that.
action_penalty_source = "raw"                  # smoothness_weight, action_jerk_weight and action_saturation_weight price
                                               # the policy's own clipped command instead of the 10 Hz-filtered one the
                                               # plant applies; energy stays on the applied command. The first-order
                                               # filter (plant interface r11) passes 24-54% of 12.5-50 Hz content, so seed
                                               # 42's raw +-1 bang-bang (knees 50 Hz, hip pitch and ankles 25 Hz) hopped
                                               # the animal while smoothness / jerk / saturation charged it 8.8x / 11.4x /
                                               # 222x too little (49.4 -> 434.2, 35.0 -> 397.3, 0.9 -> 201.6 per episode
                                               # raw; out of sample the same to 0.5). The statue commands zero and pays 0
                                               # either way, and a constant command is free under both, so raw pricing
                                               # pushes toward holding still. It restores the jerk weight's own
                                               # calibration (0.58 per step at std 1.0 on the unfiltered plant, above; raw
                                               # here 0.56). It is why log_std_init moves to -1.5 in [ppo.policy_kwargs]:
                                               # at std 1.0 the raw action terms alone cost a fresh policy 1.24 per step.
                                               #
                                               # The seven keys above together (D-D27), re-scored exactly on the
                                               # recorded r8 panels: the statue 3766.1 -> 3756.8 (width -9.1, flatness
                                               # -0.2); seed 42 0.80 -> 0.28 of the statue; seed 44 against the statue
                                               # +5.7 -> -17.5 on 3042-3081 (above it on 23/40 -> 11/40 seeds), +17.3
                                               # -> -5.6 on 5042-5081 (23/40 -> 14/40) and -97 -> -153 on 7042-7081.
                                               # The shift on seed 44 is about -23 per episode on 3042-3081 and
                                               # 5042-5081 and -56 on 7042-7081, where its three hop episodes lose
                                               # about twice what they lost before (-18 on its 36 standing episodes),
                                               # so whether it ends below the statue depends on its old margin: the v2
                                               # settle bars, not this reward, are what refuse its stomp. All seven are
                                               # inert at TRexEnv's defaults (the legacy arithmetic, bit for bit).
tail_home_pose_weight = 0.25                   # Prices tail JOINT positions. tail_stability reads only the
                                               # tail-tip gyro, so a tail parked motionless against a hard stop is
                                               # optimal for it -- the 20260809 run parked tail_1_yaw, tail_2_pitch
                                               # and tail_3_pitch exactly that way (all three at stops by 10M).
tail_home_pose_tolerance = 0.05                # rad; around the SETTLED droop, not the keyframe: the passive tail
                                               # rests on its ventral stops (tail_1/2 pitch -0.2107/-0.2029, tail_3
                                               # -0.0926; sub-milliradian spread over 40 seeds at noise 0.05), so
                                               # the keyframe zeros are unreachable and would cap the statue at
                                               # ~0.25 quality. Targets live plant-side (TRexEnv._TAIL_SETTLED_QPOS
                                               # in trex_env.py). At 0.05 the statue scores
                                               # ~1.0 and every parked-tail pose from the 20260809 run scores ~0.
action_saturation_weight = 0.5                 # Prices commands parked past |action| = threshold (linear ramp to
                                               # full range). A saturated command cannot oscillate, so it is
                                               # invisible to smoothness/jerk -- parking at stops was the cheapest
                                               # way to be smooth, and the 20260809 run parked 6 of 15 actuators
                                               # (both knees, head_pitch, the tail chain). At 0.5 that stance pays
                                               # ~-200/episode; transient corrective saturation of one actuator
                                               # costs 0.5/15 per step. The statue commands zero and pays nothing.
action_saturation_threshold = 0.9              # Ramp start; below this saturation is free.
head_clearance_weight = 0.35                   # Prevent the learned head-droop posture
head_clearance_target = 0.90                   # m; settled home head tip is ~0.94 m
head_clearance_tolerance = 0.15                # Smooth transition from zero credit at 0.75 m
neck_posture_weight = 0.20                     # Softly retain the statue's settled neck/head pose
neck_posture_tolerance = 0.35                  # rad. Sized while the target was the XML keyframe, to absorb the
                                               # statue's 0.21 rad passive sag below it; kept at 0.35 when the target
                                               # moved to the settled pose (physics r8), where it no longer has to:
                                               # the statue's own error is 0.005-0.011 rad rms, the head lift to the
                                               # keyframe costs 36.4 per episode, and the 2026-09 stances' raised
                                               # heads (0.21-0.34 rad rms from the settled pose) each lose 96-106
                                               # against the statue relative to the keyframe target. 0.20 would add
                                               # 38-51 to that at a 1.6 statue cost, but the swing at 0.35 already
                                               # prices every audited head lift at 1.9-3.7x its whole gain.
neck_posture_reference = "settled"             # Centres the term on TRexEnv._NECK_SETTLED_QPOS (0.21432, 0.0,
                                               # 0.21963 rad: the r8 statue's post-settle neck) instead of the
                                               # keyframe the kp 200 / kp 80 neck servos cannot hold against
                                               # gravity. On the keyframe target the statue scored 0.787 quality and
                                               # lifting the head back to the keyframe PAID +45.6 per episode (+41.9
                                               # neck, +5.8 clearance, -2.1 energy; 40 seeds, physics r8): the
                                               # raised head every 2026-09 stance learned (+16 to +38 neck posture
                                               # per checkpoint over the statue). Settled, the statue earns 198.9 of
                                               # 200 (+41.2) and the same lift costs it 36.4.
energy_penalty_weight = 0.075                  # Setting 4 sweep: 0.075 forces efficient posture. Led to best downstream S2/S3 results (03-16, 03-17).
tail_stability_weight = 0.15
posture_weight = 1.5                           # Tilt penalty: with the reduced alive_bonus it, not survival, drives the
                                               # upright stance. (Provenance note 2026-08-15: this line's original
                                               # "Increased from 1.5" contradicted itself from the file's first commit;
                                               # the pre-repo value it compared against is not recoverable.)
nosedive_weight = 1.5                          # Complements posture_weight against the forward-pitch exploit.
                                               # (Provenance note 2026-08-15: the original "Increased from 3.0"
                                               # described a decrease; same unrecoverable pre-repo history as
                                               # posture_weight above.)
nosedive_termination_threshold = 0.493         # Terminates at forward_z < -0.520 (~31.3° nose-down), unchanged from the
                                               # 0.35 that preceded the natural_pitch 0.17 -> 0.05 correction. natural_pitch
                                               # describes the measured neutral pose, so the threshold absorbs every shift in
                                               # it and the absolute termination envelope stays put. The theropod stance
                                               # correction moved natural_pitch 0.05 -> 0.027 (the flexed limb settles 1.55°
                                               # nose-down where the columnar one settled 2.9°), so this re-derives as
                                               #   0.493 = sin(0.05) + 0.47 - sin(0.027)
                                               # and the plant still terminates at the same absolute -0.520.
smoothness_weight = 2.0                        # Second escalation: 0.1 -> 0.7 -> 2.0. The lever works but was
                                               # under-dosed. 0.1 was a rounding error (-0.0259/step, 1.0% of
                                               # return) and left RMS action change per joint flat at 1.018 for a
                                               # whole run, 2-3x beyond the 0.3-0.5 "severe" band in
                                               # docs/investigations/TREX_STAGE1_LEG_JITTER.md.
                                               #
                                               # 0.7 is the first setting that moved that number at all. Measured
                                               # with compare_run_diagnostics.py across the single-variable pair
                                               # 20260725_194916 (pre) -> 20260726_191730 (post):
                                               #   RMS action change / joint   1.018 -> 0.747  (-27%)
                                               #   policy std (algo_std)       0.959 -> 0.850
                                               #   tail_contact terminations   39.1% -> 11.5%
                                               # Still deep in thrash territory, and the legs visibly bounce in
                                               # trex_ppo_stage1_best.mp4 from the post run.
                                               #
                                               # Sized from the penalty formula -w*sum(da^2)/(n*4), which reduces
                                               # to w*r^2/4 per step at RMS rate r (it reproduces the doc's
                                               # -0.0255 exactly at w=0.1, r=1.010). At the observed r=0.747,
                                               # w=0.7 pays only 0.098/step (~98/episode, 3.9% of return) -- the
                                               # policy absorbed most of the 7x increase by lowering r. w=2.0 pays
                                               # 0.279/step (~279/episode, ~15% of return) before the policy
                                               # adapts down, which is a dose that should bind.
                                               #
                                               # Not free. The 0.7 run gave up reward and stability for the 27%:
                                               #   final eval reward       2699.8 -> 2516.9
                                               #   explained variance      0.748 -> 0.482
                                               #   fallen terminations     35.2% -> 49.1%
                                               # Watch explained_variance on the next run -- the value function was
                                               # already fitting worse at 0.7, and this term is what got bigger.
                                               # Single-variable change; see min_avg_reward for the gate margin.
heading_weight = 0.1                           # Small heading reward to prevent spin-to-balance exploits
gait_symmetry_weight = 0.0                     # Kept at 0.0: the alternation formula is fixed (base_env.py), but a
                                               # standing stage has no touchdowns to alternate, and it is unswept for the T-Rex
height_weight = 0.6                            # Bounded target-centred height shaping; no reward for standing taller than home
height_target_tolerance = 0.06                 # m Gaussian scale around the measured 0.926 m settled pelvis height
fall_penalty = -100.0                          # Restored to -100: stronger penalty needed to discourage lying-flat exploit
bite_bonus = 0.0
bite_approach_weight = 0.0                     # Must be explicit — species default was leaking into stage 1 via key mismatch bug
prey_distance_range = [10.0, 15.0]
max_episode_steps = 1000                       # Match stage 2/3 for consistent episode horizon across curriculum
reset_noise_scale = 0.05                       # Stage 1a operating point (PLANT_VALIDATION §7/§12): the noise sweep on
                                               # the repaired plant showed reset noise does not make STANDING harder
                                               # (statue standing reward 3288 -> 3167 across 0.01-0.20), it decides how
                                               # often you get to stand at all (full-horizon 100% at <=0.05, 65% at
                                               # 0.10, 22% at 0.20). At 0.10 survival and stance quality were
                                               # inseparable, which is why no scalar gate over both ever worked. At
                                               # 0.05 a statue survives 100%, so survival stops being the binding
                                               # constraint and stance-quality gates measure stance quality. The old
                                               # 0.10 rationale ("leave headroom below the statue") optimised for a
                                               # reward gate, which §9 retired: the statue is the reward optimum at
                                               # every noise level. Robustness is stage 1b's job, via perturbations,
                                               # not lucky-draw reset noise (§13).

[ppo]                                   # recovery.toml inherits this and [ppo.policy_kwargs] (`extends`), all but ent_coef_decay_timesteps: an edit here moves recovery's hyperparameters too
learning_rate = 3e-5                    # Setting 4 sweep: 3.23e-5 — 10x lower. All successful S1→S3 runs used this. Old 3e-4 caused instability.
learning_rate_end = 1e-5
n_steps = 2048                          # Setting 4 sweep: smaller rollout buffer. Matches brachio Setting 4.
batch_size = 128
n_epochs = 10
gamma = 0.98                            # Setting 4 sweep: 0.9797. Previous 0.998 was too high for balance task — shorter horizon stabilizes value estimates.
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.0                      # Decay entropy to ZERO, not to a 0.001 floor. The floor is what kept run
                                        # 20260804_143747 (physics r6, 21 action dims) from ever standing still:
                                        # ent_coef hit 0.001 at 3M and held there for the remaining 7M, and across
                                        # those 21 dims that bonus holds the policy std at equilibrium ~0.375
                                        # indefinitely (`algo_std` 0.47 at 5.9M, 0.375 at 8.4M, still falling
                                        # ~0.01/M -- it was never going to converge). The equilibrium mechanism is
                                        # dimension-independent, and the per-joint degree figures below still hold
                                        # on r7: it deleted only the toe actuators and left the leg ctrlranges
                                        # untouched (plant_versions.toml note 9).
                                        #
                                        # In joint terms that std is enormous. Through `_scale_action`'s residual
                                        # mapping and this model's ctrlranges, std 0.375 is a 1-sigma command noise of
                                        # 24.4 deg at the hips and 18.8 deg at knee and ankle -- mean 20.6 deg across
                                        # the major leg joints, resampled every control step at 100 Hz. A policy
                                        # cannot learn to hold a pose it is being told to shake by 20 deg. PPO
                                        # optimises expected return UNDER that noise, so the mean action it converges
                                        # to is not the deterministic optimum but whatever survives its own tremor --
                                        # in that run, a 16.7 Hz limit cycle with unsupported duty 0.1668 (issue #486).
                                        #
                                        # The target is known reachable and known still: `action = 0` IS the home
                                        # keyframe under home-keyframe-residual/v1, and scores 3274.4 +/- 7.6 with
                                        # duty 0.0000 (measured, stance_gate_report.py trex --stage 1 --zero-action).
                                        # The trained policy scored 2686.9 -- 588 BELOW the do-nothing policy. This is
                                        # a convergence failure, not a reward-shaping one, so the usual risk of
                                        # zeroing entropy (premature convergence to a bad optimum) is unusually low:
                                        # the good optimum is trivially reachable and the run's actual failure was
                                        # never converging at all.
                                        #
                                        # 0.0 rather than a smaller floor because any floor sets a non-zero std
                                        # equilibrium; std 0.05 (2.75 deg/joint, a plausible standing policy) needs
                                        # the bonus to go away, not to get smaller.
ent_coef_decay_timesteps = 7000000      # 64% of the 11M budget (derived as 70% of the then-10M budget; the
                                        # 10M -> 11M bump, commit 08a66b3, kept the anchor), not 30%. The old 3M
                                        # anchor was chosen for a 6M
                                        # stage (~half of it) and was never revisited when stage 1 went to 10M, so
                                        # decay finished in the first third and the floor governed the rest. Keeping
                                        # the decay live through 7M means entropy is still falling while the policy
                                        # consolidates, instead of being pinned during the whole second half.
                                        #
                                        # Early exploration is deliberately unchanged: ent_coef still starts at 0.005
                                        # and the first 3M now decays MORE slowly than before, so nothing about the
                                        # early-training regime this stage depends on is tightened.
                                        #
                                        # Falsifiable prediction for the next run, to be checked at ~4M rather than
                                        # at the end: `algo_std` should be well under 0.2 (it was 0.55 at 4.6M and
                                        # 0.47 at 5.9M last run), and `unsupported_duty` should be below the 0.28 it
                                        # showed at 4.34M. If either tracks the old curve, this hypothesis is wrong
                                        # and the next suspect is the learning rate (3e-5 -> 1e-5 is very low).
                                        #
                                        # FALSIFIED (2026-10-07). Both physics-r8 runs (20261006_185343 seed 42,
                                        # 20261006_185704 seed 44; this config byte for byte, hyperparameters
                                        # 8c8b9ab3) tracked the old curve: algo_std 0.750 / 0.724 at 4M and
                                        # 0.606 / 0.606 at 6M; unsupported duty at 4M 0.409 / 0.358 in the
                                        # rollouts and 0.418 / 0.321 at evaluation. Seed 44 escaped the hop
                                        # regime between 5.0M and 6.0M while ent_coef was still non-zero (eval
                                        # duty 0.0001 at 6M); seed 42 locked at 0.375 by 6.5M and held it to 11M.
                                        # The learning rate named above was NOT tested. D-D27 changed the start
                                        # instead -- log_std_init = -1.5 in [ppo.policy_kwargs], measured in short
                                        # runs only -- and added the hop watch in [curriculum] to stop a seed that
                                        # locks in; this anneal and the learning rate are unchanged.

target_kl = 0.03                        # Cap destabilising late PPO updates (early-stop epochs on high approx-KL).

