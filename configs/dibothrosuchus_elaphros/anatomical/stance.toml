[stage]
name = "stance"
description = "Hold the erect quadrupedal stance without collapsing into a sprawl"

[env]
forward_vel_weight = 0.0
backward_vel_penalty_weight = 0.0              # Redundant with drift_penalty — drift covers all horizontal directions equally
drift_penalty_weight = 0.3                     # Penalize horizontal displacement from spawn; prevents creep-to-balance exploit
spin_penalty_weight = 0.1                      # Penalize trunk angular velocity to directly discourage spinning
speed_penalty_weight = 0.3                     # Penalize absolute 2D speed above threshold — instantaneous complement to the drift penalty
speed_penalty_threshold = 0.10                 # m/s — any speed above this incurs penalty
alive_bonus = 1.5                              # Ungated under SB3, where snout- and body-contact termination end a snout prop (the retired mjx_env gated it on height AND foot contact)
foot_contact_gate = 1.0                        # Read only by the retired MJX reward (>0 gated its alive bonus on foot contact); SB3 ignores it. Kept: task_sha256 hashes it.
foot_contact_weight = 0.8                      # Read only by the retired MJX reward (a per-step bonus for a grounded foot); SB3 ignores it. Kept: task_sha256 hashes it.
energy_penalty_weight = 0.05                   # This plant is light and its servos are cheap; a moderate cost still favours an efficient stance
gait_stability_weight = 0.05                   # Light trunk angular-velocity penalty
tail_stability_weight = 0.1
posture_weight = 1.5                           # Strong tilt penalty — the failure mode here is rolling into a sprawl, not pitching
nosedive_weight = 1.0
nosedive_termination_threshold = 0.45          # Terminates at forward_z < -0.45 (~27 deg nose-down) from the measured level neutral
smoothness_weight = 0.1
heading_weight = 0.0                           # 0 since policy interface r11 (decision D-D59; 0.1 before, against
                                               # spin-to-balance exploits). The term priced facing the prey's bearing;
                                               # with the prey gone it would price the spawn heading, which this
                                               # heading-free observation cannot see and no command (command_mode
                                               # "none") states, so it would pay for an error the policy cannot
                                               # observe. Wandering stays priced by the spin, drift and speed penalties.
gait_symmetry_weight = 0.0                     # Disable: diagonal-pair alternation is meaningless while standing still
height_weight = 1.0                            # Hold the trunk near the 0.313 m settled stance
fall_penalty = -100.0
max_episode_steps = 1000
reset_noise_scale = 0.05                       # Stage 1a operating point (PLANT_VALIDATION §7/§12): joint-angle jitter
                                               # in RADIANS, and the same scalar bounds the uniform qvel kick. The old
                                               # 0.30 was calibrated to leave headroom below the statue (65% statue
                                               # full-horizon) — an objective §9 retired: the statue is the reward
                                               # optimum at every noise level, so "headroom below the statue" cannot
                                               # be earned back by a better reward score, and at 0.30 survival and
                                               # stance quality are conflated in every metric. At 0.05 the statue is
                                               # 100% full-horizon (standing 2499.2 +/- 0.2 on physics r4 with heading_weight
                                               # 0; 2598.3 +/- 0.9 before, 2598.5 on physics r2), so
                                               # survival stops being the binding constraint and stance-quality gates
                                               # measure stance. Robustness moves to stage 1b's declared perturbations
                                               # (§13), where a lucky draw and a good controller are distinguishable.
                                               # The 0.30-era sweep (0.18 -> 95%, 0.22 -> 82%, 0.26 -> 72%, 0.30 ->
                                               # 65%) remains valid data for choosing 1b's perturbation magnitude.

[ppo]
learning_rate = 3e-5                    # Matches the balance-stage LR that the other species converged on; 3e-4 was unstable for them
learning_rate_end = 1e-5
n_steps = 2048
batch_size = 128
n_epochs = 10
gamma = 0.98                            # Shorter horizon stabilizes value estimates on a balance task
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
ent_coef_end = 0.001                    # Decay entropy over the stage (EntCoefDecayCallback). Every balance stage in this
ent_coef_decay_timesteps = 3000000      # repository that ran without decay destabilized late; anchor at half the 6M budget
                                        # it was set for (27% of the 11M budget since 2026-11-26, which kept the anchor)
                                        # so ent_coef reaches its floor before any late action-std drift.
                                        # See docs/investigations/TREX_STAGE1_LEG_JITTER.md.
target_kl = 0.03                        # Cap destabilising late PPO updates (early-stop epochs on high approx-KL).

[ppo.policy_kwargs]
net_arch = [512, 256]

[sac]
learning_rate = 3e-4              # Match PPO starting LR — SAC tolerates higher LR due to replay buffer stability
batch_size = 256
gamma = 0.99                      # Off-policy replay staleness at high gamma causes value overestimation; 0.99 is sufficient for balance
tau = 0.005
ent_coef = "auto"                 # Auto-tuned entropy — replaces PPO's manual ent_coef=0.005
buffer_size = 300_000             # Sized for a 6M-step stage 1 (now 11M); a smaller buffer keeps transitions recent
learning_starts = 10_000
train_freq = 16
gradient_steps = 8                # 2:1 data-to-update ratio

[sac.policy_kwargs]
net_arch = [512, 256]             # Match PPO architecture (obs is 75: heading-free since policy interface r11, the Phase C command segment last)

[curriculum]
gate_schema_version = 1                 # Fail-closed gate declaration; see
gate_kind = "reward_and_length/v1"      # environments/shared/curriculum/gate_schema.py
timesteps = 11000000
min_avg_reward = 1500.0                 # Collapse RAIL, not the gate (PLANT_VALIDATION §9/§12): 0.60 x the statue's
                                        # standing reward at noise 0.05 (2499.2 +/- 0.2, 40 episodes). Only
                                        # rejects a policy that discarded most of the available return; 0.60
                                        # rather than §12's 0.89 for the reason derived in the trex config. The
                                        # old 100.0 was cleared by the statue (18x over) and certified nothing.
                                        # Re-measured on physics r2 (plant_versions note 17: the elliptic
                                        # friction cone), same command: 2598.53 +/- 0.87, 40/40 full horizon
                                        # (80/80 on 3082-3161), +0.2, under two standard errors; 0.60 x 2598.5 =
                                        # 1559.1 still rounds to 1560.
                                        # Physics r3: 2598.47 +/- 0.65, 40/40 at seeds 3082–3121.
                                        # Both this rail and the peak floor below still round to the same values.
                                        # Physics r4 (plant_versions note 24: the prey and the 0.02 kg snout_snap
                                        # box removed; heading_weight 0.1 -> 0), same command, 2026-11-23:
                                        # 2499.18 +/- 0.23, 40/40 (seed 3042), and 2499.24 +/- 0.21, 40/40 at
                                        # seeds 3082-3121 (-99.2 against r3 there, the 0.1 per step the heading
                                        # term paid the statue). 0.60 x 2499.2 = 1499.5, rounded to 1500 (was 1560).
collapse_peak_floor = 1870.0            # 0.75 x the statue's standing reward at noise 0.05: above the grind,
                                        # below a plausible active-policy peak. Absolute pending §14 item 3. On
                                        # physics r2 0.75 x 2598.5 = 1948.9 still rounded to 1950; on physics r4
                                        # (heading_weight 0) 0.75 x 2499.2 = 1874.4 rounds to 1870.
min_avg_episode_length = 950            # Encodes §12's full-horizon >= 95%; the statue measures 100% at 0.05.
required_consecutive = 3
collapse_min_evals = 10                 # Backstop early-stop (EvalCollapseEarlyStopCallback): wait ~1M steps (10 evals x 100k) before it can fire.
collapse_patience = 5                   # Require 5 consecutive raw per-eval mean drops (~500k steps at 100k) so transition turbulence won't abort the stage.
collapse_drop_fraction = 0.5            # Only raw means >50% below the robust rolling-median peak count.
collapse_peak_warmup_timesteps = 1000000 # Evaluations before this step cannot SET the peak (the trex stance
                                         # precedent; early_stopping.py). Under home-keyframe-residual/v1 action
                                         # 0 commands the nominal stance, so the UNTRAINED policy is the statue
                                         # (2598.3 then, 2499.2 since physics r4), above the 1950 floor (1870
                                         # since physics r4): run 20260923_020654 armed at eval 20
                                         # (1.0M) on the median of evals 1-5 (2592.9), the exploration dip that
                                         # followed read as a collapse, and it stopped at 1.45M of 6M, certifying
                                         # the statue-level 50k checkpoint. Replayed on that run's 29 evaluations,
                                         # any warm-up >= 400k never arms (the statue plateau lasts to 450k); 1.0M
                                         # keeps that margin 2.5x and leaves 10M of the 11M budget protected (5M of
                                         # the 6M budget it was set for).
