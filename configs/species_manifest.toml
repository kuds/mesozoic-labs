# Species manifest schema 3 (decision D-D33, 2026-10-11): every model is the
# pair (species, embodiment).  [species.<species>] holds what the species
# shares, its display_order and display_name; each model is one
# [species.<species>.embodiments.<embodiment>] table, the embodiment one of
# "anatomical" and "robot" (environments/shared/model_id.py), holding the
# model's tagline, gait, specialty, env_entrypoint, model_path,
# training_backends, training_notebooks, result_summary_paths and its
# success, deliverable and video tables.  IDs are exact strings: there are no
# aliases, and the model display name is derived ("Compsognathus Longipes
# (Robot)"), never stored.  Models are ordered by the species display_order,
# then by embodiment in model_id.EMBODIMENTS order.  training_backends is
# required on every embodiment; only the two frozen MJX registrations
# (brachiosaurus_altithorax and dibothrosuchus_elaphros anatomical, D-D17)
# declare jax-mjx.  environments/shared/species_names.py is the one reader.
#
# Schema 2 (decision D-A8, 2026-09-12; BEHAVIOR_RECIPES_PLAN §4.3) added the
# deliverable tables.  [[species.<species>.embodiments.<embodiment>.deliverable_metrics]]
# states the success semantics of every behavior a model publishes.
# `deliverable` is a recipe label ("stand", "walk", "hunt") or a deliverable
# stage id, resolved exactly as the notebook's BEHAVIOR knob is: a label
# means its DEEPEST deliverable in manifest order (on the T-Rex "stand" is
# recovery, so its stance node is addressed by id).  Every manifest
# deliverable needs a stable-baselines3 entry (the evidence backend, plan
# §4.9); an unknown deliverable, a backend the model does not train, or two
# entries for one (stage, backend) fail the generator.  The per-backend
# [[...success_metrics]] are unchanged.
#
# [[...stage_videos]] are keyed by STAGE ID (`stage = "stance"`), the
# spelling that survives renumbering; a legacy integer (`stage = 1`) stays an
# accepted alias through the stage manifest's legacy_number mapping, and
# naming one stage both ways is a duplicate.
schema_version = 3

