[[species]]
id = "brachiosaurus"
display_order = 3
display_name = "Brachiosaurus"
tagline = "Gentle Giant Herbivore"
gait = "Quadrupedal"
specialty = "Head-to-food reaching"
aliases = ["brachio"]
env_entrypoint = "environments.brachiosaurus.envs.brachio_env:BrachioEnv"
