# Species manifest schema 2 (decision D-A8, 2026-09-12; BEHAVIOR_RECIPES_PLAN §4.3).
#
# [[species.deliverable_metrics]] states the success semantics of every
# behavior a species publishes.  `deliverable` is a recipe label ("stand",
# "walk", "hunt") or a deliverable stage id, resolved exactly as the
# notebook's BEHAVIOR knob is: a label means its DEEPEST deliverable in
# manifest order (on the T-Rex "stand" is recovery, so its stance node is
# addressed by id).  Every manifest deliverable needs a stable-baselines3
# entry (the evidence backend, plan §4.9); an unknown deliverable, a backend
# the species does not train, or two entries for one (stage, backend) fail
# the generator.  The per-backend [[species.success_metrics]] are unchanged.
#
# [[species.stage_videos]] are keyed by STAGE ID (`stage = "stance"`), the
# spelling that survives renumbering; a legacy integer (`stage = 1`) stays an
# accepted alias through the stage manifest's legacy_number mapping, and
# naming one stage both ways is a duplicate.
schema_version = 2

[project_capabilities.simulation]
label = "MuJoCo simulation"
status = "implemented"

[project_capabilities.domain_randomization]
label = "Domain randomization"
status = "planned"

[project_capabilities.hardware_prototype]
label = "Hardware prototype"
status = "planned"

[project_capabilities.ros2_bridge]
label = "ROS 2 bridge"
status = "planned"

[project_capabilities.sim_to_real_validation]
label = "Sim-to-real validation"
status = "not_started"

[[notebooks]]
id = "sb3_training"
display_order = 1
label = "Stable-Baselines3 training"
description = "Train and evaluate species with Stable-Baselines3."
path = "notebooks/sb3_training.ipynb"

[[notebooks]]
id = "jax_training"
display_order = 2
label = "JAX/MJX training"
description = "Train and evaluate species with the JAX/MJX backend."
path = "notebooks/jax_training.ipynb"

[[notebooks]]
id = "ray_tune_sweep"
display_order = 3
label = "Ray Tune sweep"
description = "Run distributed hyperparameter sweeps with Ray Tune."
path = "notebooks/ray_tune_sweep.ipynb"

[[notebooks]]
id = "google_drive_summary"
display_order = 4
label = "Google Drive results summary"
description = "Collect and summarize training artifacts from Google Drive."
path = "notebooks/google_drive_summary.ipynb"

[[species]]
id = "velociraptor"
display_order = 1
display_name = "Velociraptor Mongoliensis"
tagline = "Swift Bipedal Predator"
gait = "Bipedal"
specialty = "Sickle-claw contact attacks"
aliases = ["raptor"]
env_entrypoint = "environments.velociraptor.envs.raptor_env:RaptorEnv"
model_path = "environments/velociraptor/assets/raptor.xml"
training_notebooks = ["sb3_training", "jax_training"]
result_summary_paths = [
    "results/velociraptor/ppo/summary.json",
    "results/velociraptor/sac/summary.json",
]

[[species.success_metrics]]
backends = ["stable-baselines3"]
key = "strike_success"
label = "Sickle-claw contact success"
definition = "A left or right sickle-claw geom contacts the prey geom while the strike reward is enabled."

[[species.success_metrics]]
backends = ["jax-mjx"]
key = "strike_proximity_success"
label = "Sickle-claw proximity success"
definition = "Either claw-tip site comes within 0.20 m of the prey target position while the strike bonus is enabled; physical geom contact is not required."

[[species.deliverable_metrics]]
deliverable = "stand"
backends = ["stable-baselines3"]
key = "stance_reward_rail"
label = "Reward-gated stance (reward_and_length/v1)"
definition = "The stance checkpoint clears the reward_and_length/v1 gate: mean evaluation reward at or above the statue-derived collapse rail and a near-full-horizon mean episode length over the required consecutive evaluations. The zero-action statue clears this gate, so stand is labelled by its gate kind here rather than claimed as certified stance quality; stance_quality/v1 waits on a foot-sensor repair (the single toe site reads about 55% of true load) (plan §4.8)."

[[species.deliverable_metrics]]
deliverable = "walk"
backends = ["stable-baselines3"]
key = "forward_velocity_gate"
label = "Gated forward velocity (reward_and_length/v1)"
definition = "The locomotion checkpoint clears the reward_and_length/v1 gate: mean forward velocity at or above the stage's configured minimum, with its reward and episode-length floors, over the required consecutive evaluations."

[[species.deliverable_metrics]]
deliverable = "hunt"
backends = ["stable-baselines3"]
key = "strike_success"
label = "Sickle-claw contact success"
definition = "A left or right sickle-claw geom contacts the prey geom while the strike reward is enabled."

[[species.deliverable_metrics]]
deliverable = "hunt"
backends = ["jax-mjx"]
key = "strike_proximity_success"
label = "Sickle-claw proximity success"
definition = "Either claw-tip site comes within 0.20 m of the prey target position while the strike bonus is enabled; physical geom contact is not required."

[[species.stage_videos]]
stage = "stance"
path = "website/static/videos/velociraptor_ppo_stage1_best.mp4"
algorithm = "PPO"
backend = "stable-baselines3"
model_revision_status = "historical"
verification_status = "unverified"

[[species.stage_videos]]
stage = "locomotion"
path = "website/static/videos/velociraptor_ppo_stage2_best.mp4"
algorithm = "PPO"
backend = "stable-baselines3"
