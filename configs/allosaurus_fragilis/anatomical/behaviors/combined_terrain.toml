# Allosaurus Fragilis: heading and speed changes on gentle slopes
# Supported SB3/PPO behavior. Parent resolves through ../stages.toml.
# The 0.35 m/s cruise matches the level-ground reference walk.
[behavior]
name = "combined_terrain"
species = "allosaurus_fragilis"
embodiment = "anatomical"
parent = "locomotion"
timesteps = 3000000

[commands]
cruise_speed = 0.35
speed_scale = 0.5
lateral_speed_scale = 0.5
yaw_rate_scale = 0.6
speed_range = [0.175, 0.35]
stop_probability = 0.15
turn_increment_max = 0.5235987756
yaw_rate_max = 0.3
switch_interval_s = 6.0
switch_jitter_s = 1.0
straight_probability = 0.25

[terrain]
enabled = true
mode = "gentle"
template = "sloped"
extent = 35.0 # Half-extent; fits a 25-second cruise plus the full animal
nrow = 351
ncol = 351
apron_radius = 5.5 # Flat spawn disk contains the model, including its tail
blend_width = 1.5
max_height = 2.0
max_slope_degrees = 3.0
roughness_amplitude = 0.015
wavelength_min = 1.5
wavelength_max = 4.0
episode_variation = 0.15

# Each shuffled block of four episodes: one on the original plane, three on this terrain.
[terrain_sampler]
flat = 1
sloped = 3
bumps = 0
depressions = 0
mixed = 0
terrain_contact = 0

[env]
max_episode_steps = 2500 # 25 seconds at this species control timestep
course_distance = 8.0 # Radial progress diagnostic

[ppo]
learning_rate = 0.00005
ent_coef = 0.005
target_kl = 0.03
