[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesozoic-brachiosaurus"
version = "0.1.0"
description = "Brachiosaurus quadrupedal locomotion environment with food-reaching behavior"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "stable-baselines3[extra]>=2.2.0",
]

[project.optional-dependencies]
viz = [
    "mediapy>=1.1.0",
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["envs*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
