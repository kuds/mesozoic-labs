<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background hexagon -->
  <polygon points="50,5 93,27.5 93,72.5 50,95 7,72.5 7,27.5"
           fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.3"/>

  <!-- Inner hexagon -->
  <polygon points="50,15 83,32.5 83,67.5 50,85 17,67.5 17,32.5"
           fill="#0a0a0f" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>

  <!-- Stylized T-Rex head silhouette -->
  <g filter="url(#glow)">
    <path d="M65 35 L75 38 L78 42 L76 48 L72 50 L75 52 L73 55 L68 54 L65 56 L60 55 L55 58 L50 60 L45 58 L42 55 L40 50 L38 45 L40 40 L45 38 L50 36 L55 35 L60 34 L65 35 Z"
          fill="url(#dinoGrad)" opacity="0.9"/>

    <!-- Eye -->
    <circle cx="62" cy="44" r="3" fill="#0a0a0f"/>
    <circle cx="63" cy="43" r="1" fill="#00ff88"/>

    <!-- Circuit lines -->
    <path d="M45 50 L35 55 L30 55" stroke="#00ff88" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M50 45 L45 35 L40 30" stroke="#00ff88" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M68 48 L75 45 L80 48" stroke="#00ff88" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Node points -->
    <circle cx="30" cy="55" r="2" fill="#00ff88"/>
    <circle cx="40" cy="30" r="2" fill="#00ff88"/>
    <circle cx="80" cy="48" r="2" fill="#00ff88"/>
  </g>

  <!-- Bottom text area indicator -->
  <rect x="25" y="70" width="50" height="2" fill="#00ff88" opacity="0.3" rx="1"/>
</svg>
