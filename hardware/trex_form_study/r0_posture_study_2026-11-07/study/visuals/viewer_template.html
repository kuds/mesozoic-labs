<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intermediate T. rex · 3D inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#17332c;background:#f8f6f0;font:16px/1.45 system-ui,sans-serif}
main{max-width:1450px;margin:auto;padding:clamp(16px,3vw,42px)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:1px solid #b4c3b8;padding-bottom:12px}
h1{margin:0;font:clamp(28px,4vw,52px)/1.2 Georgia,serif;font-weight:400}
small{font-size:13px;color:#52675e}.tools,.views,.readout{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.tools{padding:16px 0}.views{gap:4px}.readout{gap:20px;margin-top:10px}
label{display:inline-flex;align-items:center;gap:7px}select,button{font:inherit;line-height:1.1;color:#18372e;background:#f8f6f0;border:1px solid #adbbb0;border-radius:4px;padding:7px 10px}
button[aria-pressed="true"]{background:#24493f;color:#fff;border-color:#24493f}button{cursor:pointer}
canvas{width:100%;height:min(60vh,680px);min-height:300px;display:block;background:#f0f0e8;border:1px solid #bbc7bc;border-radius:5px;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}#sha{font-family:ui-monospace,monospace}.error{color:#9a3820}#detail{font-weight:600}
@media(max-width:650px){main{padding:14px}header{display:block}.tools{gap:8px}canvas{min-height:280px;height:53vh}}
</style></head><body><main>
<header><h1>Intermediate T. rex</h1><small>Mesozoic Labs · body and posture study</small></header>
<div class="tools"><label>Model <select id="models"></select></label><label>Chest angle <select id="angle"><option value="00">0°</option><option value="10" selected>10°</option><option value="20">20°</option></select></label>
<label><input type="checkbox" id="cut"> Remove covers</label><label><input type="checkbox" id="sil"> Silhouette</label></div>
<canvas id="canvas" tabindex="0" aria-label="Interactive orthographic model. Drag to rotate, scroll to zoom. Arrow keys rotate."></canvas>
<div class="tools"><div class="views" id="views"><button data-view="three">Three-quarter</button><button data-view="side">Side</button><button data-view="front">Front</button><button data-view="top">Top</button></div><small>Drag to rotate · Scroll to zoom · Arrow keys to rotate</small></div>
<div class="readout"><span id="detail" role="status">Loading geometry…</span><small id="sha"></small></div>
</main><script id="archive" type="application/json">__MODEL_ARCHIVE__</script>
<script>
'use strict';
const archive=JSON.parse(document.querySelector('#archive').textContent), canvas=document.querySelector('#canvas'),
menu=document.querySelector('#models'),angle=document.querySelector('#angle'),cut=document.querySelector('#cut'),sil=document.querySelector('#sil'),
detail=document.querySelector('#detail'),sha=document.querySelector('#sha'), views=document.querySelector('#views');
const baseline=archive.R3?'R3':'P662', titles={A:'A · Tapered flank',B:'B · Deep ribcage',C:'C · Open rib frame',P662:'PR #662 · Nominal',R3:'R3 · Walking platform'};
for(const k of ['A','B','C',baseline])menu.add(new Option(titles[k],k));
menu.value='B';
const gl=canvas.getContext('webgl2',{antialias:true,alpha:false});
function message(e){detail.className='error';detail.textContent=String(e.message||e)+'. Open the PNG plates for still views.';}
if(!gl||!('DecompressionStream'in window)){message('This viewer needs WebGL 2 and gzip decompression');}
else try {start();}catch(e){message(e);}
function start(){
  const vert=`#version 300 es
  precision highp float;
  in vec3 point;in vec3 normal;in vec3 color;in float shell;
  uniform mat3 basis;uniform vec2 zoom;uniform bool asOutline;
  out vec3 lit;flat out float isShell;
  void main(){
   vec3 world=point*.00005;vec3 p=basis*(world-vec3(-.045,0.,.295));
   gl_Position=vec4(p.x*zoom.x,p.y*zoom.y,-p.z*.5,1.);
   float intensity=.32+.64*max(dot(normal,normalize(vec3(.3,-.72,1))),0.)+.10*max(dot(normal,normalize(vec3(-.5,.35,.7))),0.);
   lit=asOutline?vec3(.068,.083,.077):pow(clamp(color*intensity,0.,1.),vec3(1./2.2));
   isShell=shell;
  }`;
  const frag=`#version 300 es
   precision highp float;in vec3 lit;flat in float isShell;uniform bool cutaway;out vec4 result;
   void main(){if(cutaway&&isShell>.5)discard;result=vec4(lit,1.);}`;
  function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
  const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vert));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
  const va=gl.createBuffer(),ia=gl.createBuffer(), uniforms=Object.fromEntries(['basis','zoom','asOutline','cutaway'].map(k=>[k,gl.getUniformLocation(prog,k)]));
  let idx=0,yaw=0,pitch=0,magnification=1,current=0,held=null;
  function attribute(name,size,type,normalized,offset){const loc=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,type,normalized,16,offset);}
  gl.bindBuffer(gl.ARRAY_BUFFER,va);
  attribute('point',3,gl.SHORT,false,0);attribute('normal',3,gl.BYTE,true,6);attribute('color',3,gl.UNSIGNED_BYTE,true,9);attribute('shell',1,gl.UNSIGNED_BYTE,false,12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ia);gl.enable(gl.DEPTH_TEST);
  function draw(){
    const ratio=Math.min(2,devicePixelRatio||1),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    gl.viewport(0,0,w,h);gl.clearColor(.947,.944,.910,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const sy=Math.sin(yaw),cy=Math.cos(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch);
    const basis=new Float32Array([-sy,-sp*cy,cp*cy, cy,-sp*sy,cp*sy, 0,cp,sp]);
    gl.uniformMatrix3fv(uniforms.basis,false,basis);
    let k=Math.min(w/1.42,h/.85)*2*magnification;
    gl.uniform2f(uniforms.zoom,k/w,k/h);gl.uniform1i(uniforms.asOutline,sil.checked);gl.uniform1i(uniforms.cutaway,cut.checked);
    if(idx)gl.drawElements(gl.TRIANGLES,idx,gl.UNSIGNED_INT,0);
  }
  async function load(){
    const turn=++current;
    const f=menu.value, isBase=f===baseline,id=isBase?f:f+angle.value,m=archive[id];
    angle.disabled=isBase;cut.disabled=isBase;if(isBase)cut.checked=false;
    detail.textContent='Loading '+id+'…';
    const compressed=Uint8Array.from(atob(m.encoded),c=>c.charCodeAt(0));
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const bytes=await new Response(stream).arrayBuffer();
    if(turn!==current)return;
    gl.bindBuffer(gl.ARRAY_BUFFER,va);gl.bufferData(gl.ARRAY_BUFFER,new Uint8Array(bytes,0,16*m.verts),gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ia);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(bytes,16*m.verts,m.indices),gl.STATIC_DRAW);
    idx=m.indices;detail.textContent=id+' · '+m.crown+' mm crown · '+m.mass.toFixed(3)+' kg installed';sha.textContent='Model SHA-256 '+m.sha.slice(0,16);sha.title=m.sha;draw();
  }
  function preset(name){
    if(name==='three'){yaw=Math.atan2(-1,.61);pitch=Math.atan2(.41,Math.hypot(.61,1));}
    if(name==='side'){yaw=-Math.PI/2;pitch=0;}
    if(name==='front'){yaw=0;pitch=0;}
    if(name==='top'){yaw=-Math.PI/2;pitch=Math.PI/2;}
    for(const b of views.children)b.setAttribute('aria-pressed',String(b.dataset.view===name));
    magnification=1;draw();
  }
  function rotate(dx,dy){yaw+=dx;pitch=Math.max(-1.52,Math.min(1.57,pitch+dy));for(const b of views.children)b.setAttribute('aria-pressed','false');draw();}
  views.addEventListener('click',e=>{if(e.target.dataset.view)preset(e.target.dataset.view);});
  canvas.addEventListener('pointerdown',e=>{held=[e.pointerId,e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!held||held[0]!==e.pointerId)return;rotate((held[1]-e.clientX)*.009,(e.clientY-held[2])*.009);held=[e.pointerId,e.clientX,e.clientY];});
  canvas.addEventListener('pointerup',()=>held=null);canvas.addEventListener('pointercancel',()=>held=null);
  canvas.addEventListener('wheel',e=>{e.preventDefault();magnification=Math.max(.65,Math.min(3,magnification*Math.exp(-e.deltaY*.0015)));draw();},{passive:false});
  canvas.addEventListener('keydown',e=>{const v={ArrowLeft:[-.08,0],ArrowRight:[.08,0],ArrowUp:[0,.08],ArrowDown:[0,-.08]}[e.key];if(v){e.preventDefault();rotate(...v);}});
  menu.onchange=angle.onchange=()=>load().catch(message);cut.onchange=sil.onchange=draw;
  new ResizeObserver(draw).observe(canvas);preset('three');load().catch(message);
}
</script></body></html>
