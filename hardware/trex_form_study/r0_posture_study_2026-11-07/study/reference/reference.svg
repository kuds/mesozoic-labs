<text x="64" y="984" fill="#52655f" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">The section outlines and posture are design interpretations. No museum photographs, fossil meshes or published illustrations are reproduced.</text>
