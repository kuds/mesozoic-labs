[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesozoic-labs"
version = "0.3.9.dev0"
description = "Dinosaur-inspired locomotion environments for MuJoCo and Gymnasium"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mesozoic Labs Contributors"}]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mujoco==3.10.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://mesozoiclabs.com"
Repository = "https://github.com/kuds/mesozoic-labs"
Documentation = "https://mesozoiclabs.com"
Issues = "https://github.com/kuds/mesozoic-labs/issues"

[project.optional-dependencies]
train = [
    "torch>=2.0.0",
    "stable-baselines3[extra]>=2.2.0",
    "wandb>=0.16.0",
]
viz = [
    "mediapy>=1.1.0",
    "matplotlib>=3.7.0",
    "imageio-ffmpeg>=0.5.0",
    # compsognathus/scripts/view_model.py --video (imageio.v2 needs 2.16; 2.16.0 was yanked).
    "imageio>=2.16.1",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]
dev = [
    "mesozoic-labs[test]",
    # The versions CI and .pre-commit-config.yaml pin (test_ci_tool_pins.py).
    "mypy==2.3.1",
    "ruff==0.16.9",
    "pre-commit>=3.0",
]
all = [
    "mesozoic-labs[train,viz,dev]",
]

[tool.setuptools.packages.find]
include = ["environments*", "configs*"]

[tool.setuptools.package-data]
"*" = ["assets/*.xml", "data/*.json"]
"environments.compsognathus" = ["assets/meshes/*.stl", "references/*.xml", "references/LICENSE*", "references/*.md"]
"configs" = ["*.toml", "*.json", "*/*.toml", "*/*.json", "*/behaviors/*.toml"]

[tool.pytest.ini_options]
testpaths = [
    "environments/shared/tests",
    "environments/velociraptor/tests",
    "environments/brachiosaurus/tests",
    "environments/trex/tests",
    "environments/dibothrosuchus/tests",
    "environments/compsognathus/tests",
]
norecursedirs = [
    "scripts",
    "assets",
    "notebooks",
    "website",
    ".git",
    "*.egg-info",
]
addopts = "--tb=short -q"

[tool.mypy]
# 3.12 rather than the 3.11 floor: numpy >= 2.3 ships PEP 695 `type`
# statements in its stubs, which mypy refuses to parse for older targets.
# Runtime compatibility with 3.11 is covered by the CI test matrix.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
# The frozen MJX interface core (D-D17): the plant contract hashes the source
# tokens of its functions, so a formatter or autofix change would move four
# species' policy-interface digests (docs/CLEANUP_PLAN_2026_09.md §4.3).
# force-exclude also skips them when a path is named on the command line;
# test_plant_contract_frozen_mjx.py checks this list.
extend-exclude = [
    "environments/shared/mjx_env.py",
    "environments/shared/jax_setup.py",
    "environments/shared/mjx_utils.py",
    "environments/shared/obs_functions.py",
    "environments/trex/mjx_config.py",
    "environments/velociraptor/mjx_config.py",
    "environments/brachiosaurus/mjx_config.py",
    "environments/dibothrosuchus/mjx_config.py",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"environments/*/scripts/*.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["environments"]

[tool.coverage.run]
source = ["environments"]
# Every test job writes its own .coverage.<job>; the `coverage` job combines
# them and gates on the union. Paths must be relative for that combine to line
# up across jobs.
relative_files = true
omit = [
    "*/tests/*",
    "*/scripts/*",
    # Hand-run smoke-check and viewer harnesses behind the per-species scripts
    # (the scripts themselves are already excluded by */scripts/*).
    "environments/shared/harnesses/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
