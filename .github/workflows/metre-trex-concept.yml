name: Metre T-Rex concept
on:
  push:
    branches: [codex/tyrannosaurus-rex-one-metre]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install concept dependencies
        run: pip install -e ".[test]" "ruff==0.16.9" "mypy==2.3.1"
      - name: Format candidate sources
        run: |
          ruff check --fix examples/tyrannosaurus_rex_100cm/ environments/tyrannosaurus_rex/tests/test_tyrannosaurus_rex_100cm.py
          ruff format examples/tyrannosaurus_rex_100cm/ environments/tyrannosaurus_rex/tests/test_tyrannosaurus_rex_100cm.py
      - name: Generate
        run: python -m examples.tyrannosaurus_rex_100cm.build_model
      - name: Validate unsupported assembly and stance
        run: python -m examples.tyrannosaurus_rex_100cm.validate
      - name: Render compiled geometry
        if: always()
        run: python -m examples.tyrannosaurus_rex_100cm.render_design
      - name: Check types and focused regression
        if: always()
        run: |
          mypy examples/tyrannosaurus_rex_100cm/ --ignore-missing-imports
          pytest environments/tyrannosaurus_rex/tests/test_tyrannosaurus_rex_100cm.py -vv
      - name: Export candidate files for review
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          paths = sorted(Path("examples/tyrannosaurus_rex_100cm").rglob("*"))
          paths += [Path("environments/tyrannosaurus_rex/tests/test_tyrannosaurus_rex_100cm.py")]
          for p in paths:
              if not p.is_file() or "__pycache__" in p.parts or p.suffix not in {".py", ".json", ".xml", ".obj", ".png"}:
                  continue
              data = base64.b64encode(p.read_bytes()).decode()
              for i in range(0, len(data), 6000):
                  print("METER_EXPORT|" + str(p) + "|" + str(i // 6000) + "|" + data[i:i+6000])
          PY
      - name: Upload model and review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metre-trex-concept
          path: examples/tyrannosaurus_rex_100cm/
