name: Metre T-Rex concept
on:
  push:
    branches: [codex/tyrannosaurus-rex-one-metre]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install concept dependencies
        run: pip install -e ".[test]" "ruff==0.16.9" "mypy==2.3.1"
      - name: Format candidate sources
        run: |
          ruff check --fix examples/tyrannosaurus_rex_100cm/
          ruff format examples/tyrannosaurus_rex_100cm/
      - name: Generate
        run: python -m examples.tyrannosaurus_rex_100cm.build_model
      - name: Validate unsupported assembly and stance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import mujoco
          from examples.tyrannosaurus_rex_50cm.validate import run_trial, internal_contacts, visual_bounds
          m=mujoco.MjModel.from_xml_path("examples/tyrannosaurus_rex_100cm/model.xml")
          d=mujoco.MjData(m)
          mujoco.mj_resetDataKeyframe(m,d,0)
          mujoco.mj_forward(m,d)
          print("HOME",json.dumps({"mass":float(m.body_mass.sum()),"bounds":[x.tolist() for x in visual_bounds(m,d)],"com":d.subtree_com[1].tolist(),"contacts":internal_contacts(m,d)}))
          r=run_trial(m,duration=10)
          Path("examples/tyrannosaurus_rex_100cm/validation.json").write_text(json.dumps(r,indent=2))
          print(json.dumps(r,indent=2))
          PY
      - name: Render compiled geometry
        if: always()
        run: |
          python - <<'PY'
          import mujoco
          from examples.mini_tyrannosaurus_rex.render_design import render
          m=mujoco.MjModel.from_xml_path("examples/tyrannosaurus_rex_100cm/model.xml")
          d=mujoco.MjData(m)
          mujoco.mj_resetDataKeyframe(m,d,0)
          mujoco.mj_forward(m,d)
          render(m,d,width=800,height=900).save("examples/tyrannosaurus_rex_100cm/preview.png")
          PY
      - name: Check types and focused regression
        if: always()
        run: |
          mypy examples/tyrannosaurus_rex_100cm/ --ignore-missing-imports
          pytest -vv
      - name: Export candidate files for review
        if: always()
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          paths = sorted(Path("examples/tyrannosaurus_rex_100cm").rglob("*"))
          for p in paths:
              if not p.is_file() or "__pycache__" in p.parts or p.suffix not in {".py", ".json", ".xml", ".obj", ".png"}:
                  continue
              data = base64.b64encode(p.read_bytes()).decode()
              for i in range(0, len(data), 6000):
                  print("METER_EXPORT|" + str(p) + "|" + str(i // 6000) + "|" + data[i:i+6000])
          PY
      - name: Upload model and review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metre-trex-concept
          path: examples/tyrannosaurus_rex_100cm/
