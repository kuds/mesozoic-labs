name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8
        run: flake8 environments/ --max-line-length 120 --ignore E501,W503,E203,E402,E128

  test-velociraptor:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./environments/velociraptor
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          MUJOCO_GL: osmesa

  test-brachiosaurus:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./environments/brachiosaurus
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev
        working-directory: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          MUJOCO_GL: osmesa
