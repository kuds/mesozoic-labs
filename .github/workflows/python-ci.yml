name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8
        run: flake8 environments/ --max-line-length 120 --ignore E501,W503,E203,E402,E128

  test-velociraptor:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest environments/velociraptor/tests/ -v --tb=short
        env:
          MUJOCO_GL: osmesa

  test-brachiosaurus:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest environments/brachiosaurus/tests/ -v --tb=short
        env:
          MUJOCO_GL: osmesa

  test-trex:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest environments/trex/tests/ -v --tb=short
        env:
          MUJOCO_GL: osmesa
