name: Python CI

on:
  push:
    branches: [main]
    # One list for both triggers: the pull_request trigger names it by the
    # alias *ci-paths (GitHub takes YAML anchors and aliases, not merge keys),
    # so a pattern added here triggers both (test_ci_tool_pins.py, CU-14a).
    paths: &ci-paths
      - "README.md"
      # test_landing_records.py scans these two with the root README, the
      # species READMEs and docs/**, so a PR editing only one of them must run
      # it (cleanup CU-17).
      - "CONTRIBUTING.md"
      - "results/README.md"
      - "environments/**"
      - "configs/**"
      # docs/** rather than docs/*.md: the investigations/reviews/hardware
      # subdirectories were silently outside CI (gap review CI7).
      - "docs/**"
      - "notebooks/**"
      - "results/**/summary.json"
      - "website/blog/**"
      - "website/docs/**"
      # website/src/** rather than website/src/data/**: test_species_catalog.py
      # pins the TSX adapter and gate formatter against the Python renderer
      # as source text, so a TSX-only PR must run those pins (WS4, D-A10).
      - "website/src/**"
      - "website/static/videos/**"
      - "website/static/img/posters/**"
      - "pyproject.toml"
      # test_ci_tool_pins.py checks the hook versions and excludes it holds,
      # so a pre-commit-only PR (a `pre-commit autoupdate`) must run it (CU-1).
      - ".pre-commit-config.yaml"
      # The sys.path bootstrap every CI pytest invocation imports before
      # collecting tests: a conftest-only PR used to trigger no jobs while
      # changing collection behavior for every later run (gap review CI7).
      - "conftest.py"
      # The checkout's line endings: the plant manifest and the digest snapshot
      # hash file bytes, so a .gitattributes-only PR can move a digest (D-D22).
      - ".gitattributes"
      # Coverage reads these before pyproject.toml, so one could take files out
      # of the union; test_coverage_config.py pins that none does (CU-9).
      - ".coveragerc"
      - ".coveragerc.toml"
      - "setup.cfg"
      - "tox.ini"
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    # `labeled` so that adding the `full-ci` label to an open pull request
    # starts a run that sees it: the SB3 job's depth step reads the labels
    # from the triggering event's payload, and a re-run replays the original
    # payload (consolidation PR-3). Any label added to a pull request that
    # touches the push trigger's paths re-runs the workflow on its head once.
    types: [opened, synchronize, reopened, labeled]
    paths: *ci-paths
  # Nightly run of the whole workflow on `main`. In it the SB3 job runs what
  # pull-request and push runs leave out: the every-species and
  # four-notebook-parameter sets, and the six compsognathus_robot
  # parametrisations of test_compsognathus_training.py's trainer-handoff,
  # warm-start and freeze-rehearsal tests (the SB3 job's "Decide the SB3
  # depth" step; consolidation PR-3, and decision 10 (a) in CU-14a). GitHub
  # pauses scheduled workflows after 60 days without a commit.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ruff and mypy are pinned, with the same versions as
      # .pre-commit-config.yaml and the SB3 job's mypy step
      # (test_ci_tool_pins.py checks all three), so a tool release cannot turn
      # an unrelated pull request red, and pre-commit formats as CI checks.
      - name: Install tools
        run: pip install "ruff==0.16.9" "mypy==2.3.1" gymnasium numpy

      - name: Ruff lint
        run: ruff check environments/

      - name: Ruff format check
        run: ruff format --check environments/

      - name: mypy
        run: mypy environments/ --ignore-missing-imports

      - name: Validate notebooks (parse every code cell)
        # notebooks/** triggers this workflow but nothing parsed them: a
        # symbol rename could break the Colab entry point with every job
        # green, surfacing hours into the next paid session (gap review
        # CI9). AST-parse is cheap and needs no execution; IPython magic
        # and shell lines are stripped the way nbconvert would. The check
        # is notebook_cells.py's own, standard library only, so it runs by
        # path in this job, which does not install the package; the test
        # jobs resolve each notebook import (test_notebook_cells.py).
        run: python environments/shared/tests/notebook_cells.py

  plant-contract:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical MuJoCo and test dependencies
        run: |
          python -m pip install --upgrade pip
          MUJOCO_VERSION=$(python -c "import tomllib; print(tomllib.load(open('configs/plant_versions.toml', 'rb'))['canonical_mujoco_version'])")
          python -m pip install -e ".[test]" "mujoco==${MUJOCO_VERSION}"

      - name: Verify generated plant and public catalogs
        run: |
          python -m environments.shared.plant_contract --check
          python -m environments.shared.species_catalog --check

      - name: Enforce plant revision monotonicity against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:configs/plant_manifest.generated.json"; then
            git show "${BASE_SHA}:configs/plant_manifest.generated.json" > /tmp/base-plant-manifest.json
            python -m environments.shared.plant_contract --check --baseline /tmp/base-plant-manifest.json
          fi

      # D-D22: the FULL digest snapshot (every plant, policy, stage, recovery
      # and behavior digest; never --skip-behaviors, about a minute) must equal
      # the committed configs/digest_snapshot.generated.txt. A PR that moves a
      # digest on purpose regenerates it with --write in its own diff; the
      # failure names each moved line and prints that command. No `if:`, so
      # pushes and the nightly run also catch a dependency that moves a digest
      # (test_plant_contract_digest_snapshot.py pins this step).
      - name: Verify the digest snapshot golden
        run: python -m environments.shared.harnesses.digest_snapshot --block-optional-backends --check

      # No pytest step, and so no coverage upload (CU-14a): the
      # test_plant_contract_*.py files and test_species_catalog.py, the
      # frozen-core pin test_plant_contract_frozen_mjx.py among them, run in
      # the `test (<python>, shared)` legs on every Python version, which cover
      # every line this job's own run of them covered.
      - name: Verify plant identity from an installed wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/mesozoic-wheel .
          python -m venv --system-site-packages /tmp/mesozoic-wheel-venv
          /tmp/mesozoic-wheel-venv/bin/pip install --no-deps --force-reinstall /tmp/mesozoic-wheel/*.whl
          cd /tmp
          /tmp/mesozoic-wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          import environments
          from environments.shared.config import load_stage_config
          from environments.shared.plant_contract import current_plant_identity
          from environments.shared.species_names import species_display_names
          from environments.shared.train_behaviors import REPO_ROOT, read_recipe

          # The eleven direction/terrain recipes every species ships (the notebook's list left with the
          # notebook-only PR-12 slice; the command-line runner reads these files until the rest of PR-12).
          BEHAVIOR_RECIPE_FILES = {
              f"{name}.toml"
              for name in (
                  "difficult_terrain", "follow_direction_difficult_terrain", "follow_direction",
                  "follow_direction_speed", "terrain_contact", "sloped_terrain", "bumps_terrain",
                  "depressions_terrain", "mixed_terrain", "combined_terrain", "combined_mixed_terrain",
              )
          }
          assert Path(environments.__file__).resolve().is_relative_to(Path("/tmp/mesozoic-wheel-venv").resolve())
          assert current_plant_identity("velociraptor").nu == 22
          assert load_stage_config("velociraptor", 1)["name"]
          for species in species_display_names(backend="stable-baselines3"):
              recipes = list((REPO_ROOT / "configs" / species / "behaviors").glob("*.toml"))
              assert {recipe.name for recipe in recipes} == BEHAVIOR_RECIPE_FILES, (species, recipes)
              for recipe in recipes:
                  assert read_recipe(recipe, species)[0]["behavior"]["species"] == species
          PY

  # One matrix of two suites per Python version (gap review ST1, then CU-14a):
  # the shared tests, and every species' tests directory in one pytest run (as
  # one job per species, they spent more time on setup than on tests). Each
  # suite's `tests` names its directories, and every directory in
  # pyproject.toml's testpaths is in exactly one suite (test_ci_tool_pins.py),
  # so a new species adds its tests directory to the species suite here and
  # to testpaths. The explicit `name:` gives the check names
  # "test (<python>, shared)" and "test (<python>, species)"; a branch
  # protection rule that requires checks must name these.
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        suite: [shared, species]
        include:
          - suite: shared
            tests: environments/shared/tests/
          - suite: species
            tests: >-
              environments/velociraptor/tests/
              environments/brachiosaurus/tests/
              environments/trex/tests/
              environments/dibothrosuchus/tests/
              environments/compsognathus/tests/
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The test extra, not dev: no test runs ruff, mypy or pre-commit (the
      # lint job runs ruff and mypy). PyYAML came only with pre-commit and is
      # not installed here, so a test that reads this workflow must read it as
      # text.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"

      # Every pytest step passes -vv: pyproject.toml's addopts carries -q, which
      # cancels one -v, so -vv prints each test id. -rfEs keeps the default
      # failure and error lines of the short summary and adds skip reasons
      # (-rs alone would replace them); --durations=30 lists the slowest tests.
      - name: Run tests with coverage
        run: pytest ${{ matrix.tests }} -vv -rfEs --durations=30 --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          MUJOCO_GL: osmesa
          COVERAGE_FILE: .coverage.${{ matrix.suite }}-${{ matrix.python-version }}

      - name: Upload coverage data
        uses: ./.github/actions/upload-coverage
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.python-version }}

  test-sb3:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SB3 dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep CPU CI off PyPI's CUDA/Triton dependency stack.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          # SB3 pinned as notebooks/sb3_training.ipynb pins it, so the mypy step
          # below sees the SB3 types the notebook trains with.
          python -m pip install -e ".[train,test,viz]" "stable-baselines3[extra]==2.9.0"

      - name: Verify optional backend imports
        run: |
          python - <<'PY'
          import stable_baselines3
          import torch

          assert torch.version.cuda is None, "SB3 CI must use the CPU-only PyTorch wheel"
          print(stable_baselines3.__version__, torch.__version__)
          PY

      # The lint job's mypy runs without SB3 or torch installed, so both resolve
      # to Any there and SB3-facing code is never really checked. Here they
      # are installed at pinned versions (SB3 2.9.0, torch 2.13.0 CPU), and
      # mypy, pinned like the lint job's, must report no errors (CU-1 in
      # docs/CLEANUP_PLAN_2026_09.md; decision D-D18).
      - name: mypy with SB3 and torch types
        run: |
          python -m pip install "mypy==2.3.1"
          mypy environments/ --ignore-missing-imports

      # Consolidation PR-3: this job ran 52 minutes on the #544 merge (notebook
      # smoke 6, behaviors 14, integration 31; 69 at #541) because #540/#541
      # added their suites here, several of which import no SB3 and already run
      # three times in the `test` matrix, and because every real-PPO smoke ran
      # for all six species and all four notebook parameters on every PR. Pull
      # requests and pushes now keep ONE real-PPO smoke per body of work in the
      # notebook and behavior steps, on the compsognathus_robot parameter (the
      # costliest plant to build), and the integration step skips the six
      # compsognathus_robot parametrisations of test_compsognathus_training's
      # twelve training runs and keeps the six compsognathus ones (decision 10
      # (a), CU-14a). The nightly schedule, a manual dispatch and the `full-ci`
      # label on a pull request run the full sets and all twelve.
      # (`cond && value || ''` puts the non-empty string on the selecting
      # condition: GitHub's ternary idiom falls through to the right operand
      # whenever the middle one is falsy, and '' is falsy.)
      - name: Decide the SB3 depth
        id: depth
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" == "true" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "SB3 depth: full (every species and notebook parameter)"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "SB3 depth: one real-PPO smoke per body of work (schedule, workflow_dispatch or the full-ci label runs the full sets)"
          fi

      - name: Validate canonical notebook training
        run: |
          pytest \
            environments/shared/tests/test_compsognathus_training.py \
            -k "test_actual_notebook_training_stance_and_recovery_reports${{ steps.depth.outputs.full != 'true' && ' and ppo and robot' || '' }}" \
            -vv -rfEs --durations=30 --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          MUJOCO_GL: osmesa
          COVERAGE_FILE: .coverage.sb3-notebook

      # test_behavior_env.py, test_behavior_recipes.py and test_terrain_sampling.py
      # import no SB3 and run in the `test` matrix; only the real-PPO species
      # smoke needs this job.
      - name: Validate all-species direction and terrain training
        run: |
          pytest \
            environments/shared/tests/test_behavior_species_training.py \
            ${{ steps.depth.outputs.full != 'true' && '-k compsognathus_robot' || '' }} \
            -vv -rfEs --durations=30 --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          MUJOCO_GL: osmesa
          COVERAGE_FILE: .coverage.sb3-behaviors

      # Suites that import no SB3 (test_behavior_evaluation, test_behavior_certification,
      # test_behavior_env, test_phase_c_interface) run in the `test` matrix and are
      # not repeated here. At reduced depth -k also leaves out the robot's six
      # test_compsognathus_training runs (decision 10 (a)); a bare
      # `not compsognathus_robot` would drop the robot's parameters in
      # test_config.py and test_recovery_calibration.py too.
      # test_drive_summary_notebook.py needs no SB3 but runs here for pandas,
      # which stable-baselines3[extra] brings: its reader test skips in the
      # `test` matrix, whose test extra has none (cleanup CU-15).
      - name: Run SB3 integration tests
        run: |
          pytest \
            environments/shared/tests/test_behavior_checkpoint.py \
            environments/shared/tests/test_behavior_replay.py \
            environments/shared/tests/test_command_frame.py \
            environments/shared/tests/test_config.py \
            environments/shared/tests/test_compsognathus_training.py \
            environments/shared/tests/test_recovery_calibration.py \
            environments/shared/tests/test_curriculum_*.py \
            environments/shared/tests/test_diagnostics.py \
            environments/shared/tests/test_eval_diagnostics.py \
            environments/shared/tests/test_evaluation.py \
            environments/shared/tests/test_gait_report.py \
            environments/shared/tests/test_policy_loading.py \
            environments/shared/tests/test_report_script_vecnorm.py \
            environments/shared/tests/test_resume_continuation.py \
            environments/shared/tests/test_resume_load_path.py \
            environments/shared/tests/test_stance_gate_report.py \
            environments/shared/tests/test_train_base.py \
            environments/shared/tests/test_train_wiring.py \
            environments/shared/tests/test_wandb_integration.py \
            environments/shared/tests/test_widen_checkpoint.py \
            environments/shared/tests/test_drive_summary_notebook.py \
            -k "not test_actual_notebook_training_stance_and_recovery_reports${{ steps.depth.outputs.full != 'true' && ' and not (test_compsognathus_training and compsognathus_robot)' || '' }}" \
            -vv -rfEs --durations=30 --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          MUJOCO_GL: osmesa
          COVERAGE_FILE: .coverage.sb3

      - name: Upload coverage data
        uses: ./.github/actions/upload-coverage
        with:
          name: coverage-sb3

  coverage:
    # The only job that reports a coverage number. Each test job above measures
    # the whole `environments` tree but exercises only its own slice, so no
    # single one of them is meaningful alone -- they are combined here and the
    # union is what `fail_under` gates on.
    runs-on: ubuntu-latest
    needs:
      - test
      - test-sb3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage data from every test job
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and report
        run: |
          coverage combine
          coverage report
