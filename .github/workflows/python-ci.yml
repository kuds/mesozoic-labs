name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "environments/**"
      - "configs/**"
      # docs/** rather than docs/*.md: the investigations/reviews/hardware
      # subdirectories were silently outside CI (gap review CI7).
      - "docs/**"
      - "notebooks/**"
      - "results/**/summary.json"
      - "website/blog/**"
      - "website/docs/**"
      - "website/src/data/**"
      - "website/static/videos/**"
      - "website/static/img/posters/**"
      - "pyproject.toml"
      # The sys.path bootstrap every CI pytest invocation imports before
      # collecting tests: a conftest-only PR used to trigger no jobs while
      # changing collection behavior for every later run (gap review CI7).
      - "conftest.py"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "environments/**"
      - "configs/**"
      # docs/** rather than docs/*.md: the investigations/reviews/hardware
      # subdirectories were silently outside CI (gap review CI7).
      - "docs/**"
      - "notebooks/**"
      - "results/**/summary.json"
      - "website/blog/**"
      - "website/docs/**"
      - "website/src/data/**"
      - "website/static/videos/**"
      - "website/static/img/posters/**"
      - "pyproject.toml"
      # The sys.path bootstrap every CI pytest invocation imports before
      # collecting tests: a conftest-only PR used to trigger no jobs while
      # changing collection behavior for every later run (gap review CI7).
      - "conftest.py"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff mypy gymnasium numpy

      - name: Ruff lint
        run: ruff check environments/

      - name: Ruff format check
        run: ruff format --check environments/

      - name: mypy
        run: mypy environments/ --ignore-missing-imports

      - name: Validate notebooks (parse every code cell)
        # notebooks/** triggers this workflow but nothing parsed them: a
        # symbol rename could break the Colab entry point with every job
        # green, surfacing hours into the next paid session (gap review
        # CI9). AST-parse is cheap and needs no execution; IPython magic
        # and shell lines are stripped the way nbconvert would.
        run: |
          python - <<'PY'
          import ast, json, sys
          from pathlib import Path

          failures = []
          for path in sorted(Path("notebooks").glob("*.ipynb")):
              nb = json.loads(path.read_text(encoding="utf-8"))
              for index, cell in enumerate(nb["cells"]):
                  if cell["cell_type"] != "code":
                      continue
                  source = "".join(cell["source"]) if isinstance(cell["source"], list) else cell["source"]
                  lines = [
                      line
                      if not line.lstrip().startswith(("!", "%"))
                      else line[: len(line) - len(line.lstrip())] + "pass"
                      for line in source.splitlines()
                  ]
                  try:
                      ast.parse("\n".join(lines))
                  except SyntaxError as exc:
                      failures.append(f"{path} cell {index}: {exc}")
          if failures:
              sys.exit("notebook validation failed:\n" + "\n".join(failures))
          print("all notebook code cells parse")
          PY

  plant-contract:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical MuJoCo and test dependencies
        run: |
          python -m pip install --upgrade pip
          MUJOCO_VERSION=$(python -c "import tomllib; print(tomllib.load(open('configs/plant_versions.toml', 'rb'))['canonical_mujoco_version'])")
          python -m pip install -e ".[test]" "mujoco==${MUJOCO_VERSION}"

      - name: Verify generated plant and public catalogs
        run: |
          python -m environments.shared.plant_contract --check
          python -m environments.shared.species_catalog --check

      - name: Enforce plant revision monotonicity against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:configs/plant_manifest.generated.json"; then
            git show "${BASE_SHA}:configs/plant_manifest.generated.json" > /tmp/base-plant-manifest.json
            python -m environments.shared.plant_contract --check --baseline /tmp/base-plant-manifest.json
          fi

      - name: Run plant-contract integration tests
        run: |
          pytest \
            environments/shared/tests/test_plant_contract_*.py \
            environments/shared/tests/test_species_catalog.py \
            -v --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.plant-contract

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-plant-contract
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1

      - name: Verify plant identity from an installed wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/mesozoic-wheel .
          python -m venv --system-site-packages /tmp/mesozoic-wheel-venv
          /tmp/mesozoic-wheel-venv/bin/pip install --no-deps --force-reinstall /tmp/mesozoic-wheel/*.whl
          cd /tmp
          /tmp/mesozoic-wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          import environments
          from environments.shared.config import load_stage_config
          from environments.shared.plant_contract import current_plant_identity

          assert Path(environments.__file__).resolve().is_relative_to(Path("/tmp/mesozoic-wheel-venv").resolve())
          assert current_plant_identity("velociraptor").nu == 22
          assert load_stage_config("velociraptor", 1)["name"]
          PY

  # One matrix over the five per-directory suites: the previous five jobs
  # were byte-identical 37-line blocks differing only in the pytest path and
  # coverage-file suffix (gap review ST1). NOTE for branch protection: the
  # check names change from "test-shared (3.11)" to "test (shared, 3.11)" —
  # required-status settings must be updated to match.
  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        suite: [shared, velociraptor, brachiosaurus, trex, dibothrosuchus]
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests with coverage
        run: pytest environments/${{ matrix.suite }}/tests/ -v --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          MUJOCO_GL: osmesa
          COVERAGE_FILE: .coverage.${{ matrix.suite }}-${{ matrix.python-version }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1

  test-sb3:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SB3 dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep CPU CI off PyPI's CUDA/Triton dependency stack.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          python -m pip install -e ".[train,ray,test]"

      - name: Verify optional backend imports
        run: |
          python - <<'PY'
          import ray
          import stable_baselines3
          import torch
          from pathlib import Path
          from ray import tune
          from ray.train import Checkpoint
          from ray.tune import CheckpointConfig, RunConfig
          from tempfile import TemporaryDirectory

          from environments.shared.scripts.sweep.ray_orchestration import create_ray_tuner

          assert tune.Tuner and Checkpoint and CheckpointConfig and RunConfig
          assert torch.version.cuda is None, "SB3 CI must use the CPU-only PyTorch wheel"
          with TemporaryDirectory() as temp_dir:
              root = Path(temp_dir)
              tuner = create_ray_tuner(
                  train_fn=lambda config: None,
                  search_space={},
                  species="velociraptor",
                  algorithm="ppo",
                  stage=1,
                  timesteps=10,
                  n_envs=1,
                  seed=0,
                  eval_freq=5,
                  num_trials=1,
                  max_concurrent=1,
                  local_ray_dir=root / "ray",
                  local_trials_dir=root / "trials",
                  sweep_dir=root / "sweep",
                  use_asha=False,
              )
              assert tuner
          print(ray.__version__, stable_baselines3.__version__, torch.__version__)
          PY

      - name: Run SB3 integration tests
        run: |
          pytest \
            environments/shared/tests/test_config.py \
            environments/shared/tests/test_curriculum_*.py \
            environments/shared/tests/test_diagnostics.py \
            environments/shared/tests/test_eval_diagnostics.py \
            environments/shared/tests/test_evaluation.py \
            environments/shared/tests/test_train_base.py \
            environments/shared/tests/test_sweep_ray_plant_contract.py \
            environments/shared/tests/test_wandb_integration.py \
            -v --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          MUJOCO_GL: osmesa
          COVERAGE_FILE: .coverage.sb3

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sb3
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1

  test-jax-cpu:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU JAX dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[jax-cpu,test]"

      - name: Verify optional backend imports
        run: python -c "import flax, jax, optax; from mujoco import mjx; print(jax.__version__, jax.default_backend())"
        env:
          JAX_PLATFORMS: cpu

      - name: Run JAX and MJX tests
        run: |
          pytest \
            environments/shared/tests/test_jax_*.py \
            environments/shared/tests/test_mjx_*.py \
            environments/shared/tests/test_action_filter.py \
            environments/shared/tests/test_perturbation.py \
            environments/shared/tests/test_reward_functions.py \
            environments/trex/tests/ \
            -v --tb=short --cov=environments --cov-report= --cov-fail-under=0
        env:
          JAX_PLATFORMS: cpu
          MUJOCO_GL: osmesa
          COVERAGE_FILE: .coverage.jax-cpu

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jax-cpu
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1

  coverage:
    # The only job that reports a coverage number. Each test job above measures
    # the whole `environments` tree but exercises only its own slice, so no
    # single one of them is meaningful alone -- they are combined here and the
    # union is what `fail_under` gates on.
    runs-on: ubuntu-latest
    needs:
      - plant-contract
      - test
      - test-sb3
      - test-jax-cpu
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage data from every test job
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and report
        run: |
          coverage combine
          coverage report
