name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Only site-affecting paths: a python-only push used to burn a full
    # npm ci + docusaurus build and could deploy a stale generated catalog
    # while python-ci's catalog check failed in parallel (gap review CI8).
    # Making deploy WAIT on python-ci needs a required-checks setting in
    # the repo configuration; this filter narrows the trigger.
    paths:
      - "website/**"
      - "results/**/summary.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "results/**/summary.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
