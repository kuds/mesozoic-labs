name: Triceratops foreleg and gait

on:
  pull_request:
    paths:
      - "hardware/triceratops_build/refinement60/**"
      - "hardware/triceratops_build/sim/**"
      - "hardware/triceratops_build/rl/**"
      - "hardware/triceratops_build/walk/**"
      - ".github/workflows/triceratops-refinement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    name: Verify the revised 60 cm model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hardware/triceratops_build/refinement60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: hardware/triceratops_build/refinement60/requirements.txt
      - name: Install simulation dependencies
        run: python -m pip install -r requirements.txt
      - name: Check stand, four-beat walk, pivots and heading course
        run: python verify.py "$RUNNER_TEMP/triceratops60"
      - name: Preserve measured outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triceratops60-simulation
          path: ${{ runner.temp }}/triceratops60/*.json
          if-no-files-found: ignore
